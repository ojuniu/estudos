<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seus estudos</title>
<meta name="theme-color" content="#09090C">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2309090C'/%3E%3Cpath d='M24 18l24 14-24 14z' fill='%23E4F06E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090C;
  --text:#F4F3F6; --muted:rgba(244,243,246,.56); --faint:rgba(244,243,246,.32); --hair:rgba(255,255,255,.09); --hair2:rgba(255,255,255,.16);
  --acc:#E4F06E; --acc-dim:rgba(228,240,110,.5); --bad:#FF8A7A;
  --glass:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.03));
  --font:'Inter Tight',system-ui,-apple-system,sans-serif;
  --r:28px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1.5px solid var(--text);outline-offset:3px}
[hidden]{display:none!important}
h2.sec{margin:6px 6px 0;font:400 24px/1.1 var(--font);letter-spacing:-.015em}
h2.sec span{color:var(--muted)}

/* luz ambiente */
.amb{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg)}
.amb i{position:absolute;border-radius:50%}
.amb .b1{width:70vmax;height:70vmax;left:-22vmax;top:-34vmax;background:radial-gradient(closest-side,rgba(110,72,150,.55),transparent)}
.amb .b2{width:55vmax;height:55vmax;right:-18vmax;top:-12vmax;background:radial-gradient(closest-side,rgba(184,98,140,.42),transparent)}
.amb .b3{width:46vmax;height:46vmax;right:8vmax;bottom:-30vmax;background:radial-gradient(closest-side,rgba(226,140,90,.28),transparent)}
.amb .b4{width:40vmax;height:40vmax;left:-12vmax;bottom:-22vmax;background:radial-gradient(closest-side,rgba(70,90,200,.22),transparent)}
.amb img{position:absolute;left:-10%;top:-10%;width:120%;height:70%;object-fit:cover;filter:blur(70px) saturate(1.35);opacity:0;transition:opacity 1s}
.amb img.ok{opacity:.42}
.amb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,9,12,.05) 0%,rgba(9,9,12,.55) 55%,rgba(9,9,12,.92) 100%)}

/* base */
.glass{background:var(--glass);border:1px solid var(--hair);border-radius:var(--r);
  -webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 30px 70px -40px rgba(0,0,0,.85)}
.rbtn{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--text);
  background:rgba(255,255,255,.07);border:1px solid var(--hair2);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transition:background .15s}
.rbtn:hover:not(:disabled){background:rgba(255,255,255,.13)}
.rbtn:disabled{opacity:.3;cursor:default}
.wbtn{height:46px;border-radius:999px;border:0;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:#F4F3F6;color:#0B0B0E;font:500 15px/1 var(--font);white-space:nowrap;transition:transform .12s,background .15s}
.wbtn:hover:not(:disabled){background:#fff}
.wbtn:active{transform:scale(.98)}
.wbtn:disabled{opacity:.35;cursor:default}
.wbtn.done{background:rgba(228,240,110,.14);color:var(--acc);box-shadow:inset 0 0 0 1px rgba(228,240,110,.4)}
.gbtn{height:46px;border-radius:999px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
  background:rgba(255,255,255,.07);border:1px solid var(--hair2);color:var(--text);font:500 15px/1 var(--font)}
.gbtn:hover:not(:disabled){background:rgba(255,255,255,.13)}
.gbtn:disabled{opacity:.35;cursor:default}
.tag{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.1);font:500 13px var(--font);white-space:nowrap}
.tag.w{background:#F4F3F6;color:#0B0B0E}
.tag.ok{background:rgba(228,240,110,.16);color:var(--acc)}
.ic{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid var(--hair)}
.ic.w{background:#F4F3F6;color:#0B0B0E;border-color:transparent}
.dline{height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.dline i{display:block;height:100%;width:calc(var(--p,0)*100%);background:var(--acc);border-radius:3px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* layout */
.app{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:22px 28px 48px;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-areas:"top top" "main side";gap:22px 28px}
.app:not([data-view="aulas"]){grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main"}
.app:not([data-view="aulas"]) .side{display:none}
.top{grid-area:top;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1;background:none;border:0;padding:0;text-align:left;color:var(--text)}
.mark{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;font:500 16px/1 var(--font);letter-spacing:-.02em;
  background:conic-gradient(from 200deg,#E4F06E,#E28C5A,#B8628C,#6E4896,#E4F06E);padding:2px}
.mark span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:#111015}
.brand b{display:block;font:500 17px/1.15 var(--font);letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-size:13px;color:var(--muted)}
.seg{display:flex;padding:4px;gap:2px;border-radius:999px}
.seg button{height:38px;padding:0 16px;border:0;border-radius:999px;background:none;color:var(--muted);font:500 14px var(--font);white-space:nowrap}
.seg button.on{background:rgba(255,255,255,.14);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.seg button:hover:not(.on){color:var(--text)}
.seg sup,.nav sup{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;margin-left:5px;border-radius:9px;background:var(--bad);color:#1a0b08;font:600 10px/1 var(--font);vertical-align:2px}
.top .right{flex:1;display:flex;justify-content:flex-end;gap:10px}
.main{grid-area:main;min-width:0}
.side{grid-area:side;display:flex;flex-direction:column;gap:14px;position:sticky;top:22px;align-self:start}
.view{display:flex;flex-direction:column;gap:22px}
.subseg{align-self:flex-start;display:flex;padding:4px;gap:2px;border-radius:999px}
.subseg button{height:34px;padding:0 14px;border:0;border-radius:999px;background:none;color:var(--muted);font:500 13px var(--font)}
.subseg button.on{background:rgba(255,255,255,.14);color:var(--text)}

/* início */
.home-top{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.cont{position:relative;overflow:hidden;min-height:330px;padding:28px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:32px;border:1px solid var(--hair);
  background:radial-gradient(70% 90% at 20% 0%,rgba(184,98,140,.55),transparent 70%),radial-gradient(60% 80% at 90% 20%,rgba(110,72,150,.6),transparent 70%),radial-gradient(60% 70% at 60% 110%,rgba(226,140,90,.35),transparent 70%),#17131C}
.cont img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.cont img.ok{opacity:.7}
.cont::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,9,12,0) 20%,rgba(9,9,12,.85) 100%)}
.cont>*:not(img){position:relative;z-index:1}
.cont .tag{align-self:flex-start;margin-bottom:auto}
.cont small{color:rgba(255,255,255,.75);font-size:14px}
.cont h1{margin:6px 0 18px;font:300 clamp(28px,3vw,40px)/1.08 var(--font);letter-spacing:-.025em;max-width:22ch}
.cont .row{display:flex;align-items:center;gap:16px}
.cont .row .dline{flex:1;height:4px}
.cont .row span{font-size:13px;color:rgba(255,255,255,.8);white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{padding:18px;border-radius:24px}
.tile .ic{width:38px;height:38px;margin-bottom:16px}
.tile b{display:block;font:300 32px/1 var(--font);letter-spacing:-.03em}
.tile small{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.train{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tr{display:flex;flex-direction:column;gap:14px;text-align:left;padding:20px;border-radius:26px;color:var(--text);border:1px solid var(--hair);
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);transition:background .15s}
.tr:hover{background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.04))}
.tr .r{display:flex;justify-content:space-between;align-items:flex-start}
.tr b{display:block;font:400 22px/1.1 var(--font);letter-spacing:-.01em}
.tr small{display:block;margin-top:4px;color:var(--muted);font-size:14px}
.tr .go{display:flex;align-items:center;gap:6px;font-size:14px;margin-top:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.wk{padding:22px 18px}
.wk .rings{grid-template-columns:repeat(7,1fr)}
.subj{padding:8px 20px}
.srow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--hair)}
.srow:last-child{border-bottom:0}
.srow b{display:block;font:500 15px var(--font);margin-bottom:8px}
.srow .pc{font-size:14px;color:var(--muted);min-width:40px;text-align:right}
.course{display:flex;align-items:center;gap:18px;padding:18px 22px;border-radius:28px;width:100%;text-align:left;color:var(--text)}
.course .tx{flex:1;min-width:0}
.course b{display:block;font:500 17px var(--font)}
.course small{color:var(--muted);font-size:14px}
.bigring{--p:0;position:relative;width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;font:500 15px var(--font)}
.bigring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1turn),rgba(255,255,255,.13) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px))}

/* aulas: player */
.player{position:relative;aspect-ratio:var(--par,16/9);border-radius:32px;overflow:hidden;background:#141218;border:1px solid var(--hair);box-shadow:0 50px 100px -50px rgba(0,0,0,.9)}
.poster{position:absolute;inset:0;width:100%;border:0;padding:0;color:var(--text);text-align:left;
  background:radial-gradient(70% 90% at 25% 10%,rgba(184,98,140,.55),transparent 70%),radial-gradient(60% 80% at 85% 30%,rgba(110,72,150,.6),transparent 70%),radial-gradient(60% 70% at 60% 110%,rgba(226,140,90,.35),transparent 70%),#17131C}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.poster img.ok{opacity:1}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6))}
.poster .bar{position:absolute;z-index:1;left:18px;right:18px;bottom:18px;height:62px;border-radius:999px;display:flex;align-items:center;gap:14px;padding:0 10px;
  background:rgba(30,26,36,.38);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%)}
.poster .play{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:#F4F3F6;color:#0B0B0E}
.poster .bar b{font:500 15px var(--font);white-space:nowrap}
.poster .line{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.22);position:relative}
.poster .line i{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p,0)*100%);border-radius:3px;background:#fff}
.poster .line i::after{content:"";position:absolute;right:-5px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.18)}
.poster .bar small{font-size:13px;color:rgba(255,255,255,.75);white-space:nowrap;padding-right:8px}
.poster .corner{position:absolute;z-index:1;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center}
.rest{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;
  background:radial-gradient(60% 80% at 30% 0%,rgba(110,72,150,.5),transparent 70%),radial-gradient(60% 80% at 90% 100%,rgba(226,140,90,.25),transparent 70%),#141218}
.rest h3{margin:0 0 8px;font:300 34px/1.05 var(--font);letter-spacing:-.02em}
.rest p{margin:0;color:var(--muted);max-width:42ch}
.pholder{position:absolute;inset:0}
.pbox{position:absolute;inset:0;z-index:2;background:#000}
.pbox[hidden]{display:none}
.pframe{position:absolute;inset:0;overflow:hidden;background:#000}
/* o quadro do Drive nunca muda de tamanho depois de carregar: só é ampliado/reduzido (evita bordas pretas e player torto) */
.pframe iframe{position:absolute;left:0;top:0;border:0;display:block;transform-origin:0 0}
.pctl{display:none}
.pbtn{width:36px;height:36px;flex:none;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(12,11,16,.72);color:#F4F3F6;cursor:pointer;pointer-events:auto}
.pbtn:hover{background:rgba(12,11,16,.9)}
/* mini player: aparece ao sair da aula com o vídeo tocando */
body.pm-mini .pbox{position:fixed;inset:auto 24px 24px auto;width:380px;height:auto;aspect-ratio:var(--par,16/9);z-index:40;border-radius:16px;overflow:hidden;
  box-shadow:0 24px 70px -16px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.14)}
body.pm-mini .pctl{display:flex;position:absolute;z-index:3;left:8px;right:8px;top:8px;justify-content:space-between;pointer-events:none}
@media (hover:hover){body.pm-mini .pctl{opacity:0;transition:opacity .2s}body.pm-mini .pbox:hover .pctl{opacity:1}}
/* celular: vídeo de ponta a ponta na página da aula */
body.is-m .player.on{margin:0 -14px;border-radius:0;border-left:0;border-right:0;box-shadow:none}
/* sair da página da aula sem parar o vídeo: mantém só o player */
body.p-away #vAulas[hidden],body.p-away #vAula{display:contents!important}
body.p-away #vAulas[hidden]>:not(#vAula){display:none!important}
body.p-away #vAula>:not(#player){display:none!important}
body.p-away #player{display:contents}
body.p-away #pholder{display:none}
.actions{display:flex;align-items:center;gap:10px;padding:8px;border-radius:999px}
.actions .info{flex:1;min-width:0;padding:0 10px;display:flex;flex-direction:column;gap:6px}
.actions .info span{font-size:13px;color:var(--muted)}
.lhead h1{margin:0;font:300 clamp(28px,3.2vw,42px)/1.08 var(--font);letter-spacing:-.025em;max-width:26ch}
.lhead p{margin:12px 0 0;color:var(--muted);max-width:60ch}
.meta{display:flex;align-items:center;gap:12px;margin-top:20px}
.meta .who{flex:1;min-width:0}
.meta .who small{display:block;font-size:13px;color:var(--muted)}
.meta .who b{display:block;font:500 16px var(--font)}
.meta .score{font:400 15px var(--font);color:var(--muted);white-space:nowrap}
.meta .score b{color:var(--text);font-weight:500}
.lsthead{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px;font:500 15px var(--font)}
.lsthead span+span{color:var(--muted);font-weight:400}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.lesson{display:flex;align-items:center;gap:14px;padding:10px 12px 10px 10px;border-radius:999px;cursor:pointer;transition:background .15s}
.lesson:hover{background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.05))}
.lesson .ic{font:500 15px/1 var(--font)}
.lesson .tx{flex:1;min-width:0}
.lesson .tx b{display:block;font:500 15px/1.3 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson .tx small{display:block;font-size:13px;color:var(--muted)}
.chk{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--hair2);background:none;display:grid;place-items:center;color:transparent;padding:0}
.chk:hover{border-color:var(--text);color:var(--faint)}
.chk.on{background:var(--acc);border-color:var(--acc);color:#14160A}
.lesson.cur{border-color:rgba(255,255,255,.22);background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.06))}
.lesson.seen .tx b{color:var(--muted)}

/* anéis */
.strip{padding:20px 18px 18px}
.strip-head{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:18px}
.strip-head h3{margin:0;font:400 22px var(--font);letter-spacing:-.01em}
.strip-head h3 span{color:var(--muted)}
.strip-head button{width:32px;height:32px;border:0;border-radius:50%;background:none;color:var(--text);display:grid;place-items:center}
.strip-head button:disabled{opacity:.25;cursor:default}
.rings{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;text-align:center}
.rings .lbl{font-size:12px;color:var(--muted);margin-bottom:10px;white-space:nowrap}
.rings .col.sel .lbl{color:var(--text);font-weight:500}
.ring{--p:0;--rc:var(--acc);position:relative;width:38px;height:38px;margin:0 auto;border-radius:50%;border:0;padding:0;background:none;display:grid;place-items:center;font:400 12px var(--font);color:var(--muted);transition:transform .2s}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(var(--rc) calc(var(--p)*1turn),rgba(255,255,255,.13) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px))}
.ring.full{--rc:var(--acc-dim);color:var(--acc)}
.ring.none::before{background:none;border:1.5px dashed rgba(255,255,255,.16);-webkit-mask:none;mask:none}
.ring.sel{transform:scale(1.22);color:var(--text);font-weight:500}
.ring.sel::before{-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px))}
.ring.sel.full::before{background:var(--acc)}
.ring.sel.p0::before{background:conic-gradient(var(--acc) .03turn,rgba(255,255,255,.2) 0)}
button.ring:hover{color:var(--text)}

/* agenda */
.ag-head{display:flex;justify-content:center;gap:8px;font:500 15px var(--font);margin:10px 0 0}
.ag-head span{color:var(--muted);font-weight:400}
.ag{display:flex;flex-direction:column;gap:12px}
.agc{display:block;width:100%;text-align:left;padding:16px 18px 14px;border-radius:26px;border:1px solid var(--hair);color:var(--text);
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.agc.now{border-color:rgba(255,255,255,.18);background:radial-gradient(90% 120% at 100% 100%,rgba(226,140,90,.35),transparent 60%),radial-gradient(90% 120% at 30% 120%,rgba(184,98,140,.45),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05))}
.agc .r1{display:flex;align-items:flex-start;gap:12px}
.agc .r1 .tx{flex:1;min-width:0}
.agc .r1 b{display:block;font:500 15px/1.25 var(--font)}
.agc .r1 small{display:block;font-size:13px;color:var(--muted)}
.agc .pct{display:flex;align-items:center;gap:6px;font-size:13px}
.agc .pct i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.25);color:#111}
.agc.now .pct i{background:#fff}
.agc .r2{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:14px}
.agc .r2 span:last-child{display:flex;align-items:center;gap:4px}
.agc:not(.now){opacity:.7}
.agc:hover{opacity:1}

/* mapa + busca */
.searchw{position:relative;display:block}
.search{width:100%;height:52px;border-radius:999px;padding:0 20px 0 50px;outline:none;color:var(--text);
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.04));border:1px solid var(--hair);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.search::placeholder{color:var(--faint)}
.search:focus{border-color:var(--hair2)}
.searchw svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:var(--muted)}
.cycles{display:flex;flex-direction:column;gap:12px}
.cycle{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:16px;padding:18px 20px;border-radius:26px}
.cycle .cl b{display:block;font:500 15px var(--font)}
.cycle .cl small{font-size:13px;color:var(--muted)}
.cycle .ring{width:44px;height:44px;font-size:13px}
.cycle .lbl{margin:10px 0 0;font-size:11px}
.xlist{display:flex;flex-direction:column;gap:10px}
.xlist h4,.results h4{margin:10px 6px 0;font:500 15px var(--font)}
.results{display:flex;flex-direction:column;gap:10px}
.rrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px 18px 10px 10px;border-radius:999px;border:1px solid var(--hair);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));color:var(--text)}
.rrow:hover{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05))}
.rrow .tx{flex:1;min-width:0}
.rrow b{display:block;font:500 15px/1.3 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow small{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);padding:6px}

/* simulados */
.sims{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.sim{padding:22px;border-radius:28px;display:flex;flex-direction:column;gap:16px}
.sim .top2{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sim h3{margin:0;font:300 30px/1 var(--font);letter-spacing:-.025em}
.sim p{margin:4px 0 0;color:var(--muted);font-size:14px}
.sim .mix{display:flex;gap:6px;flex-wrap:wrap}
.sim .btns{display:flex;gap:8px;margin-top:auto}
.sim .btns .wbtn{flex:1}
.note{color:var(--muted);font-size:14px;max-width:70ch;padding:0 6px;margin:0}
.quiz{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.qcard{padding:28px;border-radius:32px}
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.qhead .tx{flex:1;min-width:0}
.qhead small{display:block;color:var(--muted);font-size:13px}
.qhead b{display:block;font:500 16px var(--font)}
.qtext{margin:0 0 18px;padding:16px 18px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid var(--hair);color:rgba(244,243,246,.82);font-size:15px;line-height:1.6}
.qtext summary{cursor:pointer;color:var(--text);font-weight:500;list-style:none}
.qtext summary::-webkit-details-marker{display:none}
.qtext p{margin:10px 0 0;max-width:72ch}
.qe{margin:0 0 20px;font:300 clamp(20px,2vw,26px)/1.3 var(--font);letter-spacing:-.01em;max-width:60ch}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px 18px 10px 10px;border-radius:24px;border:1px solid var(--hair);color:var(--text);
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));font:400 15px/1.4 var(--font);transition:background .15s,border-color .15s}
.opt:hover:not(:disabled){background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05))}
.opt:disabled{cursor:default}
.opt .l{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid var(--hair2);font:500 14px var(--font)}
.opt.right{border-color:rgba(228,240,110,.55);background:linear-gradient(90deg,rgba(228,240,110,.14),rgba(228,240,110,.02))}
.opt.right .l{background:var(--acc);border-color:var(--acc);color:#14160A}
.opt.wrong{border-color:rgba(255,138,122,.55);background:linear-gradient(90deg,rgba(255,138,122,.14),rgba(255,138,122,.02))}
.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#1a0b08}
.opt.dim{opacity:.5}
.fb{margin-top:18px;padding:16px 18px;border-radius:20px;border:1px solid var(--hair);background:rgba(255,255,255,.04)}
.fb b{display:block;font:500 15px var(--font);margin-bottom:4px}
.fb b.ok{color:var(--acc)}
.fb b.no{color:var(--bad)}
.fb p{margin:0;color:rgba(244,243,246,.8);max-width:72ch}
.qnav{display:flex;align-items:center;gap:10px;margin-top:22px}
.qnav .sp{flex:1}
.qside{padding:20px;border-radius:28px;position:sticky;top:22px}
.qside h4{margin:0 0 4px;font:500 15px var(--font)}
.qside p{margin:0 0 16px;color:var(--muted);font-size:13px}
.qgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.qn{aspect-ratio:1;border-radius:50%;border:1px solid var(--hair2);background:none;color:var(--muted);font:500 12px var(--font);padding:0}
.qn.r{background:var(--acc-dim);border-color:transparent;color:#14160A}
.qn.w{background:rgba(255,138,122,.55);border-color:transparent;color:#1a0b08}
.qn.c{border-color:var(--text);color:var(--text);box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.qside .wbtn{width:100%;margin-top:18px}
.result{padding:30px;border-radius:32px;display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center}
.result .big{font:200 clamp(84px,10vw,128px)/.9 var(--font);letter-spacing:-.05em}
.result .big span{font-size:.4em;color:var(--muted);margin-left:4px}
.result h3{margin:0 0 6px;font:400 24px var(--font)}
.result p{margin:0 0 16px;color:var(--muted)}
.result .btns{display:flex;gap:10px;flex-wrap:wrap}

/* resumos */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--hair2);background:rgba(255,255,255,.05);color:var(--muted);font:500 14px var(--font)}
.chip.on{background:#F4F3F6;border-color:#F4F3F6;color:#0B0B0E}
.cards{columns:2 340px;column-gap:14px}
.card{break-inside:avoid;margin:0 0 14px;padding:22px;border-radius:26px}
.card .h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.card .h b{font:500 17px/1.2 var(--font)}
.card .h small{display:block;color:var(--muted);font-size:13px}
.card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.card li{position:relative;padding-left:16px;color:rgba(244,243,246,.85);line-height:1.5}
.card li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--acc-dim)}
mark{background:rgba(228,240,110,.25);color:var(--text);border-radius:3px;padding:0 2px}

/* erros */
.errhead{display:flex;align-items:center;gap:16px;padding:22px 24px;border-radius:28px}
.errhead .tx{flex:1}
.errhead b{display:block;font:300 34px/1 var(--font);letter-spacing:-.02em}
.errhead small{color:var(--muted)}

/* pin */
.gate{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px}
.gate form{width:min(400px,100%);padding:36px 28px 28px;text-align:center}
.gate .mark{width:72px;height:72px;margin:0 auto 22px;font-size:22px}
.gate h1{margin:0;font:300 34px/1.05 var(--font);letter-spacing:-.025em}
.gate p{margin:10px 0 24px;color:var(--muted)}
.gate input{width:100%;height:58px;border-radius:999px;text-align:center;font:300 26px var(--font);letter-spacing:.4em;outline:none;color:var(--text);
  background:rgba(255,255,255,.06);border:1px solid var(--hair2)}
.gate input:focus{border-color:rgba(255,255,255,.4)}
.gate .wbtn{width:100%;height:54px;margin-top:12px}
.gate .err{min-height:22px;margin:14px 0 0;color:var(--bad);font-size:14px}
.toast{position:fixed;left:50%;bottom:30px;z-index:9;transform:translate(-50%,14px);opacity:0;pointer-events:none;transition:.25s;padding:12px 20px;border-radius:999px;background:#F4F3F6;color:#0B0B0E;font:500 14px var(--font)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.nav{display:none}
.only-m{display:none!important}

@media (max-width:1180px){
  .app{grid-template-columns:minmax(0,1fr) 340px;padding:20px}
  .cycle{grid-template-columns:1fr}

}

  .poster .bar{left:10px;right:10px;bottom:10px;height:54px;gap:10px}

  .poster .bar small{display:none}
  .poster .corner{top:12px;left:12px;right:12px}
  .poster .corner .rbtn{width:40px;height:40px}
  .actions .info{display:none}
  .actions{padding:6px}
  .actions .wbtn{flex:1}
  .lhead h1{font-size:30px}
  .lesson{border-radius:24px}
  .lesson .tx b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .strip{padding:18px 10px 16px}

  .qcard{padding:20px;border-radius:26px}

}
@media (max-width:360px){ .nav .pillnav button{width:50px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div class="amb" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><img id="ambImg" alt=""></div>

<script>
var SIMULADOS=[{"id":"s1","nome":"Simulado 1","textos":{"t1":"Nas unidades básicas de saúde, o primeiro contato do usuário raramente começa pela consulta. Começa na recepção, no olhar de quem o atende e na forma como sua queixa é ouvida. Por isso, o acolhimento não é uma etapa burocrática, mas uma postura que atravessa todo o serviço. Quando a equipe escuta com atenção, identifica riscos mais cedo e evita que casos simples se agravem. Ainda assim, muitos profissionais tratam a escuta como perda de tempo, embora ela costume economizar retornos, exames desnecessários e encaminhamentos mal feitos."},"q":[{"m":"pt","tx":"t1","e":"De acordo com o texto, o acolhimento:","o":["é uma etapa administrativa restrita à recepção.","substitui a consulta nos casos simples.","aumenta a quantidade de exames solicitados.","é uma postura que deve estar presente em todo o serviço."],"a":3,"c":"O texto afirma que o acolhimento \"não é uma etapa burocrática, mas uma postura que atravessa todo o serviço\"."},
{"m":"pt","tx":"t1","e":"No trecho \"embora ela costume economizar retornos\", a conjunção \"embora\" estabelece relação de:","o":["concessão.","conclusão.","condição.","causa."],"a":0,"c":"\"Embora\" é conjunção concessiva: admite um fato contrário sem impedir o que se afirma na oração principal."},
{"m":"pt","tx":"t1","e":"A expressão \"Por isso\", no terceiro período, introduz uma ideia de:","o":["oposição.","conclusão.","finalidade.","adição."],"a":1,"c":"\"Por isso\" retoma o que foi dito antes e apresenta a consequência ou conclusão."},

var RESUMOS=[
{m:'ce',t:'Princípios do SUS',p:[
 'Doutrinários: universalidade (todos têm direito), integralidade (cuidado completo, da prevenção à reabilitação) e equidade (tratar desigualmente os desiguais, conforme a necessidade).',
 'Organizativos: descentralização com direção única em cada esfera, regionalização e hierarquização da rede, e participação da comunidade.',
 'CF/88, art. 196: saúde é direito de todos e dever do Estado.',
 'CF/88, art. 198: as ações formam uma rede regionalizada e hierarquizada, um sistema único.',
 'A iniciativa privada participa de forma complementar, com preferência para entidades filantrópicas e sem fins lucrativos.']},
{m:'ce',t:'Lei 8.080/1990 (Lei Orgânica da Saúde)',p:[
 'Trata da promoção, proteção e recuperação da saúde e da organização e funcionamento dos serviços.',
 'Art. 3º: alimentação, moradia, saneamento, meio ambiente, trabalho, renda, educação, lazer e transporte são determinantes e condicionantes da saúde.',
 'Art. 6º: o campo de atuação inclui vigilância sanitária, epidemiológica, saúde do trabalhador e assistência terapêutica integral, inclusive farmacêutica.',
 'Vigilância epidemiológica: conhecer, detectar e prevenir mudanças nos fatores que influem na saúde, para recomendar medidas de controle.',
 'Vigilância sanitária: eliminar, diminuir ou prevenir riscos ligados ao meio ambiente, à produção e circulação de bens e à prestação de serviços.',
 'Art. 7º: princípios como universalidade, integralidade, igualdade sem privilégios, direito à informação, descentralização e participação da comunidade.',
 'Direção única: Ministério da Saúde (União), secretarias estaduais e secretarias municipais.']},
{m:'ce',t:'Lei 8.142/1990 (participação e financiamento)',p:[
 'Instâncias colegiadas: Conferência de Saúde e Conselho de Saúde.',
 'Conferência: reúne-se a cada 4 anos para avaliar a situação de saúde e propor diretrizes.',
 'Conselho: caráter permanente e deliberativo; formula estratégias e controla a execução da política, inclusive financeira.',
 'Usuários ocupam vagas paritárias em relação ao conjunto dos demais segmentos (50%).',
 'Para receber recursos do Fundo Nacional de forma regular e automática, o município precisa de: Fundo de Saúde, Conselho, Plano de Saúde, relatórios de gestão, contrapartida de recursos e comissão para o plano de carreira (PCCS).']},
{m:'ce',t:'Decreto 7.508/2011',p:[
 'Regulamenta a Lei 8.080 quanto à organização do SUS, ao planejamento, à assistência e à articulação interfederativa.',
 'Região de Saúde: municípios limítrofes agrupados. Deve ter, no mínimo, atenção primária, urgência e emergência, atenção psicossocial, atenção ambulatorial especializada e hospitalar, e vigilância em saúde.',
 'Portas de entrada: atenção primária, urgência e emergência, atenção psicossocial e serviços especiais de acesso aberto.',
 'RENASES: relação de ações e serviços de saúde. RENAME: relação de medicamentos essenciais.',
 'Comissões intergestores: CIT (União, estados e municípios), CIB (estado e municípios) e CIR (estado e municípios da região).',
 'COAP: Contrato Organizativo da Ação Pública da Saúde, acordo entre os entes de uma região.']},
{m:'ce',t:'Atenção Básica e Estratégia Saúde da Família',p:[
 'A atenção básica é a principal porta de entrada e a ordenadora da rede.',
 'Equipe mínima de Saúde da Família: médico, enfermeiro, auxiliar e/ou técnico de enfermagem e agente comunitário de saúde.',
 'Profissionais de saúde bucal e agente de combate às endemias podem integrar a equipe.',
 'População de referência por equipe (PNAB 2017): 2.000 a 3.500 pessoas.',
 'Base do trabalho: território adscrito, vínculo, longitudinalidade e coordenação do cuidado.']},
{m:'ce',t:'Política Nacional de Humanização (HumanizaSUS)',p:[
 'Princípios: transversalidade, indissociabilidade entre atenção e gestão, e protagonismo dos sujeitos.',
 'Diretrizes: acolhimento, gestão participativa, ambiência, clínica ampliada, valorização do trabalhador e defesa dos direitos dos usuários.',
 'Acolhimento é postura de escuta qualificada de toda a equipe, e não um setor ou uma triagem.',
 'Acolhimento com classificação de risco organiza a ordem de atendimento pela gravidade, não pela ordem de chegada.']},
{m:'ce',t:'Exercício profissional (Lei 7.498/1986)',p:[
 'Privativo do enfermeiro: consulta e prescrição de enfermagem, direção do serviço de enfermagem e cuidados de maior complexidade técnica a pacientes graves.',
 'Técnico de enfermagem: atividade de nível médio, com orientação e acompanhamento do trabalho em grau auxiliar e participação no planejamento da assistência.',
 'O técnico executa ações assistenciais, exceto as privativas do enfermeiro, e participa da equipe de saúde.',
 'Auxiliar de enfermagem: atividades de nível médio de natureza repetitiva, sob supervisão.',
 'O Decreto 94.406/1987 regulamenta a lei.']},
{m:'ce',t:'Código de Ética (Res. Cofen 564/2017)',p:[
 'Direito: recusar-se a executar atividades fora de sua competência técnica, científica, ética e legal.',
 'Proibido: administrar medicamento sem conhecer indicação, ação, via e riscos; executar prescrição ilegível ou sem assinatura, salvo urgência.',
 'Sigilo: pode ser revelado nos casos previstos em lei, por ordem judicial ou com consentimento escrito da pessoa ou do representante legal.',
 'Penalidades: advertência verbal, multa, censura, suspensão (até 90 dias) e cassação (até 30 anos).',
 'Infrações são classificadas em leves, graves e gravíssimas.']},
{m:'ce',t:'Sinais vitais no adulto',p:[
 'Pulso: 60 a 100 bpm. Abaixo é bradicardia, acima é taquicardia.',
 'Respiração: 12 a 20 irpm (eupneia). Abaixo é bradipneia, acima é taquipneia. Ausência é apneia.',
 'Temperatura axilar: em torno de 36 a 37 °C. Os limites para febre variam conforme a referência usada.',
 'Saturação de O2: em geral, 95% ou mais em ar ambiente.',
 'Dor é considerada o 5º sinal vital.']},
{m:'ce',t:'Hipertensão arterial',p:[
 'Classificação (Diretrizes 2020): ótima < 120/80; normal 120–129/80–84; pré-hipertensão 130–139/85–89.',
 'Estágio 1: 140–159 e/ou 90–99. Estágio 2: 160–179 e/ou 100–109. Estágio 3: ≥ 180 e/ou ≥ 110.',
 'Técnica: paciente sentado, em repouso de 3 a 5 min, bexiga vazia, sem café ou cigarro nos 30 min anteriores, pernas descruzadas e braço apoiado na altura do coração.',
 'O manguito fica 2 a 3 cm acima da fossa cubital, sem roupa apertando o braço.']},
{m:'ce',t:'Diabetes mellitus',p:[
 'Diagnóstico: glicemia de jejum ≥ 126 mg/dL, HbA1c ≥ 6,5%, glicemia 2 h após sobrecarga ≥ 200 ou glicemia casual ≥ 200 com sintomas.',
 'Hipoglicemia: < 70 mg/dL. Sinais: sudorese, tremor, palidez, confusão. Corrigir com 15 g de carboidrato rápido e medir de novo em 15 min.',
 'Insulina regular é límpida; NPH é turva. Na mistura na mesma seringa, aspira-se primeiro a regular.',
 'Aplicação subcutânea com rodízio de locais para prevenir lipodistrofia.',
 'Pé diabético: inspecionar diariamente, secar entre os dedos e não andar descalço.']},
{m:'ce',t:'Cálculos de medicação',p:[
 'Macrogotas/min = volume (mL) ÷ (tempo em horas × 3).',
 'Microgotas/min = volume (mL) ÷ tempo em horas.',
 '1 mL = 20 gotas = 60 microgotas.',
 'Regra de três: o que tenho está para o volume que tenho, assim como o prescrito está para x.',
 'Penicilina cristalina: atenção à diluição informada no frasco. Confira sempre a unidade (UI, mg ou mL).']},
{m:'ce',t:'Vias de administração',p:[
 'Intradérmica: cerca de 15°, pequeno volume (ex.: BCG, PPD).',
 'Subcutânea: 45° ou 90°, conforme a agulha e o tecido (ex.: insulina, heparina).',
 'Intramuscular: 90°. Deltoide só para pequenos volumes; ventroglútea é região segura para volumes maiores.',
 'Endovenosa: ação imediata, exige técnica asséptica rigorosa.',
 'Os "certos" da medicação incluem paciente, medicamento, dose, via, hora, registro, orientação, forma e resposta.']},
{m:'ce',t:'Biossegurança',p:[
 'Precaução padrão: para todos os pacientes (higiene das mãos, EPI conforme o risco, descarte seguro).',
 'Contato: luvas e avental (ex.: bactérias multirresistentes, escabiose).',
 'Gotículas: máscara cirúrgica (ex.: influenza, meningite meningocócica, coqueluche).',
 'Aerossóis: respirador N95/PFF2 e quarto privativo (ex.: tuberculose, sarampo, varicela).',
 'Spaulding: crítico → esterilização; semicrítico → desinfecção de alto nível; não crítico → limpeza ou desinfecção de baixo nível.',
 'RDC 222/2018: grupo A infectante, B químico, C radioativo, D comum, E perfurocortante.']},
{m:'ce',t:'Saúde da mulher',p:[
 'Regra de Naegele: DUM + 7 dias e − 3 meses (ou + 9 meses).',
 'Vacina dTpa: a partir da 20ª semana, em cada gestação, para proteger o bebê contra coqueluche.',
 'Sífilis na gestação: tratar com penicilina benzatina e tratar também a parceria sexual.',
 'Citopatológico (diretriz de 2016): 25 a 64 anos; após dois exames anuais normais, a cada 3 anos. O Ministério da Saúde vem adotando o teste de DNA-HPV, repetido a cada 5 anos quando negativo.',
 'Climatério: transição do período reprodutivo para o não reprodutivo. A menopausa é a última menstruação, confirmada após 12 meses sem menstruar.']},
{m:'ce',t:'Saúde da criança',p:[
 'Apgar no 1º e no 5º minuto: frequência cardíaca, respiração, tônus, irritabilidade reflexa e cor.',
 'Teste do pezinho: entre o 3º e o 5º dia de vida. Teste do coraçãozinho: entre 24 e 48 horas.',
 'Ao nascer: vacinas BCG e hepatite B (esta, de preferência, nas primeiras 24 horas).',
 'Aleitamento materno exclusivo até 6 meses e complementado até 2 anos ou mais.',
 'Método Canguru: contato pele a pele com o recém-nascido de baixo peso.']},
{m:'ce',t:'Doenças transmissíveis',p:[
 'Dengue: Aedes aegypti. Tratamento com hidratação. Evitar AAS e anti-inflamatórios.',
 'Tuberculose: transmissão por aerossóis. Esquema básico de 6 meses (2 RHZE + 4 RH).',
 'Hanseníase: Mycobacterium leprae. Paucibacilar até 5 lesões (6 doses), multibacilar mais de 5 lesões (12 doses).',
 'Sífilis: Treponema pallidum. Penicilina benzatina.',
 'Leptospirose: contato com água ou lama contaminada por urina de roedores.',
 'Raiva: lavar o ferimento com água e sabão e avaliar a profilaxia.',
 'Febre maculosa: carrapato-estrela (Amblyomma), bactéria Rickettsia rickettsii.',
 'Hepatite A: transmissão fecal-oral. Hepatite B: sangue e via sexual, com vacina disponível.']},
{m:'ce',t:'Urgência e emergência',p:[
 'RCP no adulto: 100 a 120 compressões/min, 5 a 6 cm de profundidade, 30:2 sem via aérea avançada, e DEA assim que disponível.',
 'Manchester: vermelho (imediato), laranja (até 10 min), amarelo (até 60 min), verde (até 120 min), azul (até 240 min).',
 'Regra dos nove (adulto): cabeça 9%, cada braço 9%, tronco anterior 18%, posterior 18%, cada perna 18%, períneo 1%.',
 'OVACE em adulto consciente com obstrução grave: compressões abdominais (Heimlich).',
 'Escala de Glasgow: 3 a 15 pontos. Escore igual ou menor que 8 sugere necessidade de proteger a via aérea.']},
{m:'ce',t:'Vigilância e indicadores',p:[
 'Incidência: casos novos em um período. Prevalência: todos os casos existentes.',
 'Mortalidade infantil: óbitos de menores de 1 ano ÷ nascidos vivos × 1.000.',
 'Letalidade: óbitos pela doença ÷ casos da doença.',
 'Notificação compulsória imediata: até 24 horas. Semanal: até 7 dias.',
 'Prevenção (Leavell e Clark): primária (promoção e proteção, ex.: vacina), secundária (diagnóstico precoce), terciária (reabilitação).']},
{m:'pt',t:'Crase',p:[
 'Ocorre quando a preposição "a" encontra o artigo feminino "a": vou à farmácia.',
 'Não ocorre antes de palavra masculina, verbo, pronome pessoal, "esta/essa" e "a" no singular antes de palavra no plural.',
 'Horas exatas: às 8h. Locuções femininas: à noite, às pressas, à medida que.',
 'Teste da volta: "vou a Brasília, volto de Brasília" (sem crase); "vou à Bahia, volto da Bahia" (com crase).']},
{m:'pt',t:'Concordância verbal',p:[
 '"Haver" no sentido de existir e "fazer" indicando tempo são impessoais: houve faltas, faz dois anos.',
 'Com "se" apassivador, o verbo concorda com o sujeito: alugam-se salas.',
 'Com "se" índice de indeterminação do sujeito, o verbo fica no singular: precisa-se de técnicos.',
 '"Mais de um" pede o verbo no singular: mais de um paciente reclamou.',
 'Nomes próprios no plural com artigo levam o verbo ao plural: os Estados Unidos são.']},
{m:'pt',t:'Regência',p:[
 'Assistir (ver) a: assistiu ao jogo. Assistir (ajudar) é transitivo direto: assistiu o paciente.',
 'Obedecer e desobedecer a. Visar (pretender) a.',
 'Preferir uma coisa a outra, sem "do que" e sem "mais".',
 'Esquecer algo, ou esquecer-se de algo.',
 'Aversão a, medo de, residente em.']},
{m:'pt',t:'Colocação pronominal',p:[
 'Pela norma-padrão, não se inicia frase com pronome oblíquo.',
 'Próclise (antes do verbo) com palavras atrativas: negação, pronomes relativos e indefinidos, advérbios e conjunções subordinativas.',
 'Mesóclise com futuro do presente e do pretérito sem palavra atrativa: entregar-lhe-ei.',
 'Não se usa ênclise com verbo no futuro nem no particípio.']},
{m:'pt',t:'Porquês e acentuação',p:[
 'Por que: perguntas e "pelo qual". Por quê: fim de frase. Porque: explicação/causa. Porquê: substantivo (o porquê).',
 'Após o Acordo: ideia, heroico, voo, veem, leem e para (verbo) sem acento.',
 'Mantêm acento: têm e vêm (plural), pôr (verbo) e pôde (passado).']},
{m:'rl',t:'Lógica proposicional',p:[
 'Negação de "todo" é "algum não". Negação de "nenhum" é "algum".',
 '~(p ∧ q) = ~p ∨ ~q. ~(p ∨ q) = ~p ∧ ~q.',
 '~(p → q) = p ∧ ~q.',
 'p → q equivale a ~q → ~p (contrapositiva) e a ~p ∨ q.',
 'A condicional só é falsa quando a primeira parte é verdadeira e a segunda é falsa.',
 'A conjunção (∧) só é verdadeira se ambas forem verdadeiras; a disjunção (∨), se ao menos uma for.']},
{m:'rl',t:'Fórmulas que mais caem',p:[
 'Aumentos e descontos sucessivos: multiplique os fatores (ex.: +25% e −20% = 1,25 × 0,8 = 1, sem variação).',
 'Permutação: n!. Arranjo (ordem importa): n!/(n−p)!. Combinação (ordem não importa): n!/[p!(n−p)!].',
 'Probabilidade = casos favoráveis ÷ casos possíveis. Eventos sucessivos: multiplique as probabilidades.',
 'União de conjuntos: n(A ∪ B) = n(A) + n(B) − n(A ∩ B).',
 'Média ponderada: soma de (valor × peso) ÷ soma dos pesos.']},
{m:'in',t:'Atalhos essenciais',p:[
 'Windows: Win + E (Explorador), Win + D (área de trabalho), Win + L (bloquear), Ctrl + Shift + Esc (Gerenciador de Tarefas), Alt + Tab (alternar janelas).',
 'Word em português: Ctrl + N (negrito), Ctrl + I (itálico), Ctrl + S (sublinhado), Ctrl + B (salvar), Ctrl + P (imprimir).',
 'Gerais: Ctrl + C, Ctrl + X, Ctrl + V (copiar, recortar, colar) e Ctrl + Z (desfazer).']},
{m:'in',t:'Excel',p:[
 'Toda fórmula começa com "=". Referência absoluta usa cifrão: $A$1 não muda ao copiar.',
 'SOMA, MÉDIA, MÁXIMO, MÍNIMO.',
 'SE(teste; valor_se_verdadeiro; valor_se_falso).',
 'CONT.SE conta as células que atendem ao critério. SOMASE soma.',
 'PROCV(valor; tabela; nº da coluna; FALSO) busca com correspondência exata.']},
{m:'in',t:'Segurança da informação',p:[
 'Vírus precisa de um arquivo hospedeiro; worm se propaga sozinho; cavalo de troia se disfarça de programa legítimo.',
 'Spyware espiona; ransomware criptografa dados e pede resgate; phishing imita instituições para roubar dados.',
 'Firewall filtra conexões. Antivírus detecta e remove malware.',
 'Backup completo copia tudo; incremental copia o que mudou desde o último backup; diferencial, o que mudou desde o último completo.',
 'HTTPS indica conexão criptografada. A navegação anônima só evita guardar dados no aparelho.']}
];

function dayOf(d){return S.days[d-1]}
function seen(l){var c=0;l.f.forEach(function(x){if(S.w[x[0]])c++});return c}
function vdays(){return S.days.filter(function(d){return d.f.length})}
function nextDay(){var v=vdays();for(var i=0;i<v.length;i++)if(seen(v[i])<v[i].f.length)return v[i].d;return v.length?v[v.length-1].d:1}
function firstUnseen(l){for(var i=0;i<l.f.length;i++)if(!S.w[l.f[i][0]])return i;return 0}
function cur(){if(!S.sel)return null;return S.sel.x!=null?S.extras[S.sel.x]:dayOf(S.sel.d)}
function dkey(t){var d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function activity(){var m={};function add(t){var q=dkey(t);m[q]=(m[q]||0)+1}Object.keys(S.w).forEach(function(k){add(S.w[k])});Object.keys(S.ans).forEach(function(k){if(S.ans[k].t)add(S.ans[k].t)});return m}
function streaks(){var m=activity(),c=0,d=new Date();d.setHours(12,0,0,0);if(!m[dkey(d)])d.setDate(d.getDate()-1);while(m[dkey(d)]){c++;d.setDate(d.getDate()-1)}
  var ks=Object.keys(m).map(function(k){var p=k.split('-');return new Date(+p[0],p[1]-1,+p[2],12).getTime()}).sort(function(a,b){return a-b});
  var best=0,run=0,prev=null;ks.forEach(function(t){run=(prev&&Math.round((t-prev)/864e5)===1)?run+1:1;best=Math.max(best,run);prev=t});return {cur:c,best:best,m:m}}
function restRange(d){var a=d-1;while(a>1&&dayOf(a-1).f.length)a--;return [a,d-1]}
function hasPrev(d){for(var i=d-1;i>=1;i--)if(dayOf(i).f.length)return true;return false}
function hasNext(d){for(var i=d+1;i<=80;i++)if(dayOf(i).f.length)return true;return false}
function courseStats(){var v=vdays(),tot=0,c=0,full=0;v.forEach(function(d){tot+=d.f.length;var k=seen(d);c+=k;if(k===d.f.length)full++});return {tot:tot,c:c,full:full,days:v.length}}

/* ---------- dados das questões ---------- */
function qkey(sid,i){return sid+':'+i}
function qget(key){var p=key.split(':'),s=SIMULADOS.filter(function(x){return x.id===p[0]})[0];return s?{s:s,q:s.q[+p[1]],i:+p[1]}:null}
function qstats(){var n=0,ok=0;Object.keys(S.ans).forEach(function(k){var g=qget(k);if(!g)return;n++;if(S.ans[k].c===g.q.a)ok++});return {n:n,ok:ok}}
function wrongKeys(){return Object.keys(S.ans).filter(function(k){var g=qget(k);return g&&S.ans[k].c!==g.q.a}).sort(function(a,b){var x=a.split(':'),y=b.split(':');return x[0]===y[0]?(+x[1])-(+y[1]):(x[0]<y[0]?-1:1)})}
function simStats(s){var n=0,ok=0;s.q.forEach(function(q,i){var a=S.ans[qkey(s.id,i)];if(a){n++;if(a.c===q.a)ok++}});return {n:n,ok:ok}}
function saveAns(){store.set('a80q',S.ans)}

/* ---------- anéis ---------- */
function ring(d,sel){var n=d.f.length,c=seen(d);var cls='ring'+(n?(c===n?' full':''):' none')+(sel?' sel':'')+(sel&&!c&&n?' p0':'');
  var inner=sel&&n&&c<n?(c+'/'+n):(n&&c===n?check(sel?14:13):d.d);
  var tip='Dia '+d.d+', '+d.s+(n?' ('+c+' de '+n+' aulas)':'');
  return '<button class="'+cls+'" data-d="'+d.d+'" style="--p:'+(n?c/n:0)+'" title="'+esc(tip)+'" aria-label="'+esc(tip)+'">'+inner+'</button>'}

  host.innerHTML=h;
  host.querySelector('.opts').onclick=function(e){var b=e.target.closest('.opt');if(!b||b.disabled)return;answer(+b.dataset.o)};
  host.querySelector('.qgrid').onclick=function(e){var b=e.target.closest('.qn');if(b){Q.i=+b.dataset.j;renderQuiz()}};
  $('qBack').onclick=function(){S.quiz=null;if(Q.mode==='erros')renderErros();else renderSimList()};
  $('qPrev').onclick=function(){Q.i--;renderQuiz()};
  if($('qNext'))$('qNext').onclick=function(){Q.i++;renderQuiz();host.scrollIntoView({block:'start'})};
  if($('qEnd'))$('qEnd').onclick=function(){renderResult()};
  $('qFin').onclick=function(){renderResult()};
}
function answer(k){var Q=S.quiz,key=Q.keys[Q.i],rec={c:k,t:Date.now()};
  if(Q.mode==='erros')Q.fresh[key]=rec;S.ans[key]=rec;saveAns();updateBadges();renderQuiz()}
function renderResult(){
  var Q=S.quiz,host=quizHost(),tot=Q.keys.length,ok=0,n=0,by={};
  Q.keys.forEach(function(k){var x=qAns(k),q=qget(k).q;by[q.m]=by[q.m]||{t:0,ok:0};by[q.m].t++;if(x){n++;if(x.c===q.a){ok++;by[q.m].ok++}}});
  var pct=Math.round(ok/tot*100),wk=wrongKeys().length;
  var h='<div class="glass result"><div class="big">'+pct+'<span>%</span></div><div><h3>'+(Q.mode==='erros'?'Revisão do caderno de erros':qget(Q.keys[0]).s.nome)+'</h3><p>'+ok+' acertos de '+tot+' questões'+(n<tot?' ('+(tot-n)+' sem resposta)':'')+'.</p><div class="btns">'+
    '<button class="wbtn" id="rBack">'+(Q.mode==='erros'?'Voltar ao caderno':'Voltar aos simulados')+'</button>'+(wk?'<button class="gbtn" id="rErr">Refazer meus erros ('+wk+')</button>':'')+'</div></div></div>';
  h+='<div class="glass subj">'+Object.keys(by).map(function(m){var p=by[m].ok/by[m].t;return '<div class="srow"><span class="ic">'+ICON[MATIC[m]]+'</span><div><b>'+MAT[m]+'</b><div class="dline" style="--p:'+p+'"><i></i></div></div><span class="pc">'+by[m].ok+'/'+by[m].t+'</span></div>'}).join('')+'</div>';
  host.innerHTML='<div class="view">'+h+'</div>';
  $('rBack').onclick=function(){S.quiz=null;if(Q.mode==='erros')renderErros();else renderSimList()};
  if($('rErr'))$('rErr').onclick=function(){startQuiz('erros',wrongKeys(),0)};
}
$('simList').onclick=function(e){var b=e.target.closest('button');if(!b)return;
  var s=b.dataset.start||b.dataset.res||b.dataset.reset;if(!s)return;var sim=SIMULADOS.filter(function(x){return x.id===s})[0],keys=sim.q.map(function(_,i){return qkey(s,i)});
  if(b.dataset.reset){keys.forEach(function(k){delete S.ans[k]});saveAns();updateBadges();startQuiz('sim',keys,0);return}
  if(b.dataset.res){S.quiz={mode:'sim',keys:keys,i:0,fresh:{}};$('simList').hidden=true;$('quizBox').hidden=false;renderResult();return}
  startQuiz('sim',keys)};

/* ---------- RESUMOS ---------- */
function renderResumos(){
  var f=S.resF,q=fold($('rq').value.trim()),mats=['todos','ce','pt','rl','in'];
  $('resChips').innerHTML=mats.map(function(m){return '<button class="chip'+(m===f?' on':'')+'" data-f="'+m+'">'+(m==='todos'?'Todos':MAT[m])+'</button>'}).join('');
  var list=RESUMOS.filter(function(r){return (f==='todos'||r.m===f)&&(q.length<2||fold(r.t+' '+r.p.join(' ')).indexOf(q)>-1)});
  $('resCount').textContent=plural(list.length,'tema','temas');
  function hl(t){var s=esc(t);if(q.length<2)return s;var src=fold(s),out='',i=0,j;while((j=src.indexOf(q,i))>-1){out+=s.slice(i,j)+'<mark>'+s.slice(j,j+q.length)+'</mark>';i=j+q.length}return out+s.slice(i)}
  $('resCards').innerHTML=list.length?list.map(function(r){return '<div class="glass card"><div class="h"><span class="ic">'+ICON[MATIC[r.m]]+'</span><div><b>'+hl(r.t)+'</b><small>'+MAT[r.m]+'</small></div></div><ul>'+r.p.map(function(p){return '<li>'+hl(p)+'</li>'}).join('')+'</ul></div>'}).join('')
    :'<p class="empty">Nenhum resumo com esse termo. Tente uma palavra mais curta.</p>';
}
$('resChips').onclick=function(e){var b=e.target.closest('.chip');if(b){S.resF=b.dataset.f;renderResumos()}};
$('rq').addEventListener('input',renderResumos);

/* ---------- CADERNO DE ERROS ---------- */
function renderErros(){
  var ks=wrongKeys(),host=$('vErr');
  var h='<div class="glass errhead"><span class="ic">'+ICON.alert+'</span><div class="tx"><b>'+plural(ks.length,'questão','questões')+'</b><small>'+(ks.length?'Erros guardados dos simulados. Acertou ao refazer, a questão sai do caderno.':'Quando você errar uma questão nos simulados, ela aparece aqui para revisar.')+'</small></div>'+
    (ks.length?'<button class="wbtn" id="eGo">Refazer todas</button>':'<button class="wbtn" id="eSim">Ir para simulados</button>')+'</div>';
  if(ks.length){var groups={};ks.forEach(function(k){var m=qget(k).q.m;(groups[m]=groups[m]||[]).push(k)});
    Object.keys(groups).forEach(function(m){h+='<h2 class="sec">'+MAT[m]+' <span>'+groups[m].length+'</span></h2><div class="results">'+groups[m].map(function(k){var g=qget(k);
      return '<button class="rrow" data-k="'+k+'"><span class="ic">'+ICON[MATIC[g.q.m]]+'</span><span class="tx"><b>'+esc(g.q.e)+'</b><small>'+g.s.nome+', questão '+(g.i+1)+'</small></span>'+CHEV+'</button>'}).join('')+'</div>'})}
  host.innerHTML=h;
  if($('eGo'))$('eGo').onclick=function(){startQuiz('erros',ks,0)};
  if($('eSim'))$('eSim').onclick=function(){setView('simulados')};
  host.onclick=function(e){var b=e.target.closest('[data-k]');if(b&&!S.quiz)startQuiz('erros',ks,ks.indexOf(b.dataset.k))};
}
function updateBadges(){var n=wrongKeys().length;[$('errBadge'),$('errBadgeM')].forEach(function(b){b.hidden=!n;b.textContent=n})}

/* ---------- navegação ---------- */
function setView(v){S.view=v;$('app').dataset.view=v;
  $('vInicio').hidden=v!=='inicio';$('vAulas').hidden=v!=='aulas';$('vSim').hidden=v!=='simulados';$('vRes').hidden=v!=='resumos';$('vErr').hidden=v!=='erros';
  [].forEach.call(document.querySelectorAll('#seg button,#nav button'),function(b){b.classList.toggle('on',b.dataset.v===v)});
  if(v==='inicio')renderInicio();
  if(v==='aulas'){renderAula();renderSide();setSub(S.sub)}
  if(v==='simulados'){if(S.quiz&&S.quiz.mode!=='erros')renderQuiz();else{S.quiz=S.quiz&&S.quiz.mode==='erros'?null:S.quiz;renderSimList()}}
  if(v==='resumos')renderResumos();
  if(v==='erros'){if(S.quiz&&S.quiz.mode==='erros')renderQuiz();else{if(S.quiz)S.quiz=null;renderErros()}}
  playerMode();window.scrollTo(0,0)}
function openDay(d,idx,play){var l=dayOf(d);S.sel={d:d};S.block=Math.floor((d-1)/8);S.idx=idx==null?firstUnseen(l):idx;S.playing=!!play&&l.f.length>0;S.sub='aula';
  if(S.view!=='aulas')setView('aulas');else{setSub('aula');renderAula()}if(play)$('player').scrollIntoView({behavior:'smooth',block:'center'})}
function openExtra(xi,idx){S.sel={x:xi};S.idx=idx||0;S.playing=false;S.sub='aula';if(S.view!=='aulas')setView('aulas');else{setSub('aula');renderAula()}}
function go(i,play){S.idx=i;S.playing=!!play;renderAula()}
function toggle(id){var on=!S.w[id];if(on)S.w[id]=Date.now();else delete S.w[id];store.set('a80w',S.w);
  var l=cur(),full=l.f.length&&l.f.every(function(x){return S.w[x[0]]});renderAula();renderSide();if(on&&full&&S.sel.d!=null)toast('Dia '+S.sel.d+' concluído')}

$('pMin').onclick=function(){if(S.view!=='aulas')setView('aulas');else setSub('aula')};
$('pClose').onclick=function(e){e.stopPropagation();stopPlayer()};
$('pClose').innerHTML=ICO_X;$('pMin').innerHTML=ICO_EXPAND;
if(IS_MOBILE)document.body.classList.add('is-m');
$('mark').onclick=function(){var l=cur(),f=l&&l.f[S.idx];if(!f)return;var was=S.w[f[0]];toggle(f[0]);if(!was&&S.idx<l.f.length-1)go(S.idx+1,false)};
$('nextLesson').onclick=function(){var l=cur();if(S.idx<l.f.length-1){go(S.idx+1,true);return}if(S.sel.d!=null)for(var d=S.sel.d+1;d<=80;d++)if(dayOf(d).f.length){openDay(d,0,true);return}};
$('prevLesson').onclick=function(){var l=cur();if(S.idx>0){go(S.idx-1,true);return}if(S.sel.d!=null)for(var d=S.sel.d-1;d>=1;d--){var x=dayOf(d);if(x.f.length){openDay(d,x.f.length-1,true);return}}};
$('lessons').onclick=function(e){var c=e.target.closest('.chk');if(c){toggle(cur().f[+c.dataset.c][0]);return}var li=e.target.closest('.lesson');if(li){go(+li.dataset.i,true);$('player').scrollIntoView({behavior:'smooth',block:'center'})}};
function stripClick(e){var b=e.target.closest('[data-b]');if(b){S.block=Math.max(0,Math.min(9,S.block+(+b.dataset.b)));renderStrips();return}var r=e.target.closest('.ring[data-d]');if(r)openDay(+r.dataset.d,null,false)}
$('stripD').onclick=stripClick;$('stripM').onclick=stripClick;
$('cycles').onclick=function(e){var r=e.target.closest('.ring[data-d]');if(r)openDay(+r.dataset.d,null,false)};
$('extras').onclick=function(e){var b=e.target.closest('[data-x]');if(b)openExtra(+b.dataset.x,0)};
$('agD').onclick=function(e){var b=e.target.closest('.agc');if(b)openDay(+b.dataset.d,null,true)};
$('aulasSeg').onclick=function(e){var b=e.target.closest('button[data-s]');if(b)setSub(b.dataset.s)};
$('seg').onclick=$('nav').onclick=function(e){var b=e.target.closest('button[data-v]');if(b){if(b.dataset.v===S.view&&S.quiz){S.quiz=null}setView(b.dataset.v)}};
$('train').onclick=function(e){var b=e.target.closest('[data-go]');if(b)setView(b.dataset.go)};
$('brand').onclick=function(){setView('inicio')};
$('searchBtn').onclick=function(){S.sub='mapa';setView('aulas');$('q').focus()};
var hits=[];
$('q').addEventListener('input',function(){var q=fold(this.value.trim());if(q.length<2){$('results').hidden=true;$('mapBody').hidden=false;return}
  hits=[];S.days.forEach(function(d){d.f.forEach(function(x,i){if(fold(x[1]).indexOf(q)>-1)hits.push({d:d.d,i:i,s:d.s,t:x[1]})})});
  S.extras.forEach(function(x,xi){x.f.forEach(function(y,i){if(fold(y[1]).indexOf(q)>-1)hits.push({x:xi,i:i,s:x.name,t:y[1]})})});
  $('mapBody').hidden=true;$('results').hidden=false;
  $('results').innerHTML=hits.length?'<h4>'+plural(hits.length,'aula encontrada','aulas encontradas')+'</h4>'+hits.slice(0,60).map(function(a,k){
    return '<button class="rrow" data-k="'+k+'"><span class="ic">'+ICON[a.d?sk(a.s)[1]:'x']+'</span><span class="tx"><b>'+esc(pretty(a.t))+'</b><small>'+(a.d?'Dia '+a.d+', '+a.s:esc(a.s))+'</small></span>'+CHEV+'</button>'}).join('')
    :'<p class="empty">Nenhuma aula com esse termo. Tente uma palavra mais curta, como "SUS" ou "crase".</p>'});
$('results').onclick=function(e){var b=e.target.closest('[data-k]');if(!b)return;var a=hits[+b.dataset.k];if(a.d)openDay(a.d,a.i,true);else openExtra(a.x,a.i)};
document.addEventListener('keydown',function(e){if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(S.quiz&&(S.view==='simulados'||S.view==='erros')){var k=e.key.toLowerCase();var ix='abcd'.indexOf(k);if(ix>-1&&!qAns(S.quiz.keys[S.quiz.i])){answer(ix);return}
    if(e.key==='ArrowRight'&&$('qNext'))$('qNext').click();if(e.key==='ArrowLeft'&&!$('qPrev').disabled)$('qPrev').click();return}
  if(S.view==='aulas'){if(e.key==='m')$('mark').click();else if(e.key==='ArrowRight'&&e.shiftKey)$('nextLesson').click();else if(e.key==='ArrowLeft'&&e.shiftKey)$('prevLesson').click()}
  if(e.key==='/'){e.preventDefault();$('searchBtn').click()}});

/* ---------- desbloqueio (PIN conferido no servidor) ---------- */
function start(data){S.days=data.days;S.extras=data.extras||[];$('gate').hidden=true;$('app').hidden=false;
  $('brandSub').textContent=COURSE.nome+', '+COURSE.orgao;
  var found=null;if(S.last)S.days.forEach(function(d){d.f.forEach(function(x,i){if(x[0]===S.last&&seen(d)<d.f.length)found={d:d.d,i:i}})});
  var d=found?found.d:nextDay();S.sel={d:d};S.block=Math.floor((d-1)/8);S.idx=found?found.i:firstUnseen(dayOf(d));S.playing=false;
  updateBadges();setView('inicio')}
function showGate(msg){$('gate').hidden=false;$('app').hidden=true;$('pinErr').textContent=msg||'';$('pin').disabled=false;$('pinBtn').disabled=false;setTimeout(function(){$('pin').focus()},50)}
var API='https://script.google.com/macros/s/AKfycbzun46yqrr2eSUCpxfc4nEgmlK5lbNVjco9dd3jc9jDZxglvsdHj6B8td3rLRVsQBO5kw/exec';
function callApi(secret,ok,fail){
  if(window.google&&google.script&&google.script.run){google.script.run.withSuccessHandler(ok).withFailureHandler(fail).getData(secret);return}
  fetch(API,{method:'POST',body:JSON.stringify({s:secret}),credentials:'omit',redirect:'follow'})
    .then(function(r){if(!r.ok)throw new Error('http');return r.text()})
    .then(function(t){t=(t||'').trim();ok(!t||t==='null'?null:t==='"locked"'?'locked':t)})
    .catch(fail)}
function fetchData(secret,silent){
  if(!silent){$('pinBtn').disabled=true;$('pinErr').textContent=''}
  callApi(secret,function(r){
    $('pinBtn').disabled=false;
    if(r==='locked'){if(!S.days.length)showGate('Muitas tentativas erradas. Espere 15 minutos e tente de novo.');return}
    if(!r){store.del('a80t');if(silent){if(!S.days.length)showGate()}else{$('pinErr').textContent='PIN incorreto. Confira e tente de novo.';$('pin').select()}return}
    r=JSON.parse(r);store.set('a80t',r.token);
    var fresh=JSON.stringify(r.data),old=JSON.stringify(store.get('a80d',null));store.set('a80d',r.data);
    if(!S.days.length)start(r.data);
    else if(fresh!==old&&!S.playing&&!S.quiz){S.days=r.data.days;S.extras=r.data.extras||[];setView(S.view)}
  },function(){
    $('pinBtn').disabled=false;
    if(!S.days.length)showGate('Não foi possível conectar. Verifique a internet e tente de novo.');
  })}
$('gateForm').onsubmit=function(e){e.preventDefault();var pin=$('pin').value.trim();if(pin)fetchData(pin,false)};
(function boot(){
  var t=store.get('a80t',null),d=store.get('a80d',null);
  if(t&&d){start(d);fetchData(t,true);return}
  if(t){$('gate').hidden=false;$('pin').disabled=true;$('pinErr').textContent='Carregando suas aulas…';fetchData(t,true);return}
  showGate();
})();
</script>
