, II e I. III: §7º. A IV está errada: a decisão final é homologada pelo dirigente máximo da Secretaria Municipal de Educação e Tecnologia, respeitada a ordem de classificação (§8º).","f":"LC 55/2007, art. 19-A, §§6º a 8º, redação da LC 210/2026","id":"5ab25f7"},{"m":"lm","tp":"LC 55/2007 – Jornada","nv":2,"e":"Segundo a LC nº 55/2007, com a redação dada pela LC nº 210/2026, a jornada semanal de 24 horas do Professor de Educação Básica (PEB I e II) é distribuída em:","o":["18 horas de regência em sala de aula e 6 horas de atividades de planejamento e reuniões.","20 horas de docência em sala de aula e 4 horas de atividades extraclasse.","21 horas e 40 minutos de regência e 2 horas e 20 minutos de planejamento e reuniões.","16 horas de docência em sala de aula e 8 horas de atividades extraclasse."],"a":3,"c":"Art. 20, VII (redação da LC 210/2026): 16 h de docência e 8 h extraclasse (4 h em local de livre escolha e 4 h na escola ou local definido pela direção, até 2 h semanais de reuniões de módulo). 18 h + 6 h era a redação original. 21h40 + 2h20 é a jornada do Professor de Apoio (VIII).","f":"LC 55/2007, art. 20, VII, redação da LC 210/2026","id":"9f2dad5"},{"m":"lm","tp":"LC 55/2007 – Jornada","nv":2,"e":"Marque V para verdadeiro e F para falso quanto à jornada semanal fixada no art. 20 da LC nº 55/2007, com a redação da LC nº 210/2026:\n( ) Mediador de Inclusão Escolar: 30 horas.\n( ) Auxiliar de Creche: 30 horas.\n( ) Psicólogo Escolar e Assistente Social Escolar: 30 horas.\n( ) Vice-Diretor Escolar: 40 horas.\nA sequência CORRETA é:","o":["V, V, V, F.","F, F, V, V.","V, F, F, F.","V, F, V, F."],"a":3,"c":"Mediador de Inclusão Escolar: 30 h (XI) – V. Auxiliar de Creche: 40 h (III) – F. Psicólogo Escolar e Assistente Social Escolar: 30 h (XVI) – V. Vice-Diretor Escolar: 24 h (IV) – F.","f":"LC 55/2007, art. 20, redação da LC 210/2026","id":"da31e79"},{"m":"lm","tp":"LC 55/2007 – Jornada","nv":3,"e":"Marque V para verdadeiro e F para falso, conforme a LC nº 55/2007, com a redação da LC nº 210/2026:\n( ) Das 8 horas de atividades extraclasse do professor, 4 horas são cumpridas em local de livre escolha do professor.\n( ) Das 4 horas extraclasse cumpridas na própria escola ou em local definido pela direção, até 2 horas semanais são dedicadas a reuniões de módulo.\n( ) O Professor de Apoio cumpre 24 horas semanais, sendo 18 horas de regência e 6 horas de planejamento e reuniões.\n( ) As aulas de Educação Física ministradas por Professor II e PEB II na Educação Infantil e nos anos iniciais do Ensino Fundamental têm duração de 50 minutos.\nA sequência CORRETA é:","o":["V, F, V, F.","V, V, F, F.","F, V, F, V.","V, V, V, F."],"a":1,"c":"Art. 20, V a VII, alíneas a e b: 4 h em local de livre escolha (V) e 4 h na escola, até 2 h de reuniões de módulo (V). Professor de Apoio: 21 h 40 min de regência e 2 h 20 min de planejamento e reuniões (art. 20, VIII) (F). Art. 20-A: aulas de Educação Física de 60 minutos; 50 minutos é a referência da hora-aula padrão (art. 25, §5º) (F).","f":"LC 55/2007, arts. 20 e 20-A, redação da LC 210/2026","id":"f933c56"},{"m":"lm","tp":"LC 55/2007 – Jornada","nv":2,"e":"Uma professora efetiva da Educação Pública Municipal foi readaptada na forma do art. 21 da LC nº 5/1991. De acordo com a LC nº 55/2007, com a redação dada pela LC nº 210/2026, sua carga horária:","o":["será mantida em 24 horas.","será a do cargo para o qual se deu a readaptação.","será reduzida à metade, sem prejuízo da remuneração.","será fixada em 40 horas, por se tratar de função administrativa."],"a":0,"c":"Art. 20, parágrafo único: o readaptado cumpre a jornada do cargo para o qual se deu a readaptação, EXCETO o titular do cargo de professor, cuja carga horária será mantida em 24 horas (exceção incluída pela LC 210/2026).","f":"LC 55/2007, art. 20, parágrafo único, redação da LC 210/2026","id":"958065d"},{"m":"lm","tp":"LC 55/2007 – Vantagens","nv":3,"e":"Sobre o Adicional Compensatório de Hora-Aula Proporcional, incluído na LC nº 55/2007 pela LC nº 210/2026, assinale a alternativa INCORRETA.","o":["É devido aos ocupantes dos cargos de Professor II e PEB II quando ministrarem aulas de Educação Física de 60 minutos na Educação Infantil e nos anos iniciais do Ensino Fundamental.","Corresponde a 20% do valor atribuído à hora-aula padrão da Rede Municipal de Educação, que considera a duração de 50 minutos.","Incorpora-se à remuneração do servidor e integra a base de cálculo das contribuições previdenciárias.","É devido exclusivamente por aula de Educação Física efetivamente lecionada, conforme registro no Quadro de Frequência da unidade escolar."],"a":2,"c":"Art. 25, §6º, V: o adicional tem natureza indenizatória, NÃO se incorpora à remuneração e NÃO integra a base de cálculo previdenciária. As demais estão no art. 25, VII, e §§5º e 6º, II e IV, e no art. 20-A.","f":"LC 55/2007, arts. 20-A e 25, VII e §§5º-6º, redação da LC 210/2026","id":"4563307"},{"m":"lm","tp":"LC 55/2007 – Vantagens","nv":2,"e":"Sobre as vantagens do servidor efetivo ocupante do cargo de Mediador de Inclusão Escolar, previstas no art. 25-A da LC nº 55/2007, incluído pela LC nº 210/2026, analise as afirmativas:\nI. O Adicional de Incentivo à Formação, de 5%, é devido ao servidor que possuir curso de Magistério (Nível Médio) ou Licenciatura Plena em Pedagogia.\nII. A Gratificação de Mediação Especializada, de 5%, é devida exclusivamente enquanto o servidor estiver em efetivo exercício e possuir, sob seus cuidados, aluno público-alvo da educação especial.\nIII. As vantagens são cumulativas e incorporam-se ao vencimento para fins de aposentadoria.\nEstão CORRETAS as afirmativas:","o":["I e III, apenas.","II e III, apenas.","I, II e III.","I e II, apenas."],"a":3,"c":"I e II: art. 25-A, I e II (calculadas exclusivamente sobre o vencimento-base). A III está errada: as vantagens são cumulativas, mas têm natureza transitória e NÃO se incorporam ao vencimento para aposentadoria ou disponibilidade, refletindo só no 13º e no terço de férias (parágrafo único).","f":"LC 55/2007, art. 25-A, redação da LC 210/2026","id":"987479b"},{"m":"lm","tp":"LC 55/2007 – Vantagens","nv":1,"e":"De acordo com a LC nº 55/2007, a gratificação a título de pó de giz, para o professor em exercício, corresponde a:","o":["10% incidente sobre o vencimento base.","1/3 incidente sobre o vencimento base.","20% incidente sobre a remuneração.","5% incidente sobre a remuneração."],"a":0,"c":"Art. 25, II: gratificação de 10% sobre o vencimento base, a título de pó de giz, para o professor em exercício. 1/3 sobre o vencimento base é a gratificação pelo exercício em escola da zona rural (I).","f":"LC 55/2007, art. 25, II","id":"575739d"},{"m":"lm","tp":"LC 55/2007 – Vantagens","nv":2,"e":"Analise as afirmativas sobre as vantagens dos servidores da Educação Pública Municipal previstas no art. 25 da LC nº 55/2007, com a redação da LC nº 210/2026:\nI. O adicional de férias é de 1/3 incidente sobre a remuneração.\nII. O adicional por trabalho extraordinário é de 50% em dias úteis e de 60% aos domingos e feriados, sendo permitida a compensação de jornada.\nIII. A gratificação pelo exercício em unidade escolar da zona rural é de 1/3 sobre o vencimento base e também é concedida ao Vigia lotado em escola da zona rural.\nEstão CORRETAS as afirmativas:","o":["I e II, apenas.","I, II e III.","II e III, apenas.","I e III, apenas."],"a":1,"c":"I: art. 25, IV. II: art. 25, VI, na redação da LC 210/2026. III: art. 25, I, e §3º. Todas corretas.","f":"LC 55/2007, art. 25, I, IV, VI e §3º, redação da LC 210/2026","id":"0f68d29"},{"m":"lm","tp":"LC 55/2007 – Férias","nv":1,"e":"Marque V para verdadeiro e F para falso, de acordo com as férias anuais previstas na LC nº 55/2007:\n( ) Os servidores da área pedagógica têm 45 dias de férias.\n( ) Os servidores da área administrativa têm 30 dias de férias, observado o interesse público.\n( ) Para os servidores que recebem remuneração variável, as férias serão calculadas à razão de 1/12 da soma das importâncias variáveis devidas no período aquisitivo.\n( ) As férias da área pedagógica são gozadas obrigatoriamente em um único período, no mês de janeiro.\nA sequência CORRETA é:","o":["V, F, V, F.","V, V, F, V.","V, V, V, F.","F, V, V, F."],"a":2,"c":"Art. 27, I: 45 dias para a área pedagógica, distribuídos nos períodos de recesso, conforme o interesse da unidade escolar (V, e por isso a última é F). Art. 27, II: 30 dias para a área administrativa (V). Parágrafo único: 1/12 da soma das variáveis do período aquisitivo (V).","f":"LC 55/2007, art. 27, redação da LC 210/2026","id":"f578c10"},{"m":"lm","tp":"LC 55/2007 – Progressão por merecimento","nv":2,"e":"Analise as afirmativas sobre a progressão horizontal por merecimento na LC nº 55/2007, com a redação da LC nº 210/2026:\nI. A avaliação de desempenho é apurada por comissão designada por indicação paritária do Secretário Municipal de Educação e do órgão de representação dos servidores.\nII. Exige-se que o servidor tenha completado 730 dias de efetivo exercício na classe.\nIII. Será considerado habilitado o servidor efetivo que obtiver, no mínimo, 70% em cada fator de avaliação de desempenho.\nIV. Os critérios da avaliação de desempenho são fixados pela própria comissão avaliadora, a cada ciclo.\nEstão CORRETAS as afirmativas:","o":["I e IV, apenas.","II, III e IV, apenas.","I, II, III e IV.","I, II e III, apenas."],"a":3,"c":"I: art. 29, III. II: art. 29, I. III: art. 29, §3º. A IV está errada: a avaliação é apurada mediante critérios objetivos estabelecidos em decreto do Chefe do Poder Executivo Municipal (art. 29, §4º). Atenção: na LC 54 a indicação paritária é do Prefeito.","f":"LC 55/2007, art. 29, redação da LC 210/2026","id":"55fa2c7"},{"m":"lm","tp":"LC 55/2007 – Progressão","nv":2,"e":"Sobre a progressão na carreira da Educação Pública Municipal, conforme a LC nº 55/2007 com a redação da LC nº 210/2026, assinale a alternativa INCORRETA.","o":["O servidor só terá direito à progressão após cumprido o estágio probatório.","O servidor posicionado no último padrão da faixa de progressão faz jus a progressão por conhecimento, mas não por merecimento.","O servidor nomeado para cargo em comissão terá direito à progressão por conhecimento no cargo efetivo de que seja titular.","Constatada irregularidade na documentação, a Comissão Permanente de Gestão de Pessoal proporá à autoridade competente a abertura de sindicância."],"a":1,"c":"Art. 35: não se concedem as progressões por merecimento OU por conhecimento ao servidor no último padrão. As demais: art. 35-A (incluído pela LC 210/2026), art. 34 e art. 31, §2º.","f":"LC 55/2007, arts. 31, 34, 35 e 35-A, redação da LC 210/2026","id":"88435a9"},{"m":"lm","tp":"LC 55/2007 – Provimento","nv":1,"e":"De acordo com a LC nº 55/2007, ao entrar em exercício, o nomeado para cargo efetivo da Educação Pública Municipal estará sujeito a estágio probatório pelo período de:","o":["3 anos, contados da data de sua investidura.","2 anos, contados da data da posse.","3 anos, contados da data da homologação do concurso.","730 dias, contados da data da nomeação."],"a":0,"c":"Art. 14: estágio probatório de 3 anos, contados da data da investidura, durante o qual aptidão e capacidade são objeto de acompanhamento e avaliação de desempenho.","f":"LC 55/2007, art. 14","id":"5f8569c"},{"m":"lm","tp":"LC 55/2007 – Carreira","nv":1,"e":"Conforme a LC nº 55/2007, integram a carreira pedagógica:","o":["apenas os servidores efetivos que exercem atividades de docência em sala de aula.","os servidores efetivos que exercem atividades de suporte e apoio técnico e administrativo no âmbito da Educação Pública Municipal.","os servidores efetivos que exercem atividades de docência e os que oferecem suporte direto a tais atividades, incluídas as de direção escolar, planejamento, inspeção, supervisão e orientação escolar.","os ocupantes de cargos em comissão de direção, excluídos os docentes."],"a":2,"c":"Art. 6º: carreira pedagógica = docência + suporte direto (direção escolar, planejamento, inspeção, supervisão e orientação escolar). Suporte e apoio técnico e administrativo é a carreira administrativa (art. 7º).","f":"LC 55/2007, arts. 5º a 7º","id":"7021179"},{"m":"lm","tp":"LC 55/2007 – Provimento","nv":2,"e":"Sobre o provimento e a substituição na LC nº 55/2007, analise as afirmativas:\nI. Durante o afastamento temporário do titular ou na vacância de cargo efetivo, poderá haver substituição mediante ampliação da carga horária de servidor já ocupante da carreira, limitada a jornada diária a 12 horas.\nII. A contratação temporária, no caso de vacância de cargo, poderá ocorrer mesmo havendo candidato aprovado em concurso público com prazo de validade em vigor.\nIII. O ingresso nas carreiras da Educação Pública Municipal dar-se-á no grau inicial da classe para a qual o candidato prestou concurso.\nIV. Pelo menos 5% dos cargos de provimento em comissão da Educação serão destinados exclusivamente aos servidores efetivos.\nEstão CORRETAS as afirmativas:","o":["I, III e IV, apenas.","I, II e III, apenas.","II e IV, apenas.","I, II, III e IV."],"a":0,"c":"I: art. 17. III: art. 13. IV: art. 16, parágrafo único. A II está errada: na vacância, a contratação temporária só ocorre se não houver candidato aprovado em concurso com prazo de validade em vigor (art. 18, parágrafo único).","f":"LC 55/2007, arts. 13, 16, 17 e 18","id":"ee60d08"},{"m":"lm","tp":"LC 55/2007 – Disposições finais","nv":1,"e":"Segundo a LC nº 55/2007, ficam extintos pela vacância os cargos de:","o":["Professor de Educação Básica I e Professor de Educação Básica II.","Supervisor Pedagógico e Orientador Educacional.","Cantineiro, Auxiliar de Serviços de Educação e Inspetor de Alunos.","Regente de Ensino, Professor I e Professor II."],"a":3,"c":"Art. 50: serão extintos pela vacância os cargos de Regente de Ensino, de Professor I e de Professor II. PEB I e PEB II são os cargos da nova estrutura (art. 12).","f":"LC 55/2007, art. 50","id":"590dddc"},{"m":"lm","tp":"LC 210/2026 – Estatuto: provimento","nv":1,"e":"A LC nº 210/2026 deu nova redação ao art. 10 do Estatuto dos Servidores de Paracatu (LC nº 5/1991). Na redação atual, o cargo público é provido mediante nomeação, readaptação, reversão, aproveitamento, reintegração e, ainda:","o":["transferência e ascensão.","progressão e promoção.","recondução e redistribuição.","promoção e recondução."],"a":1,"c":"Art. 10 (redação da LC 210/2026): I nomeação; II progressão; III readaptação; IV reversão; V aproveitamento; VI reintegração; VII promoção. A recondução está prevista nos arts. 32 e 33, mas não consta da lista do art. 10; transferência, ascensão e redistribuição não existem no Estatuto.","f":"LC 210/2026, art. 2º (LC 5/1991, art. 10)","id":"440fc7d"},{"m":"lm","tp":"LC 210/2026 – Estatuto: progressão","nv":2,"e":"De acordo com o Estatuto dos Servidores de Paracatu, na redação dada pela LC nº 210/2026, a progressão é:","o":["a passagem do servidor efetivo de uma classe para a classe imediatamente superior dentro da mesma carreira.","a passagem do servidor para o cargo efetivo de nível de vencimento imediatamente superior, na mesma carreira.","o desenvolvimento do servidor efetivo na carreira, mediante progressão horizontal, de um padrão para outro, nas tabelas de vencimento previstas para o nível de seu cargo.","o retorno à atividade do servidor em disponibilidade, em cargo de atribuições e vencimentos compatíveis."],"a":2,"c":"Art. 15 (redação da LC 210/2026): progressão é o desenvolvimento do servidor efetivo na carreira, por progressão horizontal, de um padrão para outro, conforme o Plano de Cargos e Carreiras. A alternativa A define a promoção (art. 33-A); a B era a antiga definição de promoção de 1991; a D é o aproveitamento (art. 25).","f":"LC 210/2026, art. 2º (LC 5/1991, art. 15)","id":"a3e0686"},{"m":"lm","tp":"LC 210/2026 – Estatuto: promoção","nv":2,"e":"Segundo o art. 33-A do Estatuto dos Servidores de Paracatu, incluído pela LC nº 210/2026, a promoção é a forma de provimento:","o":["derivado mediante a qual o servidor público efetivo passa de uma classe para a classe imediatamente superior dentro da mesma carreira, observado o interesse público.","originário mediante a qual o servidor passa a ocupar cargo de outra carreira, após aprovação em processo seletivo interno.","derivado mediante a qual o servidor passa de um padrão de vencimento para outro, exclusivamente por tempo de serviço.","derivado que implica, necessariamente, mudança de cargo e de carreira do servidor promovido."],"a":0,"c":"Art. 33-A, caput: promoção é provimento derivado; o servidor efetivo passa de uma classe para a imediatamente superior na mesma carreira, com repercussão remuneratória, nos termos do Plano de Cargos, Carreiras e Vencimentos. O § 3º diz que ela NÃO implica mudança de cargo. Passar de um padrão para outro é progressão (art. 15).","f":"LC 210/2026, art. 2º (LC 5/1991, art. 33-A)","id":"be3ab3c"},{"m":"lm","tp":"LC 210/2026 – Estatuto: promoção","nv":3,"e":"Analise as afirmativas sobre os pressupostos da promoção, previstos no art. 33-A, § 1º, do Estatuto dos Servidores de Paracatu, incluído pela LC nº 210/2026:\nI. Existência de classes formalmente instituídas na carreira.\nII. Cumprimento do interstício mínimo na classe de origem, quando exigido.\nIII. Aprovação do servidor em novo concurso público para a classe superior.\nIV. Inexistência de impedimento legal ou disciplinar que inviabilize o enquadramento, conforme regulamento.\nSão pressupostos cumulativos da promoção:","o":["I e II, apenas.","I, II e III, apenas.","II, III e IV, apenas.","I, II e IV, apenas."],"a":3,"c":"O § 1º do art. 33-A exige, cumulativamente: I classes formalmente instituídas; II interstício mínimo na classe de origem, quando exigido; III requisitos objetivos de lei específica (titulação, qualificação, certificação, registro em conselho, avaliação de desempenho etc.); IV inexistência de impedimento legal ou disciplinar. Não há exigência de novo concurso: a promoção ocorre dentro da mesma carreira.","f":"LC 210/2026, art. 2º (LC 5/1991, art. 33-A, § 1º)","id":"81fb840"},{"m":"lm","tp":"LC 210/2026 – Estatuto: progressão e promoção","nv":2,"e":"Marque V para verdadeiro e F para falso, conforme o Estatuto dos Servidores de Paracatu, na redação dada pela LC nº 210/2026:\n( ) A promoção não implica mudança de cargo, alterando-se apenas a classe e, quando for o caso, o padrão remuneratório.\n( ) Os requisitos, critérios e efeitos financeiros da promoção serão definidos no Plano de Cargos e Carreiras, podendo ser complementados por regulamento do Poder Executivo.\n( ) A progressão por conhecimento pode decorrer de qualificação que seja requisito de investidura do cargo.\n( ) O interstício mínimo entre uma progressão por merecimento e outra é de dois anos.\nA sequência CORRETA é:","o":["V, F, V, V.","V, V, F, V.","F, V, F, V.","V, V, V, F."],"a":1,"c":"Art. 33-A, § 3º (V) e § 2º (V). Art. 17: a progressão por conhecimento decorre de qualificação profissional, DESDE QUE a qualificação não seja requisito de investidura do cargo (F). Art. 18: interstício mínimo de dois anos (V).","f":"LC 210/2026, art. 2º (LC 5/1991, arts. 17, 18 e 33-A)","id":"a61939c"},{"m":"lm","tp":"LC 210/2026 – Estatuto: progressão","nv":1,"e":"Com a redação dada pela LC nº 210/2026 ao Estatuto dos Servidores de Paracatu, o interstício mínimo exigido entre uma progressão por merecimento e outra passou a ser de:","o":["dois anos.","três anos.","um ano.","cinco anos."],"a":0,"c":"Art. 18 (redação da LC 210/2026): somente terá a progressão por merecimento o servidor que obtiver o conceito mínimo na avaliação de desempenho e cumprir o interstício mínimo de DOIS anos. Na redação original de 1991, o interstício da antiga promoção era de três anos.","f":"LC 210/2026, art. 2º (LC 5/1991, art. 18)","id":"63f4aa9"},{"m":"lm","tp":"LC 210/2026 – Estatuto: progressão","nv":2,"e":"Conforme o art. 17 do Estatuto dos Servidores de Paracatu, na redação dada pela LC nº 210/2026, a progressão por conhecimento ocorrerá:","o":["no mês de junho de cada ano, para todos os servidores avaliados.","em razão do tempo de serviço, a cada três anos de efetivo exercício.","em razão de qualificação profissional, ainda que exigida como requisito para a investidura no cargo.","em razão de qualificação profissional, nos termos do Plano de Cargos e Carreiras, desde que a qualificação não seja requisito de investidura do cargo."],"a":3,"c":"Art. 17 (redação da LC 210/2026): a progressão se dará por conhecimento em razão de qualificação profissional, nos termos do Plano de Cargos e Carreiras, desde que a qualificação não seja requisito de investidura do cargo. A regra do \"mês de junho\" era da antiga promoção e foi substituída.","f":"LC 210/2026, art. 2º (LC 5/1991, art. 17)","id":"94e14ed"},{"m":"lm","tp":"LC 210/2026 – Estatuto: progressão","nv":3,"e":"Sobre a progressão no Estatuto dos Servidores de Paracatu, na redação dada pela LC nº 210/2026, assinale a alternativa INCORRETA.","o":["A progressão por merecimento é apurada pela avaliação de assiduidade, disciplina, capacidade de iniciativa e responsabilidade, além dos critérios do Plano de Cargos e Carreiras.","Perde o direito à progressão por merecimento o servidor que, no interstício, for punido com a pena de suspensão.","A progressão ocorrerá no mês de junho de cada ano, mantendo-se em funcionamento permanente o sistema de avaliação de desempenho.","Para apuração do interstício, adotam-se os mesmos critérios de apuração do tempo de serviço previstos no próprio Estatuto."],"a":2,"c":"A regra de que a promoção ocorreria em junho (antigo art. 17) não existe mais: o novo art. 17 trata da progressão por conhecimento. As demais alternativas reproduzem os arts. 16, 19 e 20, na redação da LC 210/2026.","f":"LC 210/2026, art. 2º (LC 5/1991, arts. 16 a 20)","id":"a35d8da"},{"m":"lm","tp":"LC 210/2026 – Estatuto: prescrição disciplinar","nv":1,"e":"Após a LC nº 210/2026, a ação disciplinar prevista no Estatuto dos Servidores de Paracatu prescreve, nos casos de infração punível com advertência, em:","o":["cento e oitenta dias.","cento e cinquenta dias.","cento e vinte dias.","noventa dias."],"a":1,"c":"Art. 163, III (redação da LC 210/2026): cento e cinquenta dias para a advertência. Na redação original eram 180 dias. Mantidos: cinco anos (demissão, cassação, destituição) e dois anos (suspensão). Os 120 dias são a prescrição do direito de requerer (art. 134, II), outro assunto.","f":"LC 210/2026, art. 2º (LC 5/1991, art. 163)","id":"c88a662"},{"m":"lm","tp":"LC 210/2026 – Estatuto: penalidades","nv":2,"e":"Um servidor de Paracatu foi demitido por inassiduidade habitual. De acordo com o Estatuto dos Servidores, com as alterações da LC nº 210/2026, ele ficará incompatibilizado para nova investidura em cargo ou função do serviço público municipal pelo prazo de:","o":["quinze anos.","dez anos.","dois anos.","cinco anos."],"a":3,"c":"Art. 161-A, incluído pela LC 210/2026: na demissão ou destituição de cargo em comissão por abandono de cargo ou função e por inassiduidade habitual, a incompatibilização é de cinco anos. Nos demais casos continua a regra de quinze anos do art. 161.","f":"LC 210/2026, art. 2º (LC 5/1991, arts. 161 e 161-A)","id":"91bcd1c"},{"m":"lm","tp":"LC 210/2026 – Estatuto: penalidades","nv":3,"e":"Analise as afirmativas sobre a incompatibilização para nova investidura, conforme o Estatuto dos Servidores de Paracatu, com as alterações da LC nº 210/2026:\nI. O servidor demitido por improbidade administrativa fica incompatibilizado por quinze anos.\nII. O servidor demitido por abandono de cargo fica incompatibilizado por cinco anos.\nIII. O ocupante de cargo em comissão destituído por inassiduidade habitual fica incompatibilizado por quinze anos.\nEstá(ão) CORRETA(S) a(s) afirmativa(s):","o":["I e II, apenas.","I, apenas.","II e III, apenas.","I, II e III."],"a":0,"c":"I: regra geral do art. 161 (quinze anos). II: art. 161-A (cinco anos para abandono e inassiduidade habitual). III está errada: o art. 161-A também alcança a destituição de cargo em comissão por inassiduidade habitual, com prazo de cinco anos.","f":"LC 210/2026, art. 2º (LC 5/1991, arts. 161 e 161-A)","id":"207e880"},{"m":"lm","tp":"LC 210/2026 – Estatuto: penalidades","nv":2,"e":"Na redação dada pela LC nº 210/2026 ao art. 152 do Estatuto dos Servidores de Paracatu, as penas disciplinares serão aplicadas pela Prefeitura Municipal ou autoridade competente, podendo ser delegada ao titular de cargo de Secretário Municipal ou equivalente a competência para aplicar a pena de:","o":["suspensão de até trinta dias.","demissão.","advertência.","destituição de cargo em comissão."],"a":2,"c":"Art. 152: apenas a competência para a pena de ADVERTÊNCIA pode ser delegada ao Secretário Municipal ou equivalente. O parágrafo único exige que o ato mencione o fundamento legal e a causa da penalização.","f":"LC 210/2026, art. 2º (LC 5/1991, art. 152)","id":"dfa9420"},{"m":"lm","tp":"LC 210/2026 – Estatuto: visão geral","nv":2,"e":"A LC nº 210/2026 promoveu as seguintes alterações no Estatuto dos Servidores de Paracatu, EXCETO:","o":["reduziu de três para dois anos o interstício mínimo exigido para a progressão por merecimento.","reduziu de cento e oitenta para cento e cinquenta dias o prazo de prescrição da infração punível com advertência.","criou prazo de cinco anos de incompatibilização para a demissão por abandono de cargo ou por inassiduidade habitual.","ampliou de noventa para cento e vinte dias o limite máximo da pena de suspensão."],"a":3,"c":"A suspensão continua limitada a noventa dias (art. 154, repetido pela LC 210/2026). As demais alternativas são mudanças reais: art. 18 (dois anos), art. 163, III (150 dias) e art. 161-A (cinco anos).","f":"LC 210/2026, art. 2º (LC 5/1991, arts. 18, 154, 161-A e 163)","id":"1eaf6d1"},{"m":"lm","tp":"LC 210/2026 – Reestruturação","nv":1,"e":"A LC nº 210/2026 dispõe sobre a reestruturação geral da Administração Pública Municipal de Paracatu, com alterações em diversas leis complementares. NÃO está entre as normas alteradas, segundo o art. 1º da LC nº 210/2026:","o":["a LC nº 7/1991 (Estatuto do Magistério Municipal).","a LC nº 149/2021 (organização e estrutura da Prefeitura).","a LC nº 164/2023.","a Lei Orgânica do Município."],"a":3,"c":"Art. 1º: a LC 210/2026 altera a LC 5/1991 (Estatuto dos Servidores), a LC 7/1991 (Estatuto do Magistério), a LC 54/2007 (Plano de Cargos da Prefeitura e da Saúde), a LC 55/2007 (Plano de Cargos da Educação), a LC 149/2021 (estrutura da Prefeitura) e a LC 164/2023. A Lei Orgânica não é alterada (é apenas citada como fundamento da sanção, art. 86, IV).","f":"LC 210/2026, art. 1º","id":"e712078"},{"m":"lm","tp":"LC 210/2026 – Estrutura da LC 149","nv":1,"e":"Segundo a LC nº 149/2021, com a redação dada pela LC nº 210/2026, são órgãos de 1º nível hierárquico da Administração Direta:","o":["a Secretaria Municipal, a Procuradoria Municipal e a Controladoria Geral.","a Superintendência, a Diretoria de Departamento e a Assessoria.","o Gabinete do Prefeito, a Câmara Municipal e os Conselhos Municipais.","a Chefia de Divisão e a Coordenação."],"a":0,"c":"Art. 8º da LC 149/2021 (redação da LC 210/2026): 1º nível – Secretaria Municipal, Procuradoria Municipal e Controladoria Geral; 2º nível – Superintendência; 3º nível – Diretoria de Departamento e Assessoria; 4º nível – Chefia de Divisão e Coordenação.","f":"LC 210/2026, art. 8º (LC 149/2021, art. 8º)","id":"5a977fb"},{"m":"lm","tp":"LC 210/2026 – Estrutura da LC 149","nv":2,"e":"Numere a COLUNA II de acordo com a COLUNA I, conforme os níveis hierárquicos da LC nº 149/2021, com a redação dada pela LC nº 210/2026:\nCOLUNA I\n1. 1º nível\n2. 2º nível\n3. 3º nível\n4. 4º nível\nCOLUNA II\n( ) Superintendência.\n( ) Chefia de Divisão e Coordenação.\n( ) Controladoria Geral.\n( ) Diretoria de Departamento e Assessoria.\nA sequência CORRETA é:","o":["3, 4, 1, 2.","2, 4, 1, 3.","2, 3, 1, 4.","1, 4, 2, 3."],"a":1,"c":"Art. 8º da LC 149/2021: Superintendência (2º), Chefia de Divisão e Coordenação (4º), Controladoria Geral (1º, junto com Secretaria e Procuradoria) e Diretoria de Departamento e Assessoria (3º).","f":"LC 210/2026, art. 8º (LC 149/2021, art. 8º)","id":"d494648"},{"m":"lm","tp":"LC 210/2026 – Estrutura da LC 149","nv":2,"e":"Analise as afirmativas sobre a estrutura administrativa da Prefeitura de Paracatu, conforme a LC nº 149/2021, com a redação dada pela LC nº 210/2026:\nI. A estrutura básica compreende os órgãos de 1º nível hierárquico.\nII. A estrutura complementar compreende as unidades administrativas de 2º e 3º nível hierárquico.\nIII. É permitida a implantação de órgãos e unidades administrativas antes da criação do respectivo cargo de direção, desde que haja dotação orçamentária.\nEstá(ão) CORRETA(S) a(s) afirmativa(s):","o":["I, apenas.","II e III, apenas.","I e II, apenas.","I, II e III."],"a":2,"c":"Art. 6º, §§ 1º e 2º, da LC 149/2021: estrutura básica = 1º nível; estrutura complementar = 2º e 3º nível (I e II corretas). Art. 7º: é VEDADA a implantação de órgãos e unidades sem a preexistência do respectivo cargo de direção (III errada).","f":"LC 210/2026, art. 8º (LC 149/2021, arts. 6º e 7º)","id":"3494001"},{"m":"lm","tp":"LC 210/2026 – Estrutura da LC 149","nv":2,"e":"Marque V para verdadeiro e F para falso sobre a classificação dos órgãos do Poder Executivo de Paracatu, conforme a LC nº 149/2021, com a redação dada pela LC nº 210/2026:\n( ) Os órgãos de assessoramento têm como finalidade as atividades de apoio direto ao Prefeito.\n( ) Os órgãos de atividade meio têm como finalidade a gestão da Administração Municipal.\n( ) Os órgãos de atividade fim têm como finalidade a execução da Ação Governamental.\n( ) Os órgãos de atividade fim têm como finalidade o controle externo das contas do Município.\nA sequência CORRETA é:","o":["V, V, V, F.","V, F, V, F.","F, V, V, F.","V, V, F, V."],"a":0,"c":"Art. 9º da LC 149/2021: os órgãos classificam-se em de assessoramento (apoio direto ao Prefeito), de atividade meio (gestão da Administração) e de atividade fim (execução da Ação Governamental). Controle externo é atribuição da Câmara Municipal com auxílio do Tribunal de Contas, não de órgão do Executivo.","f":"LC 210/2026, art. 8º (LC 149/2021, art. 9º)","id":"6c98cd3"},{"m":"lm","tp":"LC 210/2026 – Órgãos de apoio ao Prefeito","nv":1,"e":"Segundo a LC nº 149/2021, com a redação dada pela LC nº 210/2026, são órgãos de apoio direto ao Prefeito, EXCETO:","o":["o Gabinete do Vice-Prefeito.","a Secretaria Municipal de Fazenda.","a Controladoria Geral.","a Secretaria Municipal de Relações Institucionais."],"a":1,"c":"Art. 10 da LC 149/2021: apoio direto ao Prefeito – Gabinete do Prefeito, Conselhos Municipais, Gabinete do Vice-Prefeito, Procuradoria Municipal, Secretaria Municipal de Governo, Controladoria Geral e Secretaria Municipal de Relações Institucionais. A Secretaria de Fazenda é órgão de gestão (art. 11, II).","f":"LC 210/2026, art. 8º (LC 149/2021, arts. 10 e 11)","id":"d553bb8"},{"m":"lm","tp":"LC 210/2026 – Secretarias","nv":1,"e":"De acordo com a LC nº 149/2021, com a redação dada pela LC nº 210/2026, são órgãos de gestão da Administração Municipal:","o":["a Secretaria Municipal de Governo e a Procuradoria Municipal.","a Secretaria Municipal de Planejamento e a Secretaria Municipal de Saúde.","a Secretaria Municipal de Gestão Pública e a Secretaria Municipal de Fazenda.","a Controladoria Geral e a Secretaria Municipal de Relações Institucionais."],"a":2,"c":"Art. 11 da LC 149/2021: são órgãos de gestão apenas a Secretaria Municipal de Gestão Pública e a Secretaria Municipal de Fazenda. Governo, Procuradoria, Controladoria e Relações Institucionais são de apoio direto ao Prefeito (art. 10); Planejamento e Saúde são órgãos de execução (art. 12).","f":"LC 210/2026, art. 8º (LC 149/2021, arts. 10 a 12)","id":"dc96efd"},{"m":"lm","tp":"LC 210/2026 – Secretarias","nv":2,"e":"Analise as afirmativas sobre a classificação dos órgãos da Prefeitura de Paracatu, conforme a LC nº 149/2021, com a redação dada pela LC nº 210/2026:\nI. A Secretaria Municipal de Saúde é órgão de execução da Administração Municipal.\nII. A Secretaria Municipal de Fazenda é órgão de gestão da Administração Municipal.\nIII. A Controladoria Geral é órgão de apoio direto ao Prefeito.\nIV. A Secretaria Municipal de Gestão Pública é órgão de execução da Administração Municipal.\nEstão CORRETAS as afirmativas:","o":["I e II, apenas.","II, III e IV, apenas.","I, III e IV, apenas.","I, II e III, apenas."],"a":3,"c":"I: art. 12, IV. II: art. 11, II. III: art. 10, VI. IV está errada: a Secretaria de Gestão Pública é órgão de GESTÃO (art. 11, I), não de execução.","f":"LC 210/2026, art. 8º (LC 149/2021, arts. 10 a 12)","id":"3c04731"},{"m":"lm","tp":"LC 210/2026 – Secretaria de Relações Institucionais","nv":2,"e":"Analise as afirmativas sobre a Secretaria Municipal de Relações Institucionais, conforme a LC nº 210/2026:\nI. A Superintendência de Relações Institucionais passa a fazer parte integrante da Secretaria Municipal de Relações Institucionais, criada na estrutura da Administração Pública Municipal.\nII. O cargo de Secretário Municipal de Relações Institucionais observará os mesmos vencimentos dos demais cargos de Secretário Municipal, com os mesmos índices de revisão e reajuste.\nIII. Os órgãos internos anteriormente vinculados à Superintendência de Relações Institucionais foram transferidos para a nova Secretaria, deixando a Secretaria Municipal de Governo.\nEstá(ão) CORRETA(S) a(s) afirmativa(s):","o":["I e II, apenas.","I, apenas.","II e III, apenas.","I, II e III."],"a":0,"c":"I: art. 9º, caput. II: art. 10. III está errada: o parágrafo único do art. 9º MANTÉM na estrutura da Secretaria Municipal de Governo os órgãos internos anteriormente vinculados à Superintendência de Relações Institucionais.","f":"LC 210/2026, arts. 9º e 10","id":"f6a99a9"},{"m":"lm","tp":"LC 210/2026 – Estrutura da LC 149","nv":3,"e":"Conforme o art. 9º, § 5º, da LC nº 149/2021, com a redação dada pela LC nº 210/2026, dos cargos em comissão de recrutamento amplo vinculados à estrutura orgânica da Prefeitura, fica reservado, para provimento por recrutamento restrito, por servidores efetivos e estáveis, o percentual de:","o":["5% (cinco por cento).","10% (dez por cento).","20% (vinte por cento).","25% (vinte e cinco por cento)."],"a":1,"c":"Art. 9º, § 5º: a estrutura orgânica e os cargos dos agentes políticos e em comissão de recrutamento amplo estão nos Anexos I e IV, reservando-se 10% deles para recrutamento restrito, por servidores efetivos e estáveis. Não confundir com a gratificação de 25% do art. 228.","f":"LC 210/2026, art. 8º (LC 149/2021, art. 9º, § 5º)","id":"73fa87b"},{"m":"lm","tp":"LC 210/2026 – Cargos em comissão","nv":2,"e":"Segundo o art. 228 da LC nº 149/2021, com a redação dada pela LC nº 210/2026, o servidor efetivo nomeado para cargo em comissão poderá optar pelo vencimento deste ou pelo vencimento do cargo efetivo de que seja titular, acrescido de gratificação de:","o":["20% sobre o vencimento do cargo em comissão.","50% sobre o salário base do cargo efetivo.","25% sobre o salário base do cargo efetivo, sem prejuízo das vantagens de caráter permanente.","10% sobre a remuneração total do cargo efetivo."],"a":2,"c":"Art. 228: o servidor efetivo (do Município ou de qualquer ente federativo) nomeado para cargo em comissão pode optar pelo vencimento do comissionado ou pelo do efetivo acrescido de gratificação de 25% calculados sobre o salário base do cargo efetivo, sem prejuízo das vantagens de caráter permanente.","f":"LC 210/2026, art. 8º (LC 149/2021, art. 228)","id":"8b7b434"},{"m":"lm","tp":"LC 210/2026 – Cargos","nv":3,"e":"Sobre os cargos de Secretário Municipal e de Procurador Geral, conforme a LC nº 149/2021, com a redação dada pela LC nº 210/2026, assinale a alternativa INCORRETA.","o":["O subsídio dos Secretários Municipais será fixado por decreto do Prefeito Municipal.","O cargo de Procurador Geral do Município substitui o de Secretário Municipal de Assuntos Jurídicos.","A Secretaria Municipal de Relações Institucionais figura entre as secretarias que organizam os cargos de Secretário Municipal.","Ficam criados os cargos de provimento em comissão de chefia, direção e assessoramento necessários à implantação e ao funcionamento da estrutura organizacional."],"a":0,"c":"Art. 223, parágrafo único: o subsídio dos Secretários Municipais será fixado pela CÂMARA MUNICIPAL, nos termos do art. 26 da Lei Orgânica. B: art. 224. C: art. 223, XVI. D: art. 225.","f":"LC 210/2026, art. 8º (LC 149/2021, arts. 223 a 225)","id":"b1dd1af"},{"m":"lm","tp":"Estatuto – Provimento","nv":1,"e":"De acordo com o Estatuto dos Servidores Públicos do Município de Paracatu (LC nº 5/1991, com a redação dada pela LC nº 210/2026), são formas de provimento de cargo público, EXCETO:","o":["Transferência.","Progressão.","Reversão.","Promoção."],"a":0,"c":"O art. 10, na redação da LC 210/2026, lista sete formas de provimento: nomeação, progressão, readaptação, reversão, aproveitamento, reintegração e promoção. A progressão (inciso II) e a promoção (inciso VII) passaram a constar separadamente. Transferência não consta do Estatuto.","f":"LC 5/1991, art. 10 (redação da LC 210/2026)","id":"94f534e"},{"m":"lm","tp":"Estatuto – Provimento","nv":2,"e":"Analise as afirmativas sobre os requisitos básicos para investidura em cargo público, segundo a LC nº 5/1991 de Paracatu:\nI. Nacionalidade brasileira e gozo dos direitos políticos.\nII. Idade mínima de dezesseis anos.\nIII. Quitação com as obrigações militares e eleitorais.\nIV. Boa saúde física e mental.\nEstão CORRETAS as afirmativas:","o":["I, II e III, apenas.","I, III e IV, apenas.","II e IV, apenas.","I, II, III e IV."],"a":1,"c":"Art. 7º: nacionalidade brasileira, gozo dos direitos políticos, quitação com obrigações militares e eleitorais, nível de escolaridade exigido, idade mínima de 18 anos e boa saúde física e mental. A afirmativa II erra a idade (18, não 16).","f":"LC 5/1991, art. 7º","id":"0d48656"},{"m":"lm","tp":"Estatuto – Provimento","nv":1,"e":"Segundo a LC nº 5/1991 de Paracatu, às pessoas portadoras de deficiência é assegurado o direito de se inscrever em concurso público para cargos com atribuições compatíveis com a deficiência, sendo-lhes reservadas:","o":["no mínimo 5% das vagas oferecidas no concurso.","exatamente 10% das vagas oferecidas no concurso.","até 20% das vagas oferecidas no concurso.","até 30% das vagas oferecidas no concurso."],"a":2,"c":"O art. 8º reserva às pessoas com deficiência até 20% das vagas do concurso, para cargos cujas atribuições sejam compatíveis com a deficiência.","f":"LC 5/1991, art. 8º","id":"2eeff7c"},{"m":"lm","tp":"Estatuto – Progressão e promoção","nv":2,"e":"Sobre a progressão do servidor efetivo, conforme a LC nº 5/1991 de Paracatu, com a redação dada pela LC nº 210/2026, é CORRETO afirmar que:","o":["somente terá progressão por merecimento o servidor que obtiver o conceito mínimo na avaliação de desempenho e houver cumprido o interstício mínimo de dois anos entre uma progressão e outra.","a progressão ocorrerá obrigatoriamente no mês de junho de cada ano.","o interstício mínimo entre uma progressão e outra é de três anos.","a pena de advertência sofrida no interstício faz o servidor perder o direito à progressão por merecimento."],"a":0,"c":"Art. 18 (redação da LC 210/2026): conceito mínimo na avaliação de desempenho e interstício mínimo de DOIS anos (antes eram três). A regra de promoções no mês de junho (antigo art. 17) deixou de existir: o art. 17 agora trata da progressão por conhecimento. Art. 19: só a pena de SUSPENSÃO no interstício faz perder a progressão por merecimento.","f":"LC 5/1991, arts. 17 a 19 (redação da LC 210/2026)","id":"f54fd7d"},{"m":"lm","tp":"Estatuto – Progressão e promoção","nv":3,"e":"Um servidor efetivo de Paracatu foi punido com a pena de suspensão durante o interstício exigido para a progressão por merecimento. Considerando a LC nº 5/1991, com a redação dada pela LC nº 210/2026, assinale a alternativa CORRETA.","o":["Ele poderá progredir normalmente, pois a suspensão não interfere na progressão.","Ele só perderia o direito à progressão se tivesse sofrido pena de demissão posteriormente revertida.","Ele perde o direito à progressão por merecimento relativa a esse interstício.","Ele poderá progredir assim que completar três anos no padrão, prazo do interstício previsto no Estatuto."],"a":2,"c":"Art. 19 (redação da LC 210/2026): perde o direito à progressão por merecimento o servidor que, no interstício, for punido com suspensão. Além disso, o interstício mínimo passou a ser de dois anos (art. 18), e não três.","f":"LC 5/1991, arts. 18 e 19 (redação da LC 210/2026)","id":"caa9daa"},{"m":"lm","tp":"Estatuto – Provimento","nv":2,"e":"Analise as afirmativas sobre aproveitamento e reintegração, conforme a LC nº 5/1991 de Paracatu:\nI. O servidor em disponibilidade há mais de doze meses somente será aproveitado se comprovar capacidade física e mental em inspeção médica.\nII. O servidor aproveitado deverá entrar em exercício no prazo de trinta dias, contados da publicação do ato de aproveitamento.\nIII. A reintegração do servidor estável demitido dá-se sem ressarcimento dos vencimentos e vantagens do período de afastamento.\nEstá(ão) CORRETA(S) a(s) afirmativa(s):","o":["I, apenas.","I e II, apenas.","II e III, apenas.","I, II e III."],"a":1,"c":"I e II estão corretas (arts. 26 e 27). III está errada: o art. 29 assegura o ressarcimento dos vencimentos e vantagens.","f":"LC 5/1991, arts. 26, 27 e 29; redação da LC 210/2026","id":"be46a86"},{"m":"lm","tp":"Estatuto – Vacância","nv":1,"e":"Segundo a LC nº 5/1991 de Paracatu, a vacância do cargo público decorrerá de, EXCETO:","o":["promoção.","readaptação.","licença para tratar de interesses particulares.","falecimento."],"a":2,"c":"Art. 34: exoneração, demissão, promoção, readaptação, aposentadoria e falecimento. Licença não gera vacância. A LC 210/2026 repetiu essa lista sem alterações.","f":"LC 5/1991, art. 34; redação da LC 210/2026","id":"d473667"},{"m":"lm","tp":"Estatuto – Vacância","nv":2,"e":"De acordo com a LC nº 5/1991 de Paracatu, a exoneração de ofício de cargo efetivo ocorrerá:","o":["quando não satisfeitas as condições do estágio probatório ou quando o empossado não entrar em exercício no prazo legal.","somente quando o servidor praticar infração punível com demissão.","quando o servidor acumular licitamente dois cargos efetivos.","a critério exclusivo da autoridade competente, por conveniência administrativa."],"a":0,"c":"Art. 35, parágrafo único: exoneração de ofício quando não satisfeitas as condições do estágio probatório ou quando, tendo tomado posse, o servidor não entrar em exercício no prazo. A exoneração a critério da autoridade é a do cargo em comissão (art. 36).","f":"LC 5/1991, arts. 35 e 36; redação da LC 210/2026","id":"7b2bbe1"},{"m":"lm","tp":"Estatuto – Concurso","nv":1,"e":"Conforme o Estatuto dos Servidores de Paracatu, o concurso público terá validade de:","o":["dois anos, contados da homologação, prorrogável uma única vez por igual período, se previsto no edital.","um ano, contado da homologação, prorrogável uma vez por igual período.","dois anos, contados da publicação do edital, prorrogável por mais um ano.","quatro anos, contados da homologação, improrrogáveis."],"a":0,"c":"Art. 38: validade de dois anos da homologação; parágrafo único: prorrogável uma única vez por igual período, desde que previsto no edital.","f":"LC 5/1991, art. 38","id":"f32c3f9"},{"m":"lm","tp":"Estatuto – Concurso","nv":2,"e":"Analise as afirmativas sobre concurso público, segundo a LC nº 5/1991 de Paracatu:\nI. O concurso será de provas ou de provas e títulos.\nII. Não se abrirá novo concurso enquanto houver candidato aprovado em concurso anterior, para o mesmo cargo, com prazo de validade não expirado.\nIII. O prazo de validade do concurso é de dois anos, contados da publicação do edital.\nEstão CORRETAS as afirmativas:","o":["I e III, apenas.","II e III, apenas.","I, II e III.","I e II, apenas."],"a":3,"c":"I: art. 37. II: art. 39. III está errada: os dois anos de validade contam-se da HOMOLOGAÇÃO do concurso (art. 38), prorrogáveis uma vez por igual período se o edital previr.","f":"LC 5/1991, arts. 37 a 39","id":"f06f927"},{"m":"lm","tp":"Estatuto – Posse e exercício","nv":1,"e":"Nos termos da LC nº 5/1991 de Paracatu, o prazo para a posse é de:","o":["trinta dias, contados da data do ato de nomeação, prorrogável por igual período a pedido do interessado.","quinze dias, contados da publicação do resultado do concurso, improrrogável.","trinta dias, contados da data do ato de nomeação, improrrogável.","quarenta e cinco dias, contados da homologação do concurso, prorrogável uma vez."],"a":0,"c":"Art. 42: trinta dias contados do ato de nomeação, podendo ser prorrogado por igual período, a pedido do interessado.","f":"LC 5/1991, art. 42","id":"c16c254"},{"m":"lm","tp":"Estatuto – Posse e exercício","nv":1,"e":"Maria foi nomeada para o cargo de Técnico em Enfermagem em Paracatu, tomou posse no prazo, mas não entrou em exercício nos trinta dias seguintes. De acordo com a LC nº 5/1991, Maria:","o":["terá a nomeação tornada sem efeito.","será demitida por abandono de cargo.","terá o prazo automaticamente prorrogado por mais trinta dias.","será exonerada."],"a":3,"c":"Art. 51, parágrafo único: o servidor empossado que não entrar em exercício no prazo de trinta dias será exonerado (ver também art. 35, parágrafo único). A nomeação sem efeito é para quem não toma posse (art. 14).","f":"LC 5/1991, arts. 14 e 51","id":"0d8a6e4"},{"m":"lm","tp":"Estatuto – Posse e exercício","nv":1,"e":"Segundo a LC nº 5/1991 de Paracatu, são documentos exigidos para a posse, EXCETO:","o":["certidão negativa de débitos tributários municipais.","declaração de bens e valores que constituem seu patrimônio.","declaração quanto ao exercício ou não de outro cargo, emprego ou função pública.","atestado de aptidão física e mental, em inspeção médica oficial."],"a":0,"c":"Art. 43: declaração de bens e valores; declaração de não exercer outro cargo, emprego ou função (ressalvada acumulação permitida); atestado de aptidão física e mental em inspeção médica oficial. Certidão de débitos não é exigida.","f":"LC 5/1991, art. 43","id":"77eff02"},{"m":"lm","tp":"Estatuto – Posse e exercício","nv":2,"e":"Marque V para verdadeiro e F para falso, conforme a LC nº 5/1991 de Paracatu:\n( ) Só haverá posse nos casos de provimento por nomeação.\n( ) O prazo para entrar em exercício é contado da data da nomeação.\n( ) O ocupante de cargo em comissão submete-se a regime de dedicação integral ao serviço.\n( ) O retorno do servidor afastado deve ocorrer em trinta dias da cessação do motivo do afastamento, salvo outro prazo legal.\nA sequência CORRETA é:","o":["V, V, V, F.","V, F, V, V.","F, F, V, V.","V, F, F, V."],"a":1,"c":"Art. 41: posse só na nomeação (V). Art. 51: o prazo de exercício conta da POSSE (F). Art. 55: dedicação integral (V). Art. 53: retorno em trinta dias (V).","f":"LC 5/1991, arts. 41, 51, 53 e 55","id":"5529917"},{"m":"lm","tp":"Estatuto – Posse e exercício","nv":1,"e":"De acordo com o Estatuto dos Servidores de Paracatu, o servidor poderá ausentar-se do serviço, sem qualquer prejuízo, por oito dias consecutivos em razão de:","o":["casamento.","doação de sangue.","alistamento como eleitor.","falecimento de cônjuge, companheiro, pais, filhos ou menor sob guarda ou tutela."],"a":3,"c":"Art. 56: um dia para doação de sangue; um dia para alistamento eleitoral; oito dias consecutivos por falecimento de cônjuge, companheiro, pais, filhos, menor sob guarda ou tutela; cinco dias por casamento.","f":"LC 5/1991, art. 56","id":"151dc52"},{"m":"lm","tp":"Estatuto – Estágio probatório","nv":1,"e":"Segundo a LC nº 5/1991 de Paracatu, o estágio probatório tem duração de:","o":["um ano.","três anos.","dezoito meses.","dois anos."],"a":3,"c":"Art. 44: estágio probatório de dois anos, com avaliação de assiduidade, disciplina, capacidade de iniciativa e produtividade. (Observação: a CF, após a EC 19/1998, exige três anos para estabilidade; a questão cobra a literalidade do Estatuto.)","f":"LC 5/1991, art. 44","id":"f1986a6"},{"m":"lm","tp":"Estatuto – Estágio probatório","nv":2,"e":"Analise as afirmativas sobre o estágio probatório, de acordo com a LC nº 5/1991 de Paracatu:\nI. A avaliação será feita pelo setor de administração de recursos humanos e deverá ser concluída sessenta dias antes do término do estágio.\nII. O parecer final será submetido à homologação da autoridade competente.\nIII. O servidor terá vista do parecer pelo prazo de dez dias.\nIV. O servidor não aprovado será exonerado ou, se estável, reconduzido ao cargo anteriormente ocupado.\nEstão CORRETAS as afirmativas:","o":["I, II e III, apenas.","I, II e IV, apenas.","II, III e IV, apenas.","I e IV, apenas."],"a":1,"c":"I: art. 45. II: art. 45, § 1º. IV: art. 49. III está errada: a vista do parecer é de cinco dias (art. 47).","f":"LC 5/1991, arts. 45, 47 e 49","id":"d53b6c5"},{"m":"lm","tp":"Estatuto – Estágio probatório","nv":2,"e":"São fatores avaliados no estágio probatório, segundo o Estatuto dos Servidores de Paracatu, EXCETO:","o":["assiduidade.","capacidade de iniciativa.","produtividade.","responsabilidade."],"a":3,"c":"Art. 44: assiduidade, disciplina, capacidade de iniciativa e produtividade. Responsabilidade é fator da progressão por merecimento (art. 16, redação da LC 210/2026), não do estágio probatório.","f":"LC 5/1991, arts. 16 e 44 (art. 16 na redação da LC 210/2026)","id":"cfbb487"},{"m":"lm","tp":"Estatuto – Tempo de serviço","nv":2,"e":"Segundo a LC nº 5/1991 de Paracatu, contam-se APENAS para efeito de aposentadoria e disponibilidade:","o":["o período de férias e o de férias-prêmio.","a participação em programa de treinamento regularmente instituído e a convocação para júri.","o tempo de licença remunerada por motivo de doença em pessoa da família e o de licença remunerada para atividade política.","as ausências por casamento e por falecimento de familiar."],"a":2,"c":"Art. 61: contam só para aposentadoria e disponibilidade: serviço público na União, Estados, DF e outros Municípios; licença remunerada por doença em pessoa da família; licença remunerada para atividade política; afastamento para mandato eletivo. As demais hipóteses das alternativas são efetivo exercício para todos os efeitos (art. 57).","f":"LC 5/1991, arts. 57 e 61","id":"636dabd"},{"m":"lm","tp":"Estatuto – Tempo de serviço","nv":2,"e":"Conforme a LC nº 5/1991 de Paracatu, são considerados de efetivo exercício os afastamentos em virtude de, EXCETO:","o":["férias.","convocação para júri e outros serviços obrigatórios por lei.","férias-prêmio.","licença para tratar de interesses particulares."],"a":3,"c":"O art. 57 considera efetivo exercício: férias, treinamento, júri e serviços obrigatórios, competição esportiva, cessão, mandato eletivo (exceto para promoção por merecimento), licença com remuneração e férias-prêmio. A licença para interesses particulares é sem remuneração (art. 102), não estando na lista.","f":"LC 5/1991, arts. 57 e 102","id":"6404e12"},{"m":"lm","tp":"Estatuto – Férias","nv":2,"e":"Marque V para verdadeiro e F para falso sobre férias, segundo a LC nº 5/1991 de Paracatu:\n( ) As férias somente poderão ser interrompidas por motivo de comoção interna, calamidade pública ou superior interesse do serviço público.\n( ) As faltas ao serviço poderão ser descontadas das férias.\n( ) A remuneração das férias será paga até dois dias antes do início do respectivo período.\n( ) As férias podem ser acumuladas por até três períodos, no caso de necessidade do serviço.\nA sequência CORRETA é:","o":["V, V, V, F.","F, F, V, V.","V, F, V, F.","V, F, F, F."],"a":2,"c":"Art. 67 (V). Art. 71: é vedado descontar faltas das férias (F). Art. 70 (V). Art. 72, parágrafo único: acúmulo máximo de dois períodos (F).","f":"LC 5/1991, arts. 67, 70, 71 e 72","id":"b30e7fa"},{"m":"lm","tp":"Estatuto – Remuneração","nv":3,"e":"Analise as afirmativas sobre remuneração e vantagens, segundo a LC nº 5/1991 de Paracatu:\nI. Remuneração é a contraprestação pecuniária paga mensalmente ao servidor pelo exercício de cargo ou função pública.\nII. Entre os adicionais previstos estão os de tempo de serviço, horas extras, trabalho noturno, insalubridade, periculosidade e férias.\nIII. O próprio Estatuto fixa o adicional noturno em 25% sobre o vencimento.\nIV. O adicional de férias corresponde a um terço da remuneração normal.\nEstão CORRETAS as afirmativas:","o":["I, II, III e IV.","I e III, apenas.","II, III e IV, apenas.","I, II e IV, apenas."],"a":3,"c":"I: art. 63. II: art. 66. IV: art. 69. III está errada: o art. 66 remete os valores e as condições de pagamento das vantagens a leis específicas; o Estatuto não fixa o percentual do adicional noturno.","f":"LC 5/1991, arts. 63, 66 e 69","id":"93c4153"},{"m":"lm","tp":"Estatuto – Licenças","nv":2,"e":"Segundo a LC nº 5/1991 de Paracatu, conceder-se-á licença ao servidor, EXCETO:","o":["para capacitação profissional.","para atividade política.","por motivo de afastamento do cônjuge.","para o serviço militar."],"a":0,"c":"Art. 73 lista: tratamento de saúde, gestante, adotante, paternidade ou adoção, doença em pessoa da família, acidente em serviço, afastamento do cônjuge, serviço militar, atividade política e interesses particulares. Licença para capacitação não existe no Estatuto.","f":"LC 5/1991, art. 73","id":"d4faec6"},{"m":"lm","tp":"Estatuto – Licenças","nv":2,"e":"De acordo com o Estatuto dos Servidores de Paracatu, o servidor não poderá permanecer em licença por prazo superior a vinte e quatro meses, salvo exceções. A licença para tratamento de saúde poderá ser prorrogada por até três períodos de doze meses para o servidor portador de:","o":["neoplasia maligna, cardiopatia grave ou AIDS.","qualquer doença grave, contagiosa ou incurável.","tuberculose, lepra ou pênfigo foliáceo.","alienação mental, esclerose múltipla ou nefropatia grave."],"a":2,"c":"Art. 74 e parágrafo único: prorrogação por três períodos de doze meses para tuberculose, lepra ou pênfigo foliáceo, quando os exames anuais não indicarem cura.","f":"LC 5/1991, art. 74","id":"da3c3cc"},{"m":"lm","tp":"Estatuto – Licenças","nv":1,"e":"Conforme a LC nº 5/1991 de Paracatu, à servidora que adotar ou obtiver guarda judicial de criança de até um ano de idade será concedida licença de:","o":["cento e vinte dias, independentemente da idade da criança.","sessenta dias; e, se a criança tiver mais de um ano, de quinze dias.","noventa dias; e, se a criança tiver mais de um ano, de trinta dias.","trinta dias; e, se a criança tiver mais de um ano, de cinco dias."],"a":2,"c":"Art. 83: noventa dias para criança de até um ano; parágrafo único: trinta dias para criança com mais de um ano.","f":"LC 5/1991, art. 83","id":"64c6c34"},{"m":"lm","tp":"Estatuto – Licenças","nv":3,"e":"Analise as afirmativas sobre a licença por motivo de doença em pessoa da família, segundo a LC nº 5/1991 de Paracatu:\nI. Pode ser concedida por doença do cônjuge, companheiro, pai, mãe ou filho, quando indispensável a assistência direta do servidor.\nII. Será concedida por até noventa dias, prorrogável por períodos sucessivos de igual duração enquanto persistirem os motivos.\nIII. É remunerada integralmente, qualquer que seja sua duração.\nIV. Durante a licença, é vedado ao servidor o exercício de atividade remunerada.\nEstão CORRETAS as afirmativas:","o":["I, II, III e IV.","I e III, apenas.","I, II e IV, apenas.","II, III e IV, apenas."],"a":2,"c":"I: art. 85. II: art. 86. IV: art. 75. III está errada: a remuneração integral vai até noventa dias (art. 101, V).","f":"LC 5/1991, arts. 75, 85, 86 e 101","id":"bc70680"},{"m":"lm","tp":"Estatuto – Licenças","nv":1,"e":"Segundo a LC nº 5/1991 de Paracatu, equipara-se ao acidente em serviço:","o":["o acidente sofrido no percurso da residência para o trabalho e vice-versa.","qualquer doença adquirida pelo servidor durante as férias.","o dano decorrente de agressão provocada pelo próprio servidor.","o acidente ocorrido em atividade particular fora do horário de trabalho."],"a":0,"c":"Art. 87, parágrafo único: equiparam-se a acidente em serviço a agressão sofrida e NÃO provocada pelo servidor no exercício do cargo e o dano sofrido no percurso residência-trabalho e vice-versa.","f":"LC 5/1991, art. 87","id":"cef4de8"},{"m":"lm","tp":"Estatuto – Licenças","nv":3,"e":"Um servidor de Paracatu foi escolhido em convenção partidária como candidato a vereador. Conforme a LC nº 5/1991, a licença para atividade política será remunerada:","o":["desde a escolha em convenção até o dia da eleição.","apenas no período entre o registro da candidatura e o décimo quinto dia seguinte ao da eleição.","apenas no período entre a escolha em convenção e o registro da candidatura.","em nenhum período, por se tratar de interesse particular do servidor."],"a":1,"c":"Art. 92: I – entre a convenção e o registro (sem remuneração – art. 102); II – entre o registro e o 15º dia após o pleito, com remuneração integral (art. 101, VII) e contado como efetivo exercício.","f":"LC 5/1991, arts. 92, 101 e 102","id":"9910fde"},{"m":"lm","tp":"Estatuto – Licenças","nv":2,"e":"Marque V para verdadeiro e F para falso sobre a licença para tratar de interesses particulares, conforme a LC nº 5/1991 de Paracatu:\n( ) Será concedida a critério da Administração, de acordo com a conveniência do serviço.\n( ) Terá prazo máximo de dois anos.\n( ) Pode ser concedida ao servidor com menos de dois anos de exercício, desde que com remuneração proporcional.\n( ) Somente poderá ser concedida nova licença depois de decorridos dois anos do término da anterior.\nA sequência CORRETA é:","o":["V, F, F, V.","V, V, F, V.","F, V, V, F.","V, V, V, V."],"a":1,"c":"Art. 94 (V); parágrafo único: até dois anos (V). Art. 96: não se concede a quem tem menos de dois anos de exercício, e a licença é sem remuneração (art. 102) (F). Art. 95 (V).","f":"LC 5/1991, arts. 94 a 96 e 102","id":"3b93fa3"},{"m":"lm","tp":"Estatuto – Licenças","nv":3,"e":"De acordo com a LC nº 5/1991 de Paracatu, o servidor licenciado receberá remuneração integral nas seguintes licenças, EXCETO:","o":["por acidente em serviço.","para o serviço militar.","à gestante.","para tratamento de saúde."],"a":1,"c":"Art. 101: remuneração integral nas licenças para tratamento de saúde, gestante, adotante, paternidade, doença em família (até 90 dias), acidente em serviço e atividade política (art. 92, II). Art. 102: nas demais, inclusive serviço militar, não há remuneração.","f":"LC 5/1991, arts. 101 e 102","id":"aade694"},{"m":"lm","tp":"Estatuto – Férias-prêmio","nv":2,"e":"Analise as afirmativas sobre férias-prêmio, conforme a LC nº 5/1991 de Paracatu:\nI. O requerimento deve ser feito pelo menos trinta dias antes de completar o decênio de efetivo exercício.\nII. A pedido do servidor, os períodos podem ser convertidos em espécie.\nIII. A contagem do tempo é feita a partir da data de admissão, independentemente do regime jurídico.\nIV. O período de férias-prêmio não é considerado de efetivo exercício.\nEstão CORRETAS as afirmativas:","o":["I e IV, apenas.","II, III e IV, apenas.","I, II e III, apenas.","I, II, III e IV."],"a":2,"c":"I: art. 98. II e III: art. 99 e parágrafo único. IV está errada: férias-prêmio são consideradas efetivo exercício (art. 57, II).","f":"LC 5/1991, arts. 57, 98 e 99","id":"5c1c91e"},{"m":"lm","tp":"Estatuto – Afastamentos","nv":1,"e":"Um servidor efetivo de Paracatu foi eleito vereador e há compatibilidade de horários entre o cargo e o mandato. Segundo a LC nº 5/1991, ele:","o":["será afastado obrigatoriamente, podendo optar pela remuneração do cargo.","não será afastado e perceberá a remuneração do cargo, sem prejuízo da remuneração do mandato.","será afastado sem remuneração durante todo o mandato.","será exonerado, pois é vedado acumular cargo e mandato."],"a":1,"c":"Art. 108: havendo compatibilidade de horários, não haverá afastamento, e o servidor recebe a remuneração do cargo sem prejuízo da do mandato. O afastamento só ocorre sem compatibilidade (art. 106, III).","f":"LC 5/1991, arts. 106 e 108","id":"1801d40"},{"m":"lm","tp":"Estatuto – Direito de petição","nv":3,"e":"Marque V para verdadeiro e F para falso, de acordo com a LC nº 5/1991 de Paracatu:\n( ) O pedido de reconsideração poderá ser renovado uma única vez.\n( ) O recurso poderá ser recebido com efeito suspensivo, a juízo da autoridade competente.\n( ) Em caso de provimento do recurso, os efeitos da decisão retroagirão à data do ato impugnado.\n( ) O direito de requerer prescreve em cento e vinte dias nos casos que não envolvam interesse patrimonial ou créditos resultantes da relação de trabalho, salvo outro prazo fixado em lei.\nA sequência CORRETA é:","o":["V, V, V, F.","F, V, V, V.","F, F, V, V.","V, F, F, V."],"a":1,"c":"Art. 130: o pedido de reconsideração não pode ser renovado (F). Art. 132 (V). Art. 133 (V). Art. 134, II (V).","f":"LC 5/1991, arts. 130 a 134","id":"5f6fa6e"},{"m":"lm","tp":"Estatuto – Direito de petição","nv":2,"e":"Sobre a prescrição do direito de requerer, segundo a LC nº 5/1991 de Paracatu, assinale a alternativa INCORRETA.","o":["O pedido de reconsideração e o recurso suspendem a prescrição, que recomeça a correr por inteiro ao final.","O prazo de prescrição conta-se da data da publicação do ato impugnado ou da ciência pelo interessado, quando o ato não for publicado.","O pedido de reconsideração e o recurso, quando cabíveis, interrompem a prescrição.","Cessada a interrupção, o prazo prescricional recomeça a correr pelo restante."],"a":0,"c":"Art. 135: o pedido de reconsideração e o recurso INTERROMPEM a prescrição, e, cessada a interrupção, o prazo recomeça pelo restante (parágrafo único). O art. 134, parágrafo único, fixa o termo inicial.","f":"LC 5/1991, arts. 134 e 135","id":"502c89d"},{"m":"lm","tp":"Estatuto – Deveres e proibições","nv":1,"e":"São deveres do servidor público municipal de Paracatu, conforme a LC nº 5/1991, EXCETO:","o":["ser assíduo e pontual ao serviço.","tratar com urbanidade as pessoas.","cumprir todas as ordens superiores, inclusive as manifestamente ilegais.","representar contra ilegalidade ou abuso de poder."],"a":2,"c":"Art. 137, IV: cumprir as ordens superiores, EXCETO quando manifestamente ilegais. Assiduidade (IX), urbanidade (X) e representação (XI) são deveres.","f":"LC 5/1991, art. 137; redação da LC 210/2026","id":"7f89858"},{"m":"lm","tp":"Estatuto – Deveres e proibições","nv":2,"e":"Analise as condutas abaixo e assinale a que é PROIBIDA ao servidor de Paracatu, segundo a LC nº 5/1991:","o":["criticar atos do Poder Público, do ponto de vista doutrinário ou da organização do serviço, em trabalho assinado.","atuar como procurador junto a repartição pública para tratar de benefício previdenciário do próprio cônjuge.","levar ao conhecimento da autoridade superior irregularidades de que tiver ciência em razão do cargo.","manter sob sua chefia imediata cônjuge, companheiro ou parente até o segundo grau civil."],"a":3,"c":"Art. 138, IX: é proibido manter sob chefia imediata cônjuge, companheiro ou parente até o segundo grau. O inciso VI admite a crítica doutrinária em trabalho assinado; o inciso XI ressalva benefícios previdenciários ou assistenciais de parentes até o segundo grau e de cônjuge ou companheiro; levar irregularidades ao superior é dever (art. 137, VI).","f":"LC 5/1991, arts. 137 e 138; redação da LC 210/2026","id":"9ba9f6e"},{"m":"lm","tp":"Estatuto – Deveres e proibições","nv":2,"e":"Analise as afirmativas sobre proibições ao servidor, segundo a LC nº 5/1991 de Paracatu:\nI. Ausentar-se do serviço durante o expediente sem prévia autorização do chefe imediato.\nII. Promover manifestação de apreço ou desapreço no recinto da repartição.\nIII. Praticar usura sob qualquer de suas formas.\nIV. Recusar fé a documentos públicos.\nSão proibições previstas no Estatuto:","o":["I, II, III e IV.","I e II, apenas.","I, III e IV, apenas.","II e IV, apenas."],"a":0,"c":"Todas constam do art. 138: I (inciso I), II (inciso V), III (inciso XIV) e IV (inciso III).","f":"LC 5/1991, art. 138; redação da LC 210/2026","id":"d04df68"},{"m":"lm","tp":"Estatuto – Acumulação","nv":2,"e":"De acordo com a LC nº 5/1991 de Paracatu, sobre a acumulação de cargos, é CORRETO afirmar que:","o":["é permitido exercer mais de um cargo em comissão, desde que haja compatibilidade de horários.","o servidor pode ser remunerado pela participação em órgão de deliberação coletiva.","comprovada a má-fé na acumulação ilegal, o servidor poderá simplesmente optar por um dos cargos.","a proibição de acumular estende-se a cargos, empregos e funções em autarquias, fundações, empresas públicas e sociedades de economia mista."],"a":3,"c":"Art. 139: a proibição se estende às entidades da Administração Indireta. Art. 140: vedado mais de um cargo em comissão e remuneração por órgão de deliberação coletiva. Art. 162: opção só com boa-fé; com má-fé, demissão e restituição.","f":"LC 5/1991, arts. 139, 140 e 162; redação da LC 210/2026","id":"5a796e3"},{"m":"lm","tp":"Estatuto – Penalidades","nv":1,"e":"São penalidades disciplinares previstas na LC nº 5/1991 de Paracatu, EXCETO:","o":["advertência.","cassação de aposentadoria ou disponibilidade.","destituição de cargo em comissão.","repreensão."],"a":3,"c":"Art. 150: advertência, suspensão, demissão, cassação de aposentadoria ou disponibilidade e destituição de cargo em comissão. Repreensão não existe no Estatuto.","f":"LC 5/1991, art. 150; redação da LC 210/2026","id":"c7408dc"},{"m":"lm","tp":"Estatuto – Penalidades","nv":1,"e":"De acordo com a LC nº 5/1991 de Paracatu, a pena de suspensão:","o":["não excederá noventa dias e, por conveniência do serviço, poderá ser convertida em multa de cinquenta por cento da remuneração, ficando o servidor obrigado a permanecer em serviço.","não excederá sessenta dias e poderá ser convertida em multa de cem por cento da remuneração.","não excederá trinta dias e não admite conversão em multa.","não excederá noventa dias e poderá ser convertida em multa de trinta por cento da remuneração, dispensado o servidor do serviço."],"a":0,"c":"Art. 154: suspensão de até noventa dias. Art. 155, parágrafo único: conversão em multa de 50% da remuneração, permanecendo o servidor em serviço.","f":"LC 5/1991, arts. 154 e 155; redação da LC 210/2026","id":"8da9707"},{"m":"lm","tp":"Estatuto – Penalidades","nv":3,"e":"Conforme o Estatuto dos Servidores de Paracatu, configura inassiduidade habitual, punível com demissão, a falta ao serviço sem causa justificada por:","o":["mais de trinta dias consecutivos.","trinta dias, interpoladamente, durante o período de doze meses.","sessenta dias consecutivos.","sessenta dias, interpoladamente, durante o período de doze meses."],"a":3,"c":"Art. 157, parágrafo único, II: inassiduidade habitual = sessenta dias de falta injustificada no período de doze meses. Mais de trinta dias consecutivos caracteriza ABANDONO de cargo (inciso I). Pela LC 210/2026 (art. 161-A), a demissão por abandono de cargo ou por inassiduidade habitual incompatibiliza o ex-servidor por cinco anos, e não pelos quinze anos da regra geral do art. 161.","f":"LC 5/1991, art. 157, parágrafo único; redação da LC 210/2026","id":"5442c4b"},{"m":"lm","tp":"Estatuto – Penalidades","nv":2,"e":"Analise as afirmativas sobre penalidades, segundo a LC nº 5/1991 de Paracatu:\nI. A competência para aplicar a pena de advertência poderá ser delegada a titular de cargo de Secretário Municipal ou equivalente.\nII. O ato de imposição da penalidade mencionará sempre o fundamento legal e a causa da sanção.\nIII. As penas de advertência e de suspensão terão seus registros cancelados após três e cinco anos de efetivo exercício, respectivamente, se não houver nova infração.\nIV. O cancelamento do registro das penalidades produz efeitos retroativos.\nEstão CORRETAS as afirmativas:","o":["I e IV, apenas.","II, III e IV, apenas.","I, II e III, apenas.","I, II, III e IV."],"a":2,"c":"I e II: art. 152 e parágrafo único. III: art. 156. IV está errada: o cancelamento não surtirá efeitos retroativos (art. 156, parágrafo único). Na redação da LC 210/2026, o art. 152 fala em aplicação \"pela Prefeitura Municipal ou autoridade competente\", mantida a delegação da advertência ao Secretário Municipal.","f":"LC 5/1991, arts. 152 e 156; redação da LC 210/2026","id":"a0b939d"},{"m":"lm","tp":"Estatuto – Penalidades","nv":1,"e":"Segundo a LC nº 5/1991 de Paracatu, a destituição de cargo em comissão será aplicada:","o":["a qualquer servidor efetivo que pratique infração punível com advertência.","ao servidor aposentado que, em atividade, praticou falta punível com demissão.","ao ocupante de cargo em comissão não titular de cargo efetivo ou de função pública, nos casos de infração sujeita às penas de suspensão ou demissão.","exclusivamente nos casos de abandono de cargo."],"a":2,"c":"Art. 159: destituição para o comissionado que não seja titular de cargo efetivo ou função pública, nas infrações puníveis com suspensão ou demissão. A hipótese do aposentado é de cassação (art. 158).","f":"LC 5/1991, arts. 158 e 159; redação da LC 210/2026","id":"b669136"},{"m":"lm","tp":"Estatuto – Prescrição disciplinar","nv":1,"e":"Conforme a LC nº 5/1991 de Paracatu, com a redação dada pela LC nº 210/2026, a ação disciplinar prescreverá:","o":["em cinco anos, quanto à demissão; em três anos, quanto à suspensão; e em um ano, quanto à advertência.","em cinco anos, quanto à demissão; em dois anos, quanto à suspensão; e em cento e oitenta dias, quanto à advertência.","em cinco anos, para todas as penalidades.","em cinco anos, quanto às infrações puníveis com demissão, cassação de aposentadoria ou disponibilidade e destituição de cargo em comissão; em dois anos, quanto à suspensão; e em cento e cinquenta dias, quanto à advertência."],"a":3,"c":"Art. 163, I a III (redação da LC 210/2026): cinco anos (demissão, cassação e destituição), dois anos (suspensão) e CENTO E CINQUENTA dias (advertência). Os 180 dias da alternativa B eram a redação original de 1991, alterada pela LC 210/2026.","f":"LC 5/1991, art. 163 (redação da LC 210/2026)","id":"a446416"},{"m":"lm","tp":"Estatuto – Prescrição disciplinar","nv":3,"e":"Sobre a prescrição da ação disciplinar na LC nº 5/1991 de Paracatu, assinale a alternativa INCORRETA.","o":["Os prazos de prescrição previstos na lei penal aplicam-se às infrações disciplinares capituladas também como crime.","O prazo de prescrição começa a correr da data em que o fato foi praticado, ainda que desconhecido da Administração.","A abertura de sindicância ou a instauração de processo disciplinar interrompe a prescrição até a decisão final da autoridade competente.","Interrompido o curso da prescrição, o prazo recomeça a correr, pelo prazo restante, a partir do dia em que cessar a interrupção."],"a":1,"c":"Art. 163, § 1º: o prazo começa a correr da data em que o fato se tornou CONHECIDO. §§ 2º, 3º e 4º confirmam as demais alternativas. Os §§ 1º a 4º do art. 163 foram mantidos pela LC 210/2026.","f":"LC 5/1991, art. 163; redação da LC 210/2026","id":"b4a774e"},{"m":"lm","tp":"Estatuto – Sindicância e PAD","nv":2,"e":"De acordo com a LC nº 5/1991 de Paracatu, não poderá participar de comissão de sindicância ou de inquérito o cônjuge, companheiro ou parente do acusado, consanguíneo ou afim, em linha reta ou colateral, até o:","o":["primeiro grau.","segundo grau.","terceiro grau.","quarto grau."],"a":2,"c":"Art. 169, § 2º: impedimento até o terceiro grau. Não confundir com o art. 138, IX (chefia imediata de parente até o segundo grau).","f":"LC 5/1991, arts. 138 e 169","id":"6b9a1f0"},{"m":"lm","tp":"Estatuto – Sindicância e PAD","nv":2,"e":"Analise as afirmativas sobre o processo disciplinar, conforme a LC nº 5/1991 de Paracatu:\nI. O prazo para conclusão do processo não excederá sessenta dias, contados da publicação do ato de constituição da comissão, admitida prorrogação por igual prazo.\nII. O indiciado será citado para apresentar defesa escrita no prazo de dez dias.\nIII. Havendo dois ou mais indiciados, o prazo de defesa será comum e de vinte dias.\nIV. O prazo de defesa jamais poderá ser prorrogado.\nEstão CORRETAS as afirmativas:","o":["I e II, apenas.","I, II e III, apenas.","II, III e IV, apenas.","I, III e IV, apenas."],"a":1,"c":"I: art. 172. II: art. 181, § 1º. III: art. 181, § 2º. IV está errada: o prazo de defesa pode ser prorrogado pelo dobro, para diligências indispensáveis (art. 181, § 3º).","f":"LC 5/1991, arts. 172 e 181","id":"158ed0d"},{"m":"lm","tp":"Estatuto – Sindicância e PAD","nv":3,"e":"Um servidor indiciado em processo disciplinar no Município de Paracatu encontra-se em lugar incerto e não sabido. De acordo com a LC nº 5/1991, ele será citado:","o":["por edital, publicado em jornal oficial e em outro de grande circulação no Município, com prazo de defesa de quinze dias a partir da última publicação.","por edital afixado na repartição, com prazo de defesa de dez dias da afixação.","por carta com aviso de recebimento, com prazo de defesa de trinta dias.","por edital, com prazo de defesa de vinte dias contados da primeira publicação."],"a":0,"c":"Art. 183 e parágrafo único: citação por edital em jornal oficial e em outro de grande circulação no Município; defesa em quinze dias a partir da última publicação.","f":"LC 5/1991, art. 183","id":"9fb7ed4"},{"m":"lm","tp":"Estatuto – Sindicância e PAD","nv":2,"e":"Marque V para verdadeiro e F para falso, conforme a LC nº 5/1991 de Paracatu:\n( ) Considera-se revel o indiciado que, regularmente citado, não apresentar defesa no prazo legal.\n( ) Para defender o revel, a autoridade nomeará defensor dativo, ocupante de cargo de nível igual ou superior ao do indiciado.\n( ) O relatório da comissão poderá deixar de ser conclusivo quanto à inocência ou responsabilidade do servidor.\n( ) A testemunha poderá trazer seu depoimento por escrito.\nA sequência CORRETA é:","o":["V, F, F, V.","V, V, V, F.","F, V, F, F.","V, V, F, F."],"a":3,"c":"Art. 184 e parágrafo único (V, V). Art. 185, § 1º: o relatório será sempre conclusivo (F). Art. 178: é vedado à testemunha trazer o depoimento por escrito (F).","f":"LC 5/1991, arts. 178, 184 e 185","id":"7232f71"},{"m":"lm","tp":"Estatuto – Sindicância e PAD","nv":3,"e":"Sobre o julgamento do processo disciplinar, conforme a LC nº 5/1991 de Paracatu, assinale a alternativa INCORRETA.","o":["O julgamento acatará o relatório da comissão, salvo quando contrário às provas dos autos.","O julgamento fora do prazo legal implica a nulidade do processo.","Quando o relatório contrariar as provas, a autoridade poderá, motivadamente, agravar a penalidade proposta, abrandá-la ou isentar o servidor de responsabilidade.","Verificada a existência de vício insanável, a autoridade declarará a nulidade total ou parcial do processo e ordenará a constituição de outra comissão."],"a":1,"c":"Art. 189, parágrafo único: o julgamento fora do prazo legal NÃO implica nulidade. As demais alternativas reproduzem os arts. 188 e 189.","f":"LC 5/1991, arts. 188 e 189","id":"d8232a2"},{"m":"lm","tp":"Estatuto – Revisão","nv":2,"e":"De acordo com a LC nº 5/1991 de Paracatu, sobre a revisão do processo disciplinar, é CORRETO afirmar que:","o":["só pode ser requerida no prazo de cinco anos da aplicação da pena.","a simples alegação de injustiça da penalidade constitui fundamento suficiente para a revisão.","em caso de falecimento do servidor, a revisão não poderá ser requerida.","da revisão do processo não poderá resultar agravamento da penalidade."],"a":3,"c":"Art. 202: a revisão não pode agravar a pena. Art. 193: pode ocorrer a qualquer tempo, e, no falecimento, qualquer pessoa da família pode requerê-la (§ 1º). Art. 194: a simples alegação de injustiça não basta.","f":"LC 5/1991, arts. 193, 194 e 202","id":"6877d30"},{"m":"lm","tp":"Estatuto – Revisão","nv":3,"e":"Julgada procedente a revisão de processo disciplinar em que foi aplicada a pena de destituição de cargo em comissão, segundo a LC nº 5/1991 de Paracatu:","o":["o servidor será reconduzido obrigatoriamente ao cargo em comissão.","a destituição será mantida, pois não admite revisão.","a destituição será convertida em exoneração.","a destituição será convertida em advertência."],"a":2,"c":"Art. 201: procedente a revisão, a penalidade fica sem efeito e restabelecem-se os direitos do servidor, exceto em relação à destituição de cargo em comissão, que será convertida em exoneração.","f":"LC 5/1991, art. 201","id":"72ac9d5"},{"m":"lm","tp":"Estatuto – Direito de petição","nv":2,"e":"Analise as afirmativas sobre o direito de petição, segundo a LC nº 5/1991 de Paracatu:\nI. O requerimento e o pedido de reconsideração deverão ser despachados em cinco dias e decididos no prazo de trinta dias.\nII. O prazo para interposição de recurso é de quinze dias, a contar da publicação ou da ciência da decisão recorrida.\nIII. Das decisões da Administração Direta cabe recurso à Câmara Municipal.\nIV. O pedido de reconsideração poderá ser renovado uma vez.\nEstão CORRETAS as afirmativas:","o":["I, II e III, apenas.","II e IV, apenas.","I e II, apenas.","I, III e IV, apenas."],"a":2,"c":"I: art. 129. II: art. 131, parágrafo único. III está errada: o recurso vai ao Prefeito Municipal, se não for ele o prolator (art. 131). IV está errada: a reconsideração não pode ser renovada (art. 130).","f":"LC 5/1991, arts. 129 a 131","id":"119a796"},{"m":"lm","tp":"Estatuto – Sindicância e PAD","nv":2,"e":"Analise as afirmativas sobre sindicância e processo disciplinar, conforme a LC nº 5/1991 de Paracatu:\nI. Da sindicância poderá resultar a aplicação de advertência ou de suspensão de até trinta dias.\nII. O afastamento preventivo do servidor será de até sessenta dias, sem prejuízo da remuneração.\nIII. O processo disciplinar será conduzido por comissão composta de cinco servidores.\nIV. A autoridade julgadora proferirá a decisão em sessenta dias, contados do recebimento do processo.\nEstão CORRETAS as afirmativas:","o":["I, II e IV, apenas.","I e III, apenas.","II, III e IV, apenas.","I, II, III e IV."],"a":0,"c":"I: art. 166, II. II: art. 167. IV: art. 187. III está errada: a comissão é de três servidores (art. 169).","f":"LC 5/1991, arts. 166, 167, 169 e 187","id":"088e5d9"},{"m":"lm","tp":"Estatuto – Licenças","nv":2,"e":"Analise as afirmativas sobre licenças, de acordo com a LC nº 5/1991 de Paracatu:\nI. A licença-paternidade é de cinco dias consecutivos.\nII. Em caso de aborto atestado por médico oficial, a servidora terá licença de trinta dias.\nIII. A licença para tratamento de saúde superior a trinta dias depende de inspeção por junta médica oficial.\nIV. A licença por motivo de afastamento do cônjuge é remunerada e limitada a dois anos.\nEstão CORRETAS as afirmativas:","o":["I, II e III, apenas.","I e IV, apenas.","II, III e IV, apenas.","I, II, III e IV."],"a":0,"c":"I: art. 84. II: art. 82. III: art. 76, § 1º. IV está errada: a licença do cônjuge é por prazo indeterminado (art. 89, parágrafo único) e sem remuneração (art. 102).","f":"LC 5/1991, arts. 76, 82, 84, 89 e 102","id":"e9d8bcf"},{"m":"lm","tp":"Estatuto – Provimento","nv":3,"e":"Analise as afirmativas sobre formas de provimento, conforme a LC nº 5/1991 de Paracatu:\nI. Reversão é o retorno à atividade do aposentado por invalidez, quando junta médica oficial declarar insubsistentes os motivos da aposentadoria.\nII. A readaptação ocorre quando o servidor tem limitação em sua capacidade física ou mental, verificada em inspeção médica.\nIII. Se o cargo do servidor reintegrado houver sido extinto, ele ficará em disponibilidade remunerada até seu aproveitamento.\nIV. É vedada a reversão do aposentado que já tiver atingido a idade-limite para aposentadoria compulsória.\nEstão CORRETAS as afirmativas:","o":["I e II, apenas.","I, II e III, apenas.","II, III e IV, apenas.","I, II, III e IV."],"a":3,"c":"Todas corretas: I (art. 23), II (art. 21), III (art. 30) e IV
