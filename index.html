caso ≥ 200 mg/dL em paciente com sintomas clássicos de hiperglicemia. IV. Glicemia de jejum entre 100 e 125 mg/dL. São critérios diagnósticos de diabetes mellitus:","o":["I e IV, apenas.","II e IV, apenas.","I, II e III, apenas.","I, II, III e IV."],"a":2,"c":"Glicemia de jejum entre 100 e 125 mg/dL caracteriza pré-diabetes (glicemia de jejum alterada), não DM. Os critérios I, II e III, além da glicemia de jejum ≥ 126 mg/dL, diagnosticam DM.","f":"Diretriz SBD; MS","id":"6df7eea"},{"m":"ce","tp":"Doenças Crônicas (HAS e DM)","nv":2,"e":"Paciente diabético em uso de insulina está consciente, sudoreico e trêmulo, com glicemia capilar de 55 mg/dL. A conduta inicial CORRETA é:","o":["oferecer 15 g de carboidrato de absorção rápida (ex.: suco de laranja ou água com açúcar) e repetir a glicemia em 15 minutos.","aplicar a dose de insulina regular prevista e oferecer água.","aguardar a próxima refeição, pois o paciente está consciente.","oferecer alimento rico em gordura, como chocolate, para absorção rápida."],"a":0,"c":"Regra dos 15: 15 g de carboidrato simples e nova glicemia após 15 minutos, repetindo se ainda < 70 mg/dL. Alimentos gordurosos retardam a absorção; insulina pioraria a hipoglicemia.","f":"Diretriz SBD","id":"0646dc6"},{"m":"ce","tp":"Doenças Crônicas (HAS e DM)","nv":2,"e":"Sobre o armazenamento e a aplicação de insulina, marque V para verdadeiro e F para falso. ( ) Os frascos lacrados devem ser armazenados na geladeira, entre +2 °C e +8 °C, longe do congelador. ( ) A insulina que congelou pode ser utilizada normalmente após o descongelamento. ( ) O abdome é a região de absorção mais rápida para a insulina subcutânea. ( ) A insulina NPH deve ser aplicada rotineiramente por via intramuscular, para acelerar a ação. A sequência CORRETA é:","o":["V, V, V, F","V, F, V, F","F, F, V, V","V, F, F, V"],"a":1,"c":"Insulina congelada perde a eficácia e deve ser desprezada. A NPH é aplicada por via subcutânea; a IM não é a via de rotina. O abdome tem a absorção mais rápida entre os sítios SC.","f":"MS – Caderno de AB nº 36; SBD","id":"021950d"},{"m":"ce","tp":"Doenças Crônicas (HAS e DM)","nv":1,"e":"Sobre o autocuidado com os pés da pessoa com diabetes, assinale a alternativa INCORRETA.","o":["Andar descalço ajuda a fortalecer a pele dos pés e deve ser estimulado.","Os pés devem ser examinados diariamente, inclusive entre os dedos.","Após o banho, deve-se secar bem os pés, especialmente entre os dedos.","As unhas devem ser cortadas retas, sem aprofundar os cantos."],"a":0,"c":"A pessoa com DM, frequentemente com neuropatia, NÃO deve andar descalça, pelo risco de lesões não percebidas. As demais são orientações do MS.","f":"MS – Caderno de AB nº 36","id":"34951c6"},{"m":"ce","tp":"Doenças Crônicas (HAS e DM)","nv":2,"e":"Entre as medidas não farmacológicas recomendadas para o controle da hipertensão arterial, está CORRETA:","o":["suspender a atividade física aeróbica, pois ela eleva a pressão arterial.","substituir alimentos in natura por ultraprocessados com baixo teor de gordura.","manter o consumo diário de bebidas alcoólicas sem limite, desde que seja vinho.","reduzir o consumo de sódio para até 2 g por dia, o que equivale a cerca de 5 g de sal de cozinha."],"a":3,"c":"As diretrizes recomendam limitar o sódio a cerca de 2 g/dia (≈ 5 g de sal), praticar atividade física regular, preferir alimentos in natura e moderar/evitar o consumo de álcool.","f":"Diretrizes Brasileiras de HA","id":"18a0451"},{"m":"ce","tp":"Doenças Transmissíveis e Notificação","nv":2,"e":"Analise as afirmativas a seguir: I. Na população geral, considera-se sintomático respiratório a pessoa com tosse por 3 semanas ou mais. II. A rifampicina pode deixar a urina e outras secreções com coloração alaranjada/avermelhada, e o paciente deve ser orientado. III. O tratamento diretamente observado (TDO) é estratégia recomendada para favorecer a adesão. IV. O paciente pode interromper o tratamento após 15 dias, se estiver assintomático. Sobre a tuberculose, estão CORRETAS:","o":["I e IV, apenas.","II, III e IV, apenas.","I, II e III, apenas.","I, II, III e IV."],"a":2,"c":"O tratamento deve ser mantido pelo tempo total (6 meses no esquema básico); a interrupção precoce causa recidiva e resistência (IV errada).","f":"MS – Manual de Recomendações para o Controle da Tuberculose","id":"c8ccfaa"},{"m":"ce","tp":"Doenças Transmissíveis e Notificação","nv":3,"e":"Sobre o tratamento da hanseníase no Brasil, marque V para verdadeiro e F para falso. ( ) Desde 2021, a poliquimioterapia única (PQT-U), com rifampicina, dapsona e clofazimina, é utilizada tanto para casos paucibacilares quanto multibacilares. ( ) Nos casos paucibacilares, o tratamento é de 6 doses mensais supervisionadas. ( ) Nos casos multibacilares, o tratamento é de 12 doses mensais supervisionadas. ( ) O paciente deve permanecer isolado em domicílio durante todo o tratamento. A sequência CORRETA é:","o":["V, V, V, F","V, F, V, F","F, V, V, F","V, V, F, V"],"a":0,"c":"PQT-U (rifampicina + dapsona + clofazimina) para PB (6 doses) e MB (12 doses). Após o início do tratamento o paciente deixa de transmitir; não há indicação de isolamento.","f":"MS – PCDT Hanseníase","id":"4f53b44"},{"m":"ce","tp":"Doenças Transmissíveis e Notificação","nv":2,"e":"São sinais de alarme na dengue, EXCETO:","o":["dor abdominal intensa e contínua.","vômitos persistentes.","febre alta de início súbito, com cefaleia e dor retro-orbitária.","sangramento de mucosas."],"a":2,"c":"Febre alta, cefaleia e dor retro-orbitária são sintomas comuns da dengue clássica. Sinais de alarme incluem dor abdominal intensa e contínua, vômitos persistentes, acúmulo de líquidos, hipotensão postural/lipotimia, hepatomegalia > 2 cm, sangramento de mucosa, letargia/irritabilidade e aumento progressivo do hematócrito.","f":"MS – Dengue: diagnóstico e manejo clínico","id":"98f7f84"},{"m":"ce","tp":"Doenças Transmissíveis e Notificação","nv":1,"e":"Paciente com suspeita de dengue procura a UBS com febre e mialgia. Quanto ao uso de medicamentos para alívio dos sintomas, a orientação CORRETA é:","o":["usar ácido acetilsalicílico, pois reduz a febre e previne tromboses.","usar anti-inflamatórios como ibuprofeno e diclofenaco, que são os mais seguros.","evitar ácido acetilsalicílico e anti-inflamatórios não esteroides, podendo-se usar dipirona ou paracetamol conforme prescrição.","não usar nenhum medicamento, nem mesmo antitérmico."],"a":2,"c":"AAS e AINEs aumentam o risco de sangramento na dengue e são contraindicados. Para dor e febre usam-se dipirona ou paracetamol, além de hidratação.","f":"MS – Dengue: diagnóstico e manejo clínico","id":"b71589d"},{"m":"ce","tp":"Doenças Transmissíveis e Notificação","nv":2,"e":"Numere a COLUNA II de acordo com a COLUNA I, relacionando a fase da sífilis à sua manifestação. COLUNA I: 1. Primária; 2. Secundária; 3. Latente; 4. Terciária. COLUNA II: ( ) Lesões cutâneas disseminadas, que podem acometer palmas das mãos e plantas dos pés. ( ) Período sem sinais ou sintomas, diagnosticado apenas por testes imunológicos. ( ) Cancro duro: úlcera geralmente única e indolor no local de inoculação. ( ) Lesões gomosas, cardiovasculares e neurológicas, que surgem anos após a infecção. A sequência CORRETA é:","o":["1, 3, 2, 4","2, 1, 3, 4","3, 2, 1, 4","2, 3, 1, 4"],"a":3,"c":"Primária: cancro duro indolor. Secundária: lesões cutaneomucosas, inclusive palmoplantares. Latente: assintomática. Terciária: gomas, acometimento cardiovascular e neurológico.","f":"MS – PCDT IST","id":"1cf6921"},{"m":"ce","tp":"Doenças Transmissíveis e Notificação","nv":3,"e":"Analise as afirmativas a seguir: I. O sarampo é de notificação compulsória imediata (até 24 horas). II. A tuberculose é de notificação compulsória semanal. III. A notificação de casos suspeitos deve aguardar a confirmação laboratorial. IV. A notificação compulsória é obrigatória para médicos, outros profissionais de saúde e responsáveis por estabelecimentos de saúde. Estão CORRETAS:","o":["I e III, apenas.","I, II e IV, apenas.","II, III e IV, apenas.","I, II, III e IV."],"a":1,"c":"A notificação é feita já diante da SUSPEITA, sem aguardar confirmação (III errada). Sarampo é de notificação imediata; tuberculose, semanal. A obrigação abrange médicos, demais profissionais de saúde e responsáveis por estabelecimentos.","f":"Lista Nacional de Notificação Compulsória; Lei 6.259/1975","id":"5c0468f"},{"m":"ce","tp":"Doenças Transmissíveis e Notificação","nv":1,"e":"A doença viral transmitida principalmente pela via fecal-oral, por meio de água e alimentos contaminados, é a:","o":["hepatite B.","hepatite C.","hepatite D.","hepatite A."],"a":3,"c":"A hepatite A (e a E) tem transmissão fecal-oral. As hepatites B, C e D são transmitidas por sangue, via sexual e vertical.","f":"MS – Hepatites virais","id":"54afc62"},{"m":"ce","tp":"Saúde Mental","nv":1,"e":"Numere a COLUNA II de acordo com a COLUNA I, conforme os tipos de internação psiquiátrica da Lei nº 10.216/2001. COLUNA I: 1. Voluntária; 2. Involuntária; 3. Compulsória. COLUNA II: ( ) Determinada pela Justiça. ( ) Dá-se com o consentimento do usuário. ( ) Dá-se sem o consentimento do usuário e a pedido de terceiro. A sequência CORRETA é:","o":["2, 1, 3","3, 2, 1","3, 1, 2","1, 3, 2"],"a":2,"c":"Art. 6º, parágrafo único, da Lei 10.216/2001: voluntária (com consentimento), involuntária (sem consentimento, a pedido de terceiro) e compulsória (determinada pela Justiça).","f":"Lei 10.216/2001, art. 6º","id":"99d0a50"},{"m":"ce","tp":"Saúde Mental","nv":2,"e":"Segundo a Lei nº 10.216/2001, a internação psiquiátrica involuntária deverá ser comunicada ao Ministério Público Estadual pelo responsável técnico do estabelecimento no prazo de:","o":["24 horas.","72 horas.","48 horas.","7 dias."],"a":1,"c":"Art. 8º, §1º: a internação involuntária deverá, no prazo de 72 horas, ser comunicada ao Ministério Público Estadual pelo responsável técnico do estabelecimento; o mesmo procedimento deve ser adotado na alta.","f":"Lei 10.216/2001, art. 8º","id":"817657c"},{"m":"ce","tp":"Saúde Mental","nv":2,"e":"Analise as afirmativas a seguir: I. A RAPS inclui componentes de atenção básica, atenção psicossocial especializada (CAPS), urgência e emergência, atenção residencial de caráter transitório, atenção hospitalar, estratégias de desinstitucionalização e reabilitação psicossocial. II. O CAPS III funciona 24 horas, inclusive em feriados e fins de semana. III. O CAPS AD atende exclusivamente pessoas com mais de 60 anos. IV. Os Serviços Residenciais Terapêuticos são estratégias de desinstitucionalização. Sobre a Rede de Atenção Psicossocial (RAPS), estão CORRETAS:","o":["I, II e IV, apenas.","I e III, apenas.","II, III e IV, apenas.","I, II, III e IV."],"a":0,"c":"O CAPS AD atende pessoas com necessidades decorrentes do uso de álcool e outras drogas, de todas as faixas etárias previstas (III errada). Os demais itens estão de acordo com a Portaria 3.088/2011.","f":"Portaria GM/MS 3.088/2011","id":"8b3b79b"},{"m":"ce","tp":"Saúde Mental","nv":1,"e":"Sobre a Lei nº 10.216/2001, assinale a alternativa INCORRETA.","o":["É vedada a internação de pacientes portadores de transtornos mentais em instituições com características asilares.","A internação, em qualquer modalidade, é a primeira opção de tratamento para a pessoa com transtorno mental grave.","O tratamento visará, como finalidade permanente, a reinserção social do paciente em seu meio.","É direito da pessoa ser tratada, preferencialmente, em serviços comunitários de saúde mental."],"a":1,"c":"Art. 4º: a internação só será indicada quando os recursos extra-hospitalares se mostrarem insuficientes. As demais alternativas reproduzem os arts. 2º e 4º.","f":"Lei 10.216/2001","id":"e13aa09"},{"m":"ce","tp":"Vigilância em Saúde","nv":2,"e":"Em um surto de doença diarreica em uma escola foram registrados 200 casos e 10 óbitos. A taxa de letalidade foi de:","o":["0,5%.","2%.","20%.","5%."],"a":3,"c":"Letalidade = (óbitos pela doença ÷ casos da doença) × 100 = 10 ÷ 200 × 100 = 5%. Não confundir com mortalidade, cujo denominador é a população total.","f":"Epidemiologia","id":"1400586"},{"m":"ce","tp":"Vigilância em Saúde","nv":1,"e":"Sobre os conceitos epidemiológicos, assinale a alternativa INCORRETA.","o":["Endemia é a ocorrência de uma doença em níveis habituais, dentro do esperado, em determinada área.","Epidemia é a elevação do número de casos acima do esperado em determinado local e período.","Surto é uma epidemia localizada, restrita a uma área delimitada ou a um grupo específico.","Pandemia é a ocorrência de casos acima do esperado restrita a uma única instituição, como uma creche."],"a":3,"c":"O aumento restrito a uma instituição caracteriza surto. Pandemia é uma epidemia de grandes proporções, que atinge vários países/continentes.","f":"Epidemiologia","id":"f819e45"},{"m":"ce","tp":"Vigilância em Saúde","nv":2,"e":"Analise as afirmativas a seguir: I. A vacinação confere imunidade ativa artificial. II. Os anticorpos transferidos pela placenta e pelo leite materno conferem imunidade passiva natural. III. A administração de soro ou imunoglobulina confere imunidade ativa artificial. IV. A doença adquirida naturalmente pode conferir imunidade ativa natural. Estão CORRETAS:","o":["I, II e IV, apenas.","I e III, apenas.","II, III e IV, apenas.","I, II, III e IV."],"a":0,"c":"Soros e imunoglobulinas fornecem anticorpos prontos: imunidade PASSIVA artificial, de curta duração (III errada).","f":"Imunologia básica","id":"eab8b85"},{"m":"ce","tp":"Vigilância em Saúde","nv":1,"e":"Sobre os sistemas de informação em saúde, assinale a associação INCORRETA.","o":["SINAN — notificação e investigação de doenças e agravos de notificação compulsória.","SIM — informações sobre mortalidade, a partir da declaração de óbito.","SINASC — registro de óbitos e suas causas.","SI-PNI — registro das doses de vacinas aplicadas."],"a":2,"c":"O SINASC (Sistema de Informações sobre Nascidos Vivos) é alimentado pela Declaração de Nascido Vivo. Óbitos são registrados no SIM.","f":"MS – Sistemas de informação","id":"a5670c4"},{"m":"ce","tp":"Clínica Cirúrgica e Sondagens","nv":1,"e":"Sobre as posições cirúrgicas e de exame, assinale a alternativa INCORRETA.","o":["Na posição de Trendelenburg, a cabeça fica mais elevada que os pés.","Na posição de Fowler, o paciente fica semissentado, com a cabeceira elevada.","A posição de Sims é o decúbito lateral, usada por exemplo para lavagem intestinal.","A posição de litotomia (ginecológica) é usada em procedimentos perineais e ginecológicos."],"a":0,"c":"Na posição de Trendelenburg, a cabeça fica MAIS BAIXA que os pés (e a de proclive/Trendelenburg reverso é o contrário).","f":"Fundamentos de Enfermagem","id":"f14268a"},{"m":"ce","tp":"Clínica Cirúrgica e Sondagens","nv":3,"e":"Na sala de recuperação pós-anestésica, o Índice de Aldrete e Kroulik avalia os seguintes parâmetros:","o":["abertura ocular, resposta verbal e resposta motora.","atividade, respiração, circulação, consciência e saturação de oxigênio (ou coloração).","frequência cardíaca, esforço respiratório, tônus muscular, irritabilidade reflexa e cor.","percepção sensorial, umidade, atividade, mobilidade, nutrição e fricção."],"a":1,"c":"Aldrete e Kroulik: atividade motora, respiração, circulação (PA), consciência e SpO2 (ou coloração), cada um de 0 a 2 (total 10). A segunda é Glasgow, a terceira é Apgar e a quarta é Braden.","f":"Enfermagem cirúrgica","id":"74275a2"},{"m":"ce","tp":"Clínica Cirúrgica e Sondagens","nv":2,"e":"Analise as afirmativas a seguir: I. Deve ser realizado com técnica asséptica e sistema de drenagem fechado. II. A bolsa coletora deve ser mantida abaixo do nível da bexiga, sem contato com o chão. III. O sistema deve ser desconectado rotineiramente para coleta de urina e esvaziamento. IV. No âmbito da equipe de enfermagem, a inserção do cateter vesical é atividade privativa do enfermeiro. Sobre o cateterismo vesical de demora, estão CORRETAS:","o":["I e III, apenas.","II, III e IV, apenas.","I, II e IV, apenas.","I, II, III e IV."],"a":2,"c":"O sistema fechado não deve ser desconectado: a urina para exame é colhida no dispositivo próprio, com técnica asséptica (III errada). A Res. Cofen 450/2013 define a inserção do cateter vesical como privativa do enfermeiro, cabendo ao técnico os cuidados de manutenção sob supervisão.","f":"Anvisa – Prevenção de ITU; Res. Cofen 450/2013","id":"1463689"},{"m":"ce","tp":"Clínica Cirúrgica e Sondagens","nv":2,"e":"Analise as afirmativas a seguir: I. Retirar próteses dentárias móveis, adornos e esmalte, conforme protocolo institucional. II. Quando indicada, a remoção de pelos deve ser feita com tricotomizador elétrico, o mais próximo possível do horário da cirurgia. III. A tricotomia com lâmina deve ser feita na véspera, para reduzir o risco de infecção. IV. Conferir o jejum e a assinatura do termo de consentimento. São cuidados pré-operatórios CORRETOS:","o":["I e III, apenas.","I, II e IV, apenas.","II, III e IV, apenas.","I, II, III e IV."],"a":1,"c":"A tricotomia com lâmina, especialmente na véspera, aumenta o risco de infecção do sítio cirúrgico por microlesões; quando necessária, usa-se tricotomizador elétrico próximo ao procedimento (III errada).","f":"Anvisa – Prevenção de ISC","id":"5c1ffb3"},{"m":"ce","tp":"Clínica Cirúrgica e Sondagens","nv":2,"e":"Antes de iniciar a dieta por sonda nasoenteral recém-inserida, o método considerado padrão-ouro para confirmar o posicionamento da sonda é:","o":["a ausculta epigástrica após injeção de ar.","a imersão da ponta proximal da sonda em um copo com água.","a radiografia.","a observação da ausência de tosse durante a passagem."],"a":2,"c":"A confirmação radiológica é o padrão-ouro para sonda nasoenteral. A ausculta de ar injetado e o teste do copo d’água não são confiáveis; a ausência de tosse não exclui posicionamento na via aérea.","f":"Diretrizes de terapia nutricional (BRASPEN)","id":"985fb3f"},{"m":"pt","tp":"Interpretação de texto","nv":1,"tx":"g1","e":"Depreende-se da leitura do texto, como ideia central, que:","o":["a hipertensão só precisa ser tratada quando provoca dor ou febre.","os aparelhos de aferição tornaram dispensável o trabalho de orientação ao paciente.","a ausência de sintomas dificulta a percepção da hipertensão, o que exige acompanhamento contínuo e orientação dos profissionais.","o tratamento da hipertensão depende exclusivamente do uso correto de medicamentos."],"a":2,"c":"O texto insiste que a doença 'avança em silêncio' e que existe 'um trabalho de convencimento que nenhuma tecnologia substitui'. As demais alternativas contrariam o texto: ele diz que a hipertensão não dói, que o aparelho não substitui a orientação e que o tratamento 'não se resume ao comprimido'.","id":"c8e857b"},{"m":"pt","tp":"Conectivos","nv":2,"tx":"g1","e":"Considere os conectivos do texto e analise as afirmativas a seguir.\nI. Em \"O tratamento, contudo, não se resume ao comprimido\", \"contudo\" expressa oposição em relação ao que foi dito antes.\nII. Em \"ainda que nenhum desses hábitos caiba numa embalagem\", \"ainda que\" introduz uma ideia de concessão.\nIII. Em \"Por isso, os profissionais repetem...\", \"Por isso\" introduz a causa do que foi afirmado no parágrafo anterior.\nEstão CORRETAS as afirmativas:","o":["I e III, apenas.","II e III, apenas.","I, II e III.","I e II, apenas."],"a":3,"c":"I: 'contudo' é conjunção adversativa (oposição). II: 'ainda que' é locução concessiva, equivalente a 'embora'. III está errada: 'Por isso' introduz conclusão ou consequência, e não causa. A causa, o fato de a doença ser silenciosa, está no parágrafo anterior.","id":"23b59e1"},{"m":"pt","tp":"Figuras de linguagem","nv":2,"tx":"g1","e":"No trecho \"a hipertensão [...] só se anuncia quando já causou estragos\", há uma figura de linguagem denominada:","o":["hipérbole.","prosopopeia.","eufemismo.","antítese."],"a":1,"c":"A prosopopeia (ou personificação) atribui ações humanas a seres inanimados ou abstratos. A doença 'se anuncia', como se fosse uma pessoa. Não há exagero (hipérbole), suavização (eufemismo) nem oposição de ideias (antítese).","id":"7e81768"},{"m":"pt","tp":"Coesão – elipse","nv":2,"tx":"g1","e":"No trecho \"Não chegou: a pressão ficou controlada porque o tratamento estava funcionando\", o sujeito elíptico de \"chegou\" é:","o":["o remédio.","o paciente.","a cura.","o número da pressão."],"a":2,"c":"O período anterior termina com 'como se a cura tivesse chegado'. Em seguida, 'Não chegou' retoma por elipse o sujeito 'a cura'. O autor desfaz assim a falsa impressão de que o paciente estaria curado.","id":"3ec3882"},{"m":"pt","tp":"Pontuação – travessão","nv":2,"tx":"g1","e":"No trecho \"Uma aferição feita com a técnica correta — paciente sentado, braço apoiado na altura do coração, alguns minutos de repouso antes — vale mais do que muitas suposições\", os travessões foram empregados para:","o":["indicar a fala de um personagem em discurso direto.","isolar uma explicação que especifica em que consiste a técnica correta.","separar o sujeito do verbo, como exige a norma-padrão.","introduzir uma conclusão contrária à ideia do período."],"a":1,"c":"Os travessões duplos isolam um trecho intercalado de caráter explicativo, que detalha a 'técnica correta'. Não há diálogo. A norma não exige separar sujeito e verbo; ao contrário, a vírgula entre eles é proibida, e aqui o trecho está apenas intercalado. Também não há conclusão contrária.","id":"b9f1ea1"},{"m":"pt","tp":"Interpretação de texto","nv":2,"tx":"g1","e":"De acordo com o texto, marque V para as afirmativas verdadeiras e F para as falsas.\n( ) A hipertensão não tratada pode causar danos ao coração, aos rins e ao cérebro.\n( ) A confirmação do diagnóstico depende de uma única aferição alterada.\n( ) A melhora dos números da pressão autoriza o paciente a suspender o remédio.\n( ) Para o autor, a orientação feita pelo técnico tem importância comparável à do aparelho.\nA sequência CORRETA é:","o":["V, F, V, V.","F, F, F, V.","V, V, F, V.","V, F, F, V."],"a":3,"c":"1ª: V ('causou estragos no coração, nos rins ou no cérebro'). 2ª: F, pois o texto fala em valor alterado que 'se confirma em diferentes momentos'. 3ª: F, porque a pressão ficou controlada justamente 'porque o tratamento estava funcionando'. 4ª: V ('faz tanto pela saúde daquela pessoa quanto o aparelho').","id":"e85644d"},{"m":"pt","tp":"Gêneros textuais – crônica","nv":1,"tx":"g2","e":"O texto pode ser classificado como crônica, principalmente porque:","o":["apresenta dados estatísticos e fontes oficiais para defender uma tese científica.","tem como finalidade principal instruir o leitor a executar um procedimento, passo a passo.","parte de uma situação do cotidiano para desenvolver uma reflexão pessoal, em linguagem próxima da conversa.","narra acontecimentos fantásticos, com personagens e elementos sobrenaturais."],"a":2,"c":"A crônica é um gênero curto, ligado ao cotidiano (a fila da padaria), geralmente em 1ª pessoa e com tom leve e reflexivo. O texto não traz dados nem fontes, não é instrucional (injuntivo) e não tem elementos fantásticos.","id":"4c172ba"},{"m":"pt","tp":"Figuras de linguagem","nv":1,"tx":"g2","e":"Em \"a padaria da esquina vira uma pequena assembleia\", o autor emprega:","o":["metonímia.","pleonasmo.","eufemismo.","metáfora."],"a":3,"c":"Há uma comparação implícita, sem conectivo comparativo: a padaria é vista como uma assembleia por causa das conversas e discussões. Esse é o conceito de metáfora. Metonímia é a troca de um termo por outro com relação de proximidade. Pleonasmo é redundância, e eufemismo é suavização.","id":"ff5f6c9"},{"m":"pt","tp":"Classes de palavras – 'se'","nv":3,"tx":"g2","e":"No trecho \"O senhor de boné quis saber se eu tinha tomado vacina\", a palavra \"se\" classifica-se como:","o":["pronome reflexivo.","partícula apassivadora.","conjunção condicional.","conjunção integrante."],"a":3,"c":"'Se eu tinha tomado vacina' é oração subordinada substantiva objetiva direta do verbo 'saber' (quis saber o quê?). A conjunção que introduz esse tipo de oração é integrante. Não há ideia de condição ('caso'), de reflexividade ou de voz passiva.","id":"0945e14"},{"m":"pt","tp":"Interpretação de texto","nv":1,"tx":"g2","e":"De acordo com o texto, a mudança de atitude do narrador ocorreu porque ele:","o":["descobriu que o pão da padaria tinha melhorado de qualidade.","fez amizades íntimas na fila, a ponto de convidar todos para seu aniversário.","concluiu que qualquer forma de pressa é sempre prejudicial e deve ser evitada.","percebeu, depois de uma semana afastado, que os frequentadores da fila notaram sua ausência e se preocuparam com ele."],"a":3,"c":"Depois da gripe, a dona da padaria, o senhor de boné e a professora demonstraram atenção ao narrador, que então percebeu fazer parte de 'uma rede frouxa e discreta de atenção'. O texto diz que o pão 'continua o mesmo' e que não se tratava de amizade 'do tipo que se convida para o aniversário'. A última frase não generaliza que toda pressa é prejudicial.","id":"4ceb62e"},{"m":"pt","tp":"Pontuação – ponto e vírgula","nv":2,"tx":"g2","e":"No período \"O senhor de boné discute o resultado do futebol; a professora aposentada comenta o preço do tomate; o rapaz de uniforme da construtora apenas boceja\", o ponto e vírgula foi empregado para:","o":["introduzir uma citação literal da fala dos personagens.","isolar vocativos que se dirigem aos frequentadores da padaria.","separar orações coordenadas que descrevem, em paralelo, as ações de diferentes personagens.","indicar a omissão de um verbo já mencionado anteriormente."],"a":2,"c":"O ponto e vírgula separa orações coordenadas mais longas ou que formam uma enumeração, como as ações de três personagens. A citação seria marcada com dois-pontos e aspas, e o vocativo com vírgula. A omissão de verbo (zeugma) costuma ser marcada por vírgula, e aqui não há omissão.","id":"2745fb5"},{"m":"pt","tp":"Sujeito indeterminado","nv":2,"tx":"g2","e":"No trecho \"Na cidade grande, dizem, ninguém conhece o vizinho\", o sujeito da forma verbal \"dizem\" é:","o":["oculto, correspondente a \"nós\".","inexistente, pois o verbo é impessoal.","indeterminado.","simples, representado por \"ninguém\"."],"a":2,"c":"Com o verbo na 3ª pessoa do plural sem referente no contexto, o sujeito é indeterminado: não se sabe quem diz. 'Dizer' não é verbo impessoal, e 'ninguém' é sujeito de 'conhece', não de 'dizem'.","id":"98c48be"},{"m":"pt","tp":"Interpretação de texto","nv":1,"tx":"g3","e":"O texto defende, principalmente, que:","o":["preservar o patrimônio exige dar novos usos aos imóveis antigos e valorizar a memória dos moradores, sem impedir o crescimento da cidade.","o crescimento das cidades do interior foi negativo e deveria ter sido evitado.","os imóveis antigos devem permanecer fechados, para que não sofram alterações.","a memória oral dos moradores é menos importante que a preservação física dos casarões."],"a":0,"c":"O autor reconhece que o crescimento foi 'em grande parte, positivo' e afirma que preservar 'não significa congelar a cidade no passado'. Também diz que 'prédio fechado se deteriora depressa' e dá papel 'fundamental' aos moradores mais velhos.","id":"f8b8dff"},{"m":"pt","tp":"Concordância verbal","nv":2,"tx":"g3","e":"Em \"Surgiram bairros novos, supermercados, condomínios e avenidas largas\", o verbo está no plural porque:","o":["a oração não tem sujeito, e o verbo fica no plural por eufonia.","concorda com o objeto direto \"bairros novos\".","concorda com o sujeito composto, que está posposto ao verbo.","o verbo \"surgir\" é impessoal e, por isso, admite qualquer flexão."],"a":2,"c":"'Surgir' é intransitivo e tem sujeito: bairros novos, supermercados, condomínios e avenidas largas. É um sujeito composto posposto ao verbo, com o qual o verbo concorda no plural. Verbos intransitivos não têm objeto direto, e 'surgir' não é impessoal.","id":"e6b31c2"},{"m":"pt","tp":"Crase","nv":2,"tx":"g3","e":"No trecho \"Ouvi-los, registrar seus relatos e levá-los às escolas\", o acento grave em \"às\" se justifica porque:","o":["toda palavra feminina no plural deve receber acento grave.","o verbo \"levar\" exige a preposição \"a\", e o substantivo \"escolas\" vem determinado pelo artigo \"as\".","o pronome oblíquo \"los\" torna obrigatório o uso da crase.","trata-se de locução adverbial de tempo formada por palavra feminina."],"a":1,"c":"Crase é a fusão da preposição 'a' com o artigo 'a(s)': levar algo a algum lugar (a + as escolas = às escolas). Nem toda palavra feminina recebe crase, pois é preciso haver preposição e artigo. O pronome não tem relação com isso, e 'às escolas' indica lugar, não tempo.","id":"0b10fef"},{"m":"pt","tp":"Semântica e coesão","nv":3,"tx":"g3","e":"Considere o período \"Prédio fechado se deteriora depressa; prédio ocupado é cuidado por quem o utiliza\" e analise as afirmativas.\nI. Há oposição entre as ideias de \"fechado\" e \"ocupado\", o que caracteriza uma antítese.\nII. A oração \"prédio ocupado é cuidado por quem o utiliza\" está na voz passiva analítica.\nIII. O pronome \"o\", em \"quem o utiliza\", retoma \"prédio ocupado\".\nIV. Em \"se deteriora\", o \"se\" é partícula apassivadora.\nEstão CORRETAS as afirmativas:","o":["I, II e III, apenas.","I e II, apenas.","II, III e IV, apenas.","I, II, III e IV."],"a":0,"c":"I: há antítese entre fechado e ocupado. II: 'é cuidado por quem o utiliza' é passiva analítica (verbo ser + particípio + agente da passiva). III: 'quem o utiliza' significa 'quem utiliza o prédio'. IV está errada: 'deteriorar-se' é verbo pronominal, e o 'se' é parte integrante do verbo, sem sentido passivo.","id":"fc63f87"},{"m":"pt","tp":"Relações semânticas","nv":1,"tx":"g3","e":"Na passagem \"é um patrimônio tão frágil quanto as paredes de adobe que a abrigam\", a expressão \"tão... quanto\" estabelece relação de:","o":["causa.","condição.","comparação.","finalidade."],"a":2,"c":"'Tão... quanto' é estrutura comparativa de igualdade: a memória é tão frágil quanto as paredes de adobe. Não indica motivo (causa), hipótese (condição) nem objetivo (finalidade).","id":"3e1b980"},{"m":"pt","tp":"Orações adjetivas","nv":2,"tx":"g3","e":"Em \"Uma cidade que esquece a própria história corre o risco de se tornar igual a todas as outras\", a oração \"que esquece a própria história\" classifica-se como:","o":["subordinada adjetiva restritiva.","subordinada adjetiva explicativa.","subordinada substantiva objetiva direta.","subordinada adverbial causal."],"a":0,"c":"Introduzida pelo pronome relativo 'que' (= a qual), a oração caracteriza 'cidade' e restringe seu sentido: não é qualquer cidade, mas a que esquece a própria história. Por ser restritiva, não vem entre vírgulas. A explicativa viria isolada por vírgulas e se aplicaria a todos os seres do grupo.","id":"c1a11eb"},{"m":"pt","tp":"Interpretação de texto","nv":1,"tx":"g4","e":"De acordo com o texto, é CORRETO afirmar que:","o":["o prontuário eletrônico eliminou completamente os erros de interpretação nos serviços de saúde.","o compartilhamento de senhas entre colegas agiliza o atendimento sem prejudicar a segurança.","o profissional deve manter a atenção no monitor durante todo o atendimento, para que o registro fique completo.","o compartilhamento de dados pode evitar que pacientes encaminhados a outras cidades repitam exames sem necessidade."],"a":3,"c":"O 2º parágrafo afirma que o compartilhamento de dados 'evita que ele repita exames desnecessariamente'. O texto diz que informações legíveis 'reduzem' erros, e não que os eliminam. Também aponta senhas compartilhadas como risco e critica quem 'não tirou os olhos do monitor'.","id":"0a745d5"},{"m":"pt","tp":"Coesão referencial","nv":2,"tx":"g4","e":"No início do terceiro parágrafo, a expressão \"Nada disso\" retoma:","o":["os riscos de vazamento de dados mencionados no fim do texto.","as pastas de papel guardadas em diferentes serviços.","os benefícios do prontuário eletrônico apresentados no parágrafo anterior.","as senhas compartilhadas e os computadores com sessão aberta."],"a":2,"c":"'Nada disso' é um elemento anafórico que resume o que veio antes: os ganhos citados no 2º parágrafo (informações legíveis, alertas, comunicação ágil, compartilhamento de dados). O autor afirma que esses ganhos dependem de cuidados.","id":"a93e4df"},{"m":"pt","tp":"Concordância – verbo haver","nv":2,"tx":"g4","e":"No trecho \"Os dados de saúde estão entre as informações mais sensíveis que existem\", substituindo-se \"existem\" pelo verbo \"haver\", de acordo com a norma-padrão, obtém-se:","o":["\"...as informações mais sensíveis que hão\".","\"...as informações mais sensíveis que houveram\".","\"...as informações mais sensíveis que há\".","\"...as informações mais sensíveis que haviam\"."],"a":2,"c":"No sentido de 'existir', o verbo 'haver' é impessoal: fica na 3ª pessoa do singular e a oração não tem sujeito. Mantendo-se o presente, a forma é 'há'. 'Hão', 'houveram' e 'haviam' flexionam indevidamente o verbo no plural.","id":"22e6b53"},{"m":"pt","tp":"Tipologia textual","nv":1,"tx":"g4","e":"Quanto à tipologia, predomina no texto a sequência:","o":["narrativa, pois o texto conta uma história com personagens, tempo e espaço definidos.","descritiva, pois o objetivo principal é retratar o aspecto físico de um consultório.","injuntiva, pois o texto é formado por instruções com verbos no imperativo.","dissertativo-argumentativa, pois o autor defende um ponto de vista e o sustenta com argumentos."],"a":3,"c":"O autor defende que a tecnologia traz ganhos, mas exige cuidados e não substitui a atenção ao paciente. Para isso apresenta argumentos (redução de erros, riscos de vazamento etc.) e fecha com uma conclusão. Não há enredo, a descrição não é o objetivo e não há instruções em sequência.","id":"6bf8170"},{"m":"pt","tp":"Sintaxe e crase","nv":3,"tx":"g4","e":"Analise as afirmativas sobre trechos do texto.\nI. Em \"Quem já foi atendido por alguém que não tirou os olhos do monitor sabe como a experiência pode ser fria\", a oração iniciada por \"Quem\" exerce a função de sujeito de \"sabe\".\nII. Em \"anotações feitas às pressas\", o acento grave é empregado porque se trata de locução adverbial de modo formada por palavra feminina.\nIII. Em \"comprometem a segurança e a qualidade do registro\", o verbo está no plural porque concorda apenas com \"anotações\".\nEstão CORRETAS as afirmativas:","o":["I e III, apenas.","I e II, apenas.","II e III, apenas.","I, II e III."],"a":1,"c":"I: 'Quem já foi atendido...' é oração substantiva que funciona como sujeito de 'sabe'. II: locuções adverbiais femininas como 'às pressas', 'às vezes' e 'à noite' recebem acento grave. III está errada: o sujeito é composto (senhas compartilhadas, computadores deixados... e anotações feitas...), e por isso o verbo vai para o plural.","id":"4ccc440"},{"m":"pt","tp":"Coesão referencial","nv":1,"tx":"g5","e":"No segundo parágrafo, a expressão \"Essa impressão\" refere-se à ideia de que:","o":["as veredas funcionam como esponjas que retêm a água da chuva.","o Cerrado seria uma vegetação pobre, que poderia ser substituída sem grandes perdas.","a biodiversidade do Cerrado está concentrada abaixo do solo.","o Cerrado é o berço das águas de rios importantes do país."],"a":1,"c":"'Essa impressão' retoma a frase imediatamente anterior: 'o Cerrado foi visto como uma vegetação pobre [...] que poderia ser substituída sem grandes perdas'. O autor a classifica como falsa e, em seguida, a refuta.","id":"f0797d4"},{"m":"pt","tp":"Figuras de linguagem","nv":2,"tx":"g5","e":"Em \"as veredas [...] funcionam como grandes esponjas\", a figura de linguagem empregada é a:","o":["comparação.","metonímia.","hipérbole.","antítese."],"a":0,"c":"A aproximação entre dois elementos (veredas e esponjas) é feita por um conectivo comparativo explícito, 'como'. Isso caracteriza a comparação (ou símile). Na metáfora, a comparação seria implícita, sem conectivo, como em 'as veredas são esponjas'.","id":"68672dd"},{"m":"pt","tp":"Acentuação gráfica","nv":2,"tx":"g5","e":"A forma verbal \"retêm\", no trecho \"esponjas que retêm a água da chuva\", recebe acento circunflexo porque:","o":["é paroxítona terminada em \"-em\".","é monossílaba tônica terminada em \"-em\".","o Acordo Ortográfico determina que todos os verbos no plural sejam acentuados.","está na 3ª pessoa do plural do presente do indicativo de um verbo derivado de \"ter\"."],"a":3,"c":"Os derivados de 'ter' e 'vir' levam acento agudo na 3ª pessoa do singular ('ele retém') e circunflexo na 3ª do plural ('eles retêm'). 'Retêm' é oxítona, e não paroxítona nem monossílaba, e não existe regra que acentue todos os verbos no plural.","id":"c47dfc8"},{"m":"pt","tp":"Interpretação de texto","nv":2,"tx":"g5","e":"De acordo com o texto, marque V para as afirmativas verdadeiras e F para as falsas.\n( ) A retirada da vegetação nativa reduz a infiltração da água no solo.\n( ) A maior parte da biodiversidade do Cerrado está nas copas das árvores.\n( ) Os períodos secos prolongados podem agravar problemas respiratórios.\n( ) A proteção das nascentes é responsabilidade exclusiva dos órgãos ambientais.\nA sequência CORRETA é:","o":["V, F, V, F.","V, F, V, V.","F, F, V, F.","V, V, V, F."],"a":0,"c":"1ª: V ('a infiltração diminui'). 2ª: F, pois o texto diz que boa parte da biodiversidade 'está abaixo do solo'. 3ª: V (mais queimadas e fumaça agravam problemas respiratórios). 4ª: F, já que 'não são tarefas exclusivas dos órgãos ambientais'.","id":"0a20091"},{"m":"pt","tp":"Vocabulário","nv":1,"tx":"g5","e":"No trecho \"Rios com menor vazão significam menos água nas torneiras das cidades\", a palavra \"vazão\" pode ser substituída, sem alteração de sentido, por:","o":["volume de água que escoa.","profundidade do leito.","grau de poluição.","largura das margens."],"a":0,"c":"Vazão é a quantidade (volume) de água que passa por um ponto em determinado tempo. Rios com menor vazão transportam menos água, o que explica a menor disponibilidade nas torneiras.","id":"d72dcb9"},{"m":"pt","tp":"Interpretação de texto","nv":1,"tx":"g6","e":"Segundo o texto, os especialistas recomendam esfregar as paredes dos recipientes, e não apenas esvaziá-los, porque:","o":["a água parada só se acumula nas paredes dos recipientes.","os ovos do mosquito resistem por meses em ambiente seco e eclodem ao entrar em contato com a água.","o mosquito adulto se esconde nas paredes dos recipientes durante o dia.","o ato de esfregar elimina a necessidade das visitas domiciliares."],"a":1,"c":"O texto liga a recomendação ('Por esse motivo') ao fato de que os ovos 'podem resistir por meses em ambiente seco e eclodem quando entram em contato com a água'. Esvaziar o recipiente não remove os ovos aderidos às paredes.","id":"79463e0"},{"m":"pt","tp":"Crase","nv":2,"tx":"g6","e":"Analise as afirmativas sobre o uso do acento grave em trechos do texto.\nI. Em \"agentes de combate às endemias\", ocorre a fusão da preposição \"a\" com o artigo \"as\".\nII. Em \"Medicamentos à base de ácido acetilsalicílico\", o acento grave ocorre em locução prepositiva de núcleo feminino.\nIII. Em \"dedicados a percorrer a casa\", seria correto usar acento grave antes de \"percorrer\".\nEstá(ão) CORRETA(S) a(s) afirmativa(s):","o":["I, apenas.","I e II, apenas.","II e III, apenas.","I, II e III."],"a":1,"c":"I: combate a + as endemias = às endemias. II: 'à base de' é locução prepositiva com núcleo feminino e leva acento grave. III está errada: não há crase antes de verbo, porque verbo não admite artigo.","id":"ca3ca1b"},{"m":"pt","tp":"Condição","nv":2,"tx":"g6","e":"No trecho \"sem criadouro, não há mosquito\", a expressão \"sem criadouro\" equivale semanticamente a:","o":["\"embora haja criadouro\", com valor de concessão.","\"para que não haja criadouro\", com valor de finalidade.","\"se não houver criadouro\", com valor de condição.","\"quando houver criadouro\", com valor de tempo."],"a":2,"c":"A ausência de criadouro aparece como condição para a ausência do mosquito: 'Se não houver criadouro, não haverá mosquito'. As outras paráfrases mudam o sentido original.","id":"7bfebc0"},{"m":"pt","tp":"Tempos verbais","nv":3,"tx":"g6","e":"No trecho \"Quem apresentar febre deve procurar a unidade de saúde\", a forma verbal \"apresentar\" está flexionada no:","o":["infinitivo impessoal.","futuro do presente do indicativo.","futuro do subjuntivo.","presente do subjuntivo."],"a":2,"c":"Em orações com sentido de hipótese futura ('quem', 'se', 'quando'), usa-se o futuro do subjuntivo: quando eu apresentar, se você apresentar, quem apresentar. Nos verbos regulares ele coincide na forma com o infinitivo, mas a função é outra. O futuro do presente seria 'apresentará', e o presente do subjuntivo, 'apresente'.","id":"63303ce"},{"m":"pt","tp":"Interpretação de texto","nv":1,"tx":"g6","e":"De acordo com o texto, é INCORRETO afirmar que:","o":["a dengue pode evoluir para formas graves.","o sangramento de mucosas é um dos sinais que exigem atendimento imediato.","a maior parte dos focos do mosquito está em terrenos baldios.","medicamentos com ácido acetilsalicílico aumentam o risco de sangramentos."],"a":2,"c":"O texto diz o contrário: a maior parte dos focos está 'dentro das residências ou nos quintais, e não em terrenos baldios, como muitos imaginam'. As demais alternativas reproduzem informações do texto.","id":"3e723ab"},{"m":"pt","tp":"Tipologia textual","nv":2,"tx":"g6","e":"Quanto à tipologia textual, é CORRETO afirmar que o texto é predominantemente:","o":["narrativo, centrado em um conflito vivido por personagens.","descritivo, voltado a caracterizar fisicamente o mosquito.","expositivo, com passagens injuntivas que orientam o leitor sobre o que fazer.","poético, com predomínio da função emotiva da linguagem."],"a":2,"c":"O texto informa sobre criadouros, ovos e sinais de alarme (exposição) e traz recomendações como 'esfregar as paredes', 'procurar a unidade' e 'evitar a automedicação', que são trechos injuntivos. Não há enredo, a descrição do mosquito não é o foco e não se trata de texto poético.","id":"c1e7f25"},{"m":"pt","tp":"Interpretação de texto","nv":1,"tx":"g7","e":"Segundo o texto, Dona Lurdes não caiu no golpe porque:","o":["confirmou a história por outro canal, ligando para o número antigo do neto.","percebeu que a foto enviada era falsa.","recusou-se a abrir mensagens de números desconhecidos.","tinha ativado a verificação em duas etapas no aplicativo."],"a":0,"c":"O texto afirma que ela 'só não caiu no golpe porque decidiu ligar para o número antigo do rapaz', ou seja, confirmou a identidade por outro canal. A foto 'era verdadeira', ela leu a mensagem, e o texto não diz que ela usava verificação em duas etapas.","id":"d2c7460"},{"m":"pt","tp":"Pontuação","nv":2,"tx":"g7","e":"Analise as afirmativas sobre a pontuação do texto.\nI. Em \"A tecnologia, que parecia um território estrangeiro, virou parte da rotina\", as vírgulas isolam uma oração adjetiva explicativa.\nII. O travessão em \"— um da família, um da igreja e outro das amigas do tempo de escola\" introduz uma especificação dos grupos mencionados.\nIII. Em \"Na semana passada, ela recebeu uma mensagem\", a vírgula após o adjunto adverbial deslocado é facultativa, por se tratar de expressão curta.\nEstão CORRETAS as afirmativas:","o":["I, II e III.","I e II, apenas.","I e III, apenas.","II e III, apenas."],"a":0,"c":"I: 'que parecia um território estrangeiro' acrescenta uma informação sobre 'a tecnologia' e é explicativa, por isso vem entre vírgulas. II: o travessão introduz o detalhamento dos três grupos. III: depois de adjunto adverbial curto deslocado para o início da frase, a vírgula é facultativa. As três estão corretas.","id":"bbe0429"},{"m":"pt","tp":"Interpretação de texto","nv":1,"tx":"g7","e":"No último parágrafo, o autor sustenta que, em relação aos idosos e à tecnologia, a melhor atitude é:","o":["proibir o uso do celular, para evitar que sejam vítimas de golpes.","acompanhá-los no uso dos aparelhos, com orientação paciente.","limitar o uso do celular às chamadas de vídeo com a família.","deixar que aprendam sozinhos, com os próprios erros."],"a":1,"c":"'Os mais velhos não precisam ser afastados da tecnologia, mas acompanhados nela. Uma conversa paciente vale mais do que proibir o uso do aparelho.' O autor rejeita a proibição e não sugere limitar o uso nem deixar o idoso sem apoio.","id":"516c5b9"},{"m":"pt","tp":"Inferência","nv":2,"tx":"g7","e":"Do trecho \"Os criminosos exploram a confiança, a pressa e o afeto, e não apenas a falta de conhecimento técnico\", depreende-se que:","o":["somente pessoas sem conhecimento técnico são vítimas de golpes digitais.","mesmo pessoas que dominam a tecnologia podem ser vítimas de golpes, pois estes se apoiam também em fatores emocionais.","a falta de conhecimento técnico não tem nenhuma relação com os golpes.","os golpes digitais acontecem exclusivamente com pessoas idosas."],"a":1,"c":"A expressão 'e não apenas' indica que a falta de conhecimento técnico é um fator, mas não o único. Confiança, pressa e afeto também são explorados, então qualquer pessoa pode ser alvo. As alternativas que dizem 'somente', 'nenhuma relação' e 'exclusivamente' generalizam de forma indevida.","id":"227165b"},{"m":"pt","tp":"Vozes verbais","nv":3,"tx":"g7","e":"Transpondo-se para a voz passiva analítica a oração \"ela recebeu uma mensagem de um número desconhecido\", obtém-se, de acordo com a norma-padrão:","o":["Uma mensagem de um número desconhecido foi recebido por ela.","Uma mensagem de um número desconhecido era recebida por ela.","Uma mensagem de um número desconhecido foi recebida por ela.","Recebeu-se uma mensagem de um número desconhecido por ela."],"a":2,"c":"Na passiva analítica, o objeto direto ('uma mensagem') passa a sujeito, o verbo 'ser' fica no mesmo tempo do verbo original (pretérito perfeito: 'foi') e o particípio concorda com o sujeito ('recebida'). O sujeito original vira agente da passiva ('por ela'). 'Era' muda o tempo verbal, 'recebido' erra a concordância, e a última opção é passiva sintética, além de não ser natural com agente expresso.","id":"b87c3e2"},{"m":"pt","tp":"Interpretação de texto","nv":1,"tx":"g8","e":"Segundo o texto, os idosos estão entre os mais vulneráveis ao calor porque:","o":["costumam se expor mais ao sol do que as pessoas jovens.","a sensação de sede aumenta com o envelhecimento, o que leva ao consumo excessivo de água.","todos os idosos usam diuréticos e têm doenças crônicas.","a sensação de sede diminui e o organismo perde parte da capacidade de regular a temperatura."],"a":3,"c":"O 1º parágrafo traz a explicação 'fisiológica': 'a sensação de sede diminui, e o organismo perde parte da capacidade de regular a própria temperatura'. O texto não fala em maior exposição ao sol, diz que a sede diminui (e não que aumenta) e cita diuréticos e doenças crônicas apenas como fatores que aumentam o risco de 'pessoas que' os têm, e não de todos os idosos.","id":"0c474e3"},{"m":"pt","tp":"Colocação pronominal","nv":2,"tx":"g8","e":"No trecho \"Também se recomenda evitar a exposição ao sol\", a próclise do pronome \"se\" justifica-se:","o":["pela presença do advérbio \"também\", que atrai o pronome.","pelo fato de o verbo iniciar o período.","pelo fato de o verbo estar no futuro do presente.","por se tratar de oração reduzida de infinitivo."],"a":0,"c":"Advérbios antepostos ao verbo, sem pausa, são palavras atrativas e favorecem a próclise: 'também se recomenda'. O verbo não inicia o período, e se iniciasse a próclise seria vedada. 'Recomenda' está no presente do indicativo, e a oração não é reduzida.","id":"c065459"},{"m":"pt","tp":"Pontuação – travessão","nv":1,"tx":"g8","e":"No segundo parágrafo, os termos isolados por travessões (\"boca seca, urina escura e em pequena quantidade, cansaço, tontura\") têm a função de:","o":["apresentar as causas das ondas de calor.","indicar as doenças crônicas que aumentam o risco.","listar as medidas de prevenção recomendadas.","exemplificar os sinais discretos de desidratação mencionados antes."],"a":3,"c":"O trecho entre travessões enumera exemplos dos 'sinais [que] podem ser discretos'. As doenças crônicas e as medidas de prevenção aparecem em outros trechos, e o texto não trata das causas das ondas de calor.","id":"8b56cd5"},{"m":"pt","tp":"Coesão e sintaxe","nv":3,"tx":"g8","e":"Considere o trecho \"Algumas medidas simples ajudam a reduzir os riscos. Oferecer água em intervalos regulares, mesmo sem pedido, é uma delas.\" e analise as afirmativas.\nI. O pronome \"delas\" retoma \"Algumas medidas simples\".\nII. A expressão \"mesmo sem pedido\" tem valor concessivo.\nIII. A oração \"Oferecer água em intervalos regulares\" exerce a função de sujeito de \"é\".\nIV. A expressão \"uma delas\" exerce a função de objeto direto.\nEstão CORRETAS as afirmativas:","o":["I e II, apenas.","II, III e IV, apenas.","I, II, III e IV.","I, II e III, apenas."],"a":3,"c":"I: 'delas' = das medidas simples. II: 'mesmo sem pedido' equivale a 'ainda que não haja pedido', com valor de concessão. III: a oração reduzida de infinitivo funciona como sujeito de 'é'. IV está errada: 'é' é verbo de ligação, e 'uma delas' é predicativo do sujeito, não objeto direto.","id":"710312c"},{"m":"pt","tp":"Semântica – advérbio","nv":2,"tx":"g8","e":"No último período, o advérbio \"literalmente\" é empregado para:","o":["reforçar que a afirmação deve ser entendida em sentido real, e não figurado.","indicar que a frase foi copiada de outro autor.","atenuar a importância de oferecer água aos idosos.","expressar dúvida quanto à eficácia da hidratação."],"a":0,"c":"'Literalmente' significa 'ao pé da letra'. O autor quer mostrar que oferecer água é, de fato, um cuidado de saúde, e não uma figura de linguagem. O advérbio dá ênfase à afirmação; não a atenua, não expressa dúvida e não indica citação.","id":"df99859"},{"m":"pt","tp":"Interpretação – título","nv":1,"tx":"g8","e":"Um título que também seria adequado ao texto, por resumir sua ideia principal, é:","o":["Diuréticos devem ser suspensos durante o verão.","Calor extremo exige atenção redobrada à hidratação dos idosos.","Agentes comunitários substituem o atendimento médico nas ondas de calor.","A sede aumenta com o envelhecimento."],"a":1,"c":"O texto trata do risco de desidratação dos idosos durante ondas de calor e das medidas para preveni-la. Ele não manda suspender diuréticos (fala em seguir a orientação da equipe), não diz que agentes substituem médicos e afirma que a sede diminui com a idade.","id":"60809d0"},{"m":"pt","tp":"Crase","nv":2,"e":"Assinale a alternativa em que o acento indicativo de crase foi empregado INCORRETAMENTE.","o":["O paciente ficou frente à frente com o cirurgião.","Os técnicos chegaram às 7 horas para a passagem de plantão.","Refiro-me à enfermeira responsável pelo turno da noite.","Serviram, no almoço, frango à mineira."],"a":0,"c":"Não há crase entre palavras repetidas: frente a frente, cara a cara, gota a gota. As outras estão certas: horas determinadas ('às 7 horas'), 'referir-se a' + 'a enfermeira', e a expressão 'à moda (mineira)', mesmo com 'moda' subentendida.","id":"a0561ab"},{"m":"pt","tp":"Crase","nv":2,"e":"Assinale a alternativa que preenche CORRETAMENTE as lacunas da frase: \"Entregou o material ___ cada aluno e, ___ partir de hoje, a sala ficará ___ disposição da equipe.\"","o":["à / à / à","a / a / à","a / à / a","à / a / à"],"a":1,"c":"Não há crase antes de 'cada', porque o pronome indefinido não admite artigo. Também não há antes de verbo: 'a partir de'. Já 'à disposição' é locução feminina com acento grave.","id":"6b671fa"},{"m":"pt","tp":"Crase facultativa","nv":2,"e":"Assinale a alternativa em que o uso do acento grave é FACULTATIVO.","o":["Iremos à Bahia nas próximas férias.","Ontem fomos à reunião do conselho de saúde.","Enviei o relatório à minha supervisora.","Todos assistiram à palestra sobre segurança do paciente."],"a":2,"c":"Antes de pronome possessivo feminino no singular, o artigo é opcional ('a minha' ou 'minha'), e por isso a crase também é facultativa. Nas demais é obrigatória: 'ir a + a Bahia' (quem vai à Bahia volta da Bahia), 'ir a + a reunião' e 'assistir (= ver) a + a palestra'.","id":"4395730"},{"m":"pt","tp":"Concordância verbal","nv":1,"e":"Assinale a alternativa que está de acordo com a norma-padrão quanto à concordância verbal.","o":["Houveram muitas reclamações durante o plantão.","Faz dois anos que trabalho nesta unidade de saúde.","Devem haver vagas no próximo processo seletivo.","Fazem três meses que não chove na região."],"a":1,"c":"'Fazer' indicando tempo decorrido e 'haver' com sentido de existir são impessoais e ficam no singular. Isso vale também para o auxiliar que os acompanha: 'deve haver'. O correto seria 'Houve muitas reclamações', 'Deve haver vagas' e 'Faz três meses'.","id":"18ef664"},{"m":"pt","tp":"Concordância verbal","nv":3,"e":"Analise as frases a seguir quanto à concordância verbal.\nI. A maioria dos pacientes chegou cedo à unidade.\nII. Fui eu que fiz o curativo do leito 5.\nIII. Vende-se casas no centro histórico.\nIV. Mais de um técnico participou do treinamento.\nEstão de acordo com a norma-padrão as frases:","o":["I e III, apenas.","II e III, apenas.","I, II, III e IV.","I, II e IV, apenas."],"a":3,"c":"I: com expressão partitiva ('a maioria de'), o verbo pode ficar no singular ou no plural. II: com o pronome relativo 'que', o verbo concorda com o antecedente 'eu' ('fui eu que fiz'). III está errada: é voz passiva sintética, e o verbo concorda com o sujeito 'casas', ficando 'Vendem-se casas'. IV: 'mais de um' leva, em regra, o verbo ao singular.","id":"3ab2ddb"},{"m":"pt","tp":"Concordância nominal","nv":2,"e":"Assinale a alternativa que está de acordo com a norma-padrão quanto à concordância nominal.","o":["Ela mesmo preparou toda a medicação do turno.","As salas de espera estavam meias vazias.","\"Muito obrigado\", disse a enfermeira ao paciente.","É proibida a entrada de acompanhantes na sala de vacina."],"a":3,"c":"Quando o substantivo vem determinado por artigo ('a entrada'), o adjetivo concorda com ele: 'é proibida a entrada'. Sem artigo, seria 'é proibido entrada'. Nas outras, o certo é 'ela mesma' (concorda com o pronome), 'meio vazias' ('meio' é advérbio e não varia) e 'muito obrigada' (a mulher que agradece diz 'obrigada').","id":"1e8646d"},{"m":"pt","tp":"Regência verbal","nv":2,"e":"Assinale a alternativa que está de acordo com a norma-padrão quanto à regência verbal.","o":["Prefiro trabalhar de dia do que à noite.","Os alunos assistiram ao vídeo sobre higienização das mãos.","O paciente esqueceu do horário da consulta.","O técnico namora com a recepcionista do laboratório."],"a":1,"c":"'Assistir', no sentido de ver ou presenciar, é transitivo indireto e pede a preposição 'a' ('assistir ao vídeo'). Nas demais, a norma pede 'preferir uma coisa a outra' ('Prefiro trabalhar de dia a trabalhar à noite'), 'esquecer o horário' ou 'esquecer-se do horário' e 'namorar alguém', sem preposição.","id":"43d7e65"},{"m":"pt","tp":"Regência verbal","nv":3,"e":"Quanto à regência verbal, marque V para as frases de acordo com a norma-padrão e F para as que estão em desacordo.\n( ) O programa visa à redução da mortalidade infantil.\n( ) A equipe chegou no hospital antes das 8 horas.\n( ) Informamos aos usuários que a unidade ficará fechada no feriado.\n( ) O servidor aspira o cargo de coordenador.\nA sequência CORRETA é:","o":["V, F, V, F.","V, V, V, F.","F, F, V, V.","V, F, F, F."],"a":0,"c":"1ª: V, porque 'visar' no sentido de pretender é transitivo indireto ('visar a') e o encontro com o artigo gera crase. 2ª: F, porque na norma-padrão 'chegar' pede a preposição 'a' ('chegou ao hospital'). 3ª: V, pois 'informar' admite a construção 'informar algo a alguém'. 4ª: F, já que 'aspirar' no sentido de desejar pede 'a' ('aspira ao cargo').","id":"682f543"},{"m":"pt","tp":"Regência – pronome relativo","nv":3,"e":"Assinale a alternativa em que o pronome relativo está empregado de acordo com a norma-padrão quanto à regência.","o":["Este é o hospital que trabalhei durante dez anos.","Este é o protocolo de que lhe falei ontem.","A vacina que me referi chegou ontem à unidade.","O cargo que ele aspira exige curso técnico."],"a":1,"c":"A preposição exigida pelo verbo deve vir antes do relativo. 'Falar de algo' resulta em 'de que lhe falei'. O correto nas outras seria 'em que trabalhei' (trabalhar em), 'a que me referi' (referir-se a) e 'a que ele aspira' (aspirar a).","id":"ba45d1f"},{"m":"pt","tp":"Colocação pronominal","nv":1,"e":"Assinale a alternativa INCORRETA quanto à colocação pronominal, de acordo com a norma-padrão.","o":["Quem lhe contou a novidade?","Ninguém me avisou sobre a reunião.","Disseram-me que a escala mudou.","Me disseram que o plantão foi alterado."],"a":3,"c":"A norma-padrão não admite iniciar a frase com pronome oblíquo átono, o que exige 'Disseram-me'. Nas demais, a próclise é atraída pelo pronome interrogativo 'quem' e pelo pronome indefinido negativo 'ninguém', e a ênclise em 'Disseram-me' está correta.","id":"69d879f"},{"m":"pt","tp":"Colocação pronominal","nv":3,"e":"Assinale a alternativa em que a colocação do pronome oblíquo átono está de acordo com a norma-padrão.","o":["Farei-lhe uma visita amanhã à tarde.","Se deve lavar as mãos antes de cada procedimento.","Aqui se aplicam as vacinas do calendário de rotina.","Não preocupe-se com o resultado do exame."],"a":2,"c":"O advérbio 'aqui' atrai o pronome, e a próclise está correta. Nas demais: com verbo no futuro do presente não se usa ênclise (o certo é 'Far-lhe-ei' ou, com palavra atrativa, próclise); não se inicia frase com pronome átono ('Deve-se lavar'); e a palavra negativa 'não' exige próclise ('Não se preocupe').","id":"cd2096b"},{"m":"pt","tp":"Pontuação – vírgula","nv":1,"e":"Assinale a alternativa em que a vírgula foi empregada INCORRETAMENTE.","o":["Os técnicos de enfermagem do turno da noite, chegaram atrasados.","Paracatu, cidade histórica do noroeste mineiro, recebe muitos visitantes.","Ontem à noite, a equipe atendeu vinte pacientes.","Comprei gaze, esparadrapo, luvas e álcool."],"a":0,"c":"Não se separa o sujeito ('Os técnicos de enfermagem do turno da noite') do verbo ('chegaram') por vírgula. Nas demais, as vírgulas isolam um aposto explicativo, marcam um adjunto adverbial deslocado e separam os itens de uma enumeração.","id":"5914a98"},{"m":"pt","tp":"Pontuação – vocativo e aposto","nv":2,"e":"Analise as afirmativas sobre pontuação.\nI. Em \"Doutor, o paciente do leito 2 acordou\", o termo \"Doutor\" é vocativo e deve ser separado por vírgula.\nII. Em \"Joana, a técnica do posto, organizou a campanha\", o termo entre vírgulas é um vocativo.\nIII. Em \"Os pacientes que estavam em jejum foram encaminhados ao laboratório\", a inserção de vírgulas antes de \"que\" e depois de \"jejum\" alteraria o sentido da frase.\nEstão CORRETAS as afirmativas:","o":["I e III, apenas.","I e II, apenas.","II e III, apenas.","I, II e III."],"a":0,"c":"I: o vocativo (chamamento) é isolado por vírgula. II está errada: 'a técnica do posto' é aposto explicativo, porque explica quem é Joana; não é um chamamento ao interlocutor. III: sem vírgulas, a oração é restritiva e indica que só os pacientes em jejum foram encaminhados. Com vírgulas, passaria a explicativa e daria a entender que todos os pacientes estavam em jejum e foram encaminhados, o que muda o sentido.","id":"206c4bc"},{"m":"pt","tp":"Acordo Ortográfico","nv":1,"e":"De acordo com o Acordo Ortográfico vigente, todas as palavras estão corretamente grafadas na alternativa:","o":["ideia – voo – enjoo – assembleia","ideia – vôo – enjoo – assembleia","idéia – voo – enjoo – assembleia","ideia – voo – enjoo – assembléia"],"a":0,"c":"O Acordo eliminou o acento dos ditongos abertos 'ei' e 'oi' nas paroxítonas ('ideia', 'assembleia') e o circunflexo do hiato 'oo' ('voo', 'enjoo'). Cada distrator mantém um acento que caiu.","id":"2ba3a4b"},{"m":"pt","tp":"Acentuação gráfica","nv":2,"e":"Assinale a alternativa em que todas as palavras são acentuadas pela mesma regra.","o":["fácil – café – saúde","médico – vírus – avó","também – lâmpada – até","saúde – baú – país"],"a":3,"c":"Em 'saúde', 'baú' e 'país', o acento marca o 'i' ou o 'u' tônico em hiato, sozinho na sílaba ou seguido de 's'. Nos outros grupos as regras se misturam: 'fácil' é paroxítona terminada em 'l', 'médico' e 'lâmpada' são proparoxítonas, 'vírus' é paroxítona terminada em 'us', e 'café', 'avó', 'também' e 'até' são oxítonas.","id":"cf946bf"},{"m":"pt","tp":"Hífen – Acordo Ortográfico","nv":3,"e":"De acordo com o Acordo Ortográfico vigente, todas as palavras estão corretamente grafadas na alternativa:","o":["auto-estima – antissocial – micro-ondas – contrarregra","autoestima – anti-social – microondas – contrarregra","autoestima – antissocial – micro-ondas – contrarregra","autoestima – antissocial – microondas – contra-regra"],"a":2,"c":"Pelo Acordo, quando o prefixo termina em vogal e a palavra seguinte começa com 'r' ou 's', não há hífen e a consoante é dobrada ('antissocial', 'contrarregra'). Quando o prefixo termina na mesma vogal que inicia a palavra seguinte, usa-se hífen ('micro-ondas'). Quando o prefixo termina em vogal e a palavra começa com vogal diferente, a grafia é aglutinada ('autoestima').","id":"1f69574"},{"m":"pt","tp":"Classes de palavras","nv":2,"e":"Na frase \"A técnica chegou bastante cansada ao fim do plantão\", a palavra \"bastante\" classifica-se como:","o":["adjetivo.","advérbio.","pronome indefinido.","substantivo."],"a":1,"c":"'Bastante' intensifica o adjetivo 'cansada' e, nesse caso, é advérbio de intensidade e não varia. Seria pronome indefinido ou adjetivo, variando, se acompanhasse um substantivo: 'bastantes pacientes'.","id":"4f0c799"},{"m":"pt","tp":"Classes de palavras – 'meio'","nv":2,"e":"Assinale a alternativa em que a palavra \"meio\" está empregada de acordo com a norma-padrão.","o":["A paciente estava meia tonta depois da medicação.","A porta da sala de curativos ficou meio aberta.","Ela bebeu meio garrafa de água durante a consulta.","O atendimento recomeçou ao meio-dia e meio."],"a":1,"c":"Como advérbio ('um pouco'), 'meio' não varia: 'meio aberta', 'meio tonta'. Como numeral ('metade'), concorda com o substantivo: 'meia garrafa', 'meio-dia e meia (hora)'.","id":"c36cb62"},{"m":"pt","tp":"Conjunções","nv":2,"e":"Assinale a alternativa em que a oração destacada entre aspas expressa ideia de CONSEQUÊNCIA.","o":["Saiu mais cedo, \"pois tinha plantão à noite\".","\"Caso falte energia\", acione o gerador.","Choveu tanto \"que a estrada ficou interditada\".","Estudou muito \"para que fosse aprovado\"."],"a":2,"c":"A estrutura 'tanto... que' introduz oração consecutiva: a interdição da estrada é consequência da chuva intensa. Nas demais, há causa ou explicação ('pois'), condição ('caso') e finalidade ('para que').","id":"c30f777"},{"m":"pt","tp":"Conjunções coordenativas","nv":3,"e":"Numere a COLUNA II de acordo com a COLUNA I, relacionando o tipo de conjunção coordenativa à frase.\nCOLUNA I\n1. Adversativa\n2. Conclusiva\n3. Explicativa\n4. Alternativa\nCOLUNA II\n( ) Tome o remédio, porque a febre voltou.\n( ) Ou você chega cedo, ou perde a vaga.\n( ) Estudou bastante; logo, será aprovado.\n( ) Estava cansada, mas terminou o plantão.\nAssinale a sequência CORRETA.","o":["3, 4, 2, 1","3, 2, 4, 1","1, 4, 2, 3","2, 4, 3, 1"],"a":0,"c":"Na primeira frase, 'porque' depois de verbo no imperativo justifica a ordem e é explicativo (3). 'Ou... ou' é alternativa (4). 'Logo', entre vírgulas e depois de ponto e vírgula, é conclusivo (2). 'Mas' é adversativo (1).","id":"6358141"},{"m":"pt","tp":"Vozes verbais","nv":2,"e":"Assinale a alternativa em que o verbo está na voz passiva sintética.","o":["Vendem-se medicamentos genéricos nesta farmácia.","A técnica feriu-se com a agulha.","Precisa-se de técnicos de enfermagem.","O paciente foi atendido pela equipe."],"a":0,"c":"A passiva sintética usa verbo transitivo direto + partícula apassivadora 'se', e o verbo concorda com o sujeito ('medicamentos genéricos são vendidos'). 'Feriu-se' é voz reflexiva. Em 'Precisa-se de', o verbo é transitivo indireto e o 'se' é índice de indeterminação do sujeito. 'Foi atendido' é passiva analítica.","id":"d29f9bb"},{"m":"pt","tp":"Vozes verbais","nv":1,"e":"Transpondo-se para a voz passiva analítica a oração \"A secretaria publicará o edital amanhã\", obtém-se:","o":["O edital foi publicado pela secretaria amanhã.","O edital será publicado pela secretaria amanhã.","O edital seria publicado pela secretaria amanhã.","Publicar-se-á o edital amanhã."],"a":1,"c":"O verbo 'ser' deve ficar no mesmo tempo do verbo original, o futuro do presente ('publicará'), o que dá 'será publicado'. O objeto 'o edital' vira sujeito e 'a secretaria' vira agente da passiva. A última opção é passiva sintética e perdeu o agente.","id":"0163664"},{"m":"pt","tp":"Figuras de linguagem","nv":1,"e":"Na frase \"Já chorei rios de lágrimas por esse amor\", há uma figura de linguagem denominada:","o":["hipérbole.","eufemismo.","ironia.","metonímia."],"a":0,"c":"Hipérbole é o exagero intencional para dar expressividade: ninguém chora 'rios' de lágrimas. Eufemismo suaviza, ironia diz o contrário do que se pensa e metonímia troca um termo por outro com o qual mantém relação de proximidade.","id":"978c548"},{"m":"pt","tp":"Figuras de linguagem","nv":2,"e":"Assinale a alternativa em que a figura de linguagem está CORRETAMENTE identificada.","o":["\"Ela é uma flor de pessoa.\" – hipérbole.","\"Subiu para cima com pressa.\" – antítese.","\"Bebeu um copo de água antes da prova.\" – metonímia (o continente pelo conteúdo).","\"O vento sussurrava nas janelas.\" – eufemismo."],"a":2,"c":"Bebe-se a água, e não o copo, que é o recipiente; a troca do conteúdo pelo continente é um caso de metonímia. Nas demais, 'flor de pessoa' é metáfora, 'subir para cima' é pleonasmo vicioso e 'o vento sussurrava' é prosopopeia (personificação).","id":"ca4a03c"},{"m":"pt","tp":"Gêneros textuais","nv":1,"e":"O gênero textual em que predomina a sequência injuntiva, com verbos no imperativo e orientações em etapas para o leitor, é:","o":["a crônica.","a notícia.","o conto.","a receita culinária."],"a":3,"c":"Textos injuntivos (instrucionais) orientam o leitor a fazer algo: receitas, manuais, bulas na parte de posologia e regulamentos. Crônica e conto são predominantemente narrativos, e a notícia é narrativa e expositiva.","id":"463920f"},{"m":"pt","tp":"Gêneros textuais","nv":2,"e":"Analise as afirmativas sobre gêneros textuais.\nI. A notícia relata um fato recente, de interesse público, em linguagem predominantemente objetiva.\nII. O editorial expressa a opinião do veículo de comunicação sobre um assunto.\nIII. A crônica costuma partir de fatos do cotidiano, em linguagem leve e, muitas vezes, com tom reflexivo ou humorístico.\nEstão CORRETAS as afirmativas:","o":["I, II e III.","I e II, apenas.","I e III, apenas.","II e III, apenas."],"a":0,"c":"As três estão corretas. A notícia é informativa e objetiva. O editorial é texto opinativo, normalmente sem assinatura, que representa a posição do jornal. A crônica trata do cotidiano em linguagem leve, com reflexão ou humor.","id":"cdd833d"},{"m":"pt","tp":"Coesão – ambiguidade","nv":2,"e":"Assinale a alternativa em que o emprego do pronome provoca AMBIGUIDADE.","o":["O médico, atrasado para a cirurgia, despediu-se do enfermeiro.","O médico disse ao enfermeiro que ele estava atrasado.","A enfermeira pediu ao paciente que ela mesma fosse avisada do resultado.","O enfermeiro avisou o médico de que o paciente dele havia piorado e pediu sua presença imediata ao médico."],"a":1,"c":"Em 'que ele estava atrasado', o pronome 'ele' pode se referir tanto ao médico quanto ao enfermeiro, o que deixa a frase ambígua. Nas demais o contexto define o referente (o aposto 'atrasado para a cirurgia' refere-se ao médico; 'ela mesma' refere-se à enfermeira). A última é redundante, mas não ambígua, porque o pedido de presença é feito expressamente ao médico.","id":"eb2964c"},{"m":"pt","tp":"Pronomes demonstrativos","nv":3,"e":"Assinale a alternativa que preenche CORRETAMENTE as lacunas: \"Saúde e educação são prioridades do município: ___ depende de bons professores; ___, de equipes bem treinadas.\"","o":["essa / esta","aquela / esta","isso / aquilo","esta / aquela"],"a":3,"c":"Para retomar dois termos já citados, 'este/esta' remete ao mais próximo ('educação') e 'aquele/aquela' ao mais distante ('saúde'). Assim, a educação (esta) depende de professores, e a saúde (aquela), de equipes treinadas. 'Isso' e 'aquilo' são invariáveis e não retomam termos específicos dessa forma.","id":"3fd5c8f"},{"m":"pt","tp":"Ortografia – mal/mau","nv":1,"e":"Assinale a alternativa em que a palavra destacada entre aspas está empregada CORRETAMENTE.","o":["Ele é um \"mal\" profissional, pois chega sempre atrasado.","O \"mau\" da doença foi descoberto tarde.","Acordou de \"mal\" humor e não quis tomar o café.","O paciente passou \"mal\" durante a madrugada."],"a":3,"c":"'Mal' é advérbio, antônimo de 'bem' (passou mal / passou bem), ou substantivo ('o mal da doença'). 'Mau' é adjetivo, antônimo de 'bom' ('mau profissional', 'mau humor'). Dica: troque por 'bem' ou 'bom'.","id":"f6e6955"},{"m":"pt","tp":"Ortografia – há/a","nv":1,"e":"Assinale a alternativa que preenche CORRETAMENTE as lacunas: \"Trabalho nesta unidade ___ cinco anos e, daqui ___ dois meses, mudarei de setor.\"","o":["a / há","há / há","à / a","há / a"],"a":3,"c":"Para tempo passado usa-se 'há' (verbo haver, equivale a 'faz'): 'há cinco anos'. Para tempo futuro ou distância usa-se a preposição 'a': 'daqui a dois meses'.","id":"434c5c1"},{"m":"pt","tp":"Parônimos","nv":3,"e":"Assinale a alternativa em que a palavra destacada entre aspas está empregada de acordo com seu sentido correto.","o":["O juiz \"infringiu\" uma pena severa ao réu.","O motorista \"infringiu\" a lei de trânsito ao avançar o sinal.","O paciente foi \"descriminado\" por causa de sua doença.","A chegada da frente fria era \"eminente\", segundo a meteorologia."],"a":1,"c":"'Infringir' é violar ou desrespeitar (uma lei), e 'infligir' é aplicar (uma pena). 'Discriminar' é tratar com preconceito, e 'descriminar' é deixar de considerar crime. 'Iminente' é o que está prestes a acontecer, e 'eminente' é o que é ilustre ou elevado.","id":"64e2a0f"},{"m":"rl","tp":"Negação – conjunção","nv":1,"e":"A negação lógica da proposição \"Ana é técnica e Bruno é enfermeiro\" é:","o":["Ana não é técnica e Bruno não é enfermeiro.","Ana é técnica ou Bruno não é enfermeiro.","Ana não é técnica ou Bruno não é enfermeiro.","Se Ana não é técnica, então Bruno não é enfermeiro."],"a":2,"c":"Pela lei de De Morgan, ~(p ∧ q) ≡ ~p ∨ ~q: nega-se cada parte e troca-se 'e' por 'ou'. Negar as duas partes e manter o 'e' é o erro mais comum.","id":"5f782a7"},{"m":"rl","tp":"Negação – disjunção","nv":1,"e":"A negação lógica da proposição \"Carlos estuda ou trabalha\" é:","o":["Carlos não estuda ou não trabalha.","Carlos estuda e trabalha.","Carlos não estuda e não trabalha.","Se Carlos não estuda, então trabalha."],"a":2,"c":"Pela lei de De Morgan, ~(p ∨ q) ≡ ~p ∧ ~q. Para negar 'estuda ou trabalha', é preciso afirmar que ele não faz nenhuma das duas coisas.","id":"1b00745"},{"m":"rl","tp":"Negação – quantificadores","nv":2,"e":"A negação da proposição \"Nenhum paciente faltou à consulta\" é:","o":["Algum paciente faltou à consulta.","Todos os pacientes faltaram à consulta.","Nenhum paciente compareceu à consulta.","Algum paciente não faltou à consulta."],"a":0,"c":"'Nenhum A é B' se nega com 'Algum A é B'. Basta um paciente ter faltado para a afirmação original ser falsa. 'Todos faltaram' é afirmação mais forte do que o necessário, e não é a negação.","id":"8ebd333"},{"m":"rl","tp":"Equivalência – condicional","nv":2,"e":"Uma proposição logicamente equivalente a \"Se estudo, então sou aprovado\" é:","o":["Estudo e não sou aprovado.","Se sou aprovado, então estudo.","Não estudo ou sou aprovado.","Se não estudo, então não sou aprovado."],"a":2,"c":"Vale a equivalência p → q ≡ ~p ∨ q. 'Estudo e não sou aprovado' é a negação. 'Se sou aprovado, então estudo' (recíproca) e 'Se não estudo, então não sou aprovado' (inversa) não são equivalentes ao condicional original.","id":"ccf58ec"},{"m":"rl","tp":"Bicondicional","nv":3,"e":"A proposição \"Vou ao plantão se, e somente se, for escalado\" é equivalente a:","o":["Vou ao plantão ou fui escalado.","Se vou ao plantão, então fui escalado.","Se vou ao plantão, então fui escalado, e, se fui escalado, então vou ao plantão.","Vou ao plantão e não fui escalado."],"a":2,"c":"O bicondicional p ↔ q equivale a (p → q) ∧ (q → p): os dois condicionais, nos dois sentidos. Um condicional só, em um sentido, não basta.","id":"7c5dd81"},{"m":"rl","tp":"Tabela-verdade","nv":1,"e":"Uma proposição composta formada por 4 proposições simples distintas tem uma tabela-verdade com quantas linhas?","o":["4","8","32","16"],"a":3,"c":"O número de linhas é 2^n, em que n é a quantidade de proposições simples: 2^4 = 16.","id":"8843466"},{"m":"rl","tp":"Condicional","nv":1,"e":"A proposição condicional \"Se p, então q\" (p → q) é FALSA somente quando:","o":["p é verdadeira e q é falsa.","p é falsa e q é verdadeira.","p e q são falsas.","p e q são verdadeiras."],"a":0,"c":"O condicional só é falso no caso 'Vera Fischer' (V → F = F): antecedente verdadeiro e consequente falso. Nos demais casos é verdadeiro.","id":"8b20b0d"},{"m":"rl","tp":"Valor lógico","nv":2,"e":"Sabe-se que p é verdadeira, q é falsa e r é verdadeira. Assinale a alternativa que apresenta uma proposição VERDADEIRA.","o":["(p ∧ q) → r","p → q","q ∨ ~r","~p ↔ r"],"a":0,"c":"(p ∧ q) = V ∧ F = F, e F → V = V. As demais: p → q = V → F = F; q ∨ ~r = F ∨ F = F; ~p ↔ r = F ↔ V = F.","id":"dfb39c7"},{"m":"rl","tp":"Tautologia","nv":1,"e":"É uma tautologia a proposição:","o":["p ∨ ~p","p ∧ ~p","p → ~p","p ∨ q"],"a":0,"c":"p ∨ ~p é sempre verdadeira, seja p verdadeira ou falsa (princípio do terceiro excluído). p ∧ ~p é sempre falsa (contradição). p → ~p e p ∨ q dependem dos valores das proposições (contingências).","id":"fa32e61"},{"m":"rl","tp":"Conectivos","nv":2,"e":"Sobre os conectivos lógicos, marque V para verdadeiro e F para falso.\n( ) A conjunção p ∧ q é verdadeira apenas quando p e q são verdadeiras.\n( ) A disjunção p ∨ q é falsa apenas quando p e q são falsas.\n( ) O condicional p → q é verdadeiro sempre que p é falsa.\n( ) O bicondicional p ↔ q é verdadeiro quando p e q têm valores lógicos diferentes.\nA sequência CORRETA é:","o":["V, V, V, F.","V, V, F, F.","V, F, V, F.","F, V, V, V."],"a":0,"c":"As três primeiras são as regras da conjunção, da disjunção e do condicional (com antecedente falso, o condicional é sempre verdadeiro). A quarta é falsa: o bicondicional é verdadeiro quando p e q têm o mesmo valor lógico.","id":"f45a21d"},{"m":"rl","tp":"Disjunção exclusiva","nv":2,"e":"A proposição \"Ou Pedro é médico, ou Pedro é dentista\", entendida como disjunção exclusiva, é verdadeira quando:","o":["as duas proposições simples são verdadeiras.","exatamente uma das proposições simples é verdadeira.","as duas proposições simples são falsas.","pelo menos uma das proposições simples é verdadeira."],"a":1,"c":"No 'ou... ou' exclusivo (p ⊻ q), apenas uma das partes pode ser verdadeira. Se as duas forem verdadeiras ou as duas falsas, a proposição é falsa. 'Pelo menos uma' descreve a disjunção inclusiva (∨).","id":"d09337f"},{"m":"rl","tp":"Silogismo","nv":2,"e":"Considere as premissas: \"Todo enfermeiro é profissional de saúde\" e \"Nenhum profissional de saúde é sedentário\". Analise as conclusões.\nI. Nenhum enfermeiro é sedentário.\nII. Nenhum sedentário é enfermeiro.\nIII. Todo profissional de saúde é enfermeiro.\nDecorre(m) necessariamente das premissas:","o":["I, apenas.","III, apenas.","I, II e III.","I e II, apenas."],"a":3,"c":"No diagrama, o conjunto dos enfermeiros está dentro do conjunto dos profissionais de saúde, que não tem nenhum ponto em comum com o dos sedentários. Logo, enfermeiros e sedentários também não se cruzam, o que confirma I e II (são a mesma relação). III não decorre, porque pode haver profissionais de saúde que não são enfermeiros.","id":"9868778"},{"m":"rl","tp":"Silogismo – diagramas","nv":3,"e":"Sabe-se que \"Todos os A são B\" e que \"Alguns B são C\". Com base apenas nessas informações, é CORRETO afirmar que:","o":["alguns A são C.","nenhum A é C.","todos os C são A.","nada se pode concluir com certeza sobre a relação entre A e C."],"a":3,"c":"A parte de B que coincide com C pode estar dentro ou fora do conjunto A. Há diagramas possíveis em que A e C se cruzam e outros em que não se cruzam, então nenhuma das relações é garantida.","id":"93cf0ac"},{"m":"rl","tp":"Silogismo – diagramas","nv":2,"e":"Considere verdadeiras as proposições \"Alguns médicos são professores\" e \"Todos os professores são leitores\". Então, necessariamente:","o":["alguns médicos são leitores.","todos os médicos são leitores.","todos os leitores são professores.","nenhum médico é leitor."],"a":0,"c":"Os médicos que são professores estão dentro do conjunto dos professores, que está contido no dos leitores. Logo, esses médicos são leitores, e 'alguns médicos são leitores' é verdade. As outras conclusões não decorrem das premissas.","id":"c06aca4"},{"m":"rl","tp":"Argumentação – modus tollens","nv":1,"e":"Considere as premissas: \"Se chove, a feira é cancelada\" e \"A feira não foi cancelada\". Conclui-se, de forma válida, que:","o":["choveu.","a feira foi adiada.","nada se pode concluir.","não choveu."],"a":3,"c":"Pelo modus tollens, de p → q e ~q conclui-se ~p. Se tivesse chovido, a feira teria sido cancelada. Como não foi cancelada, não choveu.","id":"b363b37"},{"m":"rl","tp":"Argumentação – encadeamento","nv":2,"e":"Considere verdadeiras as proposições: \"Se Ana vai ao posto, Bia fica na recepção\"; \"Se Bia fica na recepção, Caio aplica vacinas\"; \"Caio não aplicou vacinas\". Pode-se concluir que:","o":["Ana foi ao posto e Bia ficou na recepção.","Ana não foi ao posto e Bia não ficou na recepção.","Ana foi ao posto, mas Bia não ficou na recepção.","Bia ficou na recepção, mas Ana não foi ao posto."],"a":1,"c":"Partindo do fato de que Caio não aplicou vacinas: pela 2ª premissa, Bia não ficou na recepção (modus tollens). Com isso, pela 1ª premissa, Ana não foi ao posto.","id":"a4ee3f8"},{"m":"rl","tp":"Argumentação – falácia","nv":2,"e":"Considere o argumento: \"Se estudo, passo no concurso. Passei no concurso. Logo, estudei.\" Sobre esse argumento, é CORRETO afirmar que é:","o":["inválido, pois a conclusão não decorre necessariamente das premissas.","válido, pois aplica corretamente o modus ponens.","válido, pois aplica corretamente o modus tollens.","inválido, pois as premissas são contraditórias."],"a":0,"c":"É a falácia da afirmação do consequente: de p → q e q não se conclui p, porque a pessoa pode ter passado por outro motivo. O modus ponens seria 'estudei, logo passei'. As premissas não são contraditórias.","id":"e8bec61"},{"m":"rl","tp":"Sequências numéricas","nv":1,"e":"Observe a sequência: 3, 7, 15, 31, 63, ... O próximo termo é:","o":["95","126","127","129"],"a":2,"c":"Cada termo é o dobro do anterior mais 1: 3·2+1 = 7, 7·2+1 = 15, ..., 63·2+1 = 127. As diferenças entre os termos também dobram: 4, 8, 16, 32, 64.","id":"ce92b30"},{"m":"rl","tp":"Sequências de letras","nv":3,"e":"Considerando o alfabeto de 26 letras, observe a sequência: A, C, F, J, O, ... A próxima letra é:","o":["T","V","U","S"],"a":2,"c":"As posições são 1, 3, 6, 10, 15, com saltos de +2, +3, +4, +5. O próximo salto é +6, o que leva à posição 21, que é a letra U.","id":"08f038a"},{"m":"rl","tp":"Sequências numéricas","nv":2,"e":"Observe a sequência: 2, 3, 5, 9, 17, ... O próximo termo é:","o":["25","33","31","34"],"a":1,"c":"As diferenças são 1, 2, 4, 8, cada uma o dobro da anterior. A próxima diferença é 16, e 17 + 16 = 33. Também se pode ver que cada termo é o dobro do anterior menos 1.","id":"397feba"},{"m":"rl","tp":"Sequências – padrão
