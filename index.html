 autoridade ou servidores públicos.\n( ) É permitido ao Município criar preferências entre brasileiros quando houver interesse local justificado.\nA sequência CORRETA é:","o":["V, F, V, F.","V, V, V, F.","F, F, V, V.","V, F, F, F."],"a":0,"c":"1ª V (art. 10, II). 2ª F: o inciso I ressalva, na forma da lei, a colaboração de interesse público. 3ª V (art. 10, V). 4ª F: é vedado criar distinções entre brasileiros ou preferência entre si (art. 10, III), sem exceção.","f":"LO Paracatu, art. 10","id":"5765e8e"},{"m":"lm","tp":"Lei Orgânica – Poder Municipal e participação","nv":1,"e":"Analise as afirmativas a seguir, de acordo com a Lei Orgânica do Município de Paracatu:\nI. O povo exerce o poder também pela iniciativa popular em projetos de emenda à Lei Orgânica e de interesse específico do Município, da cidade ou de bairros.\nII. A criança e o adolescente são considerados prioridade absoluta do Município.\nIII. Somente partidos políticos e associações são parte legítima para denunciar irregularidades à Câmara Municipal.\nIV. O Legislativo e o Executivo tomarão a iniciativa de propor a convocação de plebiscitos antes de proceder à discussão e aprovação de obras de valor elevado ou de significativo impacto ambiental.\nEstão CORRETAS as afirmativas:","o":["I e II, apenas.","I, II e IV, apenas.","II, III e IV, apenas.","I, II, III e IV."],"a":1,"c":"I – art. 11, § 1º, II. II – art. 12, parágrafo único. IV – art. 15. III está errada: qualquer munícipe, partido político, associação ou entidade é parte legítima para denunciar irregularidades à Câmara e aos órgãos do Executivo (art. 16).","f":"LO Paracatu, arts. 11, 12, 15 e 16","id":"906bb1c"},{"m":"lm","tp":"Lei Orgânica – Vereadores","nv":1,"e":"Segundo a Lei Orgânica de Paracatu, a idade mínima exigida como condição de elegibilidade é de:","o":["18 anos para Vereador e 21 anos para Prefeito e Vice-Prefeito.","18 anos para Vereador, para Prefeito e para Vice-Prefeito.","18 anos para Vereador e 30 anos para Prefeito e Vice-Prefeito.","21 anos para Vereador, para Prefeito e para Vice-Prefeito."],"a":0,"c":"Art. 18, VII: idade mínima de 18 anos para Vereador. Art. 72: ao Prefeito e ao Vice aplicam-se as condições dos incisos I a VI do art. 18, além da idade mínima de 21 anos.","f":"LO Paracatu, arts. 18 e 72","id":"88e4ec1"},{"m":"lm","tp":"Lei Orgânica – Câmara Municipal","nv":1,"e":"Salvo disposição em contrário da Lei Orgânica de Paracatu, as deliberações da Câmara Municipal serão tomadas:","o":["por maioria de votos, presente um terço de seus membros.","por dois terços dos votos, presente a maioria absoluta de seus membros.","por maioria absoluta de votos, presente a totalidade de seus membros.","por maioria de votos, presente a maioria absoluta de seus membros."],"a":3,"c":"Regra geral do art. 20: maioria de votos, presente a maioria absoluta dos membros. As reuniões também só podem ser abertas com a presença da maioria absoluta (art. 31).","f":"LO Paracatu, arts. 20 e 31","id":"786b69e"},{"m":"lm","tp":"Lei Orgânica – Posse dos vereadores","nv":2,"e":"Sobre a posse dos Vereadores na Lei Orgânica de Paracatu, marque V para verdadeiro e F para falso:\n( ) Assume a presidência dos trabalhos da reunião preparatória o vereador mais votado dentre os eleitos e diplomados.\n( ) A reunião preparatória ocorre no primeiro dia do primeiro ano da legislatura e nela também se dá posse ao Prefeito e ao Vice-Prefeito.\n( ) O vereador que não tomar posse na reunião preparatória deverá fazê-lo em 15 dias do início do funcionamento normal da Câmara, sob pena de perda do mandato, salvo justo motivo aceito pela maioria absoluta.\n( ) A declaração de bens do Vereador é feita apenas no ato da posse.\nA sequência CORRETA é:","o":["V, F, V, F.","F, V, V, F.","F, V, F, V.","V, V, V, F."],"a":1,"c":"1ª F: preside o vereador MAIS IDOSO (art. 21, § 1º); o mais votado é quem presta o juramento (§ 4º). 2ª V (art. 21, caput). 3ª V (art. 21, § 6º). 4ª F: a declaração é repetida quando do término do mandato (art. 21, § 7º).","f":"LO Paracatu, art. 21","id":"61eb6aa"},{"m":"lm","tp":"Lei Orgânica – Mesa Diretora","nv":2,"e":"Analise as afirmativas a seguir, de acordo com a Lei Orgânica do Município de Paracatu:\nI. A Mesa da Câmara compõe-se do Presidente, do Vice-Presidente e do Secretário, os quais se substituirão nesta ordem.\nII. Em caso de empate na eleição da Mesa, será considerado eleito o candidato mais votado nas eleições municipais.\nIII. É de dois anos o mandato dos membros da Mesa Diretora, permitida a recondução.\nIV. Qualquer membro da Mesa poderá ser destituído, quando faltoso, omisso ou ineficiente, mediante requerimento de qualquer Vereador aprovado pelo voto de dois terços dos membros da Câmara.\nEstão CORRETAS as afirmativas:","o":["I e III, apenas.","I, III e IV, apenas.","II, III e IV, apenas.","I, II, III e IV."],"a":1,"c":"I – art. 22. III – art. 23, § 5º. IV – art. 24 (assegurados contraditório e ampla defesa). II está errada: no empate, é eleito o candidato MAIS IDOSO (art. 23, § 2º). A votação é por escrutínio secreto, com 3 cédulas, uma para cada cargo (§ 1º).","f":"LO Paracatu, arts. 22 a 24","id":"aa9d9f9"},{"m":"lm","tp":"Lei Orgânica – Câmara Municipal","nv":2,"e":"A Lei Orgânica de Paracatu distingue as matérias de que a Câmara dispõe com a sanção do Prefeito (art. 25) das atribuições exclusivas da Câmara (art. 26). É atribuição EXCLUSIVA da Câmara Municipal:","o":["Dispor sobre a delimitação do perímetro urbano.","Dispor sobre criação, transformação e extinção de cargos, empregos e funções públicas.","Dispor sobre tributos municipais e sobre autorização de isenções e anistias fiscais.","Autorizar o Prefeito a se ausentar do Município por período superior a 15 (quinze) dias."],"a":3,"c":"Art. 26, IX: compete exclusivamente à Câmara autorizar o Prefeito a ausentar-se por mais de 15 dias. As demais matérias constam do art. 25 (incisos II, X e XIV), que dependem de lei com sanção do Prefeito.","f":"LO Paracatu, arts. 25 e 26","id":"5473bd8"},{"m":"lm","tp":"Lei Orgânica – Câmara Municipal","nv":3,"e":"Analise as afirmativas a seguir, de acordo com a Lei Orgânica do Município de Paracatu:\nI. A Câmara poderá criar comissão especial de inquérito, por prazo certo, para apuração de fato determinado, mediante requerimento de um terço de seus membros.\nII. A representação ao Procurador-Geral de Justiça contra o Prefeito, pela prática de crime contra a Administração Pública, depende da aprovação da maioria absoluta dos membros da Câmara.\nIII. A concessão de títulos honoríficos a pessoas que tenham prestado relevantes serviços ao Município exige proposta aprovada pelo voto de dois terços dos membros da Câmara.\nEstá(ão) CORRETA(S) a(s) afirmativa(s):","o":["I, apenas.","II, apenas.","I e III, apenas.","I, II e III."],"a":2,"c":"I – art. 26, XVII (um terço). III – art. 26, XIX (dois terços). II está errada: a representação ao Procurador-Geral de Justiça exige aprovação de DOIS TERÇOS dos membros (art. 26, XVIII).","f":"LO Paracatu, art. 26, XVII a XIX","id":"347dd57"},{"m":"lm","tp":"Lei Orgânica – Reuniões da Câmara","nv":1,"e":"Sobre as reuniões da Câmara Municipal de Paracatu, marque V para verdadeiro e F para falso:\n( ) A Câmara reúne-se, anualmente, de 1º de fevereiro a 30 de junho e de 1º de agosto a 20 de dezembro.\n( ) No primeiro ano de cada legislatura, a primeira sessão legislativa ordinária começa em 1º de janeiro, independentemente de convocação.\n( ) Realizar-se-á, no mínimo, uma reunião ordinária por semana, permitidas até duas reuniões por dia.\n( ) A convocação extraordinária far-se-á pelo Prefeito, pelo Presidente da Câmara ou a requerimento da maioria dos membros da Câmara.\nA sequência CORRETA é:","o":["V, V, F, V.","V, F, F, V.","F, V, V, V.","V, V, V, F."],"a":0,"c":"1ª V (art. 27, caput). 2ª V (art. 27, § 1º). 3ª F: é vedada a realização de mais de uma reunião por dia (art. 27, § 4º). 4ª V (art. 27, § 5º). Na sessão extraordinária, a Câmara só delibera sobre a matéria da convocação (§ 6º).","f":"LO Paracatu, art. 27","id":"8546641"},{"m":"lm","tp":"Lei Orgânica – Reuniões da Câmara","nv":1,"e":"Sobre a participação popular nas reuniões da Câmara por meio da Tribuna Livre, conforme a Lei Orgânica de Paracatu, assinale a alternativa INCORRETA:","o":["No caso de indeferimento do pedido, o requerente poderá apelar ao Plenário, mediante provocação de um dos seus membros e aprovação por maioria absoluta.","É permitido ao Vereador o aparte ao cidadão inscrito como orador na Tribuna Livre, desde que autorizado pelo Presidente.","Ao se inscrever, o cidadão deverá fazer referência ao assunto sobre o qual falará, não podendo abordar temas não mencionados na inscrição.","Cabe ao Presidente da Câmara fixar o número de cidadãos que poderá fazer uso da palavra em cada reunião."],"a":1,"c":"O art. 32, § 4º, é taxativo: NÃO é permitido ao vereador o aparte ao cidadão inscrito na Tribuna Livre. As demais estão nos §§ 1º, 3º e 2º do art. 32. A reunião ordinária fica suspensa pelo tempo de que dispuser o cidadão (§ 5º).","f":"LO Paracatu, art. 32","id":"756d9a6"},{"m":"lm","tp":"Lei Orgânica – Mesa Diretora","nv":2,"e":"Segundo a Lei Orgânica de Paracatu, o Presidente da Câmara, ou quem o substituir, somente manifestará o seu voto:\nI. na eleição da Mesa Diretora;\nII. nos escrutínios secretos;\nIII. quando ocorrer empate em qualquer votação no Plenário;\nIV. nas votações de projetos de lei complementar.\nEstão CORRETOS os itens:","o":["III, apenas.","I e III, apenas.","II e IV, apenas.","I, II e III, apenas."],"a":3,"c":"O art. 35 prevê apenas três hipóteses: eleição da Mesa, escrutínios secretos e empate em qualquer votação. Lei complementar não está entre elas.","f":"LO Paracatu, art. 35","id":"dfb2967"},{"m":"lm","tp":"Lei Orgânica – Subsídios","nv":3,"e":"Analise as afirmativas a seguir, de acordo com a Lei Orgânica do Município de Paracatu:\nI. Os subsídios do Prefeito, do Vice-Prefeito, dos Vereadores e dos Secretários Municipais serão fixados por lei de iniciativa da Câmara Municipal, em parcela única.\nII. O subsídio de cada Vereador não poderá ultrapassar 75% do que recebem, em espécie, os Deputados Estaduais.\nIII. O total da despesa com o subsídio dos Vereadores não poderá ultrapassar, anualmente, 7% da receita municipal.\nIV. O valor pago pelas reuniões extraordinárias não poderá ser superior ao subsídio mensal do Vereador.\nEstão CORRETAS as afirmativas:","o":["I, II e IV, apenas.","I e III, apenas.","II, III e IV, apenas.","I, II, III e IV."],"a":0,"c":"I – art. 41, caput e inciso I. II – art. 43, I. IV – art. 44, § 1º. III está errada: o limite anual é de 5% da receita municipal (art. 43, II).","f":"LO Paracatu, arts. 41, 43 e 44","id":"2758351"},{"m":"lm","tp":"Lei Orgânica – Vereadores","nv":3,"e":"Conforme o art. 49 da Lei Orgânica de Paracatu, o Vereador não poderá, DESDE A EXPEDIÇÃO DO DIPLOMA:","o":["Ser proprietário, controlador ou diretor de empresa que goze de favor decorrente de contrato com o Município.","Firmar ou manter contrato com autarquia ou empresa concessionária de serviço público do Município, salvo quando o contrato obedecer a cláusulas uniformes.","Patrocinar causa em que seja interessada qualquer das entidades da Administração municipal.","Ser titular de mais de um cargo ou mandato público eletivo."],"a":1,"c":"Art. 49, I, a: desde a expedição do diploma, é vedado firmar ou manter contrato com essas entidades (salvo cláusulas uniformes). As outras três proibições (art. 49, II, b, d e c) valem DESDE A POSSE.","f":"LO Paracatu, art. 49","id":"c1722fd"},{"m":"lm","tp":"Lei Orgânica – Vereadores","nv":2,"e":"Analise as afirmativas a seguir, de acordo com a Lei Orgânica do Município de Paracatu:\nI. Perderá o mandato o Vereador que deixar de comparecer, em cada sessão legislativa, à terça parte das sessões ordinárias, salvo licença ou missão autorizada pela Câmara.\nII. Perderá o mandato o Vereador que fixar residência fora do Município.\nIII. Ocorrendo falecimento ou renúncia por escrito, o mandato extingue-se e assim será declarado pelo Presidente da Câmara.\nIV. A perda do mandato por procedimento incompatível com o decoro parlamentar será declarada pela Mesa, de ofício.\nEstão CORRETAS as afirmativas:","o":["I e II, apenas.","I, II e III, apenas.","I, III e IV, apenas.","I, II, III e IV."],"a":1,"c":"I – art. 50, IV. II – art. 50, V. III – art. 50, § 1º. IV está errada: nos casos dos incisos I, II, III, V e VII (decoro é o II), a perda é DECIDIDA PELA CÂMARA, por voto secreto e maioria absoluta, mediante provocação da Mesa ou de partido (§ 2º). A Mesa apenas declara a perda nos incisos IV, VI, VIII e IX (§ 3º).","f":"LO Paracatu, art. 50","id":"f2d027e"},{"m":"lm","tp":"Lei Orgânica – Vereadores","nv":2,"e":"Sobre as licenças do Vereador previstas na Lei Orgânica de Paracatu, marque V para verdadeiro e F para falso:\n( ) A licença para tratar de interesse particular não pode ultrapassar 120 dias por sessão legislativa.\n( ) A licença para tratar de interesse particular não será inferior a 15 dias.\n( ) O Vereador investido no cargo de Secretário Municipal será considerado automaticamente licenciado, podendo optar pelo subsídio da vereança.\n( ) A licença por motivo de saúde, devidamente comprovado, dá-se com percepção de subsídio.\nA sequência CORRETA é:","o":["V, V, F, V.","F, F, V, V.","V, F, V, F.","V, F, V, V."],"a":3,"c":"1ª V (art. 51, II). 2ª F: o mínimo é de 30 dias, e o Vereador não pode reassumir antes do término (art. 51, § 3º). 3ª V (art. 51, § 2º). 4ª V: nos incisos I (saúde), III (missão) e IV (concorrer a outro cargo) há percepção de subsídio (§ 1º).","f":"LO Paracatu, art. 51","id":"6b4dd0b"},{"m":"lm","tp":"Lei Orgânica – Vereadores","nv":2,"e":"Segundo a Lei Orgânica de Paracatu, o suplente convocado nos casos de vaga ou de licença deverá tomar posse no prazo de:","o":["30 dias da convocação, prorrogável por igual período.","15 dias da convocação, prorrogável sucessivamente enquanto houver justo motivo.","10 dias da convocação, improrrogável.","15 dias da convocação, salvo justo motivo aceito pela Câmara, podendo ser concedidos mais 15 dias improrrogáveis."],"a":3,"c":"Art. 53, § 1º. Se não tomar posse, é considerado renunciante e convoca-se novo suplente (§ 2º). Havendo vaga sem suplente, o Presidente comunica o TRE em 48 horas (§ 3º), e o quorum é calculado sobre os remanescentes (§ 4º).","f":"LO Paracatu, art. 53","id":"2492c75"},{"m":"lm","tp":"Lei Orgânica – Processo legislativo","nv":1,"e":"Segundo a Lei Orgânica de Paracatu, o processo legislativo municipal compreende a elaboração de, EXCETO:","o":["Medidas provisórias.","Emendas à Lei Orgânica.","Decretos legislativos.","Leis delegadas."],"a":0,"c":"Art. 54: emendas à Lei Orgânica, leis complementares, leis ordinárias, leis delegadas, decretos legislativos e resoluções. Não há medida provisória no processo legislativo municipal de Paracatu.","f":"LO Paracatu, art. 54","id":"7d4b212"},{"m":"lm","tp":"Lei Orgânica – Processo legislativo","nv":2,"e":"Sobre a emenda à Lei Orgânica de Paracatu, analise as afirmativas:\nI. A Lei Orgânica poderá ser emendada mediante proposta de um terço, no mínimo, dos membros da Câmara, do Prefeito ou de iniciativa popular.\nII. A proposta será discutida e votada em dois turnos, com interstício mínimo de 10 dias, considerando-se aprovada se obtiver, em ambos, dois terços dos votos dos membros da Câmara.\nIII. A emenda será promulgada pelo Prefeito, com o respectivo número de ordem.\nIV. A Lei Orgânica não poderá ser emendada na vigência de intervenção no Município.\nEstão CORRETAS as afirmativas:","o":["I, II e III, apenas.","I e IV, apenas.","I, II e IV, apenas.","I, II, III e IV."],"a":2,"c":"I – art. 55, I a III. II – art. 55, § 1º. IV – art. 55, § 3º. III está errada: a emenda é promulgada pela MESA DA CÂMARA (art. 55, § 2º); não há sanção do Prefeito.","f":"LO Paracatu, art. 55","id":"6e2a03c"},{"m":"lm","tp":"Lei Orgânica – Processo legislativo","nv":2,"e":"São de iniciativa exclusiva do Prefeito, conforme a Lei Orgânica de Paracatu, as leis que disponham sobre as matérias abaixo, EXCETO:","o":["Regime jurídico dos servidores.","Orçamento anual, diretrizes orçamentárias e plano plurianual.","Fixação dos subsídios dos Vereadores.","Criação, estruturação e atribuições dos órgãos da Administração direta e indireta do Município."],"a":2,"c":"Art. 57 lista como iniciativa exclusiva do Prefeito: cargos/empregos/funções e aumento de remuneração; regime jurídico dos servidores; órgãos da Administração; leis orçamentárias. Os subsídios de Prefeito, Vice, Vereadores e Secretários são fixados por lei de iniciativa da CÂMARA (arts. 26, IV, e 41).","f":"LO Paracatu, arts. 41 e 57","id":"9265217"},{"m":"lm","tp":"Lei Orgânica – Processo legislativo","nv":1,"e":"De acordo com a Lei Orgânica de Paracatu, a iniciativa popular de projeto de lei deverá ser exercida pela apresentação à Câmara de projeto subscrito por, no mínimo:","o":["1% dos eleitores inscritos no Município.","10% dos eleitores inscritos no Município.","3% dos eleitores inscritos no Município.","5% dos eleitores inscritos no Município."],"a":3,"c":"Art. 58: 5% dos eleitores inscritos, com identificação dos assinantes pelo título eleitoral. O projeto pode ser defendido na Tribuna por um dos cinco primeiros signatários (§ 3º).","f":"LO Paracatu, art. 58","id":"ec2dd39"},{"m":"lm","tp":"Lei Orgânica – Processo legislativo","nv":1,"e":"Conforme a Lei Orgânica de Paracatu, são objeto de leis complementares as seguintes matérias, EXCETO:","o":["Regime Jurídico dos Servidores Públicos Municipais.","Plano Diretor de Desenvolvimento Integrado.","Código Sanitário.","Lei orçamentária anual."],"a":3,"c":"Art. 59: Código Tributário, Código de Obras e Edificações, Código Sanitário, Código de Posturas, Código de Zoneamento, Código de Parcelamento do Solo, Regime Jurídico dos Servidores e Plano Diretor. A lei orçamentária não está na lista. As leis complementares exigem maioria absoluta (parágrafo único).","f":"LO Paracatu, art. 59","id":"16fafa9"},{"m":"lm","tp":"Lei Orgânica – Processo legislativo","nv":3,"e":"Sobre leis delegadas e pedido de urgência na Lei Orgânica de Paracatu, marque V para verdadeiro e F para falso:\n( ) Não serão objeto de delegação as matérias reservadas à lei complementar e às leis orçamentárias.\n( ) A delegação ao Prefeito terá a forma de resolução da Câmara Municipal.\n( ) Solicitada urgência pelo Prefeito, se a Câmara não apreciar a proposição em até 45 dias, ela será incluída na ordem do dia, sobrestando-se a deliberação quanto aos demais assuntos.\n( ) O prazo da urgência corre normalmente nos períodos de recesso da Câmara.\nA sequência CORRETA é:","o":["V, V, F, F.","F, F, V, V.","V, F, V, F.","V, F, F, V."],"a":2,"c":"1ª V (art. 60, § 1º, que também exclui os atos de competência privativa da Câmara). 2ª F: a delegação tem a forma de DECRETO LEGISLATIVO (art. 60, § 2º). 3ª V (art. 62, § 1º). 4ª F: o prazo não corre no recesso nem se aplica aos projetos de lei complementar (art. 62, § 2º).","f":"LO Paracatu, arts. 60 e 62","id":"d51378c"},{"m":"lm","tp":"Lei Orgânica – Sanção e veto","nv":1,"e":"Pela Lei Orgânica de Paracatu, o projeto de lei aprovado pela Câmara será enviado ao Prefeito em 5 dias úteis. Se o Prefeito o considerar inconstitucional ou contrário ao interesse público, vetá-lo-á no prazo de:","o":["10 dias úteis, contados do recebimento, comunicando os motivos do veto em 48 horas.","30 dias, contados do recebimento, comunicando os motivos do veto em 5 dias úteis.","15 dias úteis, contados da data do recebimento, comunicando ao Presidente da Câmara, dentro de 48 horas, os motivos do veto.","15 dias corridos, contados da aprovação, comunicando os motivos do veto em 72 horas."],"a":2,"c":"Art. 63, § 1º: veto total ou parcial em 15 dias úteis do recebimento, com comunicação dos motivos em 48 horas. Decorridos os 15 dias úteis, o silêncio importa sanção (§ 3º).","f":"LO Paracatu, art. 63","id":"4b85708"},{"m":"lm","tp":"Lei Orgânica – Sanção e veto","nv":3,"e":"Sobre o veto na Lei Orgânica de Paracatu, analise as afirmativas:\nI. O veto parcial somente abrangerá texto integral de artigo, de parágrafo, de inciso ou de alínea.\nII. Decorrido o prazo de 15 dias úteis, o silêncio do Prefeito importará em veto tácito.\nIII. O veto será apreciado pela Câmara dentro de 30 dias do seu recebimento, em uma única discussão e votação, e somente será rejeitado pelo voto da maioria absoluta dos Vereadores, em escrutínio secreto.\nIV. A manutenção do veto restaura a redação original do projeto de lei.\nEstão CORRETAS as afirmativas:","o":["I e III, apenas.","I, II e III, apenas.","II e IV, apenas.","III e IV, apenas."],"a":0,"c":"I – art. 63, § 2º. III – art. 63, §§ 4º e 5º. II está errada: o silêncio importa SANÇÃO tácita (§ 3º). IV está errada: a manutenção do veto NÃO restaura a redação original (§ 9º).","f":"LO Paracatu, art. 63","id":"a1011c7"},{"m":"lm","tp":"Lei Orgânica – Sanção e veto","nv":2,"e":"Segundo a Lei Orgânica de Paracatu, se o Prefeito não promulgar a lei nos prazos previstos e no caso de sanção tácita:","o":["o Presidente da Câmara a promulgará e, se este não o fizer em 48 horas, caberá ao Vice-Presidente da Câmara fazê-lo.","a lei será considerada rejeitada, devendo o projeto ser reapresentado na sessão legislativa seguinte.","o Vice-Prefeito a promulgará no prazo de 48 horas.","o Presidente da Câmara a promulgará em 15 dias e, na sua omissão, caberá ao Secretário da Câmara fazê-lo."],"a":0,"c":"Art. 63, § 8º. O art. 36, IV, reforça: o Vice-Presidente da Câmara promulga obrigatoriamente quando o Prefeito e o Presidente da Câmara, sucessivamente, não o fizerem, sob pena de perda do mandato de membro da Mesa.","f":"LO Paracatu, arts. 36, IV, e 63, § 8º","id":"19afef7"},{"m":"lm","tp":"Lei Orgânica – Fiscalização e contas","nv":2,"e":"Analise as afirmativas a seguir, de acordo com a Lei Orgânica do Município de Paracatu:\nI. O parecer prévio do Tribunal de Contas do Estado sobre as contas anuais do Prefeito só deixará de prevalecer por decisão de dois terços dos membros da Câmara.\nII. Se rejeitadas, as contas serão imediatamente remetidas ao Ministério Público, para fins de direito.\nIII. As contas do Município ficarão, durante 30 dias, anualmente, à disposição de qualquer cidadão, para exame e apreciação.\nIV. A consulta às contas municipais depende de requerimento deferido pelo Presidente da Câmara.\nEstão CORRETAS as afirmativas:","o":["I e II, apenas.","I, II e III, apenas.","II e IV, apenas.","I, II, III e IV."],"a":0,"c":"I – art. 68, § 2º. II – art. 68, § 4º. III está errada: o prazo é de 60 dias (art. 70). IV está errada: a consulta não depende de requerimento ou despacho de qualquer autoridade, havendo pelo menos 3 cópias à disposição do público na Câmara (art. 70, § 1º).","f":"LO Paracatu, arts. 68 e 70","id":"bc7b777"},{"m":"lm","tp":"Lei Orgânica – Prefeito e Vice-Prefeito","nv":2,"e":"Sobre o Prefeito e o Vice-Prefeito na Lei Orgânica de Paracatu, marque V para verdadeiro e F para falso:\n( ) A eleição do Prefeito e do Vice-Prefeito realiza-se simultaneamente, para mandato de 4 anos.\n( ) O Prefeito poderá ser reeleito para um único período subsequente.\n( ) Decorridos 15 dias da data fixada para a posse, salvo força maior aceita pela Câmara, se o Prefeito não tiver assumido, o cargo será declarado vago.\n( ) Enquanto não ocorrer a posse do Prefeito, assumirá o cargo o Vice-Prefeito e, na falta ou impedimento deste, o Presidente da Câmara.\nA sequência CORRETA é:","o":["V, F, V, V.","V, V, F, V.","F, V, F, V.","V, V, V, F."],"a":1,"c":"1ª V (art. 73). 2ª V (art. 73, parágrafo único). 3ª F: o prazo é de 10 dias (arts. 74, § 1º, e 80, II). 4ª V (art. 74, § 2º). A posse é em 1º de janeiro do ano seguinte à eleição, em reunião preparatória da Câmara (art. 74).","f":"LO Paracatu, arts. 73, 74 e 80","id":"59f230f"},{"m":"lm","tp":"Lei Orgânica – Prefeito e Vice-Prefeito","nv":1,"e":"Em caso de impedimento do Prefeito e do Vice-Prefeito, ou vacância do cargo, assumirá a Administração municipal o Presidente da Câmara. De acordo com a Lei Orgânica de Paracatu, a recusa do Presidente da Câmara em assumir implicará:","o":["a perda do cargo que ocupa na Mesa da Câmara.","a suspensão de seus direitos políticos por oito anos.","a assunção automática do cargo de Prefeito pelo Secretário da Câmara.","a perda do mandato de Vereador."],"a":0,"c":"Art. 76, parágrafo único: a recusa implica a perda do cargo na Mesa (não do mandato de vereador). O Vice-Prefeito substitui o Prefeito no impedimento e sucede-lhe na vaga (art. 75).","f":"LO Paracatu, arts. 75 e 76","id":"b1ee1b5"},{"m":"lm","tp":"Lei Orgânica – Prefeito e Vice-Prefeito","nv":2,"e":"Analise as afirmativas a seguir, de acordo com a Lei Orgânica do Município de Paracatu:\nI. O Prefeito não poderá, sem licença da Câmara, ausentar-se do Município por período superior a 15 dias, sob pena de perda do mandato.\nII. As ausências por período inferior a 15 dias dar-se-ão exclusivamente para tratar de assuntos de interesse do Município.\nIII. O Prefeito poderá licenciar-se para tratar de interesse particular por até 120 dias.\nIV. Licenciado por motivo de saúde, devidamente comprovado, o Prefeito fará jus à percepção de subsídio.\nEstão CORRETAS as afirmativas:","o":["I e II, apenas.","II e III, apenas.","I, III e IV, apenas.","I, II e IV, apenas."],"a":3,"c":"I e II – art. 77. IV – art. 78, parágrafo único. III está errada: o art. 78 só prevê licença do Prefeito por motivo de saúde e para concorrer à reeleição. A licença para interesse particular (até 120 dias) é do VEREADOR (art. 51, II).","f":"LO Paracatu, arts. 77 e 78","id":"9e32f1b"},{"m":"lm","tp":"Lei Orgânica – Prefeito e Vice-Prefeito","nv":1,"e":"Segundo a Lei Orgânica de Paracatu, o Prefeito será julgado pela prática de crimes de responsabilidade e de infrações político-administrativas, respectivamente, perante:","o":["a Câmara Municipal e o Tribunal de Justiça do Estado.","o Tribunal Regional Eleitoral e a Câmara Municipal.","a Câmara Municipal, em ambos os casos.","o Tribunal de Justiça do Estado e a Câmara Municipal."],"a":3,"c":"Art. 81, parágrafo único: crimes de responsabilidade – Tribunal de Justiça do Estado. Art. 82, parágrafo único: infrações político-administrativas – Câmara Municipal. Ambos estão definidos em lei federal.","f":"LO Paracatu, arts. 81 e 82","id":"2d325c0"},{"m":"lm","tp":"Lei Orgânica – Prefeito e Vice-Prefeito","nv":3,"e":"Sobre o fim do mandato e a transição de governo, conforme a Lei Orgânica de Paracatu, assinale a alternativa INCORRETA:","o":["O Governo municipal oferecerá as condições para que o Prefeito eleito efetue completo levantamento da situação da Administração, no mínimo 30 dias antes da posse.","É vedado ao Prefeito assumir compromissos financeiros para execução após o término do mandato não previstos na legislação orçamentária, exceto nos casos comprovados de calamidade pública.","Até trinta dias antes do fim do mandato, o Prefeito deverá preparar, para entrega ao sucessor e publicação imediata, relatório da situação geral da Administração municipal.","Será declarado vago, pela Câmara Municipal, o cargo de Prefeito quando ele tiver suspensos os direitos políticos."],"a":0,"c":"O art. 301 fixa no mínimo 45 dias (e não 30) antes da posse para o levantamento pelo Prefeito eleito. As demais estão nos arts. 83, 84 (§ 1º) e 80, III.","f":"LO Paracatu, arts. 80, 83, 84 e 301","id":"3dd9730"},{"m":"lm","tp":"Lei Orgânica – Atribuições do Prefeito","nv":3,"e":"O art. 86 da Lei Orgânica de Paracatu lista as competências privativas do Prefeito e permite que algumas sejam delegadas. Pode ser delegada a seguinte atribuição, EXCETO:","o":["Aprovar projetos de edificação e planos de loteamento, arruamento e zoneamento urbano.","Celebrar convênios com entidades públicas ou privadas para a realização de objetivos de interesse do Município.","Vetar, no todo ou em parte, os projetos de lei.","Aplicar multas previstas em lei, nos contratos ou convênios, bem como revê-las quando for o caso."],"a":2,"c":"Art. 86, parágrafo único: são delegáveis apenas os incisos XIX (convênios), XX (arrecadação e despesas), XXII (multas), XXVII (projetos de edificação e loteamento) e XXXI (requerimentos e reclamações). O veto (inciso VI) não é delegável.","f":"LO Paracatu, art. 86","id":"1f1ac4f"},{"m":"lm","tp":"Lei Orgânica – Auxiliares do Prefeito","nv":2,"e":"Analise as afirmativas a seguir, de acordo com a Lei Orgânica do Município de Paracatu:\nI. São auxiliares diretos do Prefeito, entre outros, os Secretários Municipais, o Procurador Geral do Município, o Chefe de Gabinete e os Subprefeitos, cargos de livre nomeação e exoneração.\nII. Consideram-se Secretários Municipais, para efeito da Lei Orgânica, os cargos de Procurador Geral e de Chefe de Gabinete.\nIII. Os auxiliares diretos do Prefeito são solidariamente responsáveis, junto com este, pelos atos que assinarem, ordenarem ou praticarem.\nIV. O não comparecimento do Secretário Municipal à Câmara, quando convocado, sem justificação, importará em crime de responsabilidade.\nEstão CORRETAS as afirmativas:","o":["I e II, apenas.","I, II e III, apenas.","II, III e IV, apenas.","I, II, III e IV."],"a":1,"c":"I – art. 87 e § 1º. II – art. 87, § 2º. III – art. 89. IV está errada: a falta injustificada importa INFRAÇÃO POLÍTICO-ADMINISTRATIVA (art. 92, § 2º).","f":"LO Paracatu, arts. 87, 89 e 92","id":"2f58254"},{"m":"lm","tp":"Lei Orgânica – Servidores municipais","nv":2,"e":"Sobre servidores e concurso público na Lei Orgânica de Paracatu, marque V para verdadeiro e F para falso:\n( ) A investidura em cargo ou emprego público depende de aprovação prévia em concurso de provas ou de provas e títulos, ressalvadas as nomeações para cargo em comissão declarado em lei de livre nomeação e exoneração.\n( ) O concurso público de provas ou de provas e títulos não será realizado aos domingos e feriados.\n( ) As funções de confiança são exercidas exclusivamente por servidores ocupantes de cargo efetivo.\n( ) Entre as vantagens que a lei assegurará aos servidores municipais estão o adicional noturno e o adicional de férias.\nA sequência CORRETA é:","o":["V, F, V, V.","V, V, V, F.","F, F, V, V.","V, F, F, V."],"a":0,"c":"1ª V (art. 98, caput). 2ª F: a vedação expressa é de realização do concurso aos SÁBADOS (art. 98, § 4º). 3ª V (art. 98, § 3º). 4ª V (art. 98, § 1º, V e VII).","f":"LO Paracatu, art. 98","id":"ffbbbe0"},{"m":"lm","tp":"Lei Orgânica – Administração pública","nv":2,"e":"Conforme a Lei Orgânica de Paracatu, sobre a Administração Pública municipal, assinale a alternativa INCORRETA:","o":["Somente por lei específica poderá ser criada autarquia e autorizada a instituição de empresa pública, de sociedade de economia mista e de fundação.","A remuneração dos servidores públicos poderá ser fixada ou alterada por decreto do Prefeito, assegurada a revisão geral anual.","O Município e suas concessionárias responderão pelos danos que seus agentes, nessa qualidade, causarem a terceiros, assegurado o direito de regresso contra o responsável nos casos de dolo ou culpa.","A pessoa jurídica em débito com o sistema de seguridade social não poderá contratar com o Poder Público Municipal nem dele receber benefícios ou incentivos fiscais ou creditícios."],"a":1,"c":"Art. 99: a remuneração e o subsídio somente podem ser fixados ou alterados por LEI ESPECÍFICA, assegurada revisão geral anual, sempre na mesma data e sem distinção de índices. As demais estão nos arts. 97, § 1º, 102 e 104.","f":"LO Paracatu, arts. 97, 99, 102 e 104","id":"d5cb75f"},{"m":"lm","tp":"Lei Orgânica – Administração pública","nv":3,"e":"Pela Lei Orgânica de Paracatu, o Prefeito, o Vice-Prefeito, os Vereadores, os Secretários Municipais e os servidores públicos municipais, bem como as pessoas a eles ligadas por parentesco até o segundo grau ou por adoção, não poderão contratar com o Município. Essa proibição subsiste até:","o":["2 anos após findas as respectivas funções, não se incluindo os contratos de cláusulas uniformes.","1 ano após findas as respectivas funções, sem exceção.","90 dias após findas as respectivas funções, sem exceção.","6 meses após findas as respectivas funções, não se incluindo os contratos de cláusulas uniformes para todos os interessados."],"a":3,"c":"Art. 103: a proibição subsiste até 6 meses após findas as funções; o parágrafo único exclui os contratos com cláusulas e condições uniformes para todos.","f":"LO Paracatu, art. 103","id":"546165d"},{"m":"lm","tp":"Lei Orgânica – Atos municipais","nv":2,"e":"Analise as afirmativas a seguir, de acordo com a Lei Orgânica do Município de Paracatu:\nI. Nenhum ato produzirá efeito antes de sua publicação.\nII. A publicação dos atos normativos pela imprensa poderá ser resumida.\nIII. A escolha do órgão de imprensa particular para a publicação dos atos será feita por meio de licitação.\nIV. O Prefeito fará publicar, anualmente, até 15 de março, por órgão oficial, as contas da Administração, em forma sintética.\nEstão CORRETAS as afirmativas:","o":["I e III, apenas.","I, III e IV, apenas.","II e IV, apenas.","I, II, III e IV."],"a":1,"c":"I – art. 105, § 1º. III – art. 105, § 3º. IV – art. 106, IV. II está errada: pode ser resumida a publicação dos atos NÃO normativos (art. 105, § 2º).","f":"LO Paracatu, arts. 105 e 106","id":"8981f69"},{"m":"lm","tp":"Lei Orgânica – Atos municipais","nv":3,"e":"Numere a COLUNA II de acordo com a COLUNA I, conforme a forma que o art. 107 da Lei Orgânica de Paracatu exige para os atos administrativos do Prefeito.\nCOLUNA I\n1. Decreto\n2. Portaria\nCOLUNA II\n( ) Regulamentação de lei.\n( ) Lotação e relotação nos quadros de pessoal.\n( ) Abertura de créditos especiais e suplementares, até o limite autorizado por lei.\n( ) Criação de comissões e designação de seus membros.\n( ) Declaração de utilidade pública ou necessidade social, para fins de desapropriação.\nAssinale a sequência CORRETA:","o":["1, 2, 1, 2, 1.","1, 1, 2, 2, 1.","2, 2, 1, 1, 2.","1, 2, 2, 2, 1."],"a":0,"c":"Decreto (art. 107, I): regulamentação de lei (a), abertura de créditos (e), declaração de utilidade pública (f). Portaria (art. 107, II): lotação e relotação (b), criação de comissões (c). Os atos do inciso II (portarias) podem ser delegados (parágrafo único).","f":"LO Paracatu, art. 107","id":"930da3d"},{"m":"lm","tp":"Lei Orgânica – Bens municipais","nv":3,"e":"Sobre os bens municipais na Lei Orgânica de Paracatu, marque V para verdadeiro e F para falso:\n( ) Cabe ao Prefeito a administração dos bens municipais, respeitada a competência da Câmara quanto àqueles utilizados em seus serviços.\n( ) A alienação de bens imóveis dependerá de autorização legislativa e concorrência pública, dispensada esta nos casos previstos na legislação pertinente.\n( ) A permissão de uso, que poderá incidir sobre qualquer bem público, será feita mediante licitação, a título precário e por portaria.\n( ) A autorização de uso, que poderá incidir sobre qualquer bem público, será feita por portaria, para atividades ou usos específicos e transitórios.\nA sequência CORRETA é:","o":["V, F, F, V.","F, V, V, V.","V, V, F, V.","V, V, V, F."],"a":2,"c":"1ª V (art. 110). 2ª V (art. 111, parágrafo único). 3ª F: a permissão é feita por DECRETO (art. 114, § 3º). 4ª V (art. 114, § 5º). Pegadinha: permissão = decreto; autorização = portaria; concessão administrativa = lei, licitação e contrato por prazo determinado (§ 2º).","f":"LO Paracatu, arts. 110, 111 e 114","id":"f2f5c96"},{"m":"lm","tp":"Lei Orgânica – Bens municipais","nv":1,"e":"Conforme a Lei Orgânica de Paracatu, sobre bens, obras e serviços municipais, assinale a alternativa INCORRETA:","o":["As áreas transferidas ao Município em decorrência da aprovação de loteamentos serão consideradas bens dominiais enquanto não se efetivarem benfeitorias que lhes deem outra destinação.","O Poder Executivo poderá ceder a particulares máquinas e operadores para serviços de caráter transitório, desde que não haja outros meios disponíveis locais e o interessado recolha previamente a remuneração arbitrada.","A afetação e a desafetação de bens municipais podem ser feitas por decreto do Prefeito, independentemente de lei.","As obras realizadas em regime de urgência serão comunicadas, imediatamente, à Câmara Municipal."],"a":2,"c":"Art. 113: a afetação e a desafetação de bens municipais DEPENDERÃO DE LEI. As demais estão nos arts. 113, parágrafo único, 115 e 118, parágrafo único.","f":"LO Paracatu, arts. 113, 115 e 118","id":"19df627"},{"m":"lm","tp":"Lei Orgânica – Tributos e orçamento","nv":2,"e":"Analise as afirmativas a seguir, de acordo com a Lei Orgânica do Município de Paracatu:\nI. É vedado ao Município cobrar tributos no mesmo exercício financeiro em que haja sido publicada a lei que os instituiu ou aumentou.\nII. É vedado ao Município instituir impostos sobre templos de qualquer culto.\nIII. A concessão de isenção, anistia ou remissão constitui direito adquirido do contribuinte.\nIV. Nenhum contribuinte será obrigado ao pagamento de qualquer tributo lançado pela Prefeitura sem prévia notificação.\nEstão CORRETAS as afirmativas:","o":["I e II, apenas.","I, II e IV, apenas.","II, III e IV, apenas.","I, II, III e IV."],"a":1,"c":"I – art. 134, IV, b. II – art. 134, VIII, b. IV – art. 137. III está errada: a isenção, anistia, remissão ou outro benefício fiscal NÃO constitui direito adquirido e será revogada quando o contribuinte deixar de satisfazer as condições (art. 135).","f":"LO Paracatu, arts. 134, 135 e 137","id":"85e399c"},{"m":"lm","tp":"Lei Orgânica – Fiscalização e contas","nv":3,"e":"De acordo com a Lei Orgânica de Paracatu, o Prefeito encaminhará as contas do exercício anterior à Câmara Municipal e ao Tribunal de Contas do Estado de Minas Gerais até:","o":["15 de março de cada ano.","1º de março de cada ano.","31 de março de cada ano.","30 de abril de cada ano."],"a":2,"c":"Art. 160: até 31 de março. Não confundir: 1º de março é o prazo para a Mesa enviar ao Prefeito as contas da Câmara (art. 33, I); 15 de março é o prazo para o Prefeito publicar as contas da Administração em forma sintética (art. 106, IV).","f":"LO Paracatu, arts. 33, 106 e 160","id":"7a3af6a"},{"m":"lm","tp":"Lei Orgânica – Participação popular","nv":3,"e":"Sobre as consultas populares previstas na Lei Orgânica de Paracatu, marque V para verdadeiro e F para falso:\n( ) A consulta popular poderá ser realizada sempre que a maioria absoluta dos membros da Câmara ou pelo menos 5% do eleitorado do Município, do bairro ou do distrito apresentarem proposição nesse sentido.\n( ) A votação será organizada no prazo de 2 meses após a apresentação da proposição.\n( ) Serão realizadas, no máximo, 3 consultas por ano.\n( ) É vedada a realização de consultas populares nos 90 dias que antecedam as eleições para qualquer nível de Governo.\nA sequência CORRETA é:","o":["V, F, V, F.","F, V, F, V.","V, V, V, F.","V, V, F, F."],"a":3,"c":"1ª V (art. 168). 2ª V (art. 169). 3ª F: no máximo 2 consultas por ano (art. 169, § 2º). 4ª F: a vedação é nos 60 dias anteriores às eleições (art. 169, § 3º). A proposição é aprovada pela maioria dos votantes, com comparecimento de pelo menos 50% dos eleitores envolvidos (§ 1º).","f":"LO Paracatu, arts. 168 e 169","id":"3079212"},{"m":"lm","tp":"Lei Orgânica – Saúde","nv":1,"e":"Conforme a Lei Orgânica de Paracatu, as ações e serviços de saúde no Município integram uma rede regionalizada e hierarquizada, constituindo o SUS no âmbito municipal, com a diretriz de comando único exercido pela:","o":["Secretaria de Estado de Saúde de Minas Gerais.","Comissão de saúde da Câmara Municipal.","Secretaria Municipal de Saúde ou entidade equivalente.","Conferência Municipal de Saúde."],"a":2,"c":"Art. 188, I: comando único pela Secretaria Municipal de Saúde ou entidade equivalente. No mesmo sentido, o art. 191, § 1º: a direção do SUS no Município é exercida pelo órgão municipal competente.","f":"LO Paracatu, arts. 188 e 191","id":"244ba9d"},{"m":"lm","tp":"Lei Orgânica – Saúde","nv":2,"e":"Sobre as atribuições do Município no âmbito da saúde, previstas no art. 187 da Lei Orgânica de Paracatu, assinale a alternativa INCORRETA:","o":["Os alimentos à disposição da merenda escolar deverão ter parecer favorável da Secretaria Municipal de Saúde, ou órgão equivalente, para sua liberação ao consumo humano.","O estabelecimento que infringir as normas de saúde terá sua licença suspensa ou cassada, conforme dispuser a lei.","Compete ao Município prestar serviços hospitalares e dispensários, em articulação com a União, o Estado e instituições privadas, tendo preferência as entidades filantrópicas sem fins lucrativos.","A inspeção médica nos estabelecimentos de ensino municipal terá caráter facultativo, a critério da direção escolar."],"a":3,"c":"Art. 187, § 3º: a inspeção médica nos estabelecimentos de ensino municipal terá caráter OBRIGATÓRIO. As demais estão no art. 187, § 2º, § 1º e inciso XIV.","f":"LO Paracatu, art. 187","id":"de27257"},{"m":"lm","tp":"Lei Orgânica – Saúde","nv":2,"e":"Analise as afirmativas a seguir, de acordo com a Lei Orgânica do Município de Paracatu:\nI. É vedada a destinação de recursos públicos municipais para auxílio, incentivos fiscais ou subvenções às instituições privadas com fins lucrativos.\nII. É vedado cobrar do usuário pela prestação das ações e dos serviços no âmbito do Sistema Único de Saúde.\nIII. As ações e serviços de saúde serão executados preferencialmente através de terceiros e, supletivamente, de forma direta pelo Poder Público.\nIV. O SUS no âmbito do Município será financiado com recursos do próprio Município, do Estado, da União, da seguridade social e de outras fontes, que constituem um fundo específico regulado por lei municipal.\nEstão CORRETAS as afirmativas:","o":["I e II, apenas.","II e III, apenas.","I, II e IV, apenas.","I, II, III e IV."],"a":2,"c":"I – art. 191, § 3º (e art. 188, § 2º). II – art. 192, § 2º. IV – art. 191, § 2º. III está invertida: execução PREFERENCIALMENTE DIRETA pelo Poder Público e SUPLETIVAMENTE por terceiros (art. 192, § 1º).","f":"LO Paracatu, arts. 188, 191 e 192","id":"f080103"},{"m":"lm","tp":"Lei Orgânica – Saúde","nv":1,"e":"João é diretor de um hospital privado credenciado ao Sistema Único de Saúde e foi indicado para chefiar um setor da Secretaria Municipal de Saúde de Paracatu. De acordo com a Lei Orgânica do Município:","o":["Ele poderá ser nomeado se a indicação for aprovada pelo Conselho Municipal de Saúde.","Ele poderá ser nomeado apenas para função de assessoramento, vedada a chefia.","Ele poderá ser nomeado, desde que se licencie da direção do hospital enquanto ocupar a chefia.","É vedada a sua nomeação ou designação para cargo ou função de chefia ou assessoramento na área de saúde, em qualquer nível."],"a":3,"c":"Art. 191, § 4º: é vedada a nomeação ou designação, para cargo ou função de chefia ou assessoramento na área de saúde, em qualquer nível, de pessoa que participe da direção, gerência ou administração de entidade que mantenha contrato com o SUS ou seja por ele credenciada.","f":"LO Paracatu, art. 191, § 4º","id":"93a3f1f"},{"m":"lm","tp":"Lei Orgânica – Saúde","nv":2,"e":"Sobre a saúde na Lei Orgânica de Paracatu, marque V para verdadeiro e F para falso:\n( ) O SUS no Município promoverá, na forma da lei, a conferência anual de saúde e audiências públicas periódicas, como mecanismos de controle social de sua gestão.\n( ) O Município publicará, até 30 dias após o encerramento de cada trimestre, informações sobre as receitas e os recursos recebidos e destinados à saúde no período.\n( ) O serviço de atendimento médico do Município deverá oferecer, obrigatoriamente, formas de tratamento de assistência alternativa.\n( ) Todo estabelecimento que praticar medicina curativa é obrigado a acondicionar seu lixo em recipientes próprios, para coleta pelo órgão encarregado da limpeza urbana.\nA sequência CORRETA é:","o":["V, F, V, V.","V, V, F, V.","F, V, F, V.","V, V, V, F."],"a":1,"c":"1ª V (art. 194). 2ª V (art. 195). 3ª F: o serviço PODERÁ oferecer, QUANDO POSSÍVEL, formas de tratamento alternativo devidamente reconhecidas (art. 193, parágrafo único). 4ª V (art. 190), sob inspeção da Secretaria Municipal de Saúde quanto ao tratamento (parágrafo único).","f":"LO Paracatu, arts. 190, 193, 194 e 195","id":"8517d52"},{"m":"lm","tp":"Lei Orgânica – Assistência social","nv":1,"e":"Analise as afirmativas a seguir, de acordo com a Lei Orgânica do Município de Paracatu:\nI. O Município garantirá à população de baixa renda, na forma da lei, a gratuidade do sepultamento e dos meios e procedimentos a ele necessários.\nII. O Município poderá prestar, de forma subsidiária e conforme previsto em lei, assistência jurídica à população de baixa renda.\nIII. É assegurada a gratuidade do transporte coletivo urbano aos maiores de 60 anos.\nIV. O Município, de forma coordenada com o Estado, buscará garantir a criação e manutenção de abrigos para as mulheres e crianças vítimas de violência doméstica.\nEstão CORRETAS as afirmativas:","o":["I, II e IV, apenas.","I e III, apenas.","II, III e IV, apenas.","I, II, III e IV."],"a":0,"c":"I – art. 198. II – art. 197. IV – art. 199, II. III está errada: a Lei Orgânica fala em maiores de 65 anos (e aposentados de baixa renda) – arts. 200, III, 251 e 270, parágrafo único, III.","f":"LO Paracatu, arts. 197 a 200","id":"fe37f9e"},{"m":"lm","tp":"Lei Orgânica – Educação","nv":2,"e":"Sobre a educação na Lei Orgânica de Paracatu, assinale a alternativa INCORRETA:","o":["O ensino religioso, de matrícula facultativa, constitui disciplina dos horários normais das escolas municipais.","O Poder Público municipal assegurará atendimento em creches e pré-escolas às crianças de zero a seis anos de idade.","O ingresso no magistério público municipal se dará por concurso de provas ou de provas e títulos.","O Município não manterá nem subvencionará estabelecimentos de ensino superior."],"a":2,"c":"Art. 225, § 1º: o ingresso no magistério se dará EXCLUSIVAMENTE por concurso de provas e títulos. As demais estão nos arts. 223, 224 e 219, III.","f":"LO Paracatu, arts. 219, 223, 224 e 225","id":"edda64d"},{"m":"lm","tp":"Lei Orgânica – Política urbana e meio ambiente","nv":3,"e":"O Município de Paracatu poderá, mediante lei específica para área incluída no Plano Diretor, exigir do proprietário do solo urbano não edificado, subutilizado ou não utilizado que promova seu adequado aproveitamento. Segundo a Lei Orgânica, as sanções aplicáveis, sucessivamente, são:","o":["IPTU progressivo no tempo; parcelamento ou edificação compulsória; desapropriação com pagamento em títulos da dívida pública, com prazo de resgate de até 20 anos.","multa diária; parcelamento ou edificação compulsória; desapropriação com prévia e justa indenização em dinheiro.","parcelamento ou edificação compulsória; desapropriação com pagamento em títulos da dívida pública, com prazo de resgate de até 5 anos; IPTU progressivo no tempo.","parcelamento ou edificação compulsória; IPTU progressivo no tempo; desapropriação com pagamento em títulos da dívida pública, com prazo de resgate de até 10 anos."],"a":3,"c":"Art. 267, I a III: parcelamento ou edificação compulsória, IPTU progressivo no tempo e desapropriação paga com títulos da dívida pública (emissão aprovada pelo Senado), resgate em até 10 anos, em parcelas anuais, iguais e sucessivas.","f":"LO Paracatu, art. 267","id":"3d3bb8d"},{"m":"lm","tp":"Lei Orgânica – Política urbana e meio ambiente","nv":2,"e":"Analise as afirmativas a seguir, de acordo com a Lei Orgânica do Município de Paracatu:\nI. Os loteamentos aprovados pelo Poder Executivo só poderão ser ocupados após a implantação da infraestrutura básica, compreendida de, no mínimo, serviço de água, esgoto e energia elétrica.\nII. É vedada a concessão de qualquer incentivo, isenção ou anistia a quem tenha infringido normas de proteção ambiental durante os 12 meses subsequentes à constatação de cada infringência.\nIII. Ficam proibidos os eventos, espetáculos e atos públicos ou privados que envolvam maus-tratos e crueldade de animais.\nEstá(ão) CORRETA(S) a(s) afirmativa(s):","o":["I, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],"a":1,"c":"I – art. 272. III – art. 281, § 1º. II está errada: o prazo é de 24 meses (art. 277, § 2º).","f":"LO Paracatu, arts. 272, 277 e 281","id":"7494b24"},{"m":"lm","tp":"LC 54/2007 – Disposições transitórias","nv":1,"e":"De acordo com a LC nº 54/2007, ficam extintos pela vacância, entre outros, os cargos de:","o":["Técnico em Enfermagem e Enfermeiro.","Técnico em Radiologia e Técnico em Análise Clínica.","Agente Comunitário de Saúde e Auxiliar de Serviços de Saúde.","Nutricionista e Odontólogo."],"a":2,"c":"Art. 47: ficam extintos pela vacância os cargos de Agente Administrativo, Agente Comunitário de Saúde, Auxiliar de Serviços de Saúde, Auxiliar Técnico em Laboratório, Fiscal de Tributos e Trabalhador Braçal. Os demais cargos citados continuam no quadro da Saúde.","f":"LC 54/2007, art. 47","id":"71ee74c"},{"m":"lm","tp":"LC 54/2007 – Jornada","nv":2,"e":"Analise as afirmativas a seguir sobre a jornada semanal do pessoal da Saúde prevista na LC nº 54/2007:\nI. Enfermeiro: 24 horas.\nII. Técnico em Radiologia: 36 horas.\nIII. Nutricionista: 30 horas.\nIV. Médico ambulatório: 20 horas.\nEstão CORRETAS as afirmativas:","o":["I, II e III, apenas.","II e IV, apenas.","I, II, III e IV.","I, III e IV, apenas."],"a":3,"c":"Art. 6º, III: Enfermeiro 24 h (b), Nutricionista 30 h (g) e Médico ambulatório 20 h (a). O Técnico em Radiologia tem 24 h (k), e não 36 h.","f":"LC 54/2007, art. 6º, III","id":"352a27a"},{"m":"lm","tp":"LC 54/2007 – Jornada","nv":2,"e":"Marque V para verdadeiro e F para falso, conforme a jornada semanal fixada no art. 6º da LC nº 54/2007:\n( ) Os demais técnicos e servidores administrativos da saúde cumprem 40 horas.\n( ) Os demais profissionais de nível superior da saúde cumprem 40 horas.\n( ) O Assistente Social da Assistência Social cumpre 30 horas.\n( ) O Técnico em Higiene Dental cumpre 24 horas.\nA sequência CORRETA é:","o":["V, V, V, F.","V, F, V, F.","F, F, V, V.","V, F, F, V."],"a":1,"c":"Demais técnicos e administrativos da saúde: 40 h (art. 6º, III, m) – V. Demais profissionais de nível superior da saúde: 30 h, e não 40 h (III, l) – F. Assistente Social: 30 h (II, b) – V. Técnico em Higiene Dental: 36 h (III, j) – F.","f":"LC 54/2007, art. 6º, II e III","id":"ed06b8e"},{"m":"lm","tp":"LC 54/2007 – Jornada","nv":2,"e":"Sobre a jornada de trabalho na LC nº 54/2007, assinale a alternativa INCORRETA.","o":["Fixada por ato do Prefeito jornada semanal diversa para determinada classe, o servidor adquire direito à permanência nessa jornada.","O servidor readaptado na forma do art. 21 da LC nº 5/1991 cumpre a jornada do cargo no qual se deu a readaptação.","O Prefeito poderá, justificadamente, por ato, estabelecer para classes ou cargos que indicar jornada semanal diversa da prevista na lei.","O pessoal administrativo e de obras tem jornada de 40 horas semanais."],"a":0,"c":"O art. 7º permite ao Prefeito, justificadamente e por ato, fixar jornada diversa, mas expressamente NÃO cria para o servidor direito à permanência na jornada diversa. As demais estão no art. 6º, I, e parágrafo único, e no art. 7º.","f":"LC 54/2007, arts. 6º e 7º","id":"18797c6"},{"m":"lm","tp":"LC 54/2007 – Hora extra","nv":1,"e":"Segundo a redação dada pela LC nº 210/2026 ao art. 14 da LC nº 54/2007, o adicional por trabalho extraordinário será acrescido de:","o":["50% sobre a hora normal em dias úteis e 60% aos domingos e feriados, sendo permitida a compensação de jornada.","50% sobre a hora normal em qualquer dia, vedada a compensação de jornada.","60% sobre a hora normal em dias úteis e 100% aos domingos e feriados, sendo permitida a compensação de jornada.","50% sobre a hora normal em dias úteis e 60% aos domingos e feriados, vedada a compensação de jornada."],"a":0,"c":"O art. 14, na redação da LC 210/2026, mantém 50% (dias úteis) e 60% (domingos e feriados) e passa a prever expressamente que é permitida a compensação de jornada.","f":"LC 54/2007, art. 14, redação da LC 210/2026","id":"9566cbc"},{"m":"lm","tp":"LC 54/2007 – Hora extra","nv":1,"e":"Um técnico em enfermagem da rede municipal é convocado com frequência para trabalho extraordinário. De acordo com a LC nº 54/2007, na redação atual, o trabalho extraordinário para atender a situações excepcionais e temporárias, devidamente justificado, é limitado a:","o":["2 horas diárias, prorrogáveis por igual período.","40 horas mensais por servidor.","60 horas mensais por servidor.","50 horas mensais por servidor."],"a":3,"c":"A LC 210/2026 deu nova redação ao art. 14, §1º: o limite passou a ser de 50 horas mensais por servidor. O limite de 2 horas diárias, prorrogáveis por igual período com autorização do Secretário, era o da redação original e foi substituído.","f":"LC 54/2007, art. 14, §1º, redação da LC 210/2026","id":"3722559"},{"m":"lm","tp":"LC 54/2007 – Hora extra","nv":3,"e":"Conforme a LC nº 54/2007, com a redação dada pela LC nº 210/2026, o adicional por trabalho extraordinário que extrapole o limite regulamentado somente poderá ser pago mediante:","o":["a autorização prévia e escrita da chefia imediata, dispensada a manifestação do Prefeito.","a assinatura do Secretário titular da pasta, apenas, após parecer da Comissão Permanente de Gestão de Pessoal.","a validação das justificativas e a assinatura autorizativa do Secretário titular da pasta e do Prefeito Municipal.","a aprovação da Câmara Municipal, por se tratar de despesa excepcional."],"a":2,"c":"Art. 14, §3º: o pagamento da hora extra que extrapole o limite exige validação das justificativas e assinatura autorizativa do Secretário titular da pasta E do Prefeito. À chefia imediata e/ou coordenação cabe atestar a realização (§2º), o que não dispensa o Prefeito.","f":"LC 54/2007, art. 14, §§2º e 3º, redação da LC 210/2026","id":"95ff637"},{"m":"lm","tp":"LC 54/2007 – Hora extra","nv":2,"e":"Analise as afirmativas sobre o trabalho extraordinário na LC nº 54/2007, com a redação da LC nº 210/2026:\nI. Horas que ultrapassem o limite mensal somente poderão ocorrer em hipóteses de extrema urgência ou necessidade, com justificativa expressa e contextualizada.\nII. A realização das horas acima do limite deve ser atestada pela chefia imediata e/ou coordenação da unidade administrativa.\nIII. O regramento do adicional aplica-se também às hipóteses de plantão e sobreaviso.\nEstão CORRETAS as afirmativas:","o":["I e III, apenas.","I e II, apenas.","II e III, apenas.","I, II e III."],"a":1,"c":"I e II reproduzem o art. 14, §2º. A III está errada: o §4º diz que o artigo se aplica ao serviço extraordinário remunerado por adicional, não se confundindo com plantão, sobreaviso ou outras gratificações específicas de legislação própria.","f":"LC 54/2007, art. 14, §§2º e 4º, redação da LC 210/2026","id":"760f06e"},{"m":"lm","tp":"LC 54/2007 – Adicional noturno","nv":1,"e":"De acordo com a LC nº 54/2007, considera-se trabalho noturno o prestado no período de:","o":["22 horas de um dia às 5 horas do dia seguinte.","22 horas de um dia às 6 horas do dia seguinte.","21 horas de um dia às 5 horas do dia seguinte.","23 horas de um dia às 5 horas do dia seguinte."],"a":0,"c":"Art. 15, §2º: trabalho noturno é o prestado das 22 h de um dia às 5 h do dia seguinte. A hora noturna tem acréscimo de 20% e é computada como de 52 minutos e 30 segundos (caput e §1º).","f":"LC 54/2007, art. 15, §2º","id":"4c81ff6"},{"m":"lm","tp":"LC 54/2007 – Adicional noturno","nv":2,"e":"Uma técnica em enfermagem cumpre plantão noturno em unidade de saúde do Município. Sobre o adicional noturno previsto na LC nº 54/2007, analise as afirmativas:\nI. A hora de trabalho noturno será acrescida de 20% sobre a hora diurna.\nII. A hora de trabalho noturno será computada como de 52 minutos e 30 segundos.\nIII. Considera-se noturno o trabalho prestado das 22 horas de um dia às 6 horas do dia seguinte.\nEstão CORRETAS as afirmativas:","o":["I e III, apenas.","I e II, apenas.","II e III, apenas.","I, II e III."],"a":1,"c":"I: art. 15, caput. II: art. 15, §1º. A III está errada: o período noturno vai das 22 h de um dia às 5 h (e não 6 h) do dia seguinte (art. 15, §2º).","f":"LC 54/2007, art. 15","id":"7eb3b9a"},{"m":"lm","tp":"LC 54/2007 – Insalubridade","nv":2,"e":"Analise as afirmativas sobre as atividades insalubres, penosas ou perigosas, conforme a LC nº 54/2007:\nI. A servidora gestante ou lactante será afastada, enquanto durar a gestação e a lactação, das operações e locais insalubres, penosos ou perigosos, passando a exercer suas atividades em local salubre e em serviço não penoso e não perigoso.\nII. A concessão do adicional por atividade insalubre, penosa ou perigosa depende de indicação em laudo técnico firmado por profissional competente.\nIII. O adicional de insalubridade é devido automaticamente a todo servidor lotado em unidade de saúde.\nEstão CORRETAS as afirmativas:","o":["I e III, apenas.","II e III, apenas.","I e II, apenas.","I, II e III."],"a":2,"c":"I: art. 17, parágrafo único. II: art. 16 (legislação específica e laudo técnico). A III está errada: não há concessão automática por lotação; exige-se laudo técnico (art. 16).","f":"LC 54/2007, arts. 16 e 17","id":"a81ac3d"},{"m":"lm","tp":"LC 54/2007 – Insalubridade","nv":1,"e":"Os servidores em exercício em atividades com raio X ou substâncias radioativas, segundo a LC nº 54/2007, serão submetidos a exames médicos a cada:","o":["3 meses.","12 meses.","24 meses.","6 meses."],"a":3,"c":"Art. 18, parágrafo único: os locais e servidores que operam com raio X ou substâncias radioativas ficam sob permanente controle, com exames médicos a cada 6 meses.","f":"LC 54/2007, art. 18, parágrafo único","id":"88e8166"},{"m":"lm","tp":"LC 54/2007 – Gratificação natalina","nv":3,"e":"Sobre a gratificação natalina dos servidores da Prefeitura e da Saúde, conforme a LC nº 54/2007 com a redação da LC nº 210/2026, assinale a alternativa INCORRETA.","o":["Corresponde a 1/12 da remuneração devida no mês de dezembro por mês de exercício.","A fração igual ou superior a 15 dias de trabalho é considerada como 1 mês de exercício.","Para quem percebe remuneração variável, calcula-se à razão de 1/11 da soma das importâncias variáveis devidas nos meses trabalhados até novembro, somando-se à parte fixa.","As gratificações instituídas pela LC nº 161/2023 integram o cálculo da gratificação natalina."],"a":3,"c":"O §3º do art. 19, incluído pela LC 210/2026, determina que as gratificações da LC 161/2023 NÃO serão computadas para o cálculo da natalina. As demais reproduzem o caput e os §§1º e 2º.","f":"LC 54/2007, art. 19, redação da LC 210/2026","id":"bc14350"},{"m":"lm","tp":"LC 54/2007 – Conceitos","nv":1,"e":"De acordo com as definições da LC nº 54/2007, \"o conjunto de cargos com a mesma denominação, com atribuições da mesma natureza e o mesmo grau de responsabilidade e o mesmo nível de vencimento\" corresponde a:","o":["carreira.","grupo ocupacional.","classe.","quadro de pessoal."],"a":2,"c":"Art. 2º, VII: é a definição de classe. Carreira é a escala de vencimentos dividida em padrões (IV); grupo ocupacional reúne cargos efetivos pela natureza da atividade, com carreiras próprias (VIII); quadro de pessoal é o conjunto de classes de cargos efetivos e em comissão (IX).","f":"LC 54/2007, art. 2º, VII","id":"6ab3b74"},{"m":"lm","tp":"LC 54/2007 – Conceitos","nv":2,"e":"Numere a COLUNA II de acordo com a COLUNA I, conforme as definições da LC nº 54/2007.\nCOLUNA I\n1. Carreira\n2. Nível de vencimento\n3. Padrão de vencimento\n4. Tabela de vencimento\nCOLUNA II\n( ) Conjunto de valores a partir do vencimento base, escalonados horizontalmente e dispostos em ordem alfabética.\n( ) Escala de vencimentos dividida em padrões, em que se dá o desenvolvimento do servidor pelos critérios de merecimento e conhecimento.\n( ) Conjunto de valores a partir do vencimento base, escalonados horizontalmente e verticalmente.\n( ) Conjunto de valores a partir do vencimento base, escalonados verticalmente e enumerados sequencialmente em algarismo romano.\nA sequência CORRETA é:","o":["3, 1, 4, 2.","2, 1, 4, 3.","3, 4, 1, 2.","4, 1, 3, 2."],"a":0,"c":"Art. 2º: padrão = horizontal, ordem alfabética (XII); carreira = escala dividida em padrões (IV); tabela = horizontal e vertical (X); nível = vertical, algarismo romano (XI).","f":"LC 54/2007, art. 2º, IV, X, XI e XII","id":"3d55f84"},{"m":"lm","tp":"LC 54/2007 – Progressão por merecimento","nv":1,"e":"São exigências para a progressão horizontal por merecimento do servidor efetivo da Prefeitura e da Saúde, segundo a LC nº 54/2007, EXCETO:","o":["haver completado 730 dias de efetivo exercício na classe.","ter cumprido 1.095 dias de efetivo exercício no cargo.","não haver sofrido, nos seis meses que antecederem a progressão, pena disciplinar de suspensão.","ter obtido conceito favorável na avaliação de desempenho, apurada por comissão designada para esse fim."],"a":1,"c":"Art. 21: I – 730 dias de efetivo exercício na classe; II – sem pena de suspensão nos 6 meses anteriores; III – conceito favorável na avaliação de desempenho. Não há exigência de 1.095 dias.","f":"LC 54/2007, art. 21, redação da LC 210/2026","id":"b05e1fd"},{"m":"lm","tp":"LC 54/2007 – Avaliação de desempenho","nv":1,"e":"A comissão que apura a avaliação de desempenho para fins de progressão por merecimento dos servidores da Prefeitura e da Saúde, nos termos da LC nº 54/2007, é designada por indicação:","o":["exclusiva do Secretário Municipal de Saúde.","paritária do Secretário Municipal de Educação e do órgão de representação dos servidores.","paritária do Prefeito Municipal e do órgão de representação dos servidores.","da Câmara Municipal, ouvido o sindicato da categoria."],"a":2,"c":"Art. 21, III: comissão designada por indicação paritária do Prefeito Municipal e do órgão de representação dos servidores. Na LC 55 (Educação), a indicação paritária é do Secretário Municipal de Educação e do órgão de representação (art. 29, III).","f":"LC 54/2007, art. 21, III","id":"2c13bb8"},{"m":"lm","tp":"LC 54/2007 – Avaliação de desempenho","nv":3,"e":"Analise as afirmativas sobre a avaliação de desempenho na LC nº 54/2007:\nI. É efetuada no mês em que o servidor completar 730 dias de efetivo exercício e refere-se ao desempenho nos últimos 24 meses.\nII. Será considerado habilitado para a progressão o servidor que obtiver média geral mínima de 70% no conjunto dos fatores de avaliação.\nIII. A avaliação deverá ser exibida ao servidor, para que dela tome conhecimento, assegurando-lhe a ampla defesa e o contraditório.\nIV. Será feita com base em critérios objetivos estabelecidos em Decreto do Prefeito Municipal.\nEstão CORRETAS as afirmativas:","o":["I, II e III, apenas.","II e IV, apenas.","I, II, III e IV.","I, III e IV, apenas."],"a":3,"c":"I: art. 24, caput. III: art. 24, §1º. IV: art. 21, §3º. A II está errada: exige-se no mínimo 70% EM CADA fator de avaliação (art. 24, §2º), e não média geral.","f":"LC 54/2007, arts. 21, §3º, e 24","id":"5310e51"},{"m":"lm","tp":"LC 54/2007 – Progressão por merecimento","nv":2,"e":"De acordo com a LC nº 54/2007, NÃO se computa para fins de progressão por merecimento o tempo em que o servidor:","o":["estiver nomeado para cargo em comissão.","estiver em gozo de licença sem remuneração.","estiver em situação que a legislação municipal considere como de efetivo exercício.","estiver em exercício regular das atribuições do cargo efetivo."],"a":1,"c":"Art. 23: não se computam o tempo à disposição de órgão não integrante da Administração Municipal sem ônus para a Prefeitura e o tempo de licença sem remuneração. O afastamento para cargo em comissão e os casos previstos como efetivo exercício são computados (art. 21, §1º).","f":"LC 54/2007, arts. 21, §1º, e 23","id":"4cca3ac"},{"m":"lm","tp":"LC 54/2007 – Progressão por merecimento","nv":2,"e":"Um técnico em enfermagem completou o período aquisitivo de 730 dias para progressão por merecimento em 10 de março. De acordo com a LC nº 54/2007, a contagem do novo período aquisitivo será iniciada:","o":["no dia 11 de março, dia seguinte ao término do período anterior.","na data da publicação do ato que conceder a progressão.","no primeiro dia do mês seguinte à avaliação de desempenho.","na data em que o servidor for comunicado do resultado da avaliação."],"a":0,"c":"Art. 21, §2º: a contagem para novo período aquisitivo será iniciada, sempre, no dia seguinte àquele em que o servidor houver completado o período anterior.","f":"LC 54/2007, art. 21, §2º","id":"2955225"},{"m":"lm","tp":"LC 54/2007 – Progressão por conhecimento","nv":1,"e":"Uma técnica em enfermagem, servidora efetiva já aprovada no estágio probatório, concluiu graduação em Enfermagem, escolaridade que não é requisito do seu cargo. Nos termos da LC nº 54/2007, ela poderá requerer progressão por conhecimento, com avanço de:","o":["uma letra na faixa de vencimentos prevista para o seu cargo.","um nível de vencimento, com mudança para o cargo de Enfermeiro.","duas letras na faixa de vencimentos prevista para o seu cargo.","três letras, por se tratar de formação na área da saúde."],"a":2,"c":"Art. 25, I: avanço de duas letras quando o servidor apresentar diploma de graduação de ensino superior compatível com a área em que atua, desde que essa escolaridade não seja requisito do cargo. A progressão é horizontal (padrões/letras) e não gera mudança de cargo.","f":"LC 54/2007, art. 25, I, redação da LC 210/2026","id":"f4c64fa"},{"m":"lm","tp":"LC 54/2007 – Progressão por conhecimento","nv":2,"e":"Marque V para verdadeiro e F para falso, de acordo com a progressão por conhecimento prevista na LC nº 54/2007:\n( ) O certificado de especialização correlata às atividades do cargo, com carga horária igual ou superior a 360 horas, gera avanço de duas letras, concedido uma única vez.\n( ) O diploma de mestrado correlato gera avanço de duas letras, podendo ser concedido a cada novo mestrado concluído.\n( ) O requerimento é dirigido à Comissão Permanente de Gestão de Pessoal, que analisa e confere a autenticidade da documentação.\n( ) Juntamente com o requerimento devem ser apresentados o original e cópia dos documentos comprobatórios.\nA sequência CORRETA é:","o":["V, V, V, F.","V, F, V, V.","F, F, V, V.","V, F, F, V."],"a":1,"c":"Art. 25, III: especialização de no mínimo 360 h, duas letras, uma única vez (V). Art. 25, IV: mestrado também é concedido UMA ÚNICA VEZ (F). Art. 25, §1º: Comissão Permanente de Gestão de Pessoal (V). Art. 25, §3º: original e cópia (V).","f":"LC 54/2007, art. 25, redação da LC 210/2026","id":"b11d7cf"},{"m":"lm","tp":"LC 54/2007 – Progressão por conhecimento","nv":3,"e":"Um servidor da Saúde requereu progressão por conhecimento apresentando declaração de conclusão de curso, pois a instituição ainda não havia expedido o diploma. Conforme a LC nº 54/2007, é CORRETO afirmar que:","o":["o diploma deverá ser apresentado no prazo de doze meses, prorrogável uma única vez por doze meses, mediante requerimento instruído com declaração da instituição; não apresentado, os valores recebidos serão restituídos em folha.","o diploma deverá ser apresentado no prazo de seis meses, prorrogável sucessivamente enquanto durar o processo de expedição.","a declaração de conclusão substitui definitivamente o diploma, não havendo prazo para sua apresentação.","não apresentado o diploma no prazo, o servidor perde a progressão, mas fica dispensado de restituir os valores já recebidos, por sua natureza alimentar."],"a":0,"c":"Art. 26, §§1º a 3º: declaração de conclusão aceita, diploma em 12 meses; prorrogação uma única vez por 12 meses, com declaração da instituição sobre o estágio do processo; sem o diploma, os valores percebidos são restituídos em folha de pagamento, na forma da lei.","f":"LC 54/2007, art. 26, redação da LC 210/2026","id":"7291c77"},{"m":"lm","tp":"LC 54/2007 – Progressão","nv":2,"e":"Com a redação dada pela LC nº 210/2026, a LC nº 54/2007 passou a prever, em seu art. 29-A, que o servidor só terá direito à progressão de que trata a seção:","o":["após cinco anos de efetivo exercício no cargo.","após obter conceito favorável em duas avaliações de desempenho consecutivas.","após autorização expressa da Câmara Municipal.","após cumprido o estágio probatório."],"a":3,"c":"O art. 29-A, incluído pela LC 210/2026, dispõe que o servidor só terá direito à progressão de que trata a seção após cumprido o estágio probatório. Regra equivalente foi incluída na LC 55 (art. 35-A).","f":"LC 54/2007, art. 29-A, redação da LC 210/2026","id":"9e6f25f"},{"m":"lm","tp":"LC 54/2007 – Progressão","nv":2,"e":"Marque V para verdadeiro e F para falso, conforme o desenvolvimento na carreira previsto na LC nº 54/2007, com a redação da LC nº 210/2026:\n( ) O servidor cedido poderá requerer progressão por conhecimento a qualquer tempo, passando a percebê-la, automaticamente, no mês em que reassumir as atribuições de seu cargo efetivo.\n( ) O servidor ocupante de cargo em comissão não tem direito à progressão no cargo efetivo de que seja titular.\n( ) O servidor já posicionado no último padrão da faixa de progressão prevista para o seu cargo pode continuar progredindo.\n( ) O desenvolvimento do servidor efetivo na carreira dá-se mediante progressão horizontal, de um padrão para outro, por merecimento e/ou por conhecimento.\nA sequência CORRETA é:","o":["V, V, F, V.","F, F, V, V.","V, F, V, F.","V, F, F, V."],"a":3,"c":"Art. 28: o cedido pode requerer a qualquer tempo e recebe ao reassumir (V). Arts. 22 e 27: o comissionado TEM direito à progressão no efetivo (F). Art. 29: não se concede progressão a quem está no último padrão (F). Art. 20: progressão horizontal, de um padrão para outro, por merecimento e/ou conhecimento (V).","f":"LC 54/2007, arts. 20, 22, 27, 28 e 29, redação da LC 210/2026","id":"78cb369"},{"m":"lm","tp":"LC 54/2007 – Enquadramento","nv":3,"e":"Sobre as regras de enquadramento da LC nº 54/2007, analise as afirmativas:\nI. O servidor efetivo será posicionado no padrão base do nível de vencimento previsto para o seu cargo, contando-se, a partir dessa data, o interstício para aquisição de progressão.\nII. Se o vencimento percebido for superior ao vencimento base do cargo e não houver na tabela padrão de valor correspondente, o servidor será posicionado no padrão de valor imediatamente inferior.\nIII. O servidor em desvio de função retornará, imediatamente, ao cargo efetivo de origem e será enquadrado em relação a este.\nIV. O enquadramento será processado por Decreto do Prefeito, observado o relatório da Comissão de Enquadramento.\nEstão CORRETAS as afirmativas:","o":["I, II e IV, apenas.","I, III e IV, apenas.","II e III, apenas.","I, II, III e IV."],"a":1,"c":"I: art. 30, §1º. III: art. 30, §4º. IV: art. 32. A II está errada: inexistindo padrão de valor correspondente, o servidor é posicionado no padrão de valor imediatamente SUPERIOR (art. 30, §3º).","f":"LC 54/2007, arts. 30 e 32","id":"f47fe10"},{"m":"lm","tp":"LC 54/2007 – Disposições transitórias","nv":3,"e":"A LC nº 54/2007 determinou que os ocupantes de cargo efetivo de Auxiliar de Enfermagem, Auxiliar Técnico de Laboratório e Operador de Raio X apresentassem certificado de conclusão de curso técnico. Caso o servidor não o apresentasse no prazo previsto, a consequência legal seria:","o":["a perda do direito à progressão na carreira prevista na lei, sendo o prazo de 2 anos contados da data da lei.","a exoneração de ofício, sendo o prazo de 2 anos contados da data da lei.","a perda do direito à progressão na carreira prevista na lei, sendo o prazo de 5 anos contados da data da lei.","a readaptação compulsória em cargo de nível fundamental, sendo o prazo de 1 ano contado da data da lei."],"a":0,"c":"Art. 48: prazo máximo de 2 anos, contados da data da lei, para apresentar o certificado de curso técnico. Parágrafo único: não apresentado, o servidor não terá direito à progressão na carreira prevista na lei.","f":"LC 54/2007, art. 48","id":"53db5d0"},{"m":"lm","tp":"LC 54/2007 – Saúde – PSF","nv":3,"e":"O servidor efetivo, médico ou enfermeiro, designado para exercer atribuições no Programa da Saúde da Família (PSF) recebe, enquanto permanecer nessa situação, parcela retribuitória prevista na LC nº 54/2007. Sobre essa parcela, analise as afirmativas:\nI. Corresponde à diferença verificada entre o valor dos vencimentos do servidor e o valor de referência fixado em legislação específica do PSF.\nII. Será paga discriminadamente.\nIII. Incorpora-se ao vencimento e integra a remuneração para efeito de cálculo de contribuição previdenciária.\nEstão CORRETAS as afirmativas:","o":["I e III, apenas.","II e III, apenas.","I e II, apenas.","I, II e III."],"a":2,"c":"I: art. 36, caput. II: art. 36, §1º. A III está errada: a parcela NÃO se incorpora ao vencimento e NÃO integra a remuneração para cálculo de contribuição previdenciária (art. 36, §2º).","f":"LC 54/2007, art. 36","id":"1c0a753"},{"m":"lm","tp":"LC 54/2007 – Quadros e cargos","nv":2,"e":"Analise as afirmativas, conforme a LC nº 54/2007:\nI. No mínimo 5% dos cargos de provimento em comissão serão destinados aos servidores ocupantes de cargos efetivos.\nII. A contratação de pessoal para atender a necessidade temporária de excepcional interesse público dar-se-á através de contrato de direito administrativo, mediante processo público simplificado.\nIII. O servidor nomeado em virtude de aprovação em concurso público será posicionado no padrão final do nível de vencimento previsto para o cargo.\nIV. Ao servidor ocupante exclusivamente de cargo em comissão poderá ser concedida licença para tratar de interesse particular.\nEstão CORRETAS as afirmativas:","o":["I e II, apenas.","I, II e III, apenas.","II e IV, apenas.","I, III e IV, apenas."],"a":0,"c":"I: art. 5º, parágrafo único. II: art. 3º, parágrafo único (republicado pela LC 210/2026). III errada: o nomeado é posicionado no padrão INICIAL (art. 11, §5º). IV errada: ao ocupante exclusivamente de cargo em comissão não será concedida licença para interesse particular (art. 35).","f":"LC 54/2007, arts. 3º, 5º, 11, §5º, e 35","id":"ef184c9"},{"m":"lm","tp":"LC 54/2007 – Quadros e cargos","nv":2,"e":"Nos anexos da LC nº 54/2007 alterados pela LC nº 210/2026, o cargo de Técnico em Enfermagem figura:","o":["no nível de escolaridade \"Ensino Superior\" e no grupo ocupacional \"Apoio Operacional\".","no nível de escolaridade \"Ensino Médio\" e no grupo ocupacional \"Apoio Administrativo\".","no nível de escolaridade \"Ensino Fundamental\" e no grupo ocupacional \"Operacional\".","no nível de escolaridade \"Ensino Médio e Curso Técnico\" e no grupo ocupacional \"Saúde e Assistência Social\"."],"a":3,"c":"A LC 210/2026 (art. 4º) alterou os Anexos VI (escolaridade) e VII (grupos ocupacionais) da LC 54. No Anexo VI, o Técnico em Enfermagem está em \"Ensino Médio e Curso Técnico\"; no Anexo VII, no Grupo VII – Saúde e Assistência Social.","f":"LC 54/2007, Anexos VI e VII, redação da LC 210/2026","id":"cae12db"},{"m":"lm","tp":"LC 55/2007 – Licença para pós-graduação","nv":2,"e":"Com a redação dada pela LC nº 210/2026, a LC nº 55/2007 passou a permitir que o servidor público efetivo da Educação Pública Municipal obtenha licença do exercício do cargo para participar de programas de pós-graduação stricto sensu. Sobre essa licença, é CORRETO afirmar que:","o":["é concedida sem remuneração, para curso em qualquer modalidade, inclusive a distância.","é concedida com remuneração integral, para curso realizado na modalidade presencial.","é concedida com remuneração integral, abrangendo também cursos de especialização lato sensu.","é concedida com metade da remuneração, para curso realizado na modalidade presencial."],"a":1,"c":"Art. 19-A, caput: licença com remuneração integral para pós-graduação stricto sensu (mestrado, doutorado ou pós-doutorado), desde que na modalidade presencial. Especialização lato sensu não está abrangida.","f":"LC 55/2007, art. 19-A, redação da LC 210/2026","id":"151d497"},{"m":"lm","tp":"LC 55/2007 – Licença para pós-graduação","nv":1,"e":"De acordo com o art. 19-A da LC nº 55/2007, incluído pela LC nº 210/2026, a licença para pós-graduação stricto sensu poderá ter duração máxima de:","o":["2 anos para mestrado, 4 anos para doutorado e 1 ano para pós-doutorado.","1 ano para mestrado, 3 anos para doutorado e 1 ano para pós-doutorado.","1 ano para mestrado, 2 anos para doutorado e 2 anos para pós-doutorado.","2 anos para mestrado, 2 anos para doutorado e 2 anos para pós-doutorado."],"a":2,"c":"Art. 19-A, §4º: duração máxima de 1 ano para mestrado, 2 anos para doutorado e 2 anos para pós-doutorado. O período é considerado de efetivo exercício para todos os efeitos legais.","f":"LC 55/2007, art. 19-A, §4º, redação da LC 210/2026","id":"be8beee"},{"m":"lm","tp":"LC 55/2007 – Licença para pós-graduação","nv":2,"e":"São condições para a licença para pós-graduação stricto sensu prevista no art. 19-A da LC nº 55/2007, EXCETO:","o":["aprovação em processo seletivo de instituição de ensino superior reconhecida pelo MEC.","ter, no mínimo, dez anos de efetivo exercício na Rede Municipal de Educação.","aprovação no estágio probatório.","compromisso de permanência no serviço público por período equivalente ao do afastamento, sob pena de devolução dos valores recebidos."],"a":1,"c":"Art. 19-A, I a V: aprovação em seletivo de IES reconhecida pelo MEC; aprovação no estágio probatório; anuência da chefia imediata e autorização do dirigente máximo da Secretaria Municipal de Educação e Tecnologia; plano de estudos e cronograma; compromisso de permanência por período equivalente. Não há exigência de tempo mínimo de dez anos (o tempo de serviço só é critério de desempate, §6º, I).","f":"LC 55/2007, art. 19-A, redação da LC 210/2026","id":"b893ac7"},{"m":"lm","tp":"LC 55/2007 – Licença para pós-graduação","nv":3,"e":"Analise as afirmativas sobre a licença para pós-graduação stricto sensu da LC nº 55/2007, com a redação da LC nº 210/2026:\nI. O período de afastamento é considerado de efetivo exercício, inclusive para a contagem do interstício necessário à progressão por merecimento ou conhecimento.\nII. É vedado ao servidor licenciado acumular a remuneração com bolsas de estudo de agências de fomento.\nIII. A remuneração do licenciado exclui as vantagens condicionadas ao efetivo exercício em determinadas atividades ou locais.\nIV. Durante o afastamento, o servidor continuará contribuindo para o regime de previdência ao qual esteja vinculado.\nEstão CORRETAS as afirmativas:","o":["I, III e IV, apenas.","I, II e IV, apenas.","II e III, apenas.","I, II, III e IV."],"a":0,"c":"I: art. 19-A, §4º. III: §1º (vencimento básico + vantagens permanentes, excluídas as condicionadas ao exercício em certas atividades ou locais). IV: §2º. A II está errada: o §3º PERMITE o acúmulo com bolsas de agências de fomento, respeitadas as normas da financiadora e com ciência da Administração.","f":"LC 55/2007, art. 19-A, §§1º a 4º, redação da LC 210/2026","id":"f9dfda0"},{"m":"lm","tp":"LC 55/2007 – Licença para pós-graduação","nv":3,"e":"Caso o número de interessados na licença para pós-graduação stricto sensu ultrapasse o limite anual de vagas, a LC nº 55/2007 (redação da LC nº 210/2026) prevê processo seletivo interno. Analise as afirmativas:\nI. Um dos critérios de priorização é o menor índice de absenteísmo, considerado o histórico dos últimos 3 anos até a data do protocolo do pedido de licença.\nII. Terão prioridade os servidores com maior tempo de serviço na Rede Municipal de Educação.\nIII. O processo seletivo será realizado por comissão composta por representantes da Secretaria Municipal de Educação e Tecnologia, do sindicato da categoria e de profissionais da área acadêmica.\nIV. A decisão final será homologada pelo Prefeito Municipal, que poderá desconsiderar a ordem de classificação.\nEstão CORRETAS as afirmativas:","o":["I e IV, apenas.","II, III e IV, apenas.","I, II e III, apenas.","I, II, III e IV."],"a":2,"c":"I e II: art. 19-A, §6º
