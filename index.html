  var simsDone=SIMS.filter(function(s){var x=simStats(s);return x.fin||(!x.exam&&x.n===s.keys.length)});
  var by={};Object.keys(QB).forEach(function(k){var q=QB[k].q,a=S.ans[k];by[q.m]=by[q.m]||{t:0,n:0,ok:0};by[q.m].t++;if(a){by[q.m].n++;if(a.c===q.a)by[q.m].ok++}});
  var D=new Date(u.at||Date.now()),h='<div class="glass pf-head"><span class="av">'+esc(first.charAt(0).toUpperCase())+'</span><div class="tx"><h1>Olá, '+esc(first)+'</h1><small>'+esc(u.n)+' · conta criada em '+D.toLocaleDateString('pt-BR')+'</small><small>'+(SY.state==='ok'?'Tudo salvo na sua conta.':SY.state==='err'?'Sem conexão agora: seu progresso será salvo quando a internet voltar.':'Salvando…')+'</small></div>'+examPill()+'<button class="gbtn" id="pfOut">Sair</button></div>';
  var T=[[cs.c+'/'+cs.tot,'aulas assistidas'],[qs.n,'questões respondidas'],[qs.n?Math.round(qs.ok/qs.n*100)+'%':'–','de acerto'],[plural(st.cur,'dia','dias'),'sequência atual (recorde: '+st.best+')'],[simsDone.length,'simulados concluídos'],[fix,'flashcards bem fixados']];
  h+='<div class="pf-tiles">'+T.map(function(t){return '<div class="glass tile"><b>'+t[0]+'</b><small>'+t[1]+'</small></div>'}).join('')+'</div>';
  /* recomendações */
  var R=[],mats=['pt','rl','in','lm','ce'],dte=daysToExam();
  var g=SIMS.filter(function(s){return s.tipo==='g'}),gDone=g.filter(function(s){var x=simStats(s);return x.fin}),gNext=g.filter(function(s){var x=simStats(s);return !x.fin&&!x.n})[0];
  if(gNext)R.push({ic:I_CLOCK,m:'ce',t:gDone.length?'Faça mais um simulado no tempo de prova':'Faça seu primeiro simulado no modo prova',d:(dte>=0?'Faltam '+plural(dte,'dia','dias')+' para a prova. ':'')+'30 questões em 3 h, com a nota pelos pesos do edital.',go:function(){S.quiz=null;var A=att(gNext.id);A._exam=1;A._t0=Date.now();saveAns();startQuiz('sim',gNext.keys,null,gNext.id)}});
  var weak=mats.filter(function(m){return by[m]&&by[m].n>=5}).sort(function(a,b){return by[a].ok/by[a].n-by[b].ok/by[b].n})[0];
  if(weak&&by[weak].ok/by[weak].n<.75)R.push({m:weak,t:'Reforce '+MAT[weak],d:'É onde você mais erra ('+Math.round(by[weak].ok/by[weak].n*100)+'% de acerto). Treine 20 questões que você ainda não fez.',go:function(){S.tr={m:weak,tp:'todos',n:20,f:'novas'};var ks=shuffle(poolKeys()).slice(0,20);if(!ks.length){S.tr.f='todas';ks=shuffle(poolKeys()).slice(0,20)}startQuiz('treino',ks,0)}});
  var low=mats.filter(function(m){return by[m]&&m!==weak}).sort(function(a,b){return by[a].n/by[a].t-by[b].n/by[b].t})[0];
  if(low&&by[low].n/by[low].t<.5)R.push({m:low,t:'Pratique mais '+MAT[low],d:'Você fez '+by[low].n+' de '+by[low].t+' questões dessa matéria.'+(low==='lm'?' Vale 15 pontos e não pode zerar.':''),go:function(){S.tr={m:low,tp:'todos',n:20,f:'novas'};startQuiz('treino',shuffle(poolKeys()).slice(0,20),0)}});
  if(wk)R.push({ic:ICON.alert,m:'pt',t:'Refaça '+plural(wk,'questão errada','questões erradas'),d:'Acertou ao refazer, a questão sai do caderno.',go:function(){S.errTab='erros';S.quiz=null;setView('erros')}});
  if(fd)R.push({m:'rl',t:'Revise '+plural(fd,'flashcard','flashcards')+' de hoje',d:'Leva poucos minutos e fixa o que você já estudou.',go:function(){setView('cards')}});
  else if(!Object.keys(S.fc).length)R.push({m:'rl',t:'Comece os flashcards',d:CARDS.length+' cartões com os pontos que mais caem.',go:function(){setView('cards')}});
  if(by.lm&&by.lm.n>=5&&by.lm.ok/by.lm.n<.6)R.push({m:'lm',t:'Revise as dicas de Legislação Municipal',d:'Pegadinhas da Lei Orgânica e das leis complementares de Paracatu.',go:function(){S.resF='lm';setView('resumos')}});
  var nd=nextDay(),dd=dayOf(nd);if(cs.c<cs.tot&&dd)R.push({ic:ICON.play,m:'in',t:'Continue as aulas: dia '+nd,d:dd.s+', '+plural(dd.f.length-seen(dd),'aula restante','aulas restantes')+'.',go:function(){openDay(nd,firstUnseen(dd),false)}});
  h+='<h2 class="sec sm">Recomendado para você</h2><div class="recs">'+(R.length?R.slice(0,5).map(function(r,i){return '<button class="rec" data-r="'+i+'" style="--mc:var(--m-'+r.m+')"><span class="ic">'+(r.ic||ICON[MATIC[r.m]])+'</span><span class="tx"><b>'+esc(r.t)+'</b><small>'+esc(r.d)+'</small></span>'+CHEV+'</button>'}).join(''):'<p class="empty">Tudo em dia. Faça um treino livre para manter o ritmo.</p>')+'</div>';
  h+='<h2 class="sec sm">Desempenho por matéria</h2><div class="glass subj">'+mats.map(function(m){var b=by[m];if(!b)return '';var p=b.n?b.ok/b.n:0;
    return '<div class="srow"><span class="ic">'+ICON[MATIC[m]]+'</span><div><b>'+MAT[m]+'</b><div class="dline" style="--p:'+p+'"><i></i></div><small>'+b.n+' de '+b.t+' feitas'+(b.n?', '+b.ok+' certas':'')+'</small></div><span class="pc">'+(b.n?Math.round(p*100)+'%':'–')+'</span></div>'}).join('')+'</div>';
  if(simsDone.length)h+='<div class="glass pf-sims"><h4>Simulados concluídos</h4>'+simsDone.map(function(s){var x=simStats(s);return '<div class="row"><b>'+esc(s.nome)+'</b><span>'+x.ok+'/'+s.keys.length+' · '+Math.round(x.ok/s.keys.length*100)+'%</span></div>'}).join('')+'</div>';
  host.innerHTML=h;
  $('pfOut').onclick=function(){if(confirm('Sair da sua conta neste aparelho?'))logout()};
  host.querySelector('.recs').onclick=function(e){var b=e.target.closest('[data-r]');if(b)R[+b.dataset.r].go()};
}

var hits=[];

  hits=[];S.days.forEach(function(d){d.f.forEach(function(x,i){if(fold(x[1]).indexOf(q)>-1)hits.push({d:d.d,i:i,s:d.s,t:x[1]})})});

    return '<button class="rrow" data-k="'+k+'"><span class="ic">'+ICON[a.d?sk(a.s)[1]:'x']+'</span><span class="tx"><b>'+esc(pretty(a.t))+'</b><small>'+(a.d?'Dia '+a.d+', '+a.s:esc(a.s))+'</small></span>'+CHEV+'</button>'}).join('')
    :'<p class="empty">Nenhuma aula com esse termo. Tente uma palavra mais curta, como "SUS" ou "crase".</p>'});

document.addEventListener('keydown',function(e){if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(S.quiz&&(S.view==='simulados'||S.view==='erros')){var k=e.key.toLowerCase();var ix='abcd'.indexOf(k);if(ix>-1&&!qAns(S.quiz.keys[S.quiz.i])){answer(ix);return}
    if(e.key==='ArrowRight'&&$('qNext'))$('qNext').click();if(e.key==='ArrowLeft'&&!$('qPrev').disabled)$('qPrev').click();return}
  if(VP.el&&S.playing&&!e.ctrlKey&&!e.metaKey&&!e.altKey){var K=e.key;
    if((K===' '||K==='k')&&e.target.tagName!=='BUTTON'){e.preventDefault();vpToggle();vpPoke();return}
    if(!e.shiftKey&&(K==='ArrowLeft'||K==='j')){e.preventDefault();vpSkip(-10);vpPoke();return}
    if(!e.shiftKey&&(K==='ArrowRight'||K==='l')){e.preventDefault();vpSkip(10);vpPoke();return}
    if(K==='f'){vpFs();return}}
  if(S.view==='aulas'){if(e.key==='m')$('mark').click();else if(e.key==='ArrowRight'&&e.shiftKey)$('nextLesson').click();else if(e.key==='ArrowLeft'&&e.shiftKey)$('prevLesson').click()}
  if(e.key==='/'){e.preventDefault();$('searchBtn').click()}});

/* ---------- desbloqueio (PIN conferido no servidor) ---------- */
function start(data){S.days=data.days;S.extras=data.extras||[];$('gate').hidden=true;$('app').hidden=false;
  $('brandSub').textContent=COURSE.nome+', '+COURSE.orgao;
  var found=null;if(S.last)S.days.forEach(function(d){d.f.forEach(function(x,i){if(x[0]===S.last&&seen(d)<d.f.length)found={d:d.d,i:i}})});
  var d=found?found.d:nextDay();S.sel={d:d};S.block=Math.floor((d-1)/8);S.idx=found?found.i:firstUnseen(dayOf(d));S.playing=false;
  updateBadges();setView('inicio')}
function showGate(msg){$('gate').hidden=false;$('app').hidden=true;$('pinErr').textContent=msg||'';$('pin').disabled=false;$('pinBtn').disabled=false;
  var u=store.get('a80u',null);if(u&&!$('gName').value)$('gName').value=u.n;setTimeout(function(){($('gName').value?$('pin'):$('gName')).focus()},50)}
function gateMode(m){var f=$('gateForm');f.dataset.m=m;[].forEach.call(f.querySelectorAll('.gtabs button'),function(b){b.classList.toggle('on',b.dataset.m===m)});
  $('pinBtn').textContent=m==='up'?'Criar conta':'Entrar';$('pin').autocomplete=m==='up'?'new-password':'current-password';
  $('gSub').textContent=m==='up'?'Escolha um nome e uma senha (mínimo de 4 caracteres). Para criar a conta, use o código de convite que você recebeu.':'Entre com seu nome e sua senha. Seu progresso fica salvo na sua conta, em qualquer aparelho.';$('pinErr').textContent=''}
$('gateForm').querySelector('.gtabs').onclick=function(e){var b=e.target.closest('[data-m]');if(b)gateMode(b.dataset.m)};
var API='https://script.google.com/macros/s/AKfycbzun46yqrr2eSUCpxfc4nEgmlK5lbNVjco9dd3jc9jDZxglvsdHj6B8td3rLRVsQBO5kw/exec';
function callApi(secret,ok,fail,extra){
  if(window.google&&google.script&&google.script.run){if(extra){fail();return}google.script.run.withSuccessHandler(ok).withFailureHandler(fail).getData(secret);return}
  fetch(API,{method:'POST',body:JSON.stringify(Object.assign({s:secret},extra||{})),credentials:'omit',redirect:'follow'})
    .then(function(r){if(!r.ok)throw new Error('http');return r.text()})
    .then(function(t){t=(t||'').trim();ok(!t||t==='null'?null:t==='"locked"'?'locked':t)})
    .catch(fail)}
function fetchData(secret,silent,extra){
  if(!silent){$('pinBtn').disabled=true;$('pinErr').textContent=''}
  callApi(secret,function(r){
    $('pinBtn').disabled=false;
    if(r==='locked'){if(!S.days.length)showGate('Muitas tentativas erradas. Espere 15 minutos e tente de novo.');return}
    if(!r){store.del('a80t');if(silent){showGate('Sua sessão expirou. Entre de novo.')}else{$('pinErr').textContent='Não foi possível entrar. Tente de novo.'}return}
    r=JSON.parse(r);
    if(r.err){var M={login:'Nome ou senha incorretos.',code:'Código de convite incorreto.',exists:'Já existe uma conta com esse nome. Entre com ela ou escolha outro nome.',name:'Digite seu nome.',pass:'A senha precisa ter pelo menos 4 caracteres.'};$('pinErr').textContent=M[r.err]||'Não foi possível entrar.';return}
    store.set('a80t',r.token);if(r.user){setUser(r.user);var ch=syncIn(r.prog,r.user)}
    vpSetTok(r.vt);
    var fresh=JSON.stringify(r.data),old=JSON.stringify(store.get('a80d',null));store.set('a80d',r.data);
    if(!S.days.length)start(r.data);
    else if((fresh!==old||ch)&&!S.playing&&!S.quiz){S.days=r.data.days;S.extras=r.data.extras||[];updateBadges();setView(S.view)}
  },function(){
    $('pinBtn').disabled=false;
    if(!S.days.length)showGate('Não foi possível conectar. Verifique a internet e tente de novo.');
  },extra)}
$('gateForm').onsubmit=function(e){e.preventDefault();var m=$('gateForm').dataset.m,n=$('gName').value.trim(),p=$('pin').value;
  if(!n){$('pinErr').textContent='Digite seu nome.';$('gName').focus();return}
  if(!p){$('pinErr').textContent='Digite sua senha.';$('pin').focus();return}
  if(m==='up'){if(p.length<4){$('pinErr').textContent='A senha precisa ter pelo menos 4 caracteres.';return}
    if(p!==$('gPass2').value){$('pinErr').textContent='As senhas não são iguais.';$('gPass2').focus();return}
    if(!$('gCode').value.trim()){$('pinErr').textContent='Digite o código de convite.';$('gCode').focus();return}}
  $('pinErr').textContent=m==='up'?'Criando sua conta…':'Entrando…';
  fetchData(null,false,m==='up'?{a:'reg',n:n,p:p,c:$('gCode').value.trim()}:{a:'login',n:n,p:p})};
(function boot(){
  var t=store.get('a80t',null),d=store.get('a80d',null);
  if(!isUserTok(t)){store.del('a80t');t=null}
  var u=store.get('a80u',null);if(t&&u)setUser(u);
  if(t&&d){start(d);fetchData(t,true);return}
  if(t){$('gate').hidden=false;$('pin').disabled=true;$('pinErr').textContent='Carregando suas aulas…';fetchData(t,true);return}
  showGate();
})();
