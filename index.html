cíclico","nv":2,"e":"Em uma unidade de saúde, os atendimentos seguem o padrão repetitivo \"vacina, curativo, triagem, vacina, curativo, triagem, ...\". O 50º atendimento será de:","o":["curativo.","vacina.","triagem.","vacina ou triagem, não sendo possível determinar."],"a":0,"c":"O ciclo tem 3 elementos. 50 ÷ 3 = 16 com resto 2, então o 50º atendimento ocupa a 2ª posição do ciclo, que é curativo.","id":"c91f5ff"},{"m":"rl","tp":"Calendário","nv":2,"e":"Hoje é terça-feira. Daqui a 100 dias será:","o":["quarta-feira.","sexta-feira.","terça-feira.","quinta-feira."],"a":3,"c":"100 = 7·14 + 2. Depois de 14 semanas completas volta-se à terça-feira, e os 2 dias restantes levam à quinta-feira.","id":"a6ca3cf"},{"m":"rl","tp":"Porcentagem","nv":1,"e":"Em um município, 1.800 das 2.400 crianças de determinada faixa etária foram vacinadas em uma campanha. O percentual de crianças vacinadas foi de:","o":["75%","70%","72%","80%"],"a":0,"c":"1.800 ÷ 2.400 = 0,75 = 75%.","id":"de0543d"},{"m":"rl","tp":"Porcentagem – aumentos sucessivos","nv":2,"e":"Um produto sofreu dois aumentos sucessivos de 10%. O aumento total acumulado foi de:","o":["20%","22%","21%","25%"],"a":2,"c":"1,10 × 1,10 = 1,21, ou seja, aumento de 21%. O segundo aumento incide sobre o preço já aumentado, por isso o total não é 20%.","id":"98c0241"},{"m":"rl","tp":"Porcentagem","nv":3,"e":"Sobre porcentagens, marque V para verdadeiro e F para falso.\n( ) 20% de 150 é igual a 30.\n( ) Um aumento de 50% seguido de um desconto de 50% faz o preço voltar ao valor original.\n( ) 0,5% equivale à fração 1/200.\n( ) 30% de 40% equivale a 12%.\nA sequência CORRETA é:","o":["V, V, V, V.","V, F, F, V.","V, F, V, V.","F, F, V, V."],"a":2,"c":"1ª: 0,2 × 150 = 30 (V). 2ª: 1,5 × 0,5 = 0,75, e o preço cai 25% (F). 3ª: 0,5/100 = 5/1000 = 1/200 (V). 4ª: 0,3 × 0,4 = 0,12 = 12% (V).","id":"bc7083a"},{"m":"rl","tp":"Porcentagem – valor original","nv":2,"e":"Após um desconto de 20%, um aparelho de pressão passou a custar R$ 64,00. O preço original era:","o":["R$ 76,80","R$ 80,00","R$ 78,00","R$ 84,00"],"a":1,"c":"Com desconto de 20%, paga-se 80% do preço: 0,8·x = 64, então x = 64 ÷ 0,8 = 80. Somar 20% a 64 (R$ 76,80) é erro comum, porque o desconto incidiu sobre o preço original, e não sobre o final.","id":"301db44"},{"m":"rl","tp":"Regra de três simples","nv":1,"e":"Se 12 frascos de álcool em gel custam R$ 90,00, quanto custarão 20 frascos do mesmo produto?","o":["R$ 140,00","R$ 150,00","R$ 145,00","R$ 160,00"],"a":1,"c":"Grandezas diretamente proporcionais: 90 ÷ 12 = R$ 7,50 por frasco, e 20 × 7,50 = R$ 150,00.","id":"7ec28d3"},{"m":"rl","tp":"Regra de três inversa","nv":1,"e":"Seis pedreiros constroem um muro em 10 dias. Mantido o mesmo ritmo de trabalho, quatro pedreiros construiriam o mesmo muro em:","o":["12 dias.","18 dias.","20 dias.","15 dias."],"a":3,"c":"Com menos pedreiros, gasta-se mais tempo (grandezas inversamente proporcionais): 6 × 10 = 4 × x, logo x = 60 ÷ 4 = 15 dias.","id":"d5faab8"},{"m":"rl","tp":"Regra de três composta","nv":3,"e":"Quatro máquinas iguais produzem 600 peças em 5 horas. Seis dessas máquinas, trabalhando por 8 horas no mesmo ritmo, produzirão:","o":["960 peças.","1.440 peças.","1.200 peças.","1.800 peças."],"a":1,"c":"Produção por máquina por hora: 600 ÷ (4 × 5) = 30 peças. Então 6 × 8 × 30 = 1.440 peças.","id":"51d9dcd"},{"m":"rl","tp":"Razão e proporção","nv":1,"e":"Em uma unidade de saúde, a razão entre o número de técnicos e o de enfermeiros é de 5 para 2. Se técnicos e enfermeiros somam 35 profissionais, o número de técnicos é:","o":["10","20","25","28"],"a":2,"c":"São 5 + 2 = 7 partes, e 35 ÷ 7 = 5 profissionais por parte. Técnicos: 5 × 5 = 25. Enfermeiros: 2 × 5 = 10.","id":"5367d93"},{"m":"rl","tp":"Divisão proporcional","nv":2,"e":"Uma quantia de R$ 1.800,00 será dividida em partes diretamente proporcionais a 2, 3 e 4. A maior parte será de:","o":["R$ 400,00","R$ 800,00","R$ 600,00","R$ 900,00"],"a":1,"c":"São 2 + 3 + 4 = 9 partes, e 1.800 ÷ 9 = 200 por parte. A maior parte é 4 × 200 = R$ 800,00. As outras são R$ 400,00 e R$ 600,00.","id":"d93b984"},{"m":"rl","tp":"Escala","nv":2,"e":"Em um mapa na escala 1:50.000, uma distância de 4 cm corresponde, na realidade, a:","o":["200 m.","2 km.","500 m.","20 km."],"a":1,"c":"4 cm × 50.000 = 200.000 cm. Como 1 m = 100 cm, isso dá 2.000 m, e 2.000 m = 2 km.","id":"a178e15"},{"m":"rl","tp":"Média aritmética","nv":2,"e":"A média aritmética de cinco números é 12. Retirando-se o número 20 desse conjunto, a média aritmética dos quatro números restantes passa a ser:","o":["10","8","9","11"],"a":0,"c":"A soma dos cinco números é 5 × 12 = 60. Retirando o 20, a soma passa a 40, e 40 ÷ 4 = 10.","id":"0820eb3"},{"m":"rl","tp":"Princípio multiplicativo","nv":1,"e":"Uma pessoa tem 3 camisas, 4 calças e 2 pares de sapatos. De quantas maneiras diferentes ela pode se vestir usando uma camisa, uma calça e um par de sapatos?","o":["9","12","18","24"],"a":3,"c":"Pelo princípio fundamental da contagem, multiplicam-se as possibilidades: 3 × 4 × 2 = 24.","id":"cd6573f"},{"m":"rl","tp":"Anagramas","nv":2,"e":"Quantos anagramas podem ser formados com as letras da palavra SAÚDE (desconsiderando o acento)?","o":["24","120","60","720"],"a":1,"c":"SAUDE tem 5 letras distintas, e o número de anagramas é 5! = 5 × 4 × 3 × 2 × 1 = 120.","id":"0df6227"},{"m":"rl","tp":"Anagramas com repetição","nv":3,"e":"Quantos anagramas distintos podem ser formados com as letras da palavra ARARA?","o":["20","30","10","120"],"a":2,"c":"São 5 letras, com A repetido 3 vezes e R repetido 2 vezes. Permutação com repetição: 5! ÷ (3! × 2!) = 120 ÷ (6 × 2) = 10.","id":"5c33c12"},{"m":"rl","tp":"Combinação","nv":2,"e":"Uma comissão de 3 servidores será escolhida entre 7 candidatos, sem distinção de cargos na comissão. O número de comissões diferentes possíveis é:","o":["21","35","42","210"],"a":1,"c":"Como a ordem não importa, usa-se combinação: C(7,3) = 7! ÷ (3! × 4!) = (7 × 6 × 5) ÷ (3 × 2 × 1) = 210 ÷ 6 = 35. O valor 210 seria o arranjo, em que a ordem importa.","id":"511e945"},{"m":"rl","tp":"Arranjo","nv":2,"e":"Em uma eleição para presidente e vice-presidente de um conselho, há 8 candidatos. Quantos resultados diferentes são possíveis, considerando que uma mesma pessoa não pode ocupar os dois cargos?","o":["15","28","56","64"],"a":2,"c":"Aqui a ordem importa, porque presidente e vice são cargos diferentes. São 8 opções para presidente e 7 para vice: 8 × 7 = 56. O valor 28 seria a combinação, e 64 permitiria repetir a mesma pessoa.","id":"ae533f7"},{"m":"rl","tp":"Probabilidade","nv":2,"e":"Lançando-se dois dados comuns e honestos, de seis faces cada, a probabilidade de a soma dos resultados ser 7 é:","o":["1/12","5/36","7/36","1/6"],"a":3,"c":"São 36 resultados possíveis, e 6 deles dão soma 7: (1,6), (2,5), (3,4), (4,3), (5,2) e (6,1). Então 6/36 = 1/6.","id":"2b6bfac"},{"m":"rl","tp":"Probabilidade – evento complementar","nv":2,"e":"Uma moeda honesta é lançada 3 vezes. A probabilidade de sair pelo menos uma cara é:","o":["3/8","1/2","3/4","7/8"],"a":3,"c":"Calcula-se o complementar. A probabilidade de não sair nenhuma cara (três coroas) é (1/2)³ = 1/8, então a de sair pelo menos uma cara é 1 − 1/8 = 7/8.","id":"3003370"},{"m":"rl","tp":"Lógica de associação","nv":1,"e":"Lia, Rosa e Vera trabalham, cada uma, em um setor diferente de uma unidade de saúde: sala de vacina, farmácia ou recepção. Sabe-se que Lia não trabalha na farmácia nem na recepção, e que Rosa não trabalha na recepção. É CORRETO afirmar que:","o":["Vera trabalha na recepção.","Rosa trabalha na recepção.","Lia trabalha na farmácia.","Vera trabalha na sala de vacina."],"a":0,"c":"Lia não está na farmácia nem na recepção, então está na sala de vacina. Rosa não está na recepção e a vacina já é de Lia, então está na farmácia. Sobra a recepção para Vera.","id":"a2da090"},{"m":"rl","tp":"Lógica de associação","nv":3,"e":"Quatro técnicos — André, Bruno, Célia e Dora — farão plantões em dias diferentes, de segunda a quinta-feira, um técnico por dia. Sabe-se que: Bruno fará o plantão de quarta-feira; Dora não fará plantão na segunda nem na quinta-feira; Célia fará seu plantão em dia anterior ao de André. O técnico que fará o plantão de quinta-feira é:","o":["Bruno.","Célia.","Dora.","André."],"a":3,"c":"Bruno fica com a quarta. Dora só poderia ficar com terça ou quarta, e a quarta já é de Bruno, então Dora fica com a terça. Restam segunda e quinta para Célia e André. Como Célia vem antes, ela fica com a segunda e André com a quinta.","id":"a855e65"},{"m":"rl","tp":"Verdades e mentiras","nv":3,"e":"Um termômetro foi quebrado e há três suspeitos. Ana diz: \"Foi o Beto\". Beto diz: \"Não fui eu\". Caio diz: \"Não fui eu\". Sabendo-se que apenas um deles diz a verdade e que apenas um deles quebrou o termômetro, quem o quebrou foi:","o":["Ana.","Caio.","Beto.","não é possível determinar."],"a":1,"c":"Testando cada hipótese: se foi Ana, Beto e Caio dizem a verdade (duas verdades), o que não serve. Se foi Beto, Ana e Caio dizem a verdade (duas verdades), o que também não serve. Se foi Caio, só Beto diz a verdade (uma verdade), o que atende à condição.","id":"4bb1c91"},{"m":"rl","tp":"Conjuntos","nv":3,"e":"Em um grupo de 40 pacientes, 22 são hipertensos, 15 são diabéticos e 8 têm as duas doenças. Quantos pacientes têm apenas uma das duas doenças?","o":["14","29","37","21"],"a":3,"c":"Apenas hipertensos: 22 − 8 = 14. Apenas diabéticos: 15 − 8 = 7. Apenas uma das doenças: 14 + 7 = 21. Têm pelo menos uma 29 pacientes, e nenhuma, 11.","id":"1658269"},{"m":"rl","tp":"Proposições","nv":2,"e":"Analise as sentenças a seguir.\nI. Que dia lindo!\nII. x + 2 = 5\nIII. Paracatu fica em Minas Gerais.\nIV. Feche a porta.\nV. 7 + 3 = 11\nSão proposições lógicas apenas as sentenças:","o":["III e V, apenas.","III, apenas.","II, III e V, apenas.","I, III e V, apenas."],"a":0,"c":"Proposição é uma sentença declarativa que pode ser julgada como verdadeira ou falsa. III é verdadeira e V é falsa, mas as duas são proposições. I (exclamativa) e IV (imperativa) não podem ser julgadas. II é sentença aberta, porque seu valor depende de x.","id":"5f2d1cb"},{"m":"in","tp":"Windows – atalhos","nv":1,"e":"No Windows 10 e 11, o atalho de teclado que abre o Explorador de Arquivos é:","o":["Windows + R","Windows + D","Windows + E","Windows + I"],"a":2,"c":"Windows + E abre o Explorador de Arquivos. Windows + R abre a caixa Executar, Windows + D mostra a área de trabalho e Windows + I abre as Configurações.","id":"65d0a21"},{"m":"in","tp":"Windows – exclusão","nv":2,"e":"No Explorador de Arquivos do Windows, para excluir um arquivo selecionado de forma permanente, sem enviá-lo para a Lixeira, o usuário deve pressionar:","o":["Ctrl + Delete","Shift + Delete","Alt + Delete","Windows + Delete"],"a":1,"c":"Shift + Delete exclui definitivamente, depois de pedir confirmação, e o arquivo não vai para a Lixeira. Delete sozinho ou Ctrl + Delete enviam o arquivo para a Lixeira.","id":"3e46876"},{"m":"in","tp":"Windows – área de transferência","nv":2,"e":"No Windows 10 (a partir da versão 1809) e no Windows 11, o atalho Windows + V permite:","o":["abrir o histórico da área de transferência, com os itens copiados recentemente.","colar o conteúdo copiado sem formatação.","abrir o painel de configurações de vídeo.","alternar entre as áreas de trabalho virtuais."],"a":0,"c":"Windows + V exibe o histórico da área de transferência, que precisa estar ativado, e permite escolher qual item colar. Para alternar entre áreas de trabalho virtuais usa-se Ctrl + Windows + setas.","id":"667d291"},{"m":"in","tp":"Atalhos gerais","nv":1,"e":"Sobre atalhos de teclado amplamente usados no Windows e em seus aplicativos, marque V para verdadeiro e F para falso.\n( ) Ctrl + C copia o item selecionado.\n( ) Ctrl + X recorta o item selecionado.\n( ) Ctrl + Z desfaz a última ação.\n( ) Ctrl + Y desfaz a última ação, assim como Ctrl + Z.\nA sequência CORRETA é:","o":["V, V, F, F.","V, F, V, F.","V, V, V, F.","V, V, V, V."],"a":2,"c":"As três primeiras estão corretas. A quarta é falsa: Ctrl + Y refaz (ou repete) a ação, ou seja, faz o oposto de desfazer.","id":"adf0a24"},{"m":"in","tp":"Windows – captura de tela","nv":2,"e":"No Windows 10 e 11, o atalho Windows + Shift + S serve para:","o":["salvar o documento aberto com outro nome.","suspender o computador imediatamente.","abrir a pesquisa do menu Iniciar.","abrir a ferramenta de recorte, permitindo capturar uma área selecionada da tela."],"a":3,"c":"Windows + Shift + S abre a barra de recorte da Ferramenta de Captura, que permite recortar retângulo, forma livre, janela ou tela inteira. O recorte vai para a área de transferência.","id":"fbaaf1c"},{"m":"in","tp":"Extensões de arquivos","nv":1,"e":"Numere a COLUNA II de acordo com a COLUNA I, associando a extensão ao tipo de arquivo.\nCOLUNA I\n1. .docx\n2. .xlsx\n3. .pdf\n4. .exe\nCOLUNA II\n( ) Planilha do Microsoft Excel\n( ) Documento em formato portátil\n( ) Programa executável\n( ) Documento de texto do Microsoft Word\nAssinale a sequência CORRETA.","o":["1, 3, 4, 2","2, 4, 3, 1","3, 2, 4, 1","2, 3, 4, 1"],"a":3,"c":".xlsx é planilha do Excel, .pdf é documento portátil (Portable Document Format), .exe é programa executável do Windows e .docx é documento do Word (versões 2007 em diante).","id":"1c67196"},{"m":"in","tp":"Windows – Lixeira","nv":2,"e":"Sobre a Lixeira do Windows, é CORRETO afirmar que:","o":["a Lixeira tem capacidade ilimitada e nunca descarta arquivos automaticamente.","arquivos que estão na Lixeira não ocupam espaço em disco.","arquivos excluídos de um pen drive, em regra, são apagados sem passar pela Lixeira.","depois de esvaziar a Lixeira, os arquivos podem ser recuperados pela opção Restaurar."],"a":2,"c":"Arquivos excluídos de unidades removíveis, como pen drives e cartões de memória, e de unidades de rede geralmente não vão para a Lixeira. A Lixeira tem tamanho máximo configurável, os arquivos nela continuam ocupando espaço e, depois que ela é esvaziada, não há opção Restaurar.","id":"c4c8dee"},{"m":"in","tp":"Word – atalhos","nv":2,"e":"No Microsoft Word, em português, o atalho padrão para SALVAR o documento é:","o":["Ctrl + B","Ctrl + S","Ctrl + G","Ctrl + A"],"a":0,"c":"No Word em português, Ctrl + B salva o documento ('Baixar' ajuda a lembrar). Ctrl + S aplica sublinhado, Ctrl + G alinha à direita e Ctrl + A abre um arquivo. Ctrl + S para salvar é atalho da versão em inglês, uma pegadinha clássica.","id":"9806db0"},{"m":"in","tp":"Word – atalhos","nv":3,"e":"Considerando o Microsoft Word em português, analise as afirmativas.\nI. Ctrl + I aplica o formato itálico ao texto selecionado.\nII. Ctrl + S aplica o formato sublinhado ao texto selecionado.\nIII. Ctrl + A seleciona todo o texto do documento.\nEstão CORRETAS as afirmativas:","o":["I e II, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],"a":0,"c":"No Word em português, Ctrl + I é itálico e Ctrl + S é sublinhado. III está errada: Ctrl + A abre um documento, e para selecionar tudo usa-se Ctrl + T.","id":"864665c"},{"m":"in","tp":"Word – alinhamento","nv":2,"e":"No Microsoft Word em português, sobre os atalhos de alinhamento de parágrafo, marque V para verdadeiro e F para falso.\n( ) Ctrl + E centraliza o parágrafo.\n( ) Ctrl + J justifica o parágrafo.\n( ) Ctrl + D alinha o parágrafo à direita.\n( ) Ctrl + Q alinha o parágrafo à esquerda.\nA sequência CORRETA é:","o":["V, V, V, V.","V, V, F, V.","V, F, F, V.","F, V, F, V."],"a":1,"c":"No Word em português: Ctrl + Q alinha à esquerda, Ctrl + E centraliza, Ctrl + G alinha à direita e Ctrl + J justifica. Ctrl + D abre a caixa de diálogo Fonte, e por isso a terceira afirmativa é falsa.","id":"117c9ce"},{"m":"in","tp":"Word – quebra de página","nv":2,"e":"No Microsoft Word, para inserir uma quebra de página manual na posição do cursor, utiliza-se o atalho:","o":["Shift + Enter","Alt + Enter","Ctrl + Enter","Ctrl + Shift + Enter"],"a":2,"c":"Ctrl + Enter insere uma quebra de página. Shift + Enter insere uma quebra de linha sem criar parágrafo novo, e Ctrl + Shift + Enter insere uma quebra de coluna.","id":"79d6def"},{"m":"in","tp":"Word – localizar e substituir","nv":2,"e":"No Microsoft Word em português, os atalhos padrão para as funções Localizar e Substituir são, respectivamente:","o":["Ctrl + L e Ctrl + U","Ctrl + U e Ctrl + L","Ctrl + K e Ctrl + T","Ctrl + T e Ctrl + K"],"a":0,"c":"No Word em português, Ctrl + L abre o Localizar (no painel de Navegação) e Ctrl + U abre Substituir. Ctrl + K insere hiperlink e Ctrl + T seleciona tudo.","id":"dae34fe"},{"m":"in","tp":"Word – guias","nv":2,"e":"No Microsoft Word 2016 e no Microsoft 365, o recurso Controlar Alterações, que registra as modificações feitas no documento para posterior aceitação ou rejeição, está localizado na guia:","o":["Layout","Revisão","Referências","Exibir"],"a":1,"c":"A guia Revisão reúne Ortografia e Gramática, Novo Comentário, Controlar Alterações e Aceitar/Rejeitar. A guia Referências trata de sumário, notas de rodapé e citações.","id":"79b6838"},{"m":"in","tp":"Excel – funções","nv":1,"e":"No Microsoft Excel, as células A1, A2, A3 e A4 contêm, respectivamente, os valores 2, 4, 6 e 8. O resultado da fórmula =MÉDIA(A1:A4) é:","o":["5","4","6","20"],"a":0,"c":"MÉDIA soma os valores e divide pela quantidade: (2 + 4 + 6 + 8) ÷ 4 = 20 ÷ 4 = 5. O valor 20 seria o resultado de =SOMA(A1:A4).","id":"2dd2a75"},{"m":"in","tp":"Excel – funções","nv":2,"e":"Em uma planilha do Excel, as células B1, B2, B3 e B4 contêm os valores 3, 9, 5 e 7. O resultado da fórmula =MÁXIMO(B1:B4)-MÍNIMO(B1:B4) é:","o":["4","12","24","6"],"a":3,"c":"MÁXIMO = 9 e MÍNIMO = 3, logo 9 − 3 = 6. O valor 12 seria 9 + 3, e 24 seria a soma de todos os valores.","id":"e47e45f"},{"m":"in","tp":"Excel – referências mistas","nv":3,"e":"No Excel, a célula C2 contém a fórmula =A$1*B2. Se essa fórmula for copiada para a célula D3, a fórmula resultante em D3 será:","o":["=A$1*C3","=B$2*C3","=B$1*B2","=B$1*C3"],"a":3,"c":"Da célula C2 para D3 há deslocamento de 1 coluna e 1 linha. Em A$1, a coluna é relativa (A passa a B) e a linha está fixa (continua 1), o que dá B$1. B2 é totalmente relativa e vira C3. Resultado: =B$1*C3.","id":"8a8ba09"},{"m":"in","tp":"Excel – operadores","nv":2,"e":"No Excel, o resultado da fórmula =2+3*2^2 é:","o":["20","38","64","14"],"a":3,"c":"A ordem de precedência é: exponenciação (^), depois multiplicação e divisão, depois soma e subtração. Assim, 2^2 = 4, 3 × 4 = 12 e 2 + 12 = 14.","id":"3b68608"},{"m":"in","tp":"Excel – CONT.NÚM","nv":3,"e":"No Excel, as células A1 a A5 contêm, respectivamente: 10, o texto \"ok\", 5, uma célula vazia e 7. O resultado da fórmula =CONT.NÚM(A1:A5) é:","o":["2","4","5","3"],"a":3,"c":"CONT.NÚM conta apenas as células com números: 10, 5 e 7, o que dá 3. CONT.VALORES contaria as células não vazias, incluindo o texto, e resultaria em 4. CONTAR.VAZIO resultaria em 1.","id":"9ba4a02"},{"m":"in","tp":"Excel – SOMASE","nv":3,"e":"Em uma planilha do Excel, A1:A4 contém \"Vacina\", \"Curativo\", \"Vacina\" e \"Triagem\", e B1:B4 contém 10, 5, 20 e 8, respectivamente. O resultado de =SOMASE(A1:A4;\"Vacina\";B1:B4) é:","o":["30","10","20","43"],"a":0,"c":"SOMASE soma os valores de B nas linhas em que A é igual a \"Vacina\" (linhas 1 e 3): 10 + 20 = 30. O valor 43 é a soma de todos os valores de B.","id":"fc7dd3e"},{"m":"in","tp":"Excel – erros","nv":1,"e":"No Excel, a célula C1 contém a fórmula =A1/B1. Se B1 estiver vazia ou contiver zero, o resultado exibido em C1 será o erro:","o":["#VALOR!","#DIV/0!","#NOME?","#REF!"],"a":1,"c":"#DIV/0! indica divisão por zero, e célula vazia é tratada como zero. #VALOR! aparece com tipo de dado inadequado, #NOME? com nome de função ou intervalo não reconhecido e #REF! com referência inválida, como a de uma célula excluída.","id":"71e914f"},{"m":"in","tp":"Excel – ARRED","nv":2,"e":"No Excel, o resultado da fórmula =ARRED(2,567;2) é:","o":["2,56","2,6","3","2,57"],"a":3,"c":"ARRED(número; núm_dígitos) arredonda para a quantidade de casas indicada. Com 2 casas, 2,567 vira 2,57, porque o 3º dígito, 7, é maior ou igual a 5. Para truncar sem arredondar, usa-se TRUNCAR, que daria 2,56.","id":"758ac40"},{"m":"in","tp":"Excel – SE e E","nv":3,"e":"No Excel, a célula A1 contém 20 e a célula B1 contém o texto \"não\". O resultado da fórmula =SE(E(A1>=18;B1=\"sim\");\"Apto\";\"Inapto\") é:","o":["Apto","Inapto","VERDADEIRO","#VALOR!"],"a":1,"c":"A função E só retorna VERDADEIRO se todas as condições forem verdadeiras. A1>=18 é VERDADEIRO, mas B1=\"sim\" é FALSO, então E() = FALSO e SE retorna o 3º argumento, \"Inapto\". Com a função OU, o resultado seria \"Apto\".","id":"8513da1"},{"m":"in","tp":"Excel – alça de preenchimento","nv":2,"e":"No Excel, a célula A1 contém o número 2 e a célula A2 contém o número 4. O usuário seleciona A1:A2 e arrasta a alça de preenchimento até A5. O valor que aparecerá em A5 é:","o":["4","8","32","10"],"a":3,"c":"Ao selecionar duas células com valores numéricos e arrastar, o Excel continua a progressão aritmética de razão 2: 2, 4, 6, 8, 10. A5 recebe 10.","id":"ca7851e"},{"m":"in","tp":"LibreOffice – formatos","nv":1,"e":"O formato de arquivo padrão (ODF) utilizado pelo LibreOffice Writer para salvar documentos de texto é:","o":[".odt",".ods",".odp",".docx"],"a":0,"c":"O Writer salva em .odt (OpenDocument Text). O Calc usa .ods (planilhas) e o Impress usa .odp (apresentações). O formato .docx é do Microsoft Word, que o Writer abre e salva, mas não como padrão.","id":"8e51fb4"},{"m":"in","tp":"LibreOffice Calc – referências","nv":3,"e":"No LibreOffice Calc, considerando a sintaxe padrão do programa, a fórmula que faz referência à célula A1 da planilha chamada Planilha2 é:","o":["=Planilha2!A1","=Planilha2:A1","=Planilha2.A1","=Planilha2#A1"],"a":2,"c":"Na sintaxe padrão do Calc, planilha e célula são separadas por ponto (=Planilha2.A1, ou =$Planilha2.A1). No Excel o separador é o ponto de exclamação (=Planilha2!A1), e esse contraste é muito cobrado.","id":"62af3f8"},{"m":"in","tp":"Internet – cookies","nv":2,"e":"No contexto da navegação na internet, cookies são:","o":["programas maliciosos que se instalam no computador para roubar senhas.","pequenos arquivos gravados pelo navegador, a pedido dos sites, para armazenar informações como preferências e dados de sessão.","cópias de segurança automáticas dos arquivos do usuário feitas pelo navegador.","extensões que bloqueiam anúncios e janelas pop-up."],"a":1,"c":"Cookies guardam informações de navegação: login mantido, itens no carrinho, preferências de idioma. Eles não são vírus, embora possam ser usados para rastrear o usuário. Podem ser apagados ou bloqueados nas configurações do navegador.","id":"22a95e8"},{"m":"in","tp":"Navegadores – atalhos","nv":2,"e":"Nos navegadores Google Chrome e Microsoft Edge, o atalho que reabre a última aba fechada é:","o":["Ctrl + T","Ctrl + W","Ctrl + Shift + N","Ctrl + Shift + T"],"a":3,"c":"Ctrl + Shift + T reabre a última aba fechada. Ctrl + T abre uma nova aba, Ctrl + W fecha a aba atual e Ctrl + Shift + N abre uma janela anônima no Chrome (no Edge, InPrivate).","id":"43e5246"},{"m":"in","tp":"Navegadores – atalhos","nv":2,"e":"Nos navegadores Google Chrome e Microsoft Edge, marque V para verdadeiro e F para falso.\n( ) Ctrl + H abre o histórico de navegação.\n( ) Ctrl + D adiciona a página atual aos favoritos.\n( ) Ctrl + J abre a lista de downloads.\n( ) F5 fecha a aba atual.\nA sequência CORRETA é:","o":["V, V, F, F.","V, F, V, F.","V, V, V, F.","F, V, V, V."],"a":2,"c":"Ctrl + H abre o histórico, Ctrl + D adiciona aos favoritos e Ctrl + J abre os downloads. F5 atualiza (recarrega) a página, e quem fecha a aba é Ctrl + W ou Ctrl + F4.","id":"511f6ce"},{"m":"in","tp":"Internet – pesquisa","nv":2,"e":"Sobre o uso de operadores em buscadores como o Google, analise as afirmativas.\nI. Colocar uma expressão entre aspas, como \"técnico em enfermagem\", busca a frase exata.\nII. O sinal de menos antes de uma palavra, como em vacina -gripe, exclui dos resultados as páginas com essa palavra.\nIII. O operador site:, como em edital site:gov.br, restringe a busca a um domínio.\nEstão CORRETAS as afirmativas:","o":["I e II, apenas.","I e III, apenas.","I, II e III.","II e III, apenas."],"a":2,"c":"As três estão corretas. Aspas buscam a expressão exata, o sinal de menos exclui um termo e site: restringe a busca a um site ou domínio. Também existe filetype:, que restringe por tipo de arquivo, como filetype:pdf.","id":"4e54904"},{"m":"in","tp":"E-mail – destinatários","nv":1,"e":"Ao enviar um e-mail, o remetente quer que um destinatário receba a mensagem sem que os demais destinatários saibam disso. Para isso, deve incluir o endereço desse destinatário no campo:","o":["Para.","Cco (cópia oculta).","Cc (com cópia).","Assunto."],"a":1,"c":"Os endereços em Cco (Bcc, em inglês) não são exibidos aos outros destinatários. Os endereços em Para e Cc ficam visíveis para todos.","id":"f06c26a"},{"m":"in","tp":"E-mail – protocolos","nv":3,"e":"Sobre os protocolos de correio eletrônico, analise as afirmativas.\nI. O SMTP é utilizado para o envio de mensagens.\nII. O IMAP permite acessar as mensagens mantendo-as sincronizadas no servidor, o que facilita o uso em vários dispositivos.\nIII. O POP3, em sua configuração usual, baixa as mensagens do servidor para o dispositivo do usuário.\nEstão CORRETAS as afirmativas:","o":["I e II, apenas.","I, II e III.","I e III, apenas.","II e III, apenas."],"a":1,"c":"As três estão corretas. SMTP envia. IMAP e POP3 recebem: o IMAP mantém as mensagens no servidor, sincronizadas entre dispositivos, e o POP3 costuma baixá-las e, em geral, retirá-las do servidor.","id":"a4adbea"},{"m":"in","tp":"E-mail – encaminhar e responder","nv":3,"e":"Em programas e serviços de e-mail como Outlook e Gmail, é CORRETO afirmar que, por padrão:","o":["ao encaminhar uma mensagem, os anexos originais são mantidos.","ao responder uma mensagem, os anexos originais são reenviados automaticamente ao remetente.","a opção Responder a todos envia a resposta também aos destinatários que estavam em Cco.","ao encaminhar uma mensagem, o campo Para é preenchido automaticamente com o endereço do remetente original."],"a":0,"c":"Encaminhar repassa a mensagem com os anexos a novos destinatários, que o usuário escolhe. Responder e Responder a todos não incluem os anexos originais, e Responder a todos não alcança quem estava em Cco, porque esses endereços ficam ocultos.","id":"ace2117"},{"m":"in","tp":"Computação em nuvem","nv":1,"e":"Sobre o armazenamento de arquivos em nuvem (como Google Drive e OneDrive), é CORRETO afirmar que:","o":["os arquivos ficam armazenados exclusivamente no disco rígido do computador do usuário.","dispensa totalmente a conexão com a internet para sincronizar os arquivos.","é um tipo de antivírus que verifica os arquivos antes de abri-los.","permite acessar os arquivos a partir de diferentes dispositivos conectados à internet, mediante autenticação."],"a":3,"c":"Na nuvem, os arquivos ficam em servidores do provedor e podem ser acessados de qualquer dispositivo com internet depois do login. Pode haver cópia local para uso offline, mas a sincronização depende de conexão. Serviço de nuvem não é antivírus.","id":"8ea444d"},{"m":"in","tp":"Segurança – malware","nv":2,"e":"O tipo de código malicioso capaz de se propagar automaticamente pelas redes, explorando vulnerabilidades e enviando cópias de si mesmo, sem precisar ser anexado a outro arquivo ou programa, é o:","o":["vírus.","worm.","spyware.","adware."],"a":1,"c":"O worm (verme) se replica sozinho pela rede. O vírus precisa de um hospedeiro (arquivo ou programa) e, em geral, da execução pelo usuário. O spyware espiona o usuário e o adware exibe propaganda.","id":"5fc2bc0"},{"m":"in","tp":"Segurança – malware","nv":1,"e":"O programa malicioso que registra as teclas digitadas pelo usuário, podendo capturar senhas e números de cartão, é denominado:","o":["keylogger.","firewall.","adware.","antivírus."],"a":0,"c":"O keylogger é um tipo de spyware que captura as teclas digitadas. Por isso alguns bancos usam teclados virtuais, que dão origem a outra variante, o screenlogger. Firewall e antivírus são ferramentas de proteção, e o adware exibe propagandas.","id":"ae983d5"},{"m":"in","tp":"Segurança – autenticação","nv":1,"e":"Um serviço on-line que exige, além da senha, a digitação de um código temporário enviado ao celular do usuário está utilizando:","o":["autenticação em dois fatores (verificação em duas etapas).","criptografia de disco completo.","backup incremental em nuvem.","certificado digital do servidor (HTTPS)."],"a":0,"c":"A autenticação em dois fatores combina algo que o usuário sabe (a senha) com algo que ele tem (o celular ou token). Assim, mesmo que a senha vaze, o invasor ainda precisa do segundo fator.","id":"43b3df3"},{"m":"in","tp":"Segurança – backup","nv":2,"e":"O tipo de backup que copia todos os arquivos criados ou alterados desde o último backup COMPLETO (normal) é o backup:","o":["incremental.","completo.","de imagem do sistema.","diferencial."],"a":3,"c":"O backup diferencial cresce a cada dia até o próximo completo, e a restauração exige apenas o último completo mais o último diferencial. O incremental copia o que mudou desde o último backup de qualquer tipo, e o completo copia tudo.","id":"f608bb2"},{"m":"in","tp":"Segurança – boas práticas","nv":2,"e":"Sobre boas práticas de segurança da informação, é INCORRETO afirmar que:","o":["manter o sistema operacional e os programas atualizados reduz a exploração de vulnerabilidades.","compartilhar a senha de acesso ao sistema com colegas de confiança é recomendável para agilizar o trabalho.","senhas fortes combinam letras maiúsculas e minúsculas, números e símbolos.","bloquear o computador ao se afastar da estação de trabalho evita acessos indevidos."],"a":1,"c":"A senha é pessoal e intransferível, e compartilhá-la impede rastrear quem fez cada acesso e aumenta o risco de vazamento. As demais afirmativas são boas práticas.","id":"1e527d3"},{"m":"in","tp":"Redes – classificação","nv":1,"e":"A rede de computadores de abrangência restrita, que interliga os equipamentos de um mesmo prédio, como uma unidade de saúde, é classificada como:","o":["WAN.","MAN.","LAN.","WWW."],"a":2,"c":"LAN (Local Area Network) é a rede local. MAN abrange uma cidade ou região metropolitana, e WAN abrange grandes distâncias, como países. WWW é o sistema de páginas da web, e não uma classificação de rede por abrangência.","id":"0f26182"},{"m":"in","tp":"Redes – intranet","nv":2,"e":"Sobre intranet, é CORRETO afirmar que se trata de:","o":["um sinônimo de internet, de acesso livre a qualquer pessoa.","uma rede que, obrigatoriamente, não pode ter nenhuma conexão com a internet.","uma rede privada de uma organização, que utiliza os mesmos protocolos e tecnologias da internet.","um programa de correio eletrônico usado apenas por órgãos públicos."],"a":2,"c":"A intranet usa TCP/IP, HTTP, navegadores etc., mas o acesso é restrito aos membros da organização. Ela pode estar conectada à internet, inclusive com acesso externo por VPN ou extranet. Não é um programa de e-mail.","id":"4a1680e"},{"m":"in","tp":"Redes – equipamentos","nv":1,"e":"O equipamento responsável por interligar redes diferentes e encaminhar os pacotes de dados entre elas, como o que conecta a rede de uma unidade de saúde à internet, é o:","o":["monitor.","roteador.","estabilizador.","scanner."],"a":1,"c":"O roteador direciona o tráfego entre redes, por exemplo entre a rede local e a do provedor. Monitor e scanner são periféricos, e o estabilizador regula a tensão elétrica.","id":"b9983f9"},{"m":"in","tp":"Hardware – periféricos","nv":1,"e":"É exemplo de periférico de ENTRADA E SAÍDA de dados:","o":["mouse.","teclado.","impressora multifuncional, que imprime e digitaliza documentos.","caixa de som."],"a":2,"c":"A multifuncional imprime (saída) e digitaliza (entrada). Outros exemplos de dispositivos mistos são a tela sensível ao toque e o modem. Mouse e teclado são de entrada, e caixa de som é de saída.","id":"9867869"},{"m":"in","tp":"Hardware – armazenamento","nv":2,"e":"Sobre dispositivos de armazenamento, é INCORRETO afirmar que:","o":["o SSD possui discos magnéticos giratórios e cabeça de leitura, assim como o HD.","o pen drive utiliza memória flash.","o HD armazena os dados de forma não volátil.","o SSD costuma oferecer tempo de acesso menor que o do HD."],"a":0,"c":"O SSD (Solid State Drive) usa memória flash e não tem partes mecânicas móveis, por isso é mais rápido e resistente a impactos. Pratos magnéticos giratórios e cabeça de leitura são características do HD.","id":"dd3b2dc"},{"m":"in","tp":"Hardware – unidades de medida","nv":1,"e":"Assinale a alternativa que apresenta as unidades de medida de armazenamento em ordem CRESCENTE.","o":["MB, KB, GB, TB","KB, GB, MB, TB","KB, MB, GB, TB","GB, MB, KB, TB"],"a":2,"c":"Ordem crescente: byte < kilobyte (KB) < megabyte (MB) < gigabyte (GB) < terabyte (TB). Cada unidade equivale a 1.024 vezes a anterior, na base binária usual.","id":"14439e2"},{"m":"in","tp":"Hardware – conexões","nv":2,"e":"A interface (porta) digital que transmite simultaneamente áudio e vídeo de alta definição entre um computador e um monitor ou televisor é a:","o":["HDMI.","VGA.","PS/2.","RJ-45."],"a":0,"c":"A HDMI transmite áudio e vídeo digitais pelo mesmo cabo. A VGA é analógica e só transmite vídeo, a PS/2 era usada para teclado e mouse, e a RJ-45 é o conector de cabo de rede.","id":"f3475ef"},{"m":"pt","tp":"Variação linguística","nv":2,"e":"Numere a COLUNA II de acordo com a COLUNA I, relacionando o tipo de variação linguística ao exemplo.\nCOLUNA I\n1. Regional (diatópica)\n2. Social (diastrática)\n3. Situacional (diafásica)\n4. Histórica (diacrônica)\nCOLUNA II\n( ) O uso de \"vossa mercê\", que deu origem a \"você\".\n( ) O mineiro que diz \"uai\" e chama qualquer objeto de \"trem\".\n( ) A gíria própria de um grupo de jovens skatistas.\n( ) O técnico que fala de modo descontraído com os colegas e formal ao redigir um relatório.\nAssinale a sequência CORRETA.","o":["4, 2, 1, 3","1, 4, 2, 3","4, 1, 2, 3","4, 1, 3, 2"],"a":2,"c":"'Vossa mercê' > 'vosmecê' > 'você' é mudança ao longo do tempo (histórica). 'Uai' e 'trem' são marcas regionais. A gíria de um grupo é variação social. Mudar o registro conforme a situação, formal ou informal, é variação situacional.","id":"6ab3ccf"},{"m":"pt","tp":"Variação linguística","nv":1,"e":"Considere a fala: \"Ô, sô, pega aquele trem ali pra mim, uai!\". Esse enunciado é exemplo de variação linguística:","o":["histórica, característica do português arcaico.","situacional, própria de documentos oficiais.","regional, típica do falar mineiro.","social, exclusiva de profissionais da saúde."],"a":2,"c":"Expressões como 'sô', 'trem' (no sentido de coisa, objeto) e 'uai' identificam o falar de Minas Gerais, o que caracteriza variação regional (diatópica). Não é linguagem arcaica nem formal, e não é exclusiva de um grupo profissional.","id":"f8a65ba"},{"m":"pt","tp":"Variação linguística","nv":1,"e":"Sobre variação linguística, é INCORRETO afirmar que:","o":["a norma-padrão é a variedade adequada a situações formais, como documentos oficiais e concursos.","todas as variedades linguísticas têm regras próprias e servem à comunicação de seus falantes.","o preconceito linguístico consiste em discriminar pessoas pela forma como falam.","as variedades regionais e populares são formas erradas da língua e devem ser corrigidas em qualquer situação."],"a":3,"c":"Não existe variedade 'errada' em si. O que existe é adequação ou inadequação ao contexto: a norma-padrão é exigida em situações formais, mas as demais variedades são legítimas. Desqualificá-las é preconceito linguístico.","id":"802055c"},{"m":"pt","tp":"Formação de palavras","nv":2,"e":"Assinale a alternativa em que a palavra foi formada por derivação PARASSINTÉTICA.","o":["infelizmente","pontapé","desleal","entristecer"],"a":3,"c":"Na parassíntese, prefixo e sufixo entram ao mesmo tempo, e a palavra não existe só com um deles: não há 'entriste' nem 'tristecer'. 'Infelizmente' é prefixal e sufixal, porque existem 'infeliz' e 'felizmente'. 'Pontapé' é composição e 'desleal' é derivação prefixal.","id":"97ec9c6"},{"m":"pt","tp":"Formação de palavras","nv":2,"e":"Assinale a alternativa em que a palavra foi formada por composição por AGLUTINAÇÃO.","o":["girassol","planalto","guarda-chuva","passatempo"],"a":1,"c":"Na aglutinação, pelo menos um dos radicais perde fonemas: plano + alto = planalto, com perda do 'o'. Em 'girassol' (gira + sol), 'guarda-chuva' e 'passatempo' (passa + tempo), os elementos se mantêm inteiros, o que caracteriza justaposição.","id":"a412c50"},{"m":"pt","tp":"Formação de palavras","nv":2,"e":"Na frase \"O combate ao mosquito exige a participação de todos\", o substantivo \"combate\" foi formado por:","o":["derivação imprópria.","derivação sufixal.","composição por justaposição.","derivação regressiva."],"a":3,"c":"A derivação regressiva forma substantivos a partir de verbos com redução da palavra: combater > combate, pescar > pesca, atacar > ataque. Esses substantivos são deverbais e indicam ação.","id":"5fafd45"},{"m":"pt","tp":"Formação de palavras","nv":2,"e":"Assinale a alternativa em que ocorre derivação IMPRÓPRIA (mudança de classe gramatical sem alteração da forma da palavra).","o":["A vacinação começou cedo na unidade.","Ele reescreveu o relatório do plantão.","O olhar atento da enfermeira tranquilizou o paciente.","O pontapé inicial da campanha foi dado ontem."],"a":2,"c":"Em 'O olhar atento', o verbo 'olhar' passa a substantivo por causa do artigo, sem mudar de forma, e isso é derivação imprópria. 'Vacinação' é derivação sufixal, 'reescreveu' é derivação prefixal e 'pontapé' é composição.","id":"0b76c9b"},{"m":"pt","tp":"Formação de palavras","nv":2,"e":"As palavras \"foto\", \"moto\" e \"pneu\" foram formadas por:","o":["abreviação (redução vocabular).","hibridismo.","onomatopeia.","derivação regressiva."],"a":0,"c":"Abreviação é a redução de uma palavra longa que mantém o mesmo sentido: fotografia > foto, motocicleta > moto, pneumático > pneu. A derivação regressiva forma substantivos a partir de verbos.","id":"30f3db6"},{"m":"pt","tp":"Formação de palavras","nv":3,"e":"Assinale a alternativa que apresenta um exemplo de HIBRIDISMO, isto é, palavra formada por elementos de línguas diferentes.","o":["sociologia (latim + grego)","fidalgo","tique-taque","pernalta"],"a":0,"c":"'Sociologia' junta 'socio-', do latim socius, e '-logia', do grego logos, e por isso é hibridismo. 'Fidalgo' (filho de algo) e 'pernalta' (perna + alta) são aglutinações, e 'tique-taque' é onomatopeia.","id":"310b861"},{"m":"pt","tp":"Correlação de tempos e modos","nv":2,"e":"Assinale a alternativa em que a correlação entre os tempos e modos verbais está de acordo com a norma-padrão.","o":["Se o paciente chegasse mais cedo, será atendido antes.","Se o paciente tivesse chegado mais cedo, teria sido atendido antes.","Se o paciente tiver chegado mais cedo, teria sido atendido antes.","Quando o paciente chegasse, o médico o atende."],"a":1,"c":"Hipótese no passado se faz com o pretérito mais-que-perfeito do subjuntivo ('tivesse chegado') combinado com o futuro do pretérito composto ('teria sido'). As correlações regulares são 'se chegasse... seria' e 'se chegar... será'. As outras opções misturam tempos incompatíveis.","id":"ebf9aa1"},{"m":"pt","tp":"Correlação de tempos e modos","nv":3,"e":"Assinale a alternativa que preenche CORRETAMENTE as lacunas, respeitando a correlação verbal: \"Caso ___ vagas, a prefeitura ___ novos técnicos no próximo ano.\"","o":["haja / contratará","houvesse / contratará","houver / contrataria","haja / contrataria"],"a":0,"c":"'Caso' pede o presente do subjuntivo ('haja'), que se combina com o futuro do presente ('contratará'). 'Caso houver' contraria a norma-padrão, porque 'houver' combina com 'se' ou 'quando'. A combinação 'houvesse / contrataria' também seria correta, mas não está entre as opções.","id":"99146af"},{"m":"pt","tp":"Verbos – futuro do subjuntivo","nv":2,"e":"Assinale a alternativa que completa corretamente a frase, de acordo com a norma-padrão: \"Quando você ___ o resultado do exame, avise a equipe.\"","o":["ver","vir","vier","visse"],"a":1,"c":"O verbo 'ver' é irregular no futuro do subjuntivo: quando eu vir, quando você vir, quando nós virmos. 'Vier' é do verbo 'vir', e 'visse' é pretérito imperfeito do subjuntivo, que não combina com o imperativo 'avise'. 'Quando você ver' é um erro comum.","id":"dc96bdc"},{"m":"rl","tp":"Fatoração em primos","nv":1,"e":"A decomposição do número 360 em fatores primos é:","o":["2² · 3² · 10","2³ · 3 · 15","2³ · 3² · 5","2⁴ · 3² · 5"],"a":2,"c":"360 = 2 · 180 = 2 · 2 · 90 = 2 · 2 · 2 · 45 = 2³ · 9 · 5 = 2³ · 3² · 5. Os números 10 e 15 não são primos, e 2⁴ · 3² · 5 dá 720.","id":"77c9e5d"},{"m":"rl","tp":"Número de divisores","nv":3,"e":"A quantidade de divisores naturais (positivos) do número 72 é:","o":["6","12","8","10"],"a":1,"c":"72 = 2³ · 3². O número de divisores é o produto dos expoentes somados de 1: (3 + 1) · (2 + 1) = 12. São eles: 1, 2, 3, 4, 6, 8, 9, 12, 18, 24, 36 e 72.","id":"498c26b"},{"m":"rl","tp":"MDC","nv":2,"e":"Dois rolos de atadura, um com 48 m e outro com 72 m, serão cortados em pedaços de mesmo comprimento, o maior possível, sem sobras. O comprimento de cada pedaço será de:","o":["6 m.","12 m.","24 m.","144 m."],"a":2,"c":"O maior comprimento comum que divide os dois rolos é o MDC(48, 72). Como 48 = 2⁴ · 3 e 72 = 2³ · 3², o MDC é 2³ · 3 = 24 m, e saem 2 + 3 = 5 pedaços. O valor 144 é o MMC.","id":"13ec9ac"},{"m":"rl","tp":"MMC","nv":2,"e":"Um paciente toma o medicamento A a cada 6 horas e o medicamento B a cada 8 horas. Se tomou os dois juntos às 6h de segunda-feira, voltará a tomá-los juntos, pela primeira vez, às:","o":["12h de segunda-feira.","14h de segunda-feira.","18h de segunda-feira.","6h de terça-feira."],"a":3,"c":"O próximo encontro acontece depois de MMC(6, 8) horas. Como 6 = 2 · 3 e 8 = 2³, o MMC é 2³ · 3 = 24 h. Somando 24 horas às 6h de segunda, chega-se às 6h de terça-feira.","id":"c70ab61"},{"m":"rl","tp":"MMC","nv":2,"e":"Três ônibus partem juntos de um terminal às 7h. O primeiro sai a cada 12 minutos, o segundo a cada 18 minutos e o terceiro a cada 30 minutos. Os três voltarão a partir juntos, pela primeira vez, às:","o":["10h.","8h30.","9h.","13h."],"a":0,"c":"MMC(12, 18, 30): 12 = 2² · 3, 18 = 2 · 3² e 30 = 2 · 3 · 5, então o MMC é 2² · 3² · 5 = 180 minutos, ou 3 horas. Somando 3 horas às 7h, os ônibus voltam a sair juntos às 10h.","id":"8bcd702"},{"m":"rl","tp":"MDC e MMC","nv":3,"e":"O MDC de dois números naturais é 6 e o MMC desses números é 90. Se um deles é 18, o outro é:","o":["15","24","30","45"],"a":2,"c":"Para dois números naturais, MDC × MMC = produto dos números. Então 6 × 90 = 18 × b, ou seja, 540 = 18b, e b = 30. Verificação: MDC(18, 30) = 6 e MMC(18, 30) = 90.","id":"eadad2e"},{"m":"rl","tp":"Números primos","nv":2,"e":"A quantidade de números primos entre 1 e 30 é:","o":["9","11","12","10"],"a":3,"c":"Os primos entre 1 e 30 são 2, 3, 5, 7, 11, 13, 17, 19, 23 e 29, ou seja, 10 números. O 1 não é primo, e o 2 é o único primo par.","id":"e2ea5d0"},{"m":"rl","tp":"Conjuntos – operações","nv":1,"e":"Sejam A = {1, 2, 3, 4, 5} e B = {4, 5, 6, 7}. Analise as afirmativas.\nI. A ∩ B = {4, 5}.\nII. A ∪ B possui 7 elementos.\nIII. A − B = {6, 7}.\nEstão CORRETAS as afirmativas:","o":["I e II, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],"a":0,"c":"I: os elementos comuns são 4 e 5. II: a união é {1, 2, 3, 4, 5, 6, 7}, com 7 elementos. III está errada: A − B, os elementos de A que não estão em B, é {1, 2, 3}. O conjunto {6, 7} é B − A.","id":"569347c"},{"m":"rl","tp":"Conjuntos – três conjuntos","nv":3,"e":"Em uma pesquisa com 100 moradores sobre os serviços que utilizam, 40 usam a UBS, 35 usam a farmácia popular e 30 usam o laboratório municipal. Além disso, 10 usam a UBS e a farmácia, 8 usam a UBS e o laboratório, 7 usam a farmácia e o laboratório, e 3 usam os três serviços. Quantos entrevistados não usam nenhum desses serviços?","o":["17","14","20","25"],"a":0,"c":"n(A ∪ B ∪ C) = 40 + 35 + 30 − 10 − 8 − 7 + 3 = 83. Não usam nenhum: 100 − 83 = 17. Esquecer de somar de volta a interseção tripla dá 80 e, portanto, 20, que é um erro comum.","id":"38fe395"},{"m":"rl","tp":"Conjuntos – subconjuntos","nv":1,"e":"O número de subconjuntos de um conjunto com 4 elementos, incluindo o conjunto vazio e o próprio conjunto, é:","o":["4","8","12","16"],"a":3,"c":"Um conjunto com n elementos tem 2^n subconjuntos: 2⁴ = 16.","id":"f589adc"},{"m":"rl","tp":"Verdades e mentiras","nv":3,"e":"Em uma ilha, os cavaleiros sempre dizem a verdade e os valetes sempre mentem. Dois habitantes, A e B, fazem as seguintes declarações. A: \"B é valete.\" B: \"A e eu somos do mesmo tipo.\" É CORRETO concluir que:","o":["A e B são cavaleiros.","A é cavaleiro e B é valete.","A e B são valetes.","A é valete e B é cavaleiro."],"a":1,"c":"Se A fosse valete, B seria cavaleiro, e a frase de B ('somos do mesmo tipo') seria falsa, o que um cavaleiro não pode dizer. Logo, A é cavaleiro e B é valete. A frase de B fica falsa, o que é coerente com B ser valete.","id":"4176ddc"},{"m":"rl","tp":"Verdades e mentiras","nv":2,"e":"Um dos três amigos, Davi, Eva ou Flávio, comeu o último pedaço de bolo. Davi diz: \"Foi a Eva.\" Eva diz: \"Foi o Flávio.\" Flávio diz: \"A Eva está mentindo.\" Sabendo que apenas um deles mente, quem comeu o bolo foi:","o":["Davi.","Eva.","Flávio.","Não é possível determinar."],"a":1,"c":"Testando cada hipótese: se foi Davi, mentem Davi e Eva (duas mentiras), o que não serve. Se foi Eva, só Eva mente (Davi e Flávio dizem a verdade), o que serve. Se foi Flávio, mentem Davi e Flávio (duas mentiras), o que não serve.","id":"bf729be"},{"m":"in","tp":"PowerPoint – apresentação","nv":1,"e":"No Microsoft PowerPoint, as teclas usadas para iniciar a apresentação a partir do PRIMEIRO slide e a partir do slide ATUAL são, respectivamente:","o":["Shift + F5 e F5","F7 e Ctrl + F5","Ctrl + P e F5","F5 e Shift + F5"],"a":3,"c":"F5 inicia a apresentação do começo, e Shift + F5 inicia a partir do slide selecionado. Esc encerra a apresentação. F7 verifica a ortografia, e Ctrl + P imprime.","id":"d453776"},{"m":"in","tp":"PowerPoint – modos de exibição","nv":2,"e":"No Microsoft PowerPoint, o modo de exibição que mostra todos os slides em miniatura, facilitando reorganizar a ordem deles, é:","o":["Classificação de Slides.","Anotações.","Modo de Leitura.","Estrutura de Tópicos."],"a":0,"c":"Na Classificação de Slides as miniaturas aparecem lado a lado e podem ser arrastadas para mudar a ordem. Anotações mostra o slide com o campo de notas do orador, e o Modo de Leitura exibe a apresentação dentro da janela.","id":"4c9a7f7"},{"m":"in","tp":"PowerPoint – transições e animações","nv":2,"e":"Sobre o Microsoft PowerPoint, marque V para verdadeiro e F para falso.\n( ) Transição é o efeito aplicado na passagem de um slide para outro.\n( ) Animação é o efeito aplicado a objetos dentro do slide, como textos e imagens.\n( ) Transições e animações ficam na mesma guia, chamada Design.\n( ) Uma animação pode ser configurada para iniciar ao clicar ou automaticamente.\nA sequência CORRETA é:","o":["V, V, V, V.","V, F, F, V.","V, V, F, V.","F, V, F, V."],"a":2,"c":"As transições ficam na guia Transições e as animações na guia Animações. A guia Design trata de temas, variantes e tamanho do slide, por isso a 3ª afirmativa é falsa. Nas opções de animação pode-se escolher 'Ao clicar', 'Com o anterior' ou 'Após o anterior'.","id":"d1288b1"},{"m":"in","tp":"PowerPoint – slide mestre","nv":2,"e":"No Microsoft PowerPoint, o recurso que permite padronizar fontes, cores, logotipo e posição dos elementos em todos os slides de uma apresentação, a partir de um único ponto, é o:","o":["Pincel de Formatação.","Classificação de Slides.","Ocultar Slide.","Slide Mestre."],"a":3,"c":"O Slide Mestre fica na guia Exibir. O que se altera nele é aplicado a todos os slides que usam seus layouts. O Pincel de Formatação copia a formatação de um objeto para outro, um de cada vez.","id":"7b4c3c9"},{"m":"in","tp":"PowerPoint – formatos","nv":2,"e":"Um arquivo do PowerPoint que, ao receber um duplo clique, abre diretamente no modo de apresentação, sem exibir a tela de edição, tem a extensão:","o":[".pptx",".potx",".xlsx",".ppsx"],"a":3,"c":"O formato .ppsx (Apresentação de Slides do PowerPoint) abre direto no modo de exibição. O .pptx é a apresentação editável comum, o .potx é um modelo e o .xlsx é uma planilha do Excel.","id":"08fb3c0"},{"m":"in","tp":"PowerPoint – modo do apresentador","nv":2,"e":"No Microsoft PowerPoint, ao apresentar com um projetor ligado ao computador, o recurso que mostra ao orador, no próprio monitor, as anotações, o próximo slide e um cronômetro, enquanto o público vê apenas o slide, é o:","o":["Modo de Exibição do Apresentador.","Modo de Leitura.","Slide Mestre.","Modo de Exibição de Estrutura de Tópicos."],"a":0,"c":"O Modo de Exibição do Apresentador, disponível na guia Apresentação de Slides, separa o que o orador vê (notas, próximo slide, tempo) do que é projetado.","id":"2cbfd9c"},{"m":"in","tp":"Microsoft Teams","nv":1,"e":"Sobre o Microsoft Teams, analise as afirmativas.\nI. Organiza a colaboração em equipes, que podem conter canais por assunto.\nII. Permite reuniões on-line com áudio, vídeo e compartilhamento de tela.\nIII. Funciona apenas como programa instalado no computador, sem versão para navegador ou celular.\nEstão CORRETAS as afirmativas:","o":["I e III, apenas.","I e II, apenas.","II e III, apenas.","I, II e III."],"a":1,"c":"I e II estão corretas. III está errada: o Teams tem aplicativo para desktop, versão web acessada pelo navegador e aplicativos para Android e iOS.","id":"6d10dec"},{"m":"in","tp":"Microsoft Teams","nv":2,"e":"No Microsoft Teams, em uma reunião on-line, o recurso que permite aos participantes mostrar a todos o conteúdo de sua tela ou de uma janela específica é o:","o":["modo Não Incomodar.","compartilhamento de tela (Compartilhar conteúdo).","status Ausente.","fixar o chat."],"a":1,"c":"O botão Compartilhar (Compartilhar conteúdo) permite exibir a tela inteira, uma janela ou uma apresentação do PowerPoint. 'Não incomodar' e 'Ausente' são status de presença, e fixar o chat apenas o mantém no topo da lista.","id":"df74603"},{"m":"in","tp":"Outlook – calendário","nv":2,"e":"No Microsoft Outlook, para agendar um compromisso no calendário e enviá-lo a outras pessoas, que poderão aceitar, aceitar como provisório ou recusar, o usuário deve criar:","o":["uma nova reunião (convite de reunião).","uma nova regra.","uma nova tarefa pessoal.","um novo contato."],"a":0,"c":"O convite de reunião é enviado aos participantes e, conforme as respostas (Aceitar, Provisório, Recusar), o organizador acompanha quem vai comparecer. O compromisso sem convidados fica só no calendário do próprio usuário.","id":"979d52a"},{"m":"in","tp":"Outlook – regras","nv":2,"e":"No Microsoft Outlook, o recurso que permite mover automaticamente para uma pasta específica todas as mensagens recebidas de determinado remetente é:","o":["Cco.","Regras.","Assinatura.","Resposta automática (Ausência temporária)."],"a":1,"c":"As Regras executam ações automáticas (mover, sinalizar, encaminhar) quando a mensagem atende a condições como remetente, assunto ou palavras. A Assinatura é o texto padrão ao fim das mensagens, e a resposta automática avisa que o usuário está ausente.","id":"f831ba5"},{"m":"in","tp":"Outlook – pastas","nv":2,"e":"No Microsoft Outlook, a pasta que armazena temporariamente as mensagens que o usuário mandou enviar, mas que ainda não foram transmitidas ao servidor (por exemplo, por falta de conexão), é a:","o":["Caixa de Saída.","Itens Enviados.","Rascunhos.","Lixo Eletrônico."],"a":0,"c":"Na Caixa de Saída a mensagem aguarda o envio, e depois de enviada passa para Itens Enviados. Rascunhos guarda as mensagens que ainda não foram mandadas enviar, e Lixo Eletrônico recebe o spam.","id":"3996243"},{"m":"in","tp":"IA em produtividade","nv":1,"e":"Sobre o uso de assistentes de inteligência artificial integrados a ferramentas de produtividade, como o Microsoft Copilot no Word, Excel, PowerPoint e Outlook, é CORRETO afirmar que:","o":["produzem conteúdo sempre correto, dispensando a revisão humana.","funcionam apenas como corretores ortográficos, sem gerar textos novos.","podem gerar rascunhos, resumos e sugestões, mas o conteúdo produzido pode conter erros e deve ser revisado pelo usuário.","substituem a necessidade de salvar ou fazer backup dos arquivos."],"a":2,"c":"Os assistentes de IA generativa criam e resumem textos, sugerem fórmulas e montam slides, mas podem 'alucinar', ou seja, inventar informações com aparência de verdade. A responsabilidade pelo conteúdo final continua sendo do usuário.","id":"c9f3643"},{"m":"in","tp":"IA em produtividade","nv":2,"e":"Sobre o uso de ferramentas de inteligência artificial generativa por profissionais de saúde, é INCORRETO afirmar que:","o":["as informações produzidas pela IA devem ser conferidas antes de serem usadas.","o uso deve respeitar as normas da instituição e a Lei Geral de Proteção de Dados.","é seguro inserir nome, diagnóstico e dados pessoais de pacientes em qualquer ferramenta de IA gratuita da internet para agilizar relatórios.","a IA pode ajudar a resumir textos e organizar informações não sigilosas."],"a":2,"c":"Dados de saúde são dados pessoais sensíveis pela LGPD (Lei nº 13.709/2018). Inseri-los em ferramentas não autorizadas pode expor o paciente e violar o sigilo. As demais afirmativas são boas práticas.","id":"d48d13f"},{"m":"in","tp":"IA em produtividade","nv":1,"e":"No uso de ferramentas de inteligência artificial generativa, como o Copilot, o termo \"prompt\" designa:","o":["o arquivo de backup gerado automaticamente pela ferramenta.","o vírus que se espalha por meio de assistentes virtuais.","a instrução ou pergunta, escrita em linguagem natural, que o usuário fornece à ferramenta.","a senha usada para ativar a licença do programa."],"a":2,"c":"O prompt é o comando dado à IA, como 'Resuma este documento em cinco tópicos'. Prompts claros e com contexto tendem a gerar respostas melhores.","id":"0e7adea"},{"m":"in","tp":"Intranet e extranet","nv":2,"e":"Sobre intranet e extranet, é CORRETO afirmar que:","o":["a intranet é uma rede pública, aberta a qualquer usuário da internet.","a extranet permite que usuários externos autorizados, como parceiros e fornecedores, acessem parte dos recursos da rede privada da organização.","a extranet é o nome dado à internet quando acessada pelo celular.","a intranet não pode utilizar navegadores nem o protocolo HTTP."],"a":1,"c":"A intranet é uma rede privada que usa as tecnologias da internet (TCP/IP, HTTP, navegadores). A extranet estende parte dela a usuários externos autorizados, geralmente com login ou VPN.","id":"8c6396d"}]};

var CARDS=[{"m":"lm","tp":"Lei Orgânica – Organização do Município","f":"Quais são os Poderes do Município de Paracatu?","v":"Legislativo e Executivo, independentes e harmônicos entre si (art. 2º)."},{"m":"lm","tp":"Lei Orgânica – Competências","f":"A que se destina a guarda municipal prevista no art. 8º, XXXI?","v":"Proteger bens, serviços e instalações municipais; organizar, dirigir e fiscalizar o tráfego; proteger o patrimônio histórico, cultural e ecológico."},{"m":"lm","tp":"Lei Orgânica – Poder Municipal e participação","f":"Quem é parte legítima para denunciar irregularidades à Câmara?","v":"Qualquer munícipe, partido político, associação ou entidade (art. 16)."},{"m":"lm","tp":"Lei Orgânica – Participação popular","f":"Consulta popular: quem propõe, quantas por ano e quando é vedada?","v":"Maioria absoluta da Câmara ou 5% do eleitorado; no máximo 2 por ano; vedada nos 60 dias antes de eleições (arts. 168-169)."},{"m":"lm","tp":"Lei Orgânica – Câmara Municipal","f":"Duração de cada legislatura?","v":"Quatro anos (art. 17, § 2º)."},{"m":"lm","tp":"Lei Orgânica – Câmara Municipal","f":"Quórum geral das deliberações da Câmara (art. 20)?","v":"Maioria de votos, presente a maioria absoluta dos membros."},{"m":"lm","tp":"Lei Orgânica – Posse dos vereadores","f":"Quem preside a reunião preparatória e quem presta o juramento?","v":"Preside o vereador mais idoso; o vereador mais votado presta o juramento (art. 21, §§ 1º e 4º)."},{"m":"lm","tp":"Lei Orgânica – Posse dos vereadores","f":"Prazo para o vereador que faltou à reunião preparatória tomar posse?","v":"15 dias do início do funcionamento normal da Câmara, sob pena de perda do mandato, salvo justo motivo aceito pela maioria absoluta (art. 21, § 6º)."},{"m":"lm","tp":"Lei Orgânica – Mesa Diretora","f":"Mandato da Mesa e critério de desempate na eleição?","v":"2 anos, permitida a recondução; no empate, elege-se o mais idoso (art. 23)."},{"m":"lm","tp":"Lei Orgânica – Mesa Diretora","f":"Quórum para destituir membro da Mesa?","v":"Requerimento de qualquer Vereador aprovado por 2/3 dos membros, com contraditório e ampla defesa (art. 24)."},{"m":"lm","tp":"Lei Orgânica – Câmara Municipal","f":"Prazo para órgãos do Executivo prestarem informações requisitadas pela Câmara?","v":"15 dias, prorrogável por igual período se solicitado e justificado (art. 26, § 1º)."},{"m":"lm","tp":"Lei Orgânica – Câmara Municipal","f":"Quórum para criar CPI (comissão de inquérito)?","v":"Requerimento de 1/3 dos membros, fato determinado e prazo certo; conclusões ao Ministério Público (arts. 26, XVII, e 38, § 4º)."},{"m":"lm","tp":"Lei Orgânica – Reuniões da Câmara","f":"Períodos anuais de reunião da Câmara?","v":"1º/2 a 30/6 e 1º/8 a 20/12; no 1º ano da legislatura, começa em 1º/1 (art. 27)."},{"m":"lm","tp":"Lei Orgânica – Reuniões da Câmara","f":"Quem convoca extraordinariamente a Câmara?","v":"O Prefeito, o Presidente da Câmara ou a maioria dos membros, mediante requerimento (art. 27, § 5º)."},{"m":"lm","tp":"Lei Orgânica – Mesa Diretora","f":"Quando o Presidente da Câmara vota?","v":"Só na eleição da Mesa, nos escrutínios secretos e no empate (art. 35)."},{"m":"lm","tp":"Lei Orgânica – Mesa Diretora","f":"Prazos da Mesa: contas da Câmara e proposta orçamentária parcial?","v":"Contas ao Prefeito até 1º de março; proposta parcial até 31 de julho (art. 33, I e IV)."},{"m":"lm","tp":"Lei Orgânica – Comissões","f":"Comissão representativa do recesso: composição?","v":"5 membros, eleita na última reunião ordinária da sessão legislativa (art. 38, § 5º)."},{"m":"lm","tp":"Lei Orgânica – Subsídios","f":"Limites do subsídio dos Vereadores?","v":"Individual: 75% do subsídio dos Deputados Estaduais; total anual: 5% da receita municipal (art. 43)."},{"m":"lm","tp":"Lei Orgânica – Vereadores","f":"Faltas que levam à perda do mandato do Vereador?","v":"Deixar de comparecer a 1/3 das sessões ordinárias em cada sessão legislativa, salvo licença ou missão autorizada (art. 50, IV)."},{"m":"lm","tp":"Lei Orgânica – Vereadores","f":"Licença do Vereador para interesse particular: limites?","v":"Máximo de 120 dias por sessão legislativa e mínimo de 30 dias, sem subsídio; não pode reassumir antes do fim (art. 51)."},{"m":"lm","tp":"Lei Orgânica – Vereadores","f":"Atestado médico do Vereador: prazo e limite de faltas justificadas?","v":"5 dias após a reunião; até 3 reuniões consecutivas, depois pede licença (art. 52)."},{"m":"lm","tp":"Lei Orgânica – Vereadores","f":"Suplente: prazo de posse?","v":"15 dias da convocação, mais 15 improrrogáveis com justo motivo; vaga sem suplente: Presidente comunica o TRE em 48 horas (art. 53)."},{"m":"lm","tp":"Lei Orgânica – Processo legislativo","f":"Emenda à Lei Orgânica: tramitação e quórum?","v":"Dois turnos, interstício mínimo de 10 dias, 2/3 dos membros em ambos; promulgada pela Mesa (art. 55)."},{"m":"lm","tp":"Lei Orgânica – Processo legislativo","f":"Iniciativa popular de lei: assinaturas?","v":"No mínimo 5% dos eleitores inscritos; defesa na Tribuna por um dos 5 primeiros signatários (art. 58)."},{"m":"lm","tp":"Lei Orgânica – Processo legislativo","f":"Quórum de aprovação de lei complementar?","v":"Maioria absoluta dos membros da Câmara (art. 59, parágrafo único)."},{"m":"lm","tp":"Lei Orgânica – Processo legislativo","f":"Urgência pedida pelo Prefeito: prazo?","v":"45 dias; não corre no recesso e não se aplica a projeto de lei complementar (art. 62)."},{"m":"lm","tp":"Lei Orgânica – Sanção e veto","f":"Prazos de sanção e veto?","v":"Envio ao Prefeito em 5 dias úteis; veto em 15 dias úteis do recebimento; motivos em 48 h; silêncio = sanção (art. 63)."},{"m":"lm","tp":"Lei Orgânica – Sanção e veto","f":"Apreciação do veto pela Câmara?","v":"Em 30 dias, discussão e votação únicas; rejeição só por maioria absoluta em escrutínio secreto (art. 63, §§ 4º e 5º)."},{"m":"lm","tp":"Lei Orgânica – Fiscalização e contas","f":"Quórum para afastar o parecer prévio do TCE?","v":"2/3 dos membros da Câmara (art. 68, § 2º)."},{"m":"lm","tp":"Lei Orgânica – Fiscalização e contas","f":"Por quanto tempo as contas ficam à disposição do cidadão?","v":"60 dias por ano, com pelo menos 3 cópias na Câmara; reclamação apreciada em 30 dias (art. 70)."},{"m":"lm","tp":"Lei Orgânica – Prefeito e Vice-Prefeito","f":"Posse do Prefeito: data e prazo para declarar o cargo vago?","v":"1º de janeiro do ano seguinte à eleição; vago após 10 dias sem posse, salvo força maior aceita pela Câmara (arts. 74 e 80)."},{"m":"lm","tp":"Lei Orgânica – Prefeito e Vice-Prefeito","f":"Ausência do Prefeito sem licença da Câmara?","v":"Por mais de 15 dias: perda do mandato (art. 77)."},{"m":"lm","tp":"Lei Orgânica – Prefeito e Vice-Prefeito","f":"Onde o Prefeito é julgado?","v":"Crimes de responsabilidade: Tribunal de Justiça; infrações político-administrativas: Câmara Municipal (arts. 81 e 82)."},{"m":"lm","tp":"Lei Orgânica – Tributos e orçamento","f":"Prazos de envio das leis orçamentárias (art. 297)?","v":"PPA e LOA até 31 de agosto; LDO até 15 de abril."},{"m":"lm","tp":"Lei Orgânica – Fiscalização e contas","f":"Prazo para o Prefeito enviar as contas anuais?","v":"Até 31 de março, à Câmara e ao TCE-MG (art. 160)."},{"m":"lm","tp":"Lei Orgânica – Servidores municipais","f":"Em que dia o concurso público municipal NÃO pode ser realizado?","v":"Aos sábados (art. 98, § 4º)."},{"m":"lm","tp":"Lei Orgânica – Atos municipais","f":"Prazo para os Poderes fornecerem certidões ao interessado?","v":"No máximo 15 dias (art. 109)."},{"m":"lm","tp":"Lei Orgânica – Bens municipais","f":"Permissão x autorização de uso de bem público: forma?","v":"Permissão: licitação, título precário, por decreto. Autorização: por portaria, para usos específicos e transitórios (art. 114)."},{"m":"lm","tp":"Lei Orgânica – Saúde","f":"Execução das ações e serviços de saúde: preferencialmente como?","v":"Preferencialmente de forma direta pelo Poder Público e supletivamente por terceiros (art. 192, § 1º)."},{"m":"lm","tp":"Lei Orgânica – Saúde","f":"Quem não pode ser nomeado para chefia ou assessoramento na saúde?","v":"Quem participe da direção, gerência ou administração de entidade contratada ou credenciada pelo SUS (art. 191, § 4º)."},{"m":"lm","tp":"LC 54/2007 – Disposições transitórias","f":"Cargos da Saúde extintos pela vacância (LC 54)?","v":"Agente Comunitário de Saúde e Auxiliar de Serviços de Saúde, entre outros (art. 47)."},{"m":"lm","tp":"LC 54/2007 – Jornada","f":"Jornada do Enfermeiro e do Técnico em Radiologia (LC 54)?","v":"24 horas cada (art. 6º, III, b e k)."},{"m":"lm","tp":"LC 54/2007 – Jornada","f":"Jornada dos demais técnicos e administrativos da saúde x demais de nível superior da saúde (LC 54)?","v":"40 h x 30 h (art. 6º, III, m e l)."},{"m":"lm","tp":"LC 54/2007 – Jornada","f":"Jornada do servidor readaptado (LC 54)?","v":"A do cargo no qual se deu a readaptação (art. 6º, parágrafo único)."},{"m":"lm","tp":"LC 54/2007 – Jornada","f":"Jornada diversa fixada pelo Prefeito gera direito à permanência?","v":"Não. Ato justificado do Prefeito, sem direito à permanência (art. 7º)."},{"m":"lm","tp":"LC 54/2007 – Hora extra","f":"Hora extra na LC 54 (redação LC 210/2026)?","v":"50% dias úteis; 60% domingos e feriados; compensação de jornada permitida (art. 14)."},{"m":"lm","tp":"LC 54/2007 – Hora extra","f":"Limite de horas extras na LC 54 após a LC 210/2026?","v":"50 horas mensais por servidor (art. 14, §1º). Antes: 2 h diárias prorrogáveis."},{"m":"lm","tp":"LC 54/2007 – Hora extra","f":"Quem autoriza o pagamento de hora extra acima do limite (LC 54)?","v":"Secretário titular da pasta E Prefeito, após validar as justificativas (art. 14, §3º)."},{"m":"lm","tp":"LC 54/2007 – Adicional noturno","f":"Adicional noturno (LC 54)?","v":"20% sobre a hora diurna; hora de 52min30s; das 22 h às 5 h (art. 15)."},{"m":"lm","tp":"LC 54/2007 – Insalubridade","f":"Exames de quem trabalha com raio X (LC 54)?","v":"A cada 6 meses (art. 18, parágrafo único)."},{"m":"lm","tp":"LC 54/2007 – Insalubridade","f":"Gestante ou lactante em local insalubre (LC 54)?","v":"Afastada durante gestação e lactação, para local salubre e serviço não penoso e não perigoso (art. 17)."},{"m":"lm","tp":"LC 54/2007 – Gratificação natalina","f":"O que a LC 210/2026 acrescentou à natalina da LC 54?","v":"§3º: gratificações da LC 161/2023 não entram no cálculo (art. 19)."},{"m":"lm","tp":"LC 54/2007 – Conceitos","f":"Nível x padrão de vencimento?","v":"Nível: vertical, algarismo romano. Padrão: horizontal, ordem alfabética (art. 2º, XI e XII)."},{"m":"lm","tp":"LC 54/2007 – Conceitos","f":"Definição de carreira (LC 54 e 55)?","v":"Escala de vencimentos dividida em padrões; desenvolvimento por merecimento e conhecimento (art. 2º, IV / LC 55, art. 3º, IV)."},{"m":"lm","tp":"LC 54/2007 – Progressão por merecimento","f":"Requisitos da progressão por merecimento?","v":"730 dias na classe; sem suspensão nos 6 meses anteriores; conceito favorável na avaliação (art. 21)."},{"m":"lm","tp":"LC 54/2007 – Avaliação de desempenho","f":"Nota mínima para habilitar à progressão?","v":"70% em CADA fator de avaliação (LC 54, art. 24, §2º; LC 55, art. 29, §3º)."},{"m":"lm","tp":"LC 54/2007 – Avaliação de desempenho","f":"Quando é feita a avaliação e que período abrange (LC 54)?","v":"No mês em que completar 730 dias; últimos 24 meses (art. 24)."},{"m":"lm","tp":"LC 54/2007 – Progressão por merecimento","f":"Tempo que não conta para progressão por merecimento (LC 54)?","v":"À disposição de órgão externo sem ônus para a Prefeitura; licença sem remuneração (art. 23)."},{"m":"lm","tp":"LC 54/2007 – Progressão por conhecimento","f":"Avanço por título na progressão por conhecimento?","v":"Duas letras (graduação, outro superior, especialização 360 h, mestrado, doutorado) (art. 25)."},{"m":"lm","tp":"LC 54/2007 – Progressão por conhecimento","f":"Prazo para entregar diploma após declaração de conclusão?","v":"12 meses, prorrogável uma única vez por 12 meses; senão devolve em folha (art. 26)."},{"m":"lm","tp":"LC 54/2007 – Progressão","f":"Regra nova dos arts. 29-A (LC 54) e 35-A (LC 55)?","v":"O servidor só terá direito à progressão de que trata a seção após cumprido o estágio probatório (LC 210/2026)."},{"m":"lm","tp":"LC 54/2007 – Enquadramento","f":"Sem padrão de valor igual ao vencimento atual, onde se posiciona o servidor?","v":"No padrão de valor imediatamente superior (art. 30, §3º)."},{"m":"lm","tp":"LC 54/2007 – Disposições transitórias","f":"Prazo dado ao Auxiliar de Enfermagem para apresentar curso técnico (LC 54)?","v":"2 anos; sem o certificado, não tem progressão (art. 48)."},{"m":"lm","tp":"LC 54/2007 – Quadros e cargos","f":"Percentual mínimo de comissionados para efetivos (LC 54 e LC 55)?","v":"5% (LC 54, art. 5º; LC 55, art. 16)."},{"m":"lm","tp":"LC 55/2007 – Licença para pós-graduação","f":"Duração máxima da licença stricto sensu (LC 55, art. 19-A)?","v":"Mestrado 1 ano; doutorado 2 anos; pós-doutorado 2 anos (§4º)."},{"m":"lm","tp":"LC 55/2007 – Licença para pós-graduação","f":"Quem homologa a licença para pós-graduação (LC 55)?","v":"Dirigente máximo da Secretaria Municipal de Educação e Tecnologia, respeitada a classificação (art. 19-A, §8º)."},{"m":"lm","tp":"LC 55/2007 – Jornada","f":"Distribuição da jornada do professor (LC 55, redação LC 210)?","v":"24 h: 16 h de regência + 8 h extraclasse (4 h livre escolha + 4 h na escola, até 2 h de módulo) (art. 20)."},{"m":"lm","tp":"LC 55/2007 – Jornada","f":"Readaptação do professor (LC 55)?","v":"Mantém a carga de 24 horas (art. 20, parágrafo único)."},{"m":"lm","tp":"LC 55/2007 – Vantagens","f":"Adicional compensatório de hora-aula (LC 55)?","v":"20% da hora-aula padrão (50 min), Ed. Física de 60 min; indenizatório (art. 25, VII e §§5º-6º)."},{"m":"lm","tp":"LC 55/2007 – Provimento","f":"Estágio probatório na LC 55?","v":"3 anos, contados da investidura (art. 14)."},{"m":"lm","tp":"LC 210/2026 – Estatuto","f":"Formas de provimento após a LC 210/2026?","v":"Sete: nomeação, progressão, readaptação, reversão, aproveitamento, reintegração e promoção (art. 10 da LC 5/1991)."},{"m":"lm","tp":"LC 210/2026 – Estatuto","f":"O que é progressão (LC 210/2026)?","v":"Desenvolvimento horizontal do servidor efetivo, de um padrão para outro na tabela de vencimentos do seu nível (art. 15)."},{"m":"lm","tp":"LC 210/2026 – Estatuto","f":"O que é promoção (art. 33-A)?","v":"Provimento derivado: passagem de uma classe para a imediatamente superior na mesma carreira, sem mudar de cargo (§ 3º)."},{"m":"lm","tp":"LC 210/2026 – Estatuto","f":"Interstício da progressão por merecimento?","v":"2 anos + conceito mínimo na avaliação de desempenho (art. 18). Antes eram 3 anos."},{"m":"lm","tp":"LC 210/2026 – Estatuto","f":"Progressão por conhecimento?","v":"Por qualificação profissional, nos termos do PCC, desde que não seja requisito de investidura do cargo (art. 17)."},{"m":"lm","tp":"LC 210/2026 – Estatuto","f":"Prescrição da infração punível com advertência?","v":"150 dias (art. 163, III, redação da LC 210/2026). Antes: 180 dias."},{"m":"lm","tp":"LC 210/2026 – Estatuto","f":"Incompatibilização por abandono ou inassiduidade habitual?","v":"5 anos (art. 161-A, criado pela LC 210/2026). Regra geral: 15 anos (art. 161)."},{"m":"lm","tp":"LC 210/2026 – Reestruturação","f":"Leis alteradas pela LC 210/2026 (art. 1º)?","v":"LC 5/1991, LC 7/1991, LC 54/2007, LC 55/2007, LC 149/2021 e LC 164/2023."},{"m":"lm","tp":"LC 210/2026 – Estrutura da LC 149","f":"Órgãos de 1º nível hierárquico?","v":"Secretaria Municipal, Procuradoria Municipal e Controladoria Geral (art. 8º, I)."},{"m":"lm","tp":"LC 210/2026 – Estrutura da LC 149","f":"2º, 3º e 4º níveis?","v":"2º: Superintendência; 3º: Diretoria de Departamento e Assessoria; 4º: Chefia de Divisão e Coordenação (art. 8º)."},{"m":"lm","tp":"LC 210/2026 – Estrutura da LC 149","f":"Estrutura básica x complementar?","v":"Básica: órgãos de 1º nível. Complementar: unidades de 2º e 3º nível (art. 6º, §§ 1º e 2º)."},{"m":"lm","tp":"LC 210/2026 – Órgãos de apoio ao Prefeito","f":"Órgãos de apoio direto ao Prefeito?","v":"Gabinete do Prefeito, Conselhos Municipais, Gabinete do Vice, Procuradoria, Secretaria de Governo, Controladoria Geral e Secretaria de Relações Institucionais (art. 10)."},{"m":"lm","tp":"LC 210/2026 – Secretarias","f":"Órgãos de gestão?","v":"Secretaria Municipal de Gestão Pública e Secretaria Municipal de Fazenda (art. 11)."},{"m":"lm","tp":"LC 210/2026 – Secretaria de Relações Institucionais","f":"Qual Secretaria a LC 210/2026 criou e o que ela absorveu?","v":"Secretaria Municipal de Relações Institucionais; recebeu a Superintendência de Relações Institucionais (art. 9º), mas os órgãos internos dela ficaram na Secretaria de Governo."},{"m":"lm","tp":"LC 210/2026 – Cargos em comissão","f":"Opção do efetivo nomeado em comissão?","v":"Vencimento do comissionado OU do efetivo + 25% sobre o salário base do efetivo (art. 228). Reserva de 10% dos cargos para efetivos estáveis (art. 9º, § 5º)."},{"m":"lm","tp":"Estatuto – Posse e exercício","f":"Prazo para a posse (LC 5/1991)?","v":"30 dias do ato de nomeação, prorrogável por igual período a pedido (art. 42)."},{"m":"lm","tp":"Estatuto – Posse e exercício","f":"Prazo para entrar em exercício?","v":"30 dias contados da posse; se não entrar, é exonerado (art. 51)."},{"m":"lm","tp":"Estatuto – Posse e exercício","f":"Documentos para a posse?","v":"Declaração de bens e valores; declaração de não exercer outro cargo; atestado de aptidão física e mental em inspeção médica oficial (art. 43)."},{"m":"lm","tp":"Estatuto – Provimento","f":"Formas de provimento (art. 10)?","v":"Sete (redação da LC 210/2026): nomeação, progressão, readaptação, reversão, aproveitamento, reintegração e promoção."},{"m":"lm","tp":"Estatuto – Provimento","f":"Idade mínima para investidura?","v":"18 anos (art. 7º, V)."},{"m":"lm","tp":"Estatuto – Provimento","f":"Reserva de vagas para pessoa com deficiência?","v":"Até 20% das vagas (art. 8º)."},{"m":"lm","tp":"Estatuto – Progressão e promoção","f":"Progressão por merecimento: interstício e fatores (redação da LC 210/2026)?","v":"Interstício mínimo de 2 anos + conceito mínimo na avaliação; assiduidade, disciplina, capacidade de iniciativa e responsabilidade (arts. 16 e 18). Não há mais \"mês de junho\"."},{"m":"lm","tp":"Estatuto – Progressão e promoção","f":"Qual pena faz perder o direito à progressão por merecimento?","v":"Suspensão sofrida no interstício (art. 19, redação da LC 210/2026)."},{"m":"lm","tp":"Estatuto – Provimento","f":"Aproveitamento: prazo para entrar em exercício?","v":"30 dias da publicação do ato; em disponibilidade há mais de 12 meses, precisa comprovar capacidade física e mental (arts. 26-27)."},{"m":"lm","tp":"Estatuto – Concurso","f":"Validade do concurso?","v":"2 anos da homologação, prorrogável uma vez por igual período, se previsto no edital (art. 38)."},{"m":"lm","tp":"Estatuto – Concurso","f":"Pode abrir novo concurso com aprovados de concurso anterior válido?","v":"Não, para o mesmo cargo, enquanto o prazo de validade do anterior não expirar (art. 39)."},{"m":"lm","tp":"Estatuto – Estágio probatório","f":"Duração e fatores do estágio probatório?","v":"2 anos; assiduidade, disciplina, capacidade de iniciativa e produtividade (art. 44)."},{"m":"lm","tp":"Estatuto – Estágio probatório","f":"Avaliação do estágio: quem faz e quando conclui?","v":"Setor de RH; concluída 60 dias antes do término; vista do parecer por 5 dias (arts. 45 e 47)."},{"m":"lm","tp":"Estatuto – Posse e exercício","f":"Ausências sem prejuízo (art. 56)?","v":"1 dia doação de sangue; 1 dia alistamento eleitoral; 8 dias consecutivos por falecimento; 5 dias por casamento."},{"m":"lm","tp":"Estatuto – Tempo de serviço","f":"Ano para conversão do tempo de serviço?","v":"365 dias (art. 58)."},{"m":"lm","tp":"Estatuto – Férias","f":"Férias: duração e pagamento?","v":"30 dias consecutivos a cada 12 meses; adicional de 1/3; pagamento até 2 dias antes (arts. 67, 69, 70)."},{"m":"lm","tp":"Estatuto – Férias","f":"Acúmulo máximo de férias?","v":"2 períodos, por necessidade do serviço (art. 72, parágrafo único)."},{"m":"lm","tp":"Estatuto – Férias","f":"Quando as férias podem ser interrompidas?","v":"Comoção interna, calamidade pública ou superior interesse do serviço público (art. 67)."},{"m":"lm","tp":"Estatuto – Licenças","f":"Tempo máximo em licença?","v":"24 meses; saúde prorrogável por 3 períodos de 12 meses para tuberculose, lepra ou pênfigo foliáceo (art. 74)."},{"m":"lm","tp":"Estatuto – Licenças","f":"Licença saúde acima de 30 dias exige?","v":"Inspeção por junta médica oficial (art. 76, § 1º)."},{"m":"lm","tp":"Estatuto – Licenças","f":"Licença por aborto?","v":"30 dias, atestado por médico oficial (art. 82)."},{"m":"lm","tp":"Estatuto – Licenças","f":"Licença adotante?","v":"90 dias (criança até 1 ano); 30 dias (mais de 1 ano) (art. 83)."},{"m":"lm","tp":"Estatuto – Licenças","f":"Licença-paternidade?","v":"5 dias consecutivos (art. 84)."},{"m":"lm","tp":"Estatuto – Licenças","f":"Doença em pessoa da família: prazo e remuneração?","v":"Até 90 dias, prorrogável; remuneração integral até 90 dias (arts. 86 e 101, V)."},{"m":"lm","tp":"Estatuto – Licenças","f":"Atividade política: qual período é remunerado?","v":"Do registro da candidatura até o 15º dia após a eleição (arts. 92, II, e 101, VII)."},{"m":"lm","tp":"Estatuto – Licenças","f":"Interesses particulares: regras?","v":"A critério da Administração; até 2 anos; exige 2 anos de exercício; nova só 2 anos após a anterior; sem remuneração (arts. 94-96, 102)."},{"m":"lm","tp":"Estatuto – Férias-prêmio","f":"Férias-prêmio?","v":"6 meses a cada 10 anos de efetivo exercício; requerer 30 dias antes do decênio; conversível em espécie a pedido (arts. 97-99)."},{"m":"lm","tp":"Estatuto – Afastamentos","f":"Vereador com compatibilidade de horários?","v":"Não se afasta; recebe a remuneração do cargo e a do mandato (art. 108)."},{"m":"lm","tp":"Estatuto – Direito de petição","f":"Requerimento/reconsideração: prazos?","v":"Despachado em 5 dias e decidido em 30 dias (art. 129)."},{"m":"lm","tp":"Estatuto – Direito de petição","f":"Prazo do recurso e prescrição comum do direito de requerer?","v":"Recurso: 15 dias; prescrição: 120 dias, nos casos não patrimoniais (arts. 131 e 134)."},{"m":"lm","tp":"Estatuto – Deveres e proibições","f":"Parente sob chefia imediata: limite?","v":"Proibido cônjuge, companheiro ou parente até o 2º grau (art. 138, IX)."},{"m":"lm","tp":"Estatuto – Penalidades","f":"Penalidades disciplinares (art. 150)?","v":"Advertência, suspensão, demissão, cassação de aposentadoria ou disponibilidade, destituição de cargo em comissão."},{"m":"lm","tp":"Estatuto – Penalidades","f":"Suspensão: limite e multa?","v":"Até 90 dias; conversível em multa de 50% da remuneração, permanecendo em serviço (arts. 154-155)."},{"m":"lm","tp":"Estatuto – Penalidades","f":"Abandono de cargo x inassiduidade habitual?","v":"Abandono: mais de 30 dias consecutivos; inassiduidade: 60 dias em 12 meses (art. 157, parágrafo único)."},{"m":"lm","tp":"Estatuto – Penalidades","f":"Cancelamento de registro de penas?","v":"Advertência: 3 anos; suspensão: 5 anos, sem nova infração; sem efeito retroativo (art. 156)."},{"m":"lm","tp":"Estatuto – Prescrição disciplinar","f":"Prescrição da ação disciplinar?","v":"5 anos (demissão, cassação, destituição); 2 anos (suspensão); 150 dias (advertência – redação da LC 210/2026), contados de quando o fato se tornou conhecido (art. 163)."},{"m":"lm","tp":"Estatuto – Sindicância e PAD","f":"Afastamento preventivo?","v":"Até 60 dias, com remuneração, prorrogável por igual prazo (art. 167)."},{"m":"lm","tp":"Estatuto – Sindicância e PAD","f":"Comissão do PAD e prazo?","v":"3 servidores; impedido parente até 3º grau; 60 dias prorrogáveis por igual prazo (arts. 169 e 172)."},{"m":"lm","tp":"Estatuto – Sindicância e PAD","f":"Prazos de defesa no PAD?","v":"10 dias; 20 dias comuns com 2+ indiciados; prorrogável pelo dobro; edital: 15 dias (arts. 181 e 183)."},{"m":"lm","tp":"Estatuto – Revisão","f":"Revisão do PAD pode agravar a pena
