?","v":"Não (art. 202). Pode ser a qualquer tempo; destituição revista vira exoneração (arts. 193 e 201)."},{"m":"lm","tp":"Estatuto – Penalidades","f":"Prazo de incompatibilização após demissão por abandono ou inassiduidade?","v":"5 anos (art. 161-A, incluído pela LC 210/2026); nas demais demissões/destituições, 15 anos (art. 161)."},{"m":"lm","tp":"Estatuto – Progressão e promoção","f":"Progressão x promoção (LC 210/2026)?","v":"Progressão: de um padrão para outro na tabela (horizontal), por merecimento ou conhecimento. Promoção: de uma classe para a imediatamente superior na mesma carreira, sem mudar de cargo (arts. 15-17 e 33-A)."},{"m":"ce","tp":"Doenças Crônicas (HAS e DM)","f":"Critérios diagnósticos de DM?","v":"Jejum ≥ 126 mg/dL; HbA1c ≥ 6,5%; TOTG 2 h ≥ 200 mg/dL; ao acaso ≥ 200 mg/dL com sintomas."},{"m":"ce","tp":"SUS – CF e Leis","f":"Três diretrizes do SUS no art. 198 da CF?","v":"Descentralização com direção única em cada esfera; atendimento integral com prioridade para ações preventivas; participação da comunidade."},{"m":"ce","tp":"SUS – CF e Leis","f":"Como a iniciativa privada participa do SUS (CF, art. 199)?","v":"De forma complementar, por contrato de direito público ou convênio; preferência para filantrópicas e sem fins lucrativos."},{"m":"ce","tp":"SUS – CF e Leis","f":"Lei 8.080/90: o dever do Estado exclui o das pessoas e da família?","v":"Não. Não exclui o das pessoas, da família, das empresas e da sociedade (art. 2º, §2º)."},{"m":"ce","tp":"SUS – CF e Leis","f":"Lei 8.142/90: dois instrumentos de participação da comunidade?","v":"Conferência de Saúde (a cada 4 anos) e Conselho de Saúde (permanente e deliberativo)."},{"m":"ce","tp":"SUS – CF e Leis","f":"Lei 8.142/90: percentual mínimo dos recursos do FNS destinado aos Municípios?","v":"Pelo menos 70%; o restante vai para os Estados."},{"m":"ce","tp":"SUS – CF e Leis","f":"Decreto 7.508/2011: quais são as Portas de Entrada?","v":"Atenção primária; urgência e emergência; atenção psicossocial; serviços especiais de acesso aberto."},{"m":"ce","tp":"Doenças Transmissíveis e Notificação","f":"Esquema básico da TB em adultos?","v":"2 meses de RHZE (fase intensiva) + 4 meses de RH (manutenção) = 6 meses."},{"m":"ce","tp":"PNAB","f":"PNAB/2017: princípios?","v":"Universalidade, equidade e integralidade."},{"m":"ce","tp":"PNAB","f":"PNAB/2017: população adscrita por eSF?","v":"2.000 a 3.500 pessoas."},{"m":"ce","tp":"PNAB","f":"PNAB: carga horária mínima recomendada de funcionamento da UBS?","v":"40 h semanais, no mínimo 5 dias por semana, nos 12 meses do ano."},{"m":"ce","tp":"PNAB","f":"Composição mínima da eSF?","v":"Médico, enfermeiro, auxiliar e/ou técnico de enfermagem e ACS (podendo ter ACE e equipe de saúde bucal)."},{"m":"ce","tp":"Ética e Legislação","f":"Lei 7.498/86, art. 15: técnico em instituição de saúde trabalha sob supervisão de quem?","v":"Do enfermeiro."},{"m":"ce","tp":"Ética e Legislação","f":"Penalidades do Código de Ética (Res. Cofen 564/2017)?","v":"Advertência verbal, multa, censura, suspensão (até 90 dias) e cassação (até 30 anos)."},{"m":"ce","tp":"Ética e Legislação","f":"Multa no Código de Ética de Enfermagem?","v":"De 1 a 10 vezes o valor da anuidade da categoria."},{"m":"ce","tp":"Ética e Legislação","f":"Violência contra criança, idoso ou incapaz: precisa de autorização para comunicar?","v":"Não. A comunicação externa aos órgãos de responsabilização é obrigatória, independentemente de autorização."},{"m":"ce","tp":"Biossegurança e NR-32","f":"NR-32: vacinas gratuitas obrigatórias ao trabalhador?","v":"Tétano, difteria, hepatite B e as previstas no PCMSO."},{"m":"ce","tp":"Biossegurança e NR-32","f":"NR-32: o que é vedado com agulhas?","v":"Reencape e desconexão manual."},{"m":"ce","tp":"Biossegurança e NR-32","f":"Grupos de resíduos (RDC 222/2018)?","v":"A biológico; B químico; C radioativo; D comum; E perfurocortante."},{"m":"ce","tp":"Biossegurança e NR-32","f":"PEP ao HIV: prazo ideal, prazo máximo e duração?","v":"Ideal até 2 h; máximo 72 h; 28 dias de uso."},{"m":"ce","tp":"Controle de Infecção e CME","f":"Spaulding: semicrítico exige no mínimo?","v":"Desinfecção de alto nível (contato com mucosa íntegra ou pele não íntegra)."},{"m":"ce","tp":"Controle de Infecção e CME","f":"Indicador biológico para autoclave a vapor?","v":"Geobacillus stearothermophilus."},{"m":"ce","tp":"Controle de Infecção e CME","f":"Bowie-Dick: quando e para quê?","v":"Diariamente, no 1º ciclo e com câmara vazia, em autoclave pré-vácuo; avalia remoção do ar e penetração do vapor."},{"m":"ce","tp":"Controle de Infecção e CME","f":"Estufa (calor seco) pode esterilizar produtos para saúde?","v":"Não. A RDC 15/2012 proíbe."},{"m":"ce","tp":"Precauções e Isolamento","f":"Precaução para aerossóis: exemplos e EPI?","v":"TB pulmonar, sarampo, varicela; respirador N95/PFF2, quarto privativo com porta fechada (ideal pressão negativa)."},{"m":"ce","tp":"Precauções e Isolamento","f":"Precaução para gotículas: exemplos e EPI?","v":"Meningite meningocócica, coqueluche, influenza, caxumba, rubéola; máscara cirúrgica."},{"m":"ce","tp":"Precauções e Isolamento","f":"Clostridioides difficile: como higienizar as mãos?","v":"Com água e sabão (o álcool não elimina esporos)."},{"m":"ce","tp":"Segurança do Paciente","f":"Seis metas internacionais de segurança do paciente?","v":"Identificação; comunicação efetiva; medicamentos seguros; cirurgia segura; higiene das mãos; prevenção de quedas e LP."},{"m":"ce","tp":"Segurança do Paciente","f":"Nove certos da medicação?","v":"Paciente, medicamento, via, hora, dose, registro, orientação, forma e resposta certos."},{"m":"ce","tp":"Segurança do Paciente","f":"Número do leito serve como identificador?","v":"Não. Usam-se no mínimo 2 identificadores (ex.: nome completo e data de nascimento)."},{"m":"ce","tp":"Segurança do Paciente","f":"RDC 36/2013: prazo para notificar evento adverso com óbito?","v":"Até 72 horas."},{"m":"ce","tp":"Sinais Vitais e Exame Físico","f":"Respiração de Kussmaul?","v":"Profunda e rápida; típica da cetoacidose diabética."},{"m":"ce","tp":"Sinais Vitais e Exame Físico","f":"Respiração de Cheyne-Stokes?","v":"Ciclos de aumento e diminuição da amplitude alternados com apneia."},{"m":"ce","tp":"Sinais Vitais e Exame Físico","f":"Manguito ideal para aferir PA?","v":"Largura de cerca de 40% e comprimento de 80–100% da circunferência do braço."},{"m":"ce","tp":"Sinais Vitais e Exame Físico","f":"Fases de Korotkoff para PAS e PAD?","v":"PAS = fase I (aparecimento dos sons); PAD = fase V (desaparecimento)."},{"m":"ce","tp":"Medicamentos e Cálculos","f":"Fórmula do gotejamento em macrogotas?","v":"Gotas/min = volume (mL) ÷ (horas × 3)."},{"m":"ce","tp":"Medicamentos e Cálculos","f":"Fórmula do gotejamento em microgotas?","v":"Microgotas/min = volume (mL) ÷ horas."},{"m":"ce","tp":"Medicamentos e Cálculos","f":"1 mL equivale a quantas gotas e microgotas?","v":"20 gotas = 60 microgotas (1 gota = 3 microgotas)."},{"m":"ce","tp":"Medicamentos e Cálculos","f":"Mistura de insulinas: qual aspirar primeiro?","v":"A regular (transparente), depois a NPH (turva)."},{"m":"ce","tp":"Clínica Cirúrgica e Sondagens","f":"Parâmetros do índice de Aldrete e Kroulik (SRPA)?","v":"Atividade, respiração, circulação, consciência e SpO2 (ou cor); 0 a 2 cada, total 10."},{"m":"ce","tp":"Vigilância em Saúde","f":"Cálculo da letalidade?","v":"Óbitos pela doença ÷ número de casos da doença × 100."},{"m":"ce","tp":"Curativos e Lesão por Pressão","f":"LP estágio 1 (NPIAP)?","v":"Pele íntegra com eritema que não embranquece."},{"m":"ce","tp":"Curativos e Lesão por Pressão","f":"LP estágio 3 x estágio 4?","v":"Estágio 3: perda total da pele, gordura visível. Estágio 4: exposição de fáscia, músculo, tendão, cartilagem ou osso."},{"m":"ce","tp":"Curativos e Lesão por Pressão","f":"Escala de Braden: variação e interpretação?","v":"6 a 23; quanto menor, maior o risco."},{"m":"ce","tp":"Curativos e Lesão por Pressão","f":"Cobertura com ação hemostática para ferida muito exsudativa?","v":"Alginato de cálcio."},{"m":"ce","tp":"Urgência e Emergência","f":"RCP adulto: frequência e profundidade?","v":"100–120/min; 5 a 6 cm; retorno total do tórax."},{"m":"ce","tp":"Urgência e Emergência","f":"Relação compressão-ventilação em criança com 2 socorristas?","v":"15:2 (com 1 socorrista, 30:2)."},{"m":"ce","tp":"Urgência e Emergência","f":"Ritmos chocáveis?","v":"Fibrilação ventricular e taquicardia ventricular sem pulso."},{"m":"ce","tp":"Urgência e Emergência","f":"Regra dos nove (adulto): valor de cada membro inferior?","v":"18% (cada membro superior 9%; cabeça/pescoço 9%; tronco anterior 18%; posterior 18%; períneo 1%)."},{"m":"ce","tp":"Urgência e Emergência","f":"Glasgow: pontuação máxima de cada item?","v":"Ocular 4; verbal 5; motora 6 (total 3 a 15)."},{"m":"ce","tp":"Imunização","f":"Faixa de temperatura da rede de frio na sala de vacina?","v":"+2 °C a +8 °C."},{"m":"ce","tp":"Imunização","f":"Esquema atual da poliomielite na rotina infantil?","v":"VIP aos 2, 4 e 6 meses e reforço com VIP aos 15 meses (VOP saiu da rotina em 2024)."},{"m":"ce","tp":"Imunização","f":"Vacina HPV para 9 a 14 anos: quantas doses?","v":"Dose única (desde 2024)."},{"m":"ce","tp":"Imunização","f":"Febre amarela na criança?","v":"9 meses e reforço aos 4 anos."},{"m":"ce","tp":"Saúde da Mulher","f":"Altura uterina na 20ª semana?","v":"Na altura da cicatriz umbilical (12ª semana: logo acima da sínfise púbica)."},{"m":"ce","tp":"Saúde da Mulher","f":"Antídoto do sulfato de magnésio?","v":"Gluconato de cálcio a 10%."},{"m":"ce","tp":"Saúde da Criança","f":"Teste do coraçãozinho: quando e valor normal?","v":"Entre 24 e 48 h; SpO2 ≥ 95% no MSD e no MI, com diferença < 3%."},{"m":"ce","tp":"Saúde da Criança","f":"Leite materno ordenhado: validade?","v":"Geladeira 12 h; congelador/freezer 15 dias."},{"m":"ce","tp":"Saúde do Idoso","f":"IMC do idoso (SISVAN)?","v":"Baixo peso ≤ 22; adequado > 22 e < 27; sobrepeso ≥ 27."},{"m":"ce","tp":"Saúde Mental","f":"Internação involuntária: prazo de comunicação ao MP?","v":"72 horas, pelo responsável técnico do estabelecimento (também na alta)."},{"m":"pt","tp":"Crase","f":"Há crase antes de verbo?","v":"Não. Ex.: 'a partir de', 'começou a chover'."},{"m":"pt","tp":"Crase","f":"Há crase antes de palavra masculina?","v":"Não, exceto quando estiver subentendida 'à moda de' (ex.: 'bife à milanesa', 'gol à Pelé')."},{"m":"pt","tp":"Crase","f":"Crase antes de pronome possessivo feminino singular é…","v":"Facultativa: 'à minha mãe' ou 'a minha mãe'."},{"m":"pt","tp":"Crase","f":"Regra do 'vou a / volto da'","v":"Se 'volto da', há crase ('vou à Bahia'). Se 'volto de', não há ('vou a Brasília')."},{"m":"pt","tp":"Crase","f":"Há crase em palavras repetidas (frente a frente, gota a gota)?","v":"Não. Nunca há crase entre palavras repetidas."},{"m":"pt","tp":"Crase","f":"Locuções femininas: há crase?","v":"Sim: às vezes, às pressas, à noite, à medida que, à base de, à disposição."},{"m":"pt","tp":"Concordância","f":"'Haver' no sentido de existir: singular ou plural?","v":"Sempre singular (impessoal): 'Houve problemas', 'Deve haver vagas'."},{"m":"pt","tp":"Concordância","f":"'Fazer' indicando tempo decorrido","v":"Impessoal, fica no singular: 'Faz dois anos que...'."},{"m":"pt","tp":"Concordância","f":"'Vende-se casas' está certo?","v":"Não. É voz passiva sintética, e o verbo concorda com o sujeito: 'Vendem-se casas'."},{"m":"pt","tp":"Concordância","f":"'Precisa-se de técnicos': verbo no plural?","v":"Não. Verbo transitivo indireto + 'se' é índice de indeterminação do sujeito, e o verbo fica no singular."},{"m":"pt","tp":"Concordância nominal","f":"'É proibido entrada' ou 'É proibida a entrada'?","v":"Ambas estão certas. Com artigo, o adjetivo concorda ('proibida a entrada'); sem artigo, fica invariável ('proibido entrada')."},{"m":"pt","tp":"Concordância nominal","f":"'Meio' como advérbio varia?","v":"Não: 'meio cansada'. Como numeral, varia: 'meia garrafa', 'meio-dia e meia'."},{"m":"pt","tp":"Regência","f":"Assistir (ver/presenciar) pede…","v":"A preposição 'a': 'assistir ao jogo', 'assistir à palestra'."},{"m":"pt","tp":"Regência","f":"Preferir: regência correta","v":"Preferir uma coisa A outra (sem 'mais' e sem 'do que')."},{"m":"pt","tp":"Regência","f":"Visar (ter em vista) e aspirar (desejar) pedem…","v":"A preposição 'a': 'visa ao lucro', 'aspira ao cargo'."},{"m":"pt","tp":"Colocação pronominal","f":"Pode iniciar a frase com pronome oblíquo átono?","v":"Não, pela norma-padrão: 'Disseram-me', e não 'Me disseram'."},{"m":"pt","tp":"Colocação pronominal","f":"Palavras que atraem a próclise","v":"Negativas (não, nunca, ninguém), advérbios, pronomes relativos, indefinidos e interrogativos e conjunções subordinativas."},{"m":"pt","tp":"Acordo Ortográfico","f":"Ditongos abertos 'ei/oi' em paroxítonas têm acento?","v":"Não: ideia, assembleia, heroico, jiboia. Nas oxítonas o acento continua: papéis, herói."},{"m":"pt","tp":"Acordo Ortográfico","f":"'Voo', 'enjoo', 'leem', 'veem' têm acento?","v":"Não. O Acordo eliminou o circunflexo de 'oo' e de 'eem'."},{"m":"pt","tp":"Acentuação","f":"'Tem/têm' e 'retém/retêm'","v":"Singular: tem, vem; derivados levam agudo (retém, intervém). Plural: têm, vêm; derivados levam circunflexo (retêm, intervêm)."},{"m":"rl","tp":"Negação","f":"Negação de 'p e q'","v":"~p ou ~q (De Morgan: nega as duas partes e troca 'e' por 'ou')."},{"m":"rl","tp":"Negação","f":"Negação de 'p ou q'","v":"~p e ~q."},{"m":"rl","tp":"Negação","f":"Negação de 'Se p, então q'","v":"p e ~q (mantém a 1ª parte, nega a 2ª e usa 'e')."},{"m":"rl","tp":"Negação","f":"Negação de 'Todo A é B'","v":"Algum A não é B."},{"m":"rl","tp":"Negação","f":"Negação de 'Nenhum A é B'","v":"Algum A é B."},{"m":"rl","tp":"Equivalência","f":"p → q equivale a… (2 formas)","v":"~q → ~p (contrapositiva) e ~p ∨ q."},{"m":"rl","tp":"Equivalência","f":"p ↔ q equivale a…","v":"(p → q) ∧ (q → p)."},{"m":"rl","tp":"Tabela-verdade","f":"Quando o condicional p → q é falso?","v":"Somente com p = V e q = F."},{"m":"rl","tp":"Tabela-verdade","f":"Nº de linhas da tabela-verdade com n proposições","v":"2^n (ex.: 3 proposições têm 8 linhas)."},{"m":"rl","tp":"Tabela-verdade","f":"Quando o bicondicional é verdadeiro?","v":"Quando p e q têm o mesmo valor (V e V, ou F e F)."},{"m":"rl","tp":"Conceitos","f":"Tautologia, contradição e contingência","v":"Tautologia: sempre V. Contradição: sempre F. Contingência: depende dos valores."},{"m":"rl","tp":"Argumentação","f":"Modus ponens e modus tollens","v":"Ponens: p → q, p, logo q. Tollens: p → q, ~q, logo ~p."},{"m":"rl","tp":"Argumentação","f":"'p → q, q, logo p' é válido?","v":"Não. É a falácia da afirmação do consequente."},{"m":"rl","tp":"Porcentagem","f":"Aumentos sucessivos de a% e b%","v":"Multiplique os fatores: (1 + a)(1 + b). Ex.: 10% e 10% dão 1,21, ou seja, +21%."},{"m":"rl","tp":"Porcentagem","f":"Aumento de x% seguido de desconto de x%","v":"O valor final é MENOR que o inicial (ex.: +50% e −50% dão 0,75)."},{"m":"rl","tp":"Regra de três","f":"Como saber se a regra de três é inversa?","v":"Quando uma grandeza aumenta e a outra diminui (ex.: mais trabalhadores, menos dias). Multiplique em linha."},{"m":"rl","tp":"Contagem","f":"Arranjo × combinação","v":"Arranjo: a ordem importa, A(n,p) = n!/(n−p)!. Combinação: a ordem não importa, C(n,p) = n!/[p!(n−p)!]."},{"m":"rl","tp":"Contagem","f":"Anagramas com letras repetidas","v":"n! dividido pelo fatorial de cada repetição. Ex.: ARARA = 5!/(3!·2!) = 10."},{"m":"rl","tp":"Probabilidade","f":"Probabilidade de 'pelo menos um'","v":"1 − P(nenhum). Ex.: pelo menos uma cara em 3 lançamentos = 1 − 1/8 = 7/8."},{"m":"rl","tp":"Conjuntos","f":"n(A ∪ B)","v":"n(A) + n(B) − n(A ∩ B)."},{"m":"in","tp":"Word – atalhos","f":"Word em português: salvar, abrir, novo","v":"Ctrl + B (salvar), Ctrl + A (abrir), Ctrl + O (novo)."},{"m":"in","tp":"Word – atalhos","f":"Word em português: negrito, itálico, sublinhado","v":"Ctrl + N, Ctrl + I, Ctrl + S."},{"m":"in","tp":"Word – atalhos","f":"Word em português: alinhamentos","v":"Ctrl + Q (esquerda), Ctrl + E (centralizar), Ctrl + G (direita), Ctrl + J (justificar)."},{"m":"in","tp":"Word – atalhos","f":"Word em português: selecionar tudo, localizar, substituir","v":"Ctrl + T, Ctrl + L, Ctrl + U."},{"m":"in","tp":"Word – atalhos","f":"Quebra de página e quebra de linha","v":"Ctrl + Enter (página) e Shift + Enter (linha)."},{"m":"in","tp":"Windows – atalhos","f":"Windows + E, + D, + L, + I, + R","v":"Explorador, área de trabalho, bloquear, Configurações, Executar."},{"m":"in","tp":"Windows – atalhos","f":"Windows + V e Windows + Shift + S","v":"Histórico da área de transferência e recorte de tela."},{"m":"in","tp":"Windows – atalhos","f":"Excluir sem passar pela Lixeira","v":"Shift + Delete."},{"m":"in","tp":"Excel","f":"Ordem de precedência dos operadores","v":"^ (potência), depois * e /, depois + e −. Parênteses vêm primeiro."},{"m":"in","tp":"Excel","f":"$A$1, A$1, $A1","v":"Absoluta, linha fixa, coluna fixa. O '$' trava o que vem logo depois dele."},{"m":"in","tp":"Excel","f":"CONT.NÚM × CONT.VALORES × CONTAR.VAZIO","v":"Conta números; conta células não vazias; conta células vazias."},{"m":"in","tp":"Excel","f":"Sintaxe de SOMASE","v":"=SOMASE(intervalo_critério; critério; [intervalo_soma])."},{"m":"in","tp":"Excel","f":"Sintaxe de PROCV","v":"=PROCV(valor; matriz; nº_coluna; [FALSO para correspondência exata])."},{"m":"in","tp":"Excel","f":"Erros #DIV/0!, #NOME?, #REF!, #VALOR!","v":"Divisão por zero; nome ou função inválido; referência inválida; tipo de dado errado."},{"m":"in","tp":"LibreOffice","f":"Extensões do Writer, Calc e Impress","v":"Writer .odt, Calc .ods, Impress .odp."},{"m":"in","tp":"LibreOffice","f":"Referência a outra planilha: Calc × Excel","v":"Calc: =Planilha2.A1 (ponto). Excel: =Planilha2!A1 (exclamação)."},{"m":"in","tp":"Navegadores","f":"Ctrl + T, Ctrl + W, Ctrl + Shift + T","v":"Nova aba, fecha a aba, reabre a última aba fechada."},{"m":"in","tp":"E-mail","f":"SMTP × POP3 × IMAP","v":"SMTP envia. POP3 recebe e baixa para o dispositivo. IMAP recebe e mantém sincronizado no servidor."},{"m":"in","tp":"Backup","f":"Completo × incremental × diferencial","v":"Completo copia tudo. Incremental copia o que mudou desde o último backup de qualquer tipo. Diferencial copia o que mudou desde o último completo."},{"m":"in","tp":"Segurança","f":"Vírus × worm","v":"O vírus precisa de hospedeiro e de execução. O worm se propaga sozinho pela rede."},{"m":"rl","tp":"MDC e MMC","f":"Quando usar o MDC e quando usar o MMC?","v":"MDC: dividir em partes iguais, do maior tamanho possível. MMC: eventos que se repetem e voltam a coincidir."},{"m":"rl","tp":"MDC e MMC","f":"Relação entre o MDC e o MMC de dois números","v":"MDC(a, b) × MMC(a, b) = a × b."},{"m":"rl","tp":"Divisores","f":"Como contar os divisores de um número?","v":"Fatore em primos, some 1 a cada expoente e multiplique. Ex.: 72 = 2³·3², então (3+1)(2+1) = 12."},{"m":"rl","tp":"Conjuntos","f":"n(A ∪ B ∪ C)","v":"A + B + C − (A∩B) − (A∩C) − (B∩C) + (A∩B∩C)."},{"m":"rl","tp":"Conjuntos","f":"Número de subconjuntos de um conjunto com n elementos","v":"2^n."},{"m":"in","tp":"PowerPoint","f":"F5 × Shift + F5","v":"F5 inicia a apresentação do 1º slide. Shift + F5 inicia do slide atual."},{"m":"in","tp":"PowerPoint","f":"Transição × animação","v":"Transição é o efeito entre slides (guia Transições). Animação é o efeito em objetos do slide (guia Animações)."},{"m":"in","tp":"PowerPoint","f":"Extensões .pptx, .ppsx e .potx","v":"Apresentação editável; abre direto no modo de apresentação; modelo."},{"m":"in","tp":"Outlook","f":"Caixa de Saída × Itens Enviados","v":"Caixa de Saída: aguardando envio. Itens Enviados: já enviados."},{"m":"in","tp":"IA","f":"O que é 'alucinação' em IA generativa?","v":"Resposta falsa ou inventada apresentada como verdadeira. Por isso é preciso sempre revisar."},{"m":"pt","tp":"Variação linguística","f":"Os 4 tipos de variação linguística","v":"Diatópica (regional), diastrática (social), diafásica (situacional) e diacrônica (histórica)."},{"m":"pt","tp":"Formação de palavras","f":"Parassíntese × prefixal e sufixal","v":"Parassíntese: prefixo e sufixo entram juntos (entristecer). Prefixal e sufixal: existe a palavra com só um deles (infeliz, felizmente)."},{"m":"pt","tp":"Formação de palavras","f":"Justaposição × aglutinação","v":"Justaposição: os radicais ficam inteiros (girassol, passatempo). Aglutinação: há perda de fonemas (planalto, aguardente)."},{"m":"pt","tp":"Formação de palavras","f":"Derivação regressiva e derivação imprópria","v":"Regressiva: verbo vira substantivo reduzido (combater > combate). Imprópria: muda a classe sem mudar a forma (o olhar)."},{"m":"pt","tp":"Correlação verbal","f":"'Se' com subjuntivo: pares corretos","v":"Se eu chegar → chegarei. Se eu chegasse → chegaria. Se eu tivesse chegado → teria chegado."}];
var DICAS_NOVAS=[{"m":"lm","t":"Lei Orgânica – Organização e competências (Título I)","p":["Município: pessoa jurídica de direito público interno, com autonomia política, administrativa, financeira e legislativa (art. 1º).","Poderes: só Legislativo e Executivo (art. 2º). Símbolos: Bandeira e Hino (art. 5º). Sede = cidade; distrito = vila, criado por lei (arts. 4º e 6º).","Art. 8º = atribuições próprias (serviços do inciso IV, guarda municipal, licenças, poder de polícia). Art. 9º = competências comuns com União e Estados (saúde e assistência, meio ambiente, cultura, moradia, pobreza, trânsito).","Povo exerce o poder por voto, iniciativa popular (inclusive emenda à LO), plebiscito e referendo (art. 11). Criança e adolescente: prioridade absoluta (art. 12)."],"pg":["Judiciário NÃO é Poder do Município.","Brasão não aparece entre os símbolos.","Distrito se cria por LEI, não por decreto.","Denunciar irregularidades: QUALQUER munícipe, não só partidos e associações."]},{"m":"lm","t":"Lei Orgânica – Câmara: reuniões, Mesa e quóruns","p":["Reuniões: 1º/2–30/6 e 1º/8–20/12; no 1º ano, a partir de 1º/1. Mínimo 1 reunião ordinária por semana, vedada mais de 1 por dia (art. 27).","Abertura de reunião e quórum geral: maioria absoluta presente; deliberação por maioria de votos (arts. 20 e 31).","Mesa: Presidente, Vice e Secretário; mandato de 2 anos com recondução; voto secreto com 3 cédulas; empate = mais idoso; destituição por 2/3 (arts. 22-24).","1/3: CPI e proposta de emenda à LO. Maioria absoluta: lei complementar, rejeição de veto, perda de mandato decidida pela Câmara. 2/3: emenda à LO, destituir membro da Mesa, afastar parecer do TCE, representar ao PGJ, títulos honoríficos, reunir fora do recinto.","Presidente da Câmara só vota na eleição da Mesa, em escrutínio secreto e no empate (art. 35)."],"pg":["Quem preside a reunião preparatória é o MAIS IDOSO; o MAIS VOTADO presta o juramento.","Reunião fora do recinto: requerimento da maioria absoluta E aprovação de 2/3; reunião itinerante: maioria absoluta.","Tribuna Livre: vereador NÃO pode apartear o cidadão.","Mesa: contas até 1º de março; proposta orçamentária parcial até 31 de julho."]},{"m":"lm","t":"Lei Orgânica – Vereadores","p":["Elegibilidade: idade mínima de 18 anos (Prefeito e Vice: 21) (arts. 18 e 72).","Subsídio fixado por lei de iniciativa da Câmara, em parcela única; limite de 75% do subsídio do Deputado Estadual e total de 5% da receita (arts. 41 e 43).","Proibições desde a expedição do diploma: contratos com o Município e cargos remunerados nessas entidades. Desde a posse: cargo demissível ad nutum (salvo Secretário), mais de um mandato, empresa favorecida por contrato, patrocinar causa (art. 49).","Perda do mandato: faltar a 1/3 das sessões ordinárias, morar fora do Município, condenação transitada etc. (art. 50).","Licenças: saúde, missão e candidatura com subsídio; interesse particular de 30 a 120 dias por sessão legislativa, sem subsídio (art. 51)."],"pg":["Decoro, improbidade, proibições, residência e condenação (incisos I, II, III, V e VII): a CÂMARA decide, por voto secreto e maioria absoluta. Faltas, direitos políticos, posse e Justiça Eleitoral (IV, VI, VIII e IX): a MESA declara.","Falecimento e renúncia: extinção declarada pelo PRESIDENTE.","Atestado em 5 dias; no máximo 3 reuniões consecutivas justificadas.","Suplente: 15 + 15 dias improrrogáveis; sem suplente, avisar o TRE em 48 HORAS."]},{"m":"lm","t":"Lei Orgânica – Processo legislativo","p":["Espécies: emendas à LO, leis complementares, ordinárias, delegadas, decretos legislativos e resoluções (art. 54). Não existe medida provisória.","Emenda à LO: 1/3 dos vereadores, Prefeito ou iniciativa popular; 2 turnos, 10 dias de interstício, 2/3; promulga a Mesa; não pode haver emenda durante intervenção (art. 55).","Iniciativa exclusiva do Prefeito: cargos e remuneração do Executivo, regime jurídico, órgãos da Administração, leis orçamentárias (art. 57).","Iniciativa popular: 5% dos eleitores (art. 58). Lei complementar (códigos, regime jurídico, plano diretor): maioria absoluta (art. 59).","Sanção e veto: envio em 5 dias úteis; veto em 15 dias úteis; motivos em 48 h; Câmara aprecia em 30 dias; rejeição por maioria absoluta em escrutínio secreto (art. 63)."],"pg":["Silêncio do Prefeito = SANÇÃO tácita, não veto.","Manter o veto NÃO restaura a redação original.","Delegação ao Prefeito: por DECRETO LEGISLATIVO. Resolução = assunto interno; decreto legislativo = efeitos externos; nenhum dos dois tem sanção.","Urgência: 45 dias; não corre no recesso; não vale para lei complementar.","Subsídios de agentes políticos: iniciativa da CÂMARA, não do Prefeito."]},{"m":"lm","t":"Lei Orgânica – Prefeito, Vice e auxiliares","p":["Mandato de 4 anos, com uma reeleição; posse em 1º de janeiro, na reunião preparatória da Câmara; vago após 10 dias sem posse (arts. 73, 74 e 80).","Sucessão: Vice-Prefeito, depois Presidente da Câmara; se o Presidente se recusar, perde o cargo na Mesa (arts. 74-76).","Ausência por mais de 15 dias sem licença: perda do mandato. Licença só para saúde (com subsídio) ou para concorrer à reeleição (arts. 77-78).","Crimes de responsabilidade: TJ; infrações político-administrativas: Câmara (arts. 81-82).","Relatório ao sucessor até 30 dias antes do fim do mandato (art. 83); levantamento pelo eleito no mínimo 45 dias antes da posse (art. 301).","Procurador Geral e Chefe de Gabinete equivalem a Secretários; auxiliares são solidariamente responsáveis (arts. 87 e 89)."],"pg":["Atribuições delegáveis: só as dos incisos XIX, XX, XXII, XXVII e XXXI do art. 86. Vetar e sancionar não se delegam.","Secretário que falta à convocação da Câmara sem justificativa comete INFRAÇÃO POLÍTICO-ADMINISTRATIVA.","Prefeito presta informações à Câmara em 15 dias; repassa os recursos da Câmara até o dia 20 de cada mês."]},{"m":"lm","t":"Lei Orgânica – Administração, servidores, atos e bens","p":["Princípios: legalidade, impessoalidade, moralidade, publicidade e eficiência (art. 95). Ficha limpa para cargos de direção, chefia e assessoramento, com declaração antes da posse (art. 95-A).","Concurso de provas ou de provas e títulos, ressalvados os cargos em comissão; funções de confiança só para efetivos; concurso NÃO pode ser aos sábados (art. 98).","Vantagens asseguradas: adicional por tempo de serviço, licença-prêmio, insalubridade/periculosidade/penosidade, gratificação de função, adicional noturno, adicional de férias, adicionais do magistério (art. 98, § 1º).","Remuneração só por lei específica, com revisão geral anual na mesma data e sem distinção de índices (art. 99).","Decreto: regulamentar lei, abrir créditos, declarar utilidade pública, permissão. Portaria: provimento e vacância, lotação, comissões, sindicância, autorização de uso (art. 107).","Bens: o Prefeito administra; alienar imóvel exige autorização legislativa e concorrência; concessão de direito real de uso é preferível à venda ou doação; afetação e desafetação dependem de lei (arts. 110-113)."],"pg":["Proibição de contratar com o Município: parentes até o 2º grau, até 6 MESES após deixar a função (art. 103).","Publicação resumida só para atos NÃO normativos; nenhum ato produz efeito antes de publicado.","Certidões em até 15 dias.","Permissão de uso: DECRETO; autorização de uso: PORTARIA."]},{"m":"lm","t":"Lei Orgânica – Finanças, contas e participação popular","p":["Contas do Prefeito: até 31 de março, à Câmara e ao TCE-MG (art. 160). Parecer do TCE só cai por 2/3; contas rejeitadas vão ao Ministério Público (art. 68).","Contas à disposição do cidadão por 60 dias por ano; reclamação apreciada em 30 dias (art. 70).","Leis orçamentárias (art. 297): PPA e LOA até 31 de agosto; LDO até 15 de abril.","Recursos da Câmara repassados até o dia 20; a Câmara envia suas demonstrações contábeis até o dia 15 (arts. 155 e 158).","Consultas populares: maioria absoluta da Câmara ou 5% do eleitorado; votação em 2 meses; máximo de 2 por ano; vedadas 60 dias antes das eleições (arts. 168-169)."],"pg":["1º de março = contas da Câmara (Mesa). 15 de março = publicação das contas pelo Prefeito. 31 de março = envio das contas à Câmara e ao TCE.","Isenção ou anistia NÃO gera direito adquirido (art. 135).","Nenhum tributo é exigido sem prévia notificação do contribuinte (art. 137)."]},{"m":"lm","t":"Lei Orgânica – Saúde e assistência social","p":["A saúde é direito de todos e dever do Município (art. 185). O SUS municipal tem comando único pela Secretaria Municipal de Saúde (art. 188).","É vedado cobrar do usuário do SUS. A execução é preferencialmente direta e, supletivamente, por terceiros (art. 192).","É vedado dar recursos públicos a instituições privadas de saúde COM fins lucrativos; nos serviços hospitalares, as filantrópicas sem fins lucrativos têm preferência (arts. 187, 188 e 191).","Conferência anual de saúde e audiências públicas; informações financeiras da saúde publicadas até 30 dias após cada TRIMESTRE (arts. 194-195).","Inspeção médica escolar obrigatória; merenda liberada com parecer da Secretaria de Saúde (art. 187, §§ 2º e 3º). Lixo de estabelecimentos de medicina curativa vai em recipientes próprios (art. 190).","Assistência social: sepultamento gratuito para baixa renda; assistência jurídica subsidiária; abrigos para mulheres e crianças vítimas de violência; transporte gratuito e prioridade aos maiores de 65 anos (arts. 197-201 e 251)."],"pg":["Tratamento alternativo: o Município PODERÁ oferecer, QUANDO POSSÍVEL, e só os reconhecidos. Não é obrigatório.","Na saúde, ninguém que dirija entidade contratada ou credenciada pelo SUS pode ocupar chefia ou assessoramento.","Requisição de bens e serviços em epidemia ou calamidade: PODE, com justa indenização.","Idade para benefícios dos idosos na Lei Orgânica: 65 anos, não 60."]},{"m":"lm","t":"LC 54/2007 – Jornada da Saúde","p":["Enfermeiro e Técnico em Radiologia: 24 h. Médicos (ambulatório, trabalho, psiquiatra) e Odontólogo: 20 h. Nutricionista e Médico Veterinário: 30 h (art. 6º, III, texto original).","Demais de nível superior da saúde: 30 h; demais técnicos e administrativos da saúde: 40 h.","Readaptado: jornada do cargo da readaptação. Prefeito pode fixar jornada diversa por ato justificado (art. 7º).","Atenção: a jornada do Técnico em Enfermagem foi alterada pela LC 150/2022; confira o texto vigente antes da prova."],"pg":["Trocar a jornada do Enfermeiro (24 h) pela dos demais de nível superior (30 h).","Dizer que o Técnico em Radiologia segue a regra dos demais técnicos (40 h): ele tem 24 h.","Afirmar que a jornada diversa fixada pelo Prefeito gera direito à permanência: a lei nega expressamente."]},{"m":"lm","t":"LC 54/2007 – Adicionais após a LC 210/2026","p":["Hora extra: 50% dias úteis, 60% domingos/feriados, compensação permitida (art. 14).","Limite: 50 h mensais. Acima disso: extrema urgência, justificativa, atesto da chefia; pagamento com assinatura do Secretário e do Prefeito.","Hora extra não se confunde com plantão, sobreaviso ou gratificações específicas (§4º).","Noturno: 20%, hora de 52min30s, 22 h às 5 h. Raio X: exames a cada 6 meses.","Natalina: 1/12; fração de 15 dias = 1 mês; variável 1/11; gratificações da LC 161/2023 fora do cálculo."],"pg":["Cobrar o limite antigo de 2 h diárias prorrogáveis: foi substituído por 50 h mensais.","Dizer que basta a assinatura do Secretário para pagar o excesso: exige também a do Prefeito.","Trocar 52min30s por 50 min ou o percentual noturno de 20% por 25%."]},{"m":"lm","t":"Progressão – merecimento x conhecimento (LC 54 e LC 55)","p":["Merecimento: uma letra (padrão imediatamente superior); 730 dias na classe; sem suspensão nos 6 meses; conceito favorável.","Avaliação: no mês em que completa 730 dias, últimos 24 meses; 70% em cada fator; critérios objetivos em decreto.","Comissão paritária: LC 54 = Prefeito + representação dos servidores; LC 55 = Secretário de Educação + representação.","Conhecimento: duas letras; especialização (360 h), mestrado e doutorado uma única vez; Comissão Permanente de Gestão de Pessoal.","Diploma: 12 meses + uma prorrogação de 12; sem diploma, devolução em folha. Novidade (arts. 29-A e 35-A): o servidor só terá direito à progressão de que trata a seção após cumprido o estágio probatório."],"pg":["Trocar '70% em cada fator' por 'média de 70%'.","Dizer que a especialização exige 180 h ou 420 h: são 360 h.","Afirmar que licença sem remuneração ou cessão sem ônus contam para o interstício: não contam (LC 54, art. 23).","Dizer que no último padrão ainda cabe progressão por conhecimento: não cabe nenhuma (LC 54, art. 29; LC 55, art. 35)."]},{"m":"lm","t":"LC 55/2007 – Novidades da LC 210/2026","p":["Licença stricto sensu (art. 19-A): presencial, remuneração integral, exige estágio probatório aprovado; mestrado 1 ano, doutorado e pós-doc 2 anos; permanência por período equivalente.","Jornada do professor: 24 h = 16 h regência + 8 h extraclasse (4 livre + 4 escola, até 2 h de módulo). Professor de Apoio: 21h40 + 2h20.","Novas jornadas: Auxiliar de Creche 40 h; Mediador de Inclusão, Psicólogo e Assistente Social Escolar 30 h.","Readaptado: jornada do novo cargo, exceto professor (mantém 24 h).","Ed. Física (Prof. II e PEB II, infantil e anos iniciais): aula de 60 min e adicional compensatório de 20%, indenizatório. Mediador: 5% + 5% sobre o vencimento-base."],"pg":["Cobrar a jornada antiga de 18 h de regência + 6 h.","Dizer que a licença vale para especialização ou para curso a distância.","Dizer que é vedado acumular bolsa de agência de fomento: é permitido, com ciência da Administração.","Afirmar que o adicional compensatório se incorpora ou entra na base previdenciária."]},{"m":"lm","t":"Conceitos e enquadramento (LC 54 art. 2º / LC 55 art. 3º)","p":["Classe: mesma denominação, mesma natureza, mesmo grau de responsabilidade e mesmo nível de vencimento.","Carreira: escala de vencimentos dividida em padrões. Nível: vertical, romano. Padrão: horizontal, letras (A a S).","Grupo ocupacional: cargos efetivos agrupados pela natureza da atividade. Quadro: classes efetivas + comissionadas.","Enquadramento: padrão base; se ganha mais, padrão correspondente; sem valor igual, imediatamente superior; desvio de função volta ao cargo de origem; processado por decreto, com relatório da Comissão de Enquadramento.","Técnico em Enfermagem: escolaridade 'Ensino Médio e Curso Técnico'; Grupo VII – Saúde e Assistência Social (anexos alterados pela LC 210)."],"pg":["Inverter nível (vertical/romano) e padrão (horizontal/alfabético).","Dizer 'padrão imediatamente inferior' no enquadramento.","Chamar de 'promoção vertical' o desenvolvimento na carreira: a lei prevê só progressão horizontal."]},{"m":"lm","t":"LC 210/2026 – O que mudou no Estatuto (LC 5/1991)","p":["Art. 10: 7 formas de provimento – entraram PROGRESSÃO (II) e PROMOÇÃO (VII).","Progressão (arts. 15-20): horizontal, de padrão para padrão; por merecimento (assiduidade, disciplina, iniciativa, responsabilidade; conceito mínimo; interstício de 2 anos) ou por conhecimento (qualificação que não seja requisito do cargo); suspensão no interstício tira a progressão por merecimento.","Promoção (art. 33-A): provimento derivado, de uma classe para a imediatamente superior na mesma carreira; requisitos cumulativos (classes instituídas, interstício quando exigido, requisitos objetivos de lei, ausência de impedimento); regras no PCC e em regulamento; não muda o cargo.","Art. 161-A: 5 anos de incompatibilização na demissão/destituição por abandono ou inassiduidade habitual (regra geral continua 15 anos).","Art. 163, III: advertência prescreve em 150 dias (era 180).","Repetidos sem mudança: readaptação, reversão, aproveitamento, reintegração, recondução, vacância, deveres, proibições, acumulação, responsabilidades, suspensão até 90 dias, multa de 50%, cancelamento em 3/5 anos."],"pg":["A banca pode cobrar o texto antigo: \"promoção em junho\" e \"interstício de 3 anos\" NÃO valem mais.","Progressão = PADRÃO (horizontal); promoção = CLASSE. Nenhuma das duas muda o cargo.","5 anos só para abandono e inassiduidade habitual; improbidade, crime etc. continuam 15 anos.","Advertência: 150 dias (prescrição disciplinar) x 120 dias (prescrição do direito de requerer, art. 134)."]},{"m":"lm","t":"LC 210/2026 – Estrutura da Prefeitura (LC 149/2021)","p":["Níveis (art. 8º): 1º Secretaria, Procuradoria e Controladoria Geral; 2º Superintendência; 3º Diretoria de Departamento e Assessoria; 4º Chefia de Divisão e Coordenação.","Estrutura básica = 1º nível; complementar = 2º e 3º nível (art. 6º).","Vedado implantar órgão sem o cargo de direção já existente (art. 7º).","Classificação (art. 9º): assessoramento (apoio direto ao Prefeito), atividade meio (gestão), atividade fim (execução da ação governamental).","10% dos cargos em comissão reservados a recrutamento restrito, por efetivos e estáveis (art. 9º, § 5º).","Efetivo nomeado em comissão: opta pelo vencimento do comissionado ou pelo do efetivo + 25% do salário base (art. 228)."],"pg":["Controladoria Geral é 1º nível e apoio direto ao Prefeito – não é órgão de gestão.","Superintendência é 2º nível; Assessoria é 3º nível (junto com Diretoria de Departamento).","10% (reserva) x 25% (gratificação de opção) – a banca troca os números."]},{"m":"lm","t":"LC 210/2026 – Órgãos de apoio ao Prefeito e Secretarias","p":["Apoio direto ao Prefeito (art. 10): Gabinete do Prefeito, Conselhos Municipais, Gabinete do Vice-Prefeito, Procuradoria Municipal, Secretaria de Governo, Controladoria Geral, Secretaria de Relações Institucionais.","Gestão (art. 11): Gestão Pública e Fazenda.","Execução (art. 12): Planejamento, Desenvolvimento Econômico, Educação e Tecnologia, Saúde, Agropecuária, Esportes, Infraestrutura, Assistência Social, Transporte, Meio Ambiente, Cultura, Turismo, Mulher/Igualdade Racial/Juventude, Limpeza Urbana, Habitação e Regularização Fundiária.","Criada a Secretaria Municipal de Relações Institucionais (arts. 9º e 10 da LC 210): absorve a Superintendência de Relações Institucionais; Secretário com os mesmos vencimentos e reajustes dos demais.","Procurador Geral do Município substitui o Secretário de Assuntos Jurídicos (art. 224); subsídio dos Secretários é fixado pela Câmara (art. 223, parágrafo único)."],"pg":["Planejamento e Saúde são órgãos de EXECUÇÃO, não de gestão.","Os órgãos internos da antiga Superintendência de Relações Institucionais FICARAM na Secretaria de Governo.","Secretaria de Governo é apoio direto ao Prefeito, não órgão de gestão."]},{"m":"lm","t":"Estatuto de Paracatu – Ingresso, posse e exercício","p":["Requisitos (art. 7º): brasileiro, direitos políticos, quitação militar e eleitoral, escolaridade, 18 anos, saúde física e mental.","PcD: até 20% das vagas (art. 8º).","Concurso: provas ou provas e títulos; validade 2 anos da homologação, prorrogável 1 vez por igual período se o edital previr; vedado novo concurso para o mesmo cargo com aprovados em concurso ainda válido (arts. 37-39).","Posse: 30 dias do ato de nomeação, prorrogável por igual período a pedido; só há posse na nomeação (arts. 41-42).","Exercício: 30 dias da posse (art. 51). Retorno de afastamento: 30 dias da cessação do motivo (art. 53)."],"pg":["Sem posse no prazo: nomeação SEM EFEITO (art. 14). Com posse e sem exercício: EXONERAÇÃO (art. 51).","O prazo de exercício conta da POSSE, não da nomeação.","Idade mínima é 18, não 16."]},{"m":"lm","t":"Estatuto de Paracatu – Provimento, estágio e vacância","p":["Provimento (art. 10, redação da LC 210/2026): nomeação, progressão, readaptação, reversão, aproveitamento, reintegração e promoção (7 formas).","Vacância (art. 34): exoneração, demissão, promoção, readaptação, aposentadoria, falecimento.","Estágio probatório: 2 anos; assiduidade, disciplina, capacidade de iniciativa, produtividade; RH conclui 60 dias antes do fim; vista 5 dias (arts. 44-47).","Progressão (LC 210/2026): horizontal, de um padrão para outro; por merecimento (assiduidade, disciplina, iniciativa, responsabilidade; conceito mínimo; interstício de 2 anos) ou por conhecimento (qualificação que não seja requisito do cargo); suspensão no interstício tira a progressão por merecimento (arts. 15-19).","Promoção (art. 33-A, criado pela LC 210/2026): passagem de uma classe para a imediatamente superior na mesma carreira, sem mudança de cargo; requisitos cumulativos definidos no Plano de Cargos e Carreiras.","Aproveitamento: 30 dias para exercício; disponibilidade há mais de 12 meses exige inspeção (arts. 26-27)."],"pg":["Estágio = PRODUTIVIDADE; progressão por merecimento = RESPONSABILIDADE.","Transferência e ascensão NÃO são formas de provimento no Estatuto.","Reversão é do aposentado por invalidez; reintegração é do demitido com demissão invalidada; readaptação é por limitação física/mental.","Interstício da progressão agora é de 2 anos (era 3) e acabou a regra do \"mês de junho\"."]},{"m":"lm","t":"Estatuto de Paracatu – Ausências, tempo de serviço e férias","p":["Ausências (art. 56): 1 dia sangue; 1 dia alistamento eleitoral; 8 dias consecutivos luto; 5 dias casamento.","Ano de 365 dias (art. 58); vedada contagem cumulativa de tempo concomitante (art. 59).","Só para aposentadoria e disponibilidade (art. 61): serviço em outros entes, licença remunerada por doença em família, licença remunerada para atividade política, mandato eletivo.","Férias: 30 dias consecutivos/12 meses; adicional 1/3; abono de 1/3 a critério da Administração; pagas até 2 dias antes; acúmulo máximo 2 períodos (arts. 67-72)."],"pg":["Luto = 8 dias; casamento = 5 dias (a banca troca).","Faltas NÃO podem ser descontadas das férias (art. 71).","Abono pecuniário é a critério da Administração, não direito automático."]},{"m":"lm","t":"Estatuto de Paracatu – Licenças e férias-prêmio","p":["Limite geral de 24 meses em licença; saúde prorrogável 3x12 meses para tuberculose, lepra, pênfigo foliáceo (art. 74).","Saúde > 30 dias: junta médica oficial (art. 76). Aborto: 30 dias. Adotante: 90 dias (até 1 ano) / 30 dias (mais de 1 ano). Paternidade: 5 dias consecutivos.","Doença em família: até 90 dias, prorrogável; integral só até 90 dias.","Atividade política: convenção→registro sem remuneração; registro→15º dia após a eleição com remuneração.","Interesses particulares: a critério da Administração; até 2 anos; exige 2 anos de exercício; intervalo de 2 anos entre licenças; sem remuneração.","Remuneradas (art. 101): saúde, gestante, adotante, paternidade, família (até 90 dias), acidente em serviço, atividade política (II). Sem remuneração: cônjuge, serviço militar, interesses particulares.","Férias-prêmio: 6 meses a cada 10 anos; requerer 30 dias antes do decênio; conversão em espécie a pedido (arts. 97-99)."],"pg":["Licença do cônjuge é por prazo INDETERMINADO e sem remuneração.","Acidente de trajeto e agressão NÃO provocada equiparam-se a acidente em serviço.","Na licença saúde e na por doença em família é vedada atividade remunerada (art. 75)."]},{"m":"lm","t":"Estatuto de Paracatu – Direito de petição","p":["Requerimento e reconsideração: à autoridade competente por intermédio da chefia imediata; despacho em 5 dias, decisão em 30 dias (art. 129).","Reconsideração não pode ser renovada (art. 130).","Recurso ao Prefeito (se não foi ele quem decidiu), em 15 dias da publicação ou ciência (art. 131); efeito suspensivo é facultativo (art. 132); provimento retroage à data do ato (art. 133).","Prescrição: prazos das ações judiciais (patrimonial/créditos trabalhistas) ou 120 dias nos demais casos (art. 134); reconsideração e recurso INTERROMPEM (art. 135)."],"pg":["\"Poderá\" ter efeito suspensivo, não \"terá\".","Interrupção: o prazo volta pelo RESTANTE (redação do art. 135, parágrafo único)."]},{"m":"lm","t":"Estatuto de Paracatu – Deveres, proibições e acumulação","p":["Deveres (art. 137): zelo, lealdade, observar normas, cumprir ordens (salvo manifestamente ilegais), presteza, levar irregularidades ao superior, economia de material, moralidade, assiduidade e pontualidade, urbanidade, representar contra ilegalidade.","Proibições (art. 138), entre outras: sair sem autorização do chefe imediato, retirar documentos, recusar fé a documento público, apreço/desapreço na repartição, parente até 2º grau sob chefia imediata, procurador junto a repartições, propina, usura, desídia.","Acumulação: vedada, salvo casos constitucionais e com compatibilidade de horários; vale para autarquias, fundações, EP e SEM; não pode mais de um cargo em comissão (arts. 139-140)."],"pg":["Crítica doutrinária em trabalho assinado é PERMITIDA.","Procurador para benefício previdenciário/assistencial de parente até 2º grau ou cônjuge é PERMITIDO.","Chefia de parente: 2º grau (art. 138); impedimento na comissão de PAD: 3º grau (art. 169)."]},{"m":"lm","t":"Estatuto de Paracatu – Penalidades e prescrição","p":["Penas (art. 150): advertência, suspensão, demissão, cassação de aposentadoria/disponibilidade, destituição de cargo em comissão.","Advertência pode ser delegada a Secretário Municipal (art. 152; a LC 210/2026 fala em aplicação \"pela Prefeitura Municipal ou autoridade competente\").","Suspensão até 90 dias; recusa a inspeção médica: até 15 dias; multa de 50% da remuneração, permanecendo em serviço (arts. 154-155).","Cancelamento: advertência 3 anos, suspensão 5 anos, sem efeito retroativo (art. 156).","Abandono: mais de 30 dias consecutivos; inassiduidade: 60 dias em 12 meses (art. 157).","Demitido/destituído: 15 anos sem nova investidura (art. 161); por abandono ou inassiduidade habitual: 5 anos (art. 161-A, LC 210/2026).","Prescrição: 5 anos / 2 anos / 150 dias (advertência – era 180 antes da LC 210/2026), da data em que o fato se tornou conhecido; sindicância ou PAD interrompe (art. 163)."],"pg":["Não existe \"repreensão\" no Estatuto.","Prescrição conta do CONHECIMENTO do fato, não da prática.","Absolvição penal só afasta a responsabilidade administrativa se negar o fato ou a autoria (art. 149).","Advertência prescreve em 150 dias (LC 210/2026), não mais em 180."]},{"m":"lm","t":"Estatuto de Paracatu – Sindicância, PAD e revisão","p":["Sindicância: arquivamento, advertência ou suspensão até 30 dias, ou abertura de PAD (art. 166).","Afastamento preventivo: até 60 dias, com remuneração, prorrogável por igual prazo (art. 167).","Comissão: 3 servidores designados pelo Prefeito, que indica o presidente; impedidos parentes até 3º grau (art. 169).","Fases: instauração, inquérito (instrução, defesa, relatório), julgamento; prazo 60 + 60 dias (arts. 171-172).","Defesa: 10 dias; 20 dias comuns com 2+ indiciados; prorrogável pelo dobro; edital 15 dias após a última publicação; revel recebe defensor dativo de nível igual ou superior (arts. 181-184).","Julgamento: 60 dias; julgamento fora do prazo não anula (arts. 187-189).","Revisão: a qualquer tempo; família pode pedir; comissão em 60 dias; não agrava a pena; destituição revista vira exoneração (arts. 193-202)."],"pg":["A sindicância pode aplicar suspensão só até 30 dias (não 90).","Simples alegação de injustiça não fundamenta revisão.","Depoimento é oral; testemunha não pode trazê-lo por escrito."]},{"m":"ce","t":"SUS: CF e Leis 8.080 e 8.142","p":["CF art. 196: saúde é direito de todos e dever do Estado; acesso universal e igualitário.","Art. 198: diretrizes = descentralização (direção única em cada esfera), integralidade (prioridade preventiva, sem prejuízo da assistencial) e participação da comunidade.","Art. 199: privado participa de forma complementar; vedados recursos para subvenção a entidades com fins lucrativos e capital estrangeiro (salvo previsão em lei).","Lei 8.080, art. 6º: campo de atuação (vigilâncias, saúde do trabalhador, assistência farmacêutica, sangue, vigilância nutricional).","Lei 8.142: Conferência a cada 4 anos; Conselho permanente e deliberativo; usuários = paridade; ao menos 70% dos recursos aos Municípios."],"pg":["Trocar 'preventivas' por 'assistenciais' na prioridade do art. 198.","Dizer que o Conselho é 'consultivo' ou 'temporário'.","Dizer que o SUS 'formula, sem executar' a política de sangue ou 'executa com exclusividade' o saneamento (CF: participa da formulação e da execução).","Dizer que o dever do Estado 'exclui' o da família e da sociedade."]},{"m":"ce","t":"Decreto 7.508/2011 e PNAB 2017","p":["Portas de Entrada: atenção primária, urgência/emergência, atenção psicossocial e serviços especiais de acesso aberto.","Acesso ordenado pela atenção primária, por risco e critério cronológico.","PNAB: princípios = universalidade, equidade, integralidade; o resto (territorialização, adscrição, longitudinalidade, coordenação do cuidado etc.) são diretrizes.","eSF: 2.000 a 3.500 pessoas; UBS mínimo 40 h/semana, 5 dias, 12 meses.","Técnico na AB: procedimentos na UBS e no domicílio, educação em saúde, gerenciamento de insumos."],"pg":["Colocar atenção especializada ou hospitalar como Porta de Entrada.","Chamar 'longitudinalidade' ou 'coordenação do cuidado' de princípio.","Atribuir consulta de enfermagem ao técnico."]},{"m":"ce","t":"Lei 7.498/86, Decreto 94.406/87 e Código de Ética","p":["Técnico: nível médio, assistência exceto atividades privativas do enfermeiro, sempre sob supervisão do enfermeiro em instituições de saúde (art. 15).","Privativo do enfermeiro: consulta e prescrição de enfermagem, cuidados a pacientes graves com risco de vida e cuidados de maior complexidade.","Penalidades: advertência verbal, multa (1–10 anuidades), censura, suspensão (até 90 dias), cassação (até 30 anos).","Infrações: leves, graves e gravíssimas.","Violência contra criança, adolescente, idoso ou incapaz: comunicação obrigatória, sem precisar de autorização."],"pg":["Incluir 'demissão' ou 'exoneração' entre as penalidades.","Trocar 90 dias (suspensão) por 30 anos (cassação) e vice-versa.","Dizer que o técnico pode prescrever medicamentos de programas de saúde pública (isso é do enfermeiro)."]},{"m":"ce","t":"Biossegurança, NR-32 e resíduos","p":["Vedados: reencape/desconexão manual de agulhas, adornos, calçado aberto, comer/fumar no posto de trabalho.","Vacinas gratuitas: tétano, difteria, hepatite B + PCMSO.","Acidente com perfurocortante: lavar com água e sabão, não espremer, comunicar (CAT), PEP idealmente em 2 h (máx. 72 h), por 28 dias.","Resíduos: A biológico, B químico, C radioativo, D comum, E perfurocortante."],"pg":["'Calçado fechado é vedado' (o vedado é o aberto).","'Espremer o local ou usar hipoclorito na pele'.","'Fonte desconhecida contraindica PEP'.","Trocar grupo B (químico) com C (radioativo)."]},{"m":"ce","t":"CME, Spaulding e precauções","p":["Crítico (tecido estéril/vascular) → esterilização; semicrítico (mucosa/pele não íntegra) → no mínimo desinfecção de alto nível; não crítico (pele íntegra) → limpeza/desinfecção de baixo ou intermediário nível.","Limpeza sempre antes; fluxo unidirecional sujo → limpo; estufa proibida (RDC 15/2012).","Vapor: indicador biológico Geobacillus stearothermophilus; Bowie-Dick diário, câmara vazia.","Padrão: para TODOS os pacientes. Contato: luvas + avental. Gotículas: máscara cirúrgica. Aerossóis: N95/PFF2, quarto com porta fechada."],"pg":["'Desinfecção de alto nível mata todos os esporos' (só a esterilização).","'Precaução padrão só para quem tem diagnóstico de infecção'.","Varicela só com gotículas (é aerossol + contato).","C. difficile com álcool gel."]},{"m":"ce","t":"Segurança do paciente","p":["6 metas: identificação, comunicação, medicamentos, cirurgia segura, higiene das mãos, quedas/LP.","9 certos: paciente, medicamento, via, hora, dose, registro, orientação, forma, resposta.","Identificação: ≥ 2 identificadores; nunca o número do leito.","Cirurgia segura: antes da indução, antes da incisão, antes de sair da sala.","RDC 36/2013: evento adverso com óbito notificado em até 72 h."],"pg":["Incluir 'diagnóstico certo' ou 'prescritor certo' entre os nove certos.","Aceitar o leito como identificador.","Contagem de compressas 'no pós-operatório'."]},{"m":"ce","t":"Cálculos de medicação: fórmulas","p":["Macrogotas/min = V ÷ (h × 3). Microgotas/min = V ÷ h. mL/h = V ÷ h.","1 mL = 20 gotas = 60 microgotas.","Tempo de infusão: (V × 20) ÷ gotas/min = minutos.","Regra de três: o que tenho (dose/volume) está para o que quero.","Porcentagem: X% = X g em 100 mL (SG 5% 500 mL = 25 g; glicose 50% 10 mL = 5 g).","Penicilina cristalina: considerar o volume final (diluente + pó), se o enunciado informar."],"pg":["Dar o resultado em mL/h quando se pede gotas/min.","Esquecer de dividir a dose diária pelo número de tomadas (mg/kg/dia).","Esquecer o volume do pó na reconstituição, quando o enunciado o informa.","Arredondar errado: 27,8 → 28 gotas/min."]},{"m":"ce","t":"Lesão por pressão e curativos","p":["NPIAP 2016: estágio 1 eritema não branqueável; 2 perda parcial com derme exposta/bolha; 3 perda total com gordura; 4 exposição de fáscia, músculo, osso; não classificável (coberta por esfacelo/escara); tissular profunda (púrpura/marrom persistente).","Braden 6–23: menor escore = maior risco.","Não massagear proeminências ósseas avermelhadas.","Alginato: muito exsudato, sangrante. Hidrogel: ferida seca/desbridamento. Hidrocoloide: não usar em infectada.","Ferida limpa: do menos para o mais contaminado, sem voltar com a gaze."],"pg":["Chamar de estágio 2 uma lesão com gordura visível (é estágio 3).","Dizer que Braden alto indica alto risco.","Indicar hidrogel para ferida muito exsudativa."]},{"m":"ce","t":"Urgência e emergência","p":["RCP adulto: 100–120/min, 5–6 cm, retorno total, mínimo de interrupções, troca do compressor a cada 2 min; 30:2; com via aérea avançada, 1 ventilação a cada 6 s, compressões contínuas.","Criança/lactente: 30:2 (1 socorrista) e 15:2 (2 socorristas); pulso braquial no lactente; checar pulso em ≤ 10 s.","Chocáveis: FV e TV sem pulso.","Glasgow 3–15 (O4, V5, M6); ≤ 8 = coma grave.","Regra dos nove: MS 9, MI 18, cabeça 9, tronco anterior 18, posterior 18, períneo 1.","Queimadura: água corrente em temperatura ambiente; sem gelo, sem romper bolhas."],"pg":["'Checar pulso a cada 30 s' ou 'por até 30 s'.","Assistolia como ritmo chocável.","Choque neurogênico com taquicardia e pele fria (é bradicardia e pele quente).","Esquecer que cada MI vale 18% (não 9%)."]},{"m":"ce","t":"Imunização: calendário e rede de frio","p":["Rede de frio: +2 a +8 °C; não congelar vacinas com alumínio (hepatite B, pentavalente, DTP).","BCG: ID, deltoide direito; adiar se < 2 kg; não revacinar quem ficou sem cicatriz.","Pólio: VIP 2, 4, 6 meses + reforço VIP aos 15 meses (VOP saiu em 2024).","Rotavírus: oral; 1ª dose até 3 m 15 d; 2ª até 7 m 29 d.","Febre amarela: 9 meses + reforço aos 4 anos. HPV 9–14 anos: dose única.","Vias: BCG ID; tríplice viral e febre amarela SC; pentavalente, VIP, pneumo e hepatite B IM; rotavírus oral.","ESAVI: notificar mesmo sem certeza da causa."],"pg":["Faixa de '-1 a +9 °C' ou '0 a +10 °C'.","Reforço de pólio com gotinha (VOP) — calendário antigo.","HPV em 2 ou 3 doses para 9–14 anos (esquema antigo).","Revacinar BCG sem cicatriz."]},{"m":"ce","t":"Saúde da mulher e da criança","p":["Pré-natal (CAB 32): mensal até 28 sem; quinzenal 28–36; semanal 36–41; não há alta antes do parto.","AU: 12 sem na sínfise; 20 sem na cicatriz umbilical.","Lóquios: rubra → serosa → alba.","Pré-eclâmpsia: HAS após 20 sem + proteinúria/lesão de órgão-alvo; MgSO4, antídoto gluconato de cálcio.","Colo do útero: rastreio 25–64 anos.","Coraçãozinho 24–48 h, normal ≥ 95% e diferença < 3%. Leite ordenhado: geladeira 12 h, freezer 15 dias.","Diarreia: Plano A (domicílio), B (TRO na unidade), C (venoso)."],"pg":["Pega com 'mais aréola abaixo da boca'.","Mastite ou hepatite B como contraindicação à amamentação (HIV é).","Antídoto do magnésio = bicarbonato."]},{"m":"ce","t":"Doenças transmissíveis, saúde mental e vigilância","p":["TB: sintomático respiratório = tosse ≥ 3 semanas; esquema básico 6 meses; rifampicina deixa urina alaranjada; TDO.","Hanseníase: PQT-U para PB (6 doses) e MB (12 doses).","Dengue: evitar AAS/AINEs; sinais de alarme: dor abdominal intensa, vômitos persistentes, sangramento de mucosa, letargia, hipotensão postural.","Notificar já na suspeita; sarampo é imediata (24 h).","Lei 10.216: voluntária, involuntária (MP em 72 h), compulsória (Justiça); internação só se recursos extra-hospitalares forem insuficientes.","Letalidade = óbitos ÷ casos × 100; surto = epidemia restrita a um local/grupo."],"pg":["'Aguardar confirmação laboratorial para notificar'.","Involuntária determinada pela Justiça (é a compulsória).","Soro = imunidade ativa (é passiva).","SINASC registra óbitos (registra nascidos vivos; óbitos = SIM)."]},{"m":"pt","t":"Interpretação de texto na IBGP","p":["Leia primeiro o enunciado e depois volte ao texto para procurar o trecho citado.","Responda com base no que o texto diz, e não na sua opinião ou no conhecimento técnico de enfermagem.","Em perguntas sobre conectivos, substitua pelo sinônimo e veja se o sentido se mantém.","Em pronomes e expressões como 'isso' e 'nada disso', procure o referente no período imediatamente anterior."],"pg":["Alternativas com 'sempre', 'nunca', 'somente', 'exclusivamente' costumam extrapolar o texto.","Troca de 'reduz' por 'elimina' ou de 'diminui' por 'aumenta' em relação ao que o texto afirma."]},{"m":"pt","t":"Crase sem erro","p":["Para haver crase, é preciso preposição 'a' + artigo 'a(s)'. Troque por uma palavra masculina: se aparecer 'ao', há crase.","Nunca há crase antes de verbo, de palavra masculina (salvo 'à moda de'), de pronomes pessoais e de tratamento (exceto senhora e senhorita) nem entre palavras repetidas.","Locuções femininas levam crase: às vezes, à noite, às pressas, à medida que.","Antes de possessivo feminino singular e depois de 'até', a crase é facultativa."],"pg":["'Frente à frente' e 'cara à cara' estão errados.","'Daqui à dois dias' está errado: o correto é 'daqui a dois dias'."]},{"m":"pt","t":"Concordância e regência que mais caem","p":["Haver (existir) e fazer (tempo) são impessoais e ficam no singular, inclusive com auxiliar: 'deve haver'.","Na voz passiva sintética o verbo vai ao plural ('Vendem-se casas'). Com o índice de indeterminação, fica no singular ('Precisa-se de técnicos').","'Assistir' (ver), 'obedecer', 'visar' (pretender) e 'aspirar' (desejar) pedem a preposição 'a'.","'Chegar' e 'ir' pedem 'a' na norma-padrão: chegar ao hospital."],"pg":["'Prefiro mais X do que Y' está errado: o certo é 'Prefiro X a Y'.","'Fazem dois anos' e 'Houveram problemas' estão errados."]},{"m":"pt","t":"Pontuação e colocação pronominal","p":["Não se separa sujeito e verbo, nem verbo e complemento, por vírgula.","Vocativo, aposto explicativo, oração adjetiva explicativa e adjunto adverbial longo deslocado ficam entre vírgulas.","Palavras negativas, advérbios, pronomes relativos e conjunções subordinativas atraem o pronome (próclise).","Não se inicia frase com pronome átono e não se usa ênclise com verbo no futuro: nesse caso, mesóclise ou próclise."],"pg":["Colocar vírgulas numa oração restritiva muda o sentido da frase.","'Farei-lhe' está errado: o certo é 'Far-lhe-ei'."]},{"m":"rl","t":"Negações e equivalências","p":["Para negar 'e', troque por 'ou' e negue as duas partes. Para negar 'ou', troque por 'e' e negue as duas partes.","A negação de 'Se p, então q' é 'p e não q'.","Todo ↔ Algum... não; Nenhum ↔ Algum.","p → q equivale a ~q → ~p e a ~p ∨ q."],"pg":["A banca coloca 'Se não p, então não q' (inversa) como se fosse equivalente, mas não é.","A negação de 'Todo técnico usa luvas' não é 'Nenhum técnico usa luvas'."]},{"m":"rl","t":"Contas rápidas: porcentagem e proporção","p":["Use fatores multiplicativos: aumento de 15% é ×1,15; desconto de 20% é ×0,80.","Para achar o valor original depois de um desconto, divida pelo fator (64 ÷ 0,8 = 80).","Em divisão proporcional, some as partes, divida o total e multiplique.","Na regra de três, confira primeiro se as grandezas são diretas ou inversas."],"pg":["Aumentos sucessivos não se somam: 10% + 10% dá 21%.","Um aumento seguido de desconto de mesma taxa não volta ao valor inicial."]},{"m":"rl","t":"Sequências, contagem e associação lógica","p":["Em sequências, olhe as diferenças entre os termos, depois as razões, depois padrões alternados.","Em ciclos (dias da semana, padrões que se repetem), use o resto da divisão.","Pergunte se a ordem importa: se sim, é arranjo ou princípio multiplicativo; se não, é combinação.","Em problemas de associação, monte uma tabela e preencha primeiro as informações certas (as afirmações positivas)."],"pg":["Escolher 'presidente e vice' é arranjo, e escolher uma 'comissão' é combinação.","Em verdades e mentiras, teste cada hipótese e conte quantas afirmações ficam verdadeiras."]},{"m":"in","t":"Atalhos do Word em português","p":["Ctrl + B salva, Ctrl + A abre, Ctrl + O cria novo e Ctrl + P imprime.","Ctrl + N, I e S aplicam negrito, itálico e sublinhado.","Ctrl + Q, E, G e J alinham à esquerda, ao centro, à direita e justificam.","Ctrl + T seleciona tudo, Ctrl + L localiza, Ctrl + U substitui e Ctrl + Enter quebra a página."],"pg":["A banca troca pelos atalhos da versão em inglês: Ctrl + S para salvar, Ctrl + B para negrito.","Ctrl + D no Word em português abre a caixa Fonte, e não alinha à direita."]},{"m":"in","t":"Excel e Calc: o que mais cai","p":["Toda fórmula começa com '='. Os argumentos são separados por ';' no Excel em português.","Referência: $ fixa coluna ou linha. Ao copiar, só muda o que não tem $.","SE, E, OU, SOMA, MÉDIA, MÁXIMO, MÍNIMO, CONT.SE, SOMASE, PROCV e ARRED.","No Calc, a referência a outra planilha usa ponto (=Planilha2.A1). O formato padrão é .ods."],"pg":["MÉDIA ignora células vazias e textos, e CONT.NÚM conta apenas números.","Precedência: 2+3*2 = 8, e não 10."]},{"m":"in","t":"Segurança, redes e e-mail","p":["Phishing é golpe por mensagem falsa. Ransomware sequestra arquivos. Worm se espalha sozinho. Keylogger captura teclas.","Backup: o completo copia tudo, o incremental copia o que mudou desde o último backup e o diferencial copia o que mudou desde o último completo.","Cco esconde destinatários. SMTP envia. POP3 e IMAP recebem.","Intranet é uma rede privada que usa a tecnologia da internet. LAN é rede local."],"pg":["Responder não reenvia os anexos, e Encaminhar sim.","Arquivos excluídos de pen drive não vão para a Lixeira."]}];

{m:'ce',t:'Princípios do SUS',p:[
 'Doutrinários: universalidade (todos têm direito), integralidade (cuidado completo, da prevenção à reabilitação) e equidade (tratar desigualmente os desiguais, conforme a necessidade).',
 'Organizativos: descentralização com direção única em cada esfera, regionalização e hierarquização da rede, e participação da comunidade.',
 'CF/88, art. 196: saúde é direito de todos e dever do Estado.',
 'CF/88, art. 198: as ações formam uma rede regionalizada e hierarquizada, um sistema único.',
 'A iniciativa privada participa de forma complementar, com preferência para entidades filantrópicas e sem fins lucrativos.']},
{m:'ce',t:'Lei 8.080/1990 (Lei Orgânica da Saúde)',p:[
 'Trata da promoção, proteção e recuperação da saúde e da organização e funcionamento dos serviços.',
 'Art. 3º: alimentação, moradia, saneamento, meio ambiente, trabalho, renda, educação, lazer e transporte são determinantes e condicionantes da saúde.',
 'Art. 6º: o campo de atuação inclui vigilância sanitária, epidemiológica, saúde do trabalhador e assistência terapêutica integral, inclusive farmacêutica.',
 'Vigilância epidemiológica: conhecer, detectar e prevenir mudanças nos fatores que influem na saúde, para recomendar medidas de controle.',
 'Vigilância sanitária: eliminar, diminuir ou prevenir riscos ligados ao meio ambiente, à produção e circulação de bens e à prestação de serviços.',
 'Art. 7º: princípios como universalidade, integralidade, igualdade sem privilégios, direito à informação, descentralização e participação da comunidade.',
 'Direção única: Ministério da Saúde (União), secretarias estaduais e secretarias municipais.']},
{m:'ce',t:'Lei 8.142/1990 (participação e financiamento)',p:[
 'Instâncias colegiadas: Conferência de Saúde e Conselho de Saúde.',
 'Conferência: reúne-se a cada 4 anos para avaliar a situação de saúde e propor diretrizes.',
 'Conselho: caráter permanente e deliberativo; formula estratégias e controla a execução da política, inclusive financeira.',
 'Usuários ocupam vagas paritárias em relação ao conjunto dos demais segmentos (50%).',
 'Para receber recursos do Fundo Nacional de forma regular e automática, o município precisa de: Fundo de Saúde, Conselho, Plano de Saúde, relatórios de gestão, contrapartida de recursos e comissão para o plano de carreira (PCCS).']},
{m:'ce',t:'Decreto 7.508/2011',p:[
 'Regulamenta a Lei 8.080 quanto à organização do SUS, ao planejamento, à assistência e à articulação interfederativa.',
 'Região de Saúde: municípios limítrofes agrupados. Deve ter, no mínimo, atenção primária, urgência e emergência, atenção psicossocial, atenção ambulatorial especializada e hospitalar, e vigilância em saúde.',
 'Portas de entrada: atenção primária, urgência e emergência, atenção psicossocial e serviços especiais de acesso aberto.',
 'RENASES: relação de ações e serviços de saúde. RENAME: relação de medicamentos essenciais.',
 'Comissões intergestores: CIT (União, estados e municípios), CIB (estado e municípios) e CIR (estado e municípios da região).',
 'COAP: Contrato Organizativo da Ação Pública da Saúde, acordo entre os entes de uma região.']},
{m:'ce',t:'Atenção Básica e Estratégia Saúde da Família',p:[
 'A atenção básica é a principal porta de entrada e a ordenadora da rede.',
 'Equipe mínima de Saúde da Família: médico, enfermeiro, auxiliar e/ou técnico de enfermagem e agente comunitário de saúde.',
 'Profissionais de saúde bucal e agente de combate às endemias podem integrar a equipe.',
 'População de referência por equipe (PNAB 2017): 2.000 a 3.500 pessoas.',
 'Base do trabalho: território adscrito, vínculo, longitudinalidade e coordenação do cuidado.']},
{m:'ce',t:'Política Nacional de Humanização (HumanizaSUS)',p:[
 'Princípios: transversalidade, indissociabilidade entre atenção e gestão, e protagonismo dos sujeitos.',
 'Diretrizes: acolhimento, gestão participativa, ambiência, clínica ampliada, valorização do trabalhador e defesa dos direitos dos usuários.',
 'Acolhimento é postura de escuta qualificada de toda a equipe, e não um setor ou uma triagem.',
 'Acolhimento com classificação de risco organiza a ordem de atendimento pela gravidade, não pela ordem de chegada.']},
{m:'ce',t:'Exercício profissional (Lei 7.498/1986)',p:[
 'Privativo do enfermeiro: consulta e prescrição de enfermagem, direção do serviço de enfermagem e cuidados de maior complexidade técnica a pacientes graves.',
 'Técnico de enfermagem: atividade de nível médio, com orientação e acompanhamento do trabalho em grau auxiliar e participação no planejamento da assistência.',
 'O técnico executa ações assistenciais, exceto as privativas do enfermeiro, e participa da equipe de saúde.',
 'Auxiliar de enfermagem: atividades de nível médio de natureza repetitiva, sob supervisão.',
 'O Decreto 94.406/1987 regulamenta a lei.']},
{m:'ce',t:'Código de Ética (Res. Cofen 564/2017)',p:[
 'Direito: recusar-se a executar atividades fora de sua competência técnica, científica, ética e legal.',
 'Proibido: administrar medicamento sem conhecer indicação, ação, via e riscos; executar prescrição ilegível ou sem assinatura, salvo urgência.',
 'Sigilo: pode ser revelado nos casos previstos em lei, por ordem judicial ou com consentimento escrito da pessoa ou do representante legal.',
 'Penalidades: advertência verbal, multa, censura, suspensão (até 90 dias) e cassação (até 30 anos).',
 'Infrações são classificadas em leves, graves e gravíssimas.']},
{m:'ce',t:'Sinais vitais no adulto',p:[
 'Pulso: 60 a 100 bpm. Abaixo é bradicardia, acima é taquicardia.',
 'Respiração: 12 a 20 irpm (eupneia). Abaixo é bradipneia, acima é taquipneia. Ausência é apneia.',
 'Temperatura axilar: em torno de 36 a 37 °C. Os limites para febre variam conforme a referência usada.',
 'Saturação de O2: em geral, 95% ou mais em ar ambiente.',
 'Dor é considerada o 5º sinal vital.']},
{m:'ce',t:'Hipertensão arterial',p:[
 'Classificação (Diretrizes 2020): ótima < 120/80; normal 120–129/80–84; pré-hipertensão 130–139/85–89.',
 'Estágio 1: 140–159 e/ou 90–99. Estágio 2: 160–179 e/ou 100–109. Estágio 3: ≥ 180 e/ou ≥ 110.',
 'Técnica: paciente sentado, em repouso de 3 a 5 min, bexiga vazia, sem café ou cigarro nos 30 min anteriores, pernas descruzadas e braço apoiado na altura do coração.',
 'O manguito fica 2 a 3 cm acima da fossa cubital, sem roupa apertando o braço.']},
{m:'ce',t:'Diabetes mellitus',p:[
 'Diagnóstico: glicemia de jejum ≥ 126 mg/dL, HbA1c ≥ 6,5%, glicemia 2 h após sobrecarga ≥ 200 ou glicemia casual ≥ 200 com sintomas.',
 'Hipoglicemia: < 70 mg/dL. Sinais: sudorese, tremor, palidez, confusão. Corrigir com 15 g de carboidrato rápido e medir de novo em 15 min.',
 'Insulina regular é límpida; NPH é turva. Na mistura na mesma seringa, aspira-se primeiro a regular.',
 'Aplicação subcutânea com rodízio de locais para prevenir lipodistrofia.',
 'Pé diabético: inspecionar diariamente, secar entre os dedos e não andar descalço.']},
{m:'ce',t:'Cálculos de medicação',p:[
 'Macrogotas/min = volume (mL) ÷ (tempo em horas × 3).',
 'Microgotas/min = volume (mL) ÷ tempo em horas.',
 '1 mL = 20 gotas = 60 microgotas.',
 'Regra de três: o que tenho está para o volume que tenho, assim como o prescrito está para x.',
 'Penicilina cristalina: atenção à diluição informada no frasco. Confira sempre a unidade (UI, mg ou mL).']},
{m:'ce',t:'Vias de administração',p:[
 'Intradérmica: cerca de 15°, pequeno volume (ex.: BCG, PPD).',
 'Subcutânea: 45° ou 90°, conforme a agulha e o tecido (ex.: insulina, heparina).',
 'Intramuscular: 90°. Deltoide só para pequenos volumes; ventroglútea é região segura para volumes maiores.',
 'Endovenosa: ação imediata, exige técnica asséptica rigorosa.',
 'Os "certos" da medicação incluem paciente, medicamento, dose, via, hora, registro, orientação, forma e resposta.']},
{m:'ce',t:'Biossegurança',p:[
 'Precaução padrão: para todos os pacientes (higiene das mãos, EPI conforme o risco, descarte seguro).',
 'Contato: luvas e avental (ex.: bactérias multirresistentes, escabiose).',
 'Gotículas: máscara cirúrgica (ex.: influenza, meningite meningocócica, coqueluche).',
 'Aerossóis: respirador N95/PFF2 e quarto privativo (ex.: tuberculose, sarampo, varicela).',
 'Spaulding: crítico → esterilização; semicrítico → desinfecção de alto nível; não crítico → limpeza ou desinfecção de baixo nível.',
 'RDC 222/2018: grupo A infectante, B químico, C radioativo, D comum, E perfurocortante.']},
{m:'ce',t:'Saúde da mulher',p:[
 'Regra de Naegele: DUM + 7 dias e − 3 meses (ou + 9 meses).',
 'Vacina dTpa: a partir da 20ª semana, em cada gestação, para proteger o bebê contra coqueluche.',
 'Sífilis na gestação: tratar com penicilina benzatina e tratar também a parceria sexual.',
 'Citopatológico (diretriz de 2016): 25 a 64 anos; após dois exames anuais normais, a cada 3 anos. O Ministério da Saúde vem adotando o teste de DNA-HPV, repetido a cada 5 anos quando negativo.',
 'Climatério: transição do período reprodutivo para o não reprodutivo. A menopausa é a última menstruação, confirmada após 12 meses sem menstruar.']},
{m:'ce',t:'Saúde da criança',p:[
 'Apgar no 1º e no 5º minuto: frequência cardíaca, respiração, tônus, irritabilidade reflexa e cor.',
 'Teste do pezinho: entre o 3º e o 5º dia de vida. Teste do coraçãozinho: entre 24 e 48 horas.',
 'Ao nascer: vacinas BCG e hepatite B (esta, de preferência, nas primeiras 24 horas).',
 'Aleitamento materno exclusivo até 6 meses e complementado até 2 anos ou mais.',
 'Método Canguru: contato pele a pele com o recém-nascido de baixo peso.']},
{m:'ce',t:'Doenças transmissíveis',p:[
 'Dengue: Aedes aegypti. Tratamento com hidratação. Evitar AAS e anti-inflamatórios.',
 'Tuberculose: transmissão por aerossóis. Esquema básico de 6 meses (2 RHZE + 4 RH).',
 'Hanseníase: Mycobacterium leprae. Paucibacilar até 5 lesões (6 doses), multibacilar mais de 5 lesões (12 doses).',
 'Sífilis: Treponema pallidum. Penicilina benzatina.',
 'Leptospirose: contato com água ou lama contaminada por urina de roedores.',
 'Raiva: lavar o ferimento com água e sabão e avaliar a profilaxia.',
 'Febre maculosa: carrapato-estrela (Amblyomma), bactéria Rickettsia rickettsii.',
 'Hepatite A: transmissão fecal-oral. Hepatite B: sangue e via sexual, com vacina disponível.']},
{m:'ce',t:'Urgência e emergência',p:[
 'RCP no adulto: 100 a 120 compressões/min, 5 a 6 cm de profundidade, 30:2 sem via aérea avançada, e DEA assim que disponível.',
 'Manchester: vermelho (imediato), laranja (até 10 min), amarelo (até 60 min), verde (até 120 min), azul (até 240 min).',
 'Regra dos nove (adulto): cabeça 9%, cada braço 9%, tronco anterior 18%, posterior 18%, cada perna 18%, períneo 1%.',
 'OVACE em adulto consciente com obstrução grave: compressões abdominais (Heimlich).',
 'Escala de Glasgow: 3 a 15 pontos. Escore igual ou menor que 8 sugere necessidade de proteger a via aérea.']},
{m:'ce',t:'Vigilância e indicadores',p:[
 'Incidência: casos novos em um período. Prevalência: todos os casos existentes.',
 'Mortalidade infantil: óbitos de menores de 1 ano ÷ nascidos vivos × 1.000.',
 'Letalidade: óbitos pela doença ÷ casos da doença.',
 'Notificação compulsória imediata: até 24 horas. Semanal: até 7 dias.',
 'Prevenção (Leavell e Clark): primária (promoção e proteção, ex.: vacina), secundária (diagnóstico precoce), terciária (reabilitação).']},
{m:'pt',t:'Crase',p:[
 'Ocorre quando a preposição "a" encontra o artigo feminino "a": vou à farmácia.',
 'Não ocorre antes de palavra masculina, verbo, pronome pessoal, "esta/essa" e "a" no singular antes de palavra no plural.',
 'Horas exatas: às 8h. Locuções femininas: à noite, às pressas, à medida que.',
 'Teste da volta: "vou a Brasília, volto de Brasília" (sem crase); "vou à Bahia, volto da Bahia" (com crase).']},
{m:'pt',t:'Concordância verbal',p:[
 '"Haver" no sentido de existir e "fazer" indicando tempo são impessoais: houve faltas, faz dois anos.',
 'Com "se" apassivador, o verbo concorda com o sujeito: alugam-se salas.',
 'Com "se" índice de indeterminação do sujeito, o verbo fica no singular: precisa-se de técnicos.',
 '"Mais de um" pede o verbo no singular: mais de um paciente reclamou.',
 'Nomes próprios no plural com artigo levam o verbo ao plural: os Estados Unidos são.']},
{m:'pt',t:'Regência',p:[
 'Assistir (ver) a: assistiu ao jogo. Assistir (ajudar) é transitivo direto: assistiu o paciente.',
 'Obedecer e desobedecer a. Visar (pretender) a.',
 'Preferir uma coisa a outra, sem "do que" e sem "mais".',
 'Esquecer algo, ou esquecer-se de algo.',
 'Aversão a, medo de, residente em.']},
{m:'pt',t:'Colocação pronominal',p:[
 'Pela norma-padrão, não se inicia frase com pronome oblíquo.',
 'Próclise (antes do verbo) com palavras atrativas: negação, pronomes relativos e indefinidos, advérbios e conjunções subordinativas.',
 'Mesóclise com futuro do presente e do pretérito sem palavra atrativa: entregar-lhe-ei.',
 'Não se usa ênclise com verbo no futuro nem no particípio.']},
{m:'pt',t:'Porquês e acentuação',p:[
 'Por que: perguntas e "pelo qual". Por quê: fim de frase. Porque: explicação/causa. Porquê: substantivo (o porquê).',
 'Após o Acordo: ideia, heroico, voo, veem, leem e para (verbo) sem acento.',
 'Mantêm acento: têm e vêm (plural), pôr (verbo) e pôde (passado).']},
{m:'rl',t:'Lógica proposicional',p:[
 'Negação de "todo" é "algum não". Negação de "nenhum" é "algum".',
 '~(p ∧ q) = ~p ∨ ~q. ~(p ∨ q) = ~p ∧ ~q.',
 '~(p → q) = p ∧ ~q.',
 'p → q equivale a ~q → ~p (contrapositiva) e a ~p ∨ q.',
 'A condicional só é falsa quando a primeira parte é verdadeira e a segunda é falsa.',
 'A conjunção (∧) só é verdadeira se ambas forem verdadeiras; a disjunção (∨), se ao menos uma for.']},
{m:'rl',t:'Fórmulas que mais caem',p:[
 'Aumentos e descontos sucessivos: multiplique os fatores (ex.: +25% e −20% = 1,25 × 0,8 = 1, sem variação).',
 'Permutação: n!. Arranjo (ordem importa): n!/(n−p)!. Combinação (ordem não importa): n!/[p!(n−p)!].',
 'Probabilidade = casos favoráveis ÷ casos possíveis. Eventos sucessivos: multiplique as probabilidades.',
 'União de conjuntos: n(A ∪ B) = n(A) + n(B) − n(A ∩ B).',
 'Média ponderada: soma de (valor × peso) ÷ soma dos pesos.']},
{m:'in',t:'Atalhos essenciais',p:[
 'Windows: Win + E (Explorador), Win + D (área de trabalho), Win + L (bloquear), Ctrl + Shift + Esc (Gerenciador de Tarefas), Alt + Tab (alternar janelas).',
 'Word em português: Ctrl + N (negrito), Ctrl + I (itálico), Ctrl + S (sublinhado), Ctrl + B (salvar), Ctrl + P (imprimir).',
 'Gerais: Ctrl + C, Ctrl + X, Ctrl + V (copiar, recortar, colar) e Ctrl + Z (desfazer).']},
{m:'in',t:'Excel',p:[
 'Toda fórmula começa com "=". Referência absoluta usa cifrão: $A$1 não muda ao copiar.',
 'SOMA, MÉDIA, MÁXIMO, MÍNIMO.',
 'SE(teste; valor_se_verdadeiro; valor_se_falso).',
 'CONT.SE conta as células que atendem ao critério. SOMASE soma.',
 'PROCV(valor; tabela; nº da coluna; FALSO) busca com correspondência exata.']},
{m:'in',t:'Segurança da informação',p:[
 'Vírus precisa de um arquivo hospedeiro; worm se propaga sozinho; cavalo de troia se disfarça de programa legítimo.',
 'Spyware espiona; ransomware criptografa dados e pede resgate; phishing imita instituições para roubar dados.',
 'Firewall filtra conexões. Antivírus detecta e remove malware.',
 'Backup completo copia tudo; incremental copia o que mudou desde o último backup; diferencial, o que mudou desde o último completo.',
 'HTTPS indica conexão criptografada. A navegação anônima só evita guardar dados no aparelho.']}
];

var SYNC=['a80w','a80q','a80att','a80fav','a80rev','a80fc','a80pos','a80l'];
var SY={busy:0,h:0,state:'ok',at:0,quiet:0};

function isUserTok(t){return typeof t==='string'&&t.indexOf('u.')===0}
function snapProg(){var o={u:store.get('a80upd',0)||Date.now()};SYNC.forEach(function(k){o[k]=store.get(k,null)});return o}
function syncLater(ms){clearTimeout(SY.h);SY.h=setTimeout(pushProg,ms||2500);syncDot('saving')}
function syncDot(st){SY.state=st;var d=$('meSync');if(d){d.className='sy'+(st==='ok'?'':' '+st);d.title=st==='ok'?'Progresso salvo na sua conta':st==='err'?'Sem conexão: o progresso será salvo quando a internet voltar':'Salvando…'}}
function pushProg(){var t=store.get('a80t',null);if(!isUserTok(t))return;if(SY.busy){syncLater(1500);return}SY.busy=1;var snap=snapProg();
  callApi(t,function(r){SY.busy=0;if(!r){sessionLost();return}SY.at=Date.now();if(store.get('a80upd',0)<=snap.u)syncDot('ok');else syncLater()},
    function(){SY.busy=0;syncDot('err');clearTimeout(SY.h);SY.h=setTimeout(pushProg,30000)},{a:'save',d:JSON.stringify(snap)})}

function renderPerfil(){var u=S.user||{n:''},host=$('vPerfil'),first=String(u.n).split(/\s+/)[0];
