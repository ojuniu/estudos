<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seus estudos</title>
<meta name="theme-color" content="#09090C">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2309090C'/%3E%3Cpath d='M24 18l24 14-24 14z' fill='%23E4F06E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090C;
  --text:#F4F3F6; --muted:rgba(244,243,246,.56); --faint:rgba(244,243,246,.32); --hair:rgba(255,255,255,.09); --hair2:rgba(255,255,255,.16);
  --acc:#E4F06E; --acc-dim:rgba(228,240,110,.5); --bad:#FF8A7A;
  --glass:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.03));
  --font:'Inter Tight',system-ui,-apple-system,sans-serif;
  --r:28px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1.5px solid var(--text);outline-offset:3px}
[hidden]{display:none!important}
h2.sec{margin:6px 6px 0;font:400 24px/1.1 var(--font);letter-spacing:-.015em}
h2.sec span{color:var(--muted)}

/* luz ambiente */
.amb{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg)}
.amb i{position:absolute;border-radius:50%}
.amb .b1{width:70vmax;height:70vmax;left:-22vmax;top:-34vmax;background:radial-gradient(closest-side,rgba(110,72,150,.55),transparent)}
.amb .b2{width:55vmax;height:55vmax;right:-18vmax;top:-12vmax;background:radial-gradient(closest-side,rgba(184,98,140,.42),transparent)}
.amb .b3{width:46vmax;height:46vmax;right:8vmax;bottom:-30vmax;background:radial-gradient(closest-side,rgba(226,140,90,.28),transparent)}
.amb .b4{width:40vmax;height:40vmax;left:-12vmax;bottom:-22vmax;background:radial-gradient(closest-side,rgba(70,90,200,.22),transparent)}
.amb img{position:absolute;left:-10%;top:-10%;width:120%;height:70%;object-fit:cover;filter:blur(70px) saturate(1.35);opacity:0;transition:opacity 1s}
.amb img.ok{opacity:.42}
.amb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,9,12,.05) 0%,rgba(9,9,12,.55) 55%,rgba(9,9,12,.92) 100%)}

/* base */
.glass{background:var(--glass);border:1px solid var(--hair);border-radius:var(--r);
  -webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 30px 70px -40px rgba(0,0,0,.85)}
.rbtn{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--text);
  background:rgba(255,255,255,.07);border:1px solid var(--hair2);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);transition:background .15s}
.rbtn:hover:not(:disabled){background:rgba(255,255,255,.13)}
.rbtn:disabled{opacity:.3;cursor:default}
.wbtn{height:46px;border-radius:999px;border:0;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:#F4F3F6;color:#0B0B0E;font:500 15px/1 var(--font);white-space:nowrap;transition:transform .12s,background .15s}
.wbtn:hover:not(:disabled){background:#fff}
.wbtn:active{transform:scale(.98)}
.wbtn:disabled{opacity:.35;cursor:default}
.wbtn.done{background:rgba(228,240,110,.14);color:var(--acc);box-shadow:inset 0 0 0 1px rgba(228,240,110,.4)}
.gbtn{height:46px;border-radius:999px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
  background:rgba(255,255,255,.07);border:1px solid var(--hair2);color:var(--text);font:500 15px/1 var(--font)}
.gbtn:hover:not(:disabled){background:rgba(255,255,255,.13)}
.gbtn:disabled{opacity:.35;cursor:default}
.tag{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.1);font:500 13px var(--font);white-space:nowrap}
.tag.w{background:#F4F3F6;color:#0B0B0E}
.tag.ok{background:rgba(228,240,110,.16);color:var(--acc)}
.ic{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid var(--hair)}
.ic.w{background:#F4F3F6;color:#0B0B0E;border-color:transparent}
.dline{height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.dline i{display:block;height:100%;width:calc(var(--p,0)*100%);background:var(--acc);border-radius:3px;transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* layout */
.app{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:22px 28px 48px;display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-areas:"top top" "main side";gap:22px 28px}
.app:not([data-view="aulas"]){grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main"}
.app:not([data-view="aulas"]) .side{display:none}
.top{grid-area:top;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1;background:none;border:0;padding:0;text-align:left;color:var(--text)}
.mark{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;font:500 16px/1 var(--font);letter-spacing:-.02em;
  background:conic-gradient(from 200deg,#E4F06E,#E28C5A,#B8628C,#6E4896,#E4F06E);padding:2px}
.mark span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:#111015}
.brand b{display:block;font:500 17px/1.15 var(--font);letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-size:13px;color:var(--muted)}
.seg{display:flex;padding:4px;gap:2px;border-radius:999px}
.seg button{height:38px;padding:0 16px;border:0;border-radius:999px;background:none;color:var(--muted);font:500 14px var(--font);white-space:nowrap}
.seg button.on{background:rgba(255,255,255,.14);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.seg button:hover:not(.on){color:var(--text)}
.seg sup,.nav sup{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;margin-left:5px;border-radius:9px;background:var(--bad);color:#1a0b08;font:600 10px/1 var(--font);vertical-align:2px}
.top .right{flex:1;display:flex;justify-content:flex-end;gap:10px}
.main{grid-area:main;min-width:0}
.side{grid-area:side;display:flex;flex-direction:column;gap:14px;position:sticky;top:22px;align-self:start}
.view{display:flex;flex-direction:column;gap:22px}
.subseg{align-self:flex-start;display:flex;padding:4px;gap:2px;border-radius:999px}
.subseg button{height:34px;padding:0 14px;border:0;border-radius:999px;background:none;color:var(--muted);font:500 13px var(--font)}
.subseg button.on{background:rgba(255,255,255,.14);color:var(--text)}

/* início */
.home-top{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.cont{position:relative;overflow:hidden;min-height:330px;padding:28px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:32px;border:1px solid var(--hair);
  background:radial-gradient(70% 90% at 20% 0%,rgba(184,98,140,.55),transparent 70%),radial-gradient(60% 80% at 90% 20%,rgba(110,72,150,.6),transparent 70%),radial-gradient(60% 70% at 60% 110%,rgba(226,140,90,.35),transparent 70%),#17131C}
.cont img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.cont img.ok{opacity:.7}
.cont::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,9,12,0) 20%,rgba(9,9,12,.85) 100%)}
.cont>*:not(img){position:relative;z-index:1}
.cont .tag{align-self:flex-start;margin-bottom:auto}
.cont small{color:rgba(255,255,255,.75);font-size:14px}
.cont h1{margin:6px 0 18px;font:300 clamp(28px,3vw,40px)/1.08 var(--font);letter-spacing:-.025em;max-width:22ch}
.cont .row{display:flex;align-items:center;gap:16px}
.cont .row .dline{flex:1;height:4px}
.cont .row span{font-size:13px;color:rgba(255,255,255,.8);white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{padding:18px;border-radius:24px}
.tile .ic{width:38px;height:38px;margin-bottom:16px}
.tile b{display:block;font:300 32px/1 var(--font);letter-spacing:-.03em}
.tile small{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.train{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tr{display:flex;flex-direction:column;gap:14px;text-align:left;padding:20px;border-radius:26px;color:var(--text);border:1px solid var(--hair);
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);transition:background .15s}
.tr:hover{background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.04))}
.tr .r{display:flex;justify-content:space-between;align-items:flex-start}
.tr b{display:block;font:400 22px/1.1 var(--font);letter-spacing:-.01em}
.tr small{display:block;margin-top:4px;color:var(--muted);font-size:14px}
.tr .go{display:flex;align-items:center;gap:6px;font-size:14px;margin-top:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.wk{padding:22px 18px}
.wk .rings{grid-template-columns:repeat(7,1fr)}
.subj{padding:8px 20px}
.srow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--hair)}
.srow:last-child{border-bottom:0}
.srow b{display:block;font:500 15px var(--font);margin-bottom:8px}
.srow .pc{font-size:14px;color:var(--muted);min-width:40px;text-align:right}
.course{display:flex;align-items:center;gap:18px;padding:18px 22px;border-radius:28px;width:100%;text-align:left;color:var(--text)}
.course .tx{flex:1;min-width:0}
.course b{display:block;font:500 17px var(--font)}
.course small{color:var(--muted);font-size:14px}
.bigring{--p:0;position:relative;width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;font:500 15px var(--font)}
.bigring::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1turn),rgba(255,255,255,.13) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px))}

/* aulas: player */
.player{position:relative;aspect-ratio:var(--par,16/9);border-radius:32px;overflow:hidden;background:#141218;border:1px solid var(--hair);box-shadow:0 50px 100px -50px rgba(0,0,0,.9)}
.poster{position:absolute;inset:0;width:100%;border:0;padding:0;color:var(--text);text-align:left;
  background:radial-gradient(70% 90% at 25% 10%,rgba(184,98,140,.55),transparent 70%),radial-gradient(60% 80% at 85% 30%,rgba(110,72,150,.6),transparent 70%),radial-gradient(60% 70% at 60% 110%,rgba(226,140,90,.35),transparent 70%),#17131C}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.poster img.ok{opacity:1}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6))}
.poster .bar{position:absolute;z-index:1;left:18px;right:18px;bottom:18px;height:62px;border-radius:999px;display:flex;align-items:center;gap:14px;padding:0 10px;
  background:rgba(30,26,36,.38);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%)}
.poster .play{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:#F4F3F6;color:#0B0B0E}
.poster .bar b{font:500 15px var(--font);white-space:nowrap}
.poster .line{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.22);position:relative}
.poster .line i{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p,0)*100%);border-radius:3px;background:#fff}
.poster .line i::after{content:"";position:absolute;right:-5px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.18)}
.poster .bar small{font-size:13px;color:rgba(255,255,255,.75);white-space:nowrap;padding-right:8px}
.poster .corner{position:absolute;z-index:1;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center}
.rest{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;
  background:radial-gradient(60% 80% at 30% 0%,rgba(110,72,150,.5),transparent 70%),radial-gradient(60% 80% at 90% 100%,rgba(226,140,90,.25),transparent 70%),#141218}
.rest h3{margin:0 0 8px;font:300 34px/1.05 var(--font);letter-spacing:-.02em}
.rest p{margin:0;color:var(--muted);max-width:42ch}
.pholder{position:absolute;inset:0}
.pbox{position:absolute;inset:0;z-index:2;background:#000}
.pbox[hidden]{display:none}
.pframe{position:absolute;inset:0;overflow:hidden;background:#000}
/* o quadro do Drive nunca muda de tamanho depois de carregar: só é ampliado/reduzido (evita bordas pretas e player torto) */
.pframe iframe{position:absolute;left:0;top:0;border:0;display:block;transform-origin:0 0}
.pctl{display:none}
.pbtn{width:36px;height:36px;flex:none;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(12,11,16,.72);color:#F4F3F6;cursor:pointer;pointer-events:auto}
.pbtn:hover{background:rgba(12,11,16,.9)}
/* mini player: aparece ao sair da aula com o vídeo tocando */
body.pm-mini .pbox{position:fixed;inset:auto 24px 24px auto;width:380px;height:auto;aspect-ratio:var(--par,16/9);z-index:40;border-radius:16px;overflow:hidden;
  box-shadow:0 24px 70px -16px rgba(0,0,0,.95),0 0 0 1px rgba(255,255,255,.14)}
body.pm-mini .pctl{display:flex;position:absolute;z-index:3;left:8px;right:8px;top:8px;justify-content:space-between;pointer-events:none}
@media (hover:hover){body.pm-mini .pctl{opacity:0;transition:opacity .2s}body.pm-mini .pbox:hover .pctl{opacity:1}}
/* celular: vídeo de ponta a ponta na página da aula */
body.is-m .player.on{margin:0 -14px;border-radius:0;border-left:0;border-right:0;box-shadow:none}
/* sair da página da aula sem parar o vídeo: mantém só o player */
body.p-away #vAulas[hidden],body.p-away #vAula{display:contents!important}
body.p-away #vAulas[hidden]>:not(#vAula){display:none!important}
body.p-away #vAula>:not(#player){display:none!important}
body.p-away #player{display:contents}
body.p-away #pholder{display:none}
/* player próprio do site (vídeo direto do Drive, controles do site) */
.vp{position:absolute;inset:0;background:#000;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;color:#F4F3F6;font:400 14px var(--font)}
.vp video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:block}
.vp-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;transition:opacity .4s;pointer-events:none}
.vp.started .vp-poster{opacity:0}
.vp-shade{position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.62));pointer-events:none;transition:opacity .25s}
.vp-ui{position:absolute;left:14px;right:14px;bottom:12px;display:flex;flex-direction:column;gap:4px;transition:opacity .25s}
.vp-bar{display:flex;align-items:center;gap:2px;height:48px;padding:0 6px;border-radius:999px;background:rgba(30,26,36,.42);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%)}
.vb{width:38px;height:38px;flex:none;border:0;border-radius:50%;display:grid;place-items:center;background:transparent;color:inherit;padding:0;cursor:pointer}
.vb:hover{background:rgba(255,255,255,.12)}
.vb[hidden]{display:none}
.vp-time{padding:0 8px;white-space:nowrap;font-size:13px;color:rgba(255,255,255,.72)}
.vp-time b{font-weight:500;color:#fff}
.vp-sp{flex:1}
.vp-rate{width:auto;min-width:44px;padding:0 10px;border-radius:999px;font:500 13px var(--font)}
.vp-vol{display:flex;align-items:center}
.vp-vol input{width:0;opacity:0;transition:width .2s,opacity .2s;accent-color:#F4F3F6;height:4px;margin:0;cursor:pointer}
.vp-vol:hover input,.vp-vol input:focus-visible{width:72px;opacity:1;margin:0 8px 0 2px}
.vp-seek{position:relative;height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none;margin:0 10px}
.vp-track{position:relative;flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.24);transition:height .15s}
.vp-seek:hover .vp-track,.vp-seek.drag .vp-track{height:6px}
.vp-track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.vp-buf{background:rgba(255,255,255,.38)}
.vp-prog{background:var(--acc)}
.vp-knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px rgba(228,240,110,.22);transform:scale(.0);transition:transform .15s}
.vp-seek:hover .vp-knob,.vp-seek.drag .vp-knob,.vp.touch .vp-knob{transform:scale(1)}
.vp-tip{position:absolute;bottom:22px;transform:translateX(-50%);padding:4px 8px;border-radius:8px;background:rgba(12,11,16,.85);font:500 12px var(--font);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
.vp-seek:hover .vp-tip,.vp-seek.drag .vp-tip{opacity:1}
.vp-mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:28px;transition:opacity .25s}
.vp-mid .vb{width:52px;height:52px;background:rgba(20,18,26,.5);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.vp-mid .vb.big{width:68px;height:68px;background:#F4F3F6;color:#0B0B0E}
.vp-spin{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:vspin .8s linear infinite;pointer-events:none;display:none}
.vp.wait .vp-spin{display:block}
.vp.wait .vp-mid .big{opacity:0}
@keyframes vspin{to{transform:rotate(360deg)}}
.vp-tap{position:absolute;top:0;bottom:0;width:38%;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .35s}
.vp-tap.l{left:0;border-radius:0 50% 50% 0/0 50% 50% 0;background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,0))}
.vp-tap.r{right:0;border-radius:50% 0 0 50%/50% 0 0 50%;background:linear-gradient(270deg,rgba(255,255,255,.14),rgba(255,255,255,0))}
.vp-tap.show{opacity:1;transition:none}
.vp-tap span{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 13px var(--font)}
.vp-menu{position:absolute;right:14px;bottom:76px;width:236px;padding:14px;border-radius:20px;background:rgba(22,20,28,.88);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);display:flex;flex-direction:column;gap:10px}
.vp-menu small{color:rgba(255,255,255,.6);font-size:12px}
.vp-rates{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vp-rates button{height:34px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:transparent;font:500 13px var(--font);cursor:pointer}
.vp-rates button.on{background:#F4F3F6;color:#0B0B0E;border-color:#F4F3F6}
.vp-menu .lk{border:0;background:transparent;padding:6px 0 0;text-align:left;font-size:13px;color:rgba(255,255,255,.75);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.vp-end{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,6,9,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);text-align:center;padding:16px}
.vp-end h4{margin:0 0 14px;font:400 20px/1.2 var(--font)}
.vp-end .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.vp-end button{height:42px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:transparent;font:500 14px var(--font);cursor:pointer}
.vp-end button.pri{background:#F4F3F6;color:#0B0B0E;border-color:#F4F3F6}
.vp.idle .vp-ui,.vp.idle .vp-shade,.vp.idle .vp-mid{opacity:0;pointer-events:none}
.vp.idle{cursor:none}
.vp .m-only{display:none}
.vp.touch .m-only{display:grid}
.vp.touch .d-only{display:none}
.vp:not(.touch).playing .vp-mid{opacity:0;pointer-events:none}
.vp.touch .vp-time{padding-left:4px}
.vp:fullscreen,.vp:-webkit-full-screen{width:100%;height:100%}
.vp:fullscreen .vp-ui{left:max(24px,env(safe-area-inset-left));right:max(24px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom))}
body.pm-mini .vp .x-mini,body.pm-mini .vp .vp-mid .vb:not(.big),body.pm-mini .vp-menu{display:none!important}
body.pm-mini .vp-ui{left:8px;right:8px;bottom:6px;gap:0}
body.pm-mini .vp-bar{height:40px;padding:0 4px}
body.pm-mini .vb{width:34px;height:34px}
body.pm-mini .vp-mid .vb.big{width:52px;height:52px}
body.pm-mini .vp-end h4{font-size:15px;margin-bottom:10px}
body.pm-mini .vp-end button{height:36px;padding:0 14px;font-size:13px}
@media (max-width:520px){.vp-ui{left:8px;right:8px;bottom:6px}.vp-bar{height:42px}.vb{width:36px;height:36px}.vp-mid{gap:22px}.vp-mid .vb{width:46px;height:46px}.vp-mid .vb.big{width:60px;height:60px}.vp-menu{right:8px;bottom:62px}}
.actions{display:flex;align-items:center;gap:10px;padding:8px;border-radius:999px}
.actions .info{flex:1;min-width:0;padding:0 10px;display:flex;flex-direction:column;gap:6px}
.actions .info span{font-size:13px;color:var(--muted)}
.lhead h1{margin:0;font:300 clamp(26px,2.6vw,36px)/1.1 var(--font);letter-spacing:-.025em;max-width:30ch}
.lhead p{margin:12px 0 0;color:var(--muted);max-width:60ch}
.meta{display:flex;align-items:center;gap:12px;margin-top:20px}
.meta .who{flex:1;min-width:0}
.meta .who small{display:block;font-size:13px;color:var(--muted)}
.meta .who b{display:block;font:500 16px var(--font)}
.meta .score{font:400 15px var(--font);color:var(--muted);white-space:nowrap}
.meta .score b{color:var(--text);font-weight:500}
.lsthead{display:flex;justify-content:space-between;align-items:baseline;padding:0 6px;font:500 15px var(--font)}
.lsthead span+span{color:var(--muted);font-weight:400}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.lesson{display:flex;align-items:center;gap:14px;padding:10px 12px 10px 10px;border-radius:999px;cursor:pointer;transition:background .15s}
.lesson:hover{background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.05))}
.lesson .ic{font:500 15px/1 var(--font)}
.lesson .tx{flex:1;min-width:0}
.lesson .tx b{display:block;font:500 15px/1.3 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson .tx small{display:block;font-size:13px;color:var(--muted)}
.chk{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--hair2);background:none;display:grid;place-items:center;color:transparent;padding:0}
.chk:hover{border-color:var(--text);color:var(--faint)}
.chk.on{background:var(--acc);border-color:var(--acc);color:#14160A}
.lesson.cur{border-color:rgba(255,255,255,.22);background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.06))}
.lesson.seen .tx b{color:var(--muted)}
/* seletor de dia (topo da página da aula) */
.daybar{display:flex;align-items:center;gap:8px;padding:8px;border-radius:999px}
.dmid{flex:1;min-width:0;border:0;background:none;color:var(--text);text-align:center;padding:4px 8px;border-radius:999px;cursor:pointer}
.dmid:hover{background:rgba(255,255,255,.06)}
.dmid small{display:block;font-size:13px;color:var(--muted)}
.dmid b{display:inline-flex;align-items:center;gap:6px;max-width:100%;font:500 18px/1.3 var(--font)}
.dmid b span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmid b svg{flex:none;color:var(--muted)}
.lhead{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.allbtn{width:100%}
/* lista de dias (lateral e "Todos os dias") */
.dlist{display:flex;flex-direction:column;gap:2px}
.drow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:7px 12px 7px 7px;border-radius:999px;border:1px solid transparent;background:none;color:var(--text);cursor:pointer;font:inherit}
.drow:hover{background:rgba(255,255,255,.07)}
.drow.sel{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.06));border-color:rgba(255,255,255,.18)}
.drow .ring{width:38px;height:38px;flex:none;margin:0;font-size:12px}
.drow .tx{flex:1;min-width:0}
.drow .tx b{display:block;font:500 14px/1.3 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .tx small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow.off .tx b{color:var(--muted);font-weight:400}
.drow .tag{height:22px;padding:0 9px;font-size:11.5px}
.drow>svg{flex:none;color:var(--faint)}
.wk2 .strip-head{margin-bottom:10px}
.wk2 .sub{display:block;text-align:center;font-size:12.5px;color:var(--muted);margin:-6px 0 12px}
.cyc{padding:16px 14px 12px;border-radius:26px}
.cyc .chead{display:flex;align-items:center;gap:10px;padding:4px 8px;cursor:pointer;list-style:none}
.cyc .chead::-webkit-details-marker{display:none}
.cyc .chead b{flex:1;font:500 16px var(--font)}
.cyc .chead small{font-size:13px;color:var(--muted)}
.cyc .chead svg{flex:none;color:var(--muted);transition:transform .2s}
.cyc[open] .chead{padding-bottom:10px}
.cyc[open] .chead svg{transform:rotate(180deg)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}

/* anéis */
.strip{padding:20px 18px 18px}
.strip-head{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:18px}
.strip-head h3{margin:0;font:400 22px var(--font);letter-spacing:-.01em}
.strip-head h3 span{color:var(--muted)}
.strip-head button{width:32px;height:32px;border:0;border-radius:50%;background:none;color:var(--text);display:grid;place-items:center}
.strip-head button:disabled{opacity:.25;cursor:default}
.rings{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;text-align:center}
.rings .lbl{font-size:12px;color:var(--muted);margin-bottom:10px;white-space:nowrap}
.rings .col.sel .lbl{color:var(--text);font-weight:500}
.ring{--p:0;--rc:var(--acc);position:relative;width:38px;height:38px;margin:0 auto;border-radius:50%;border:0;padding:0;background:none;display:grid;place-items:center;font:400 12px var(--font);color:var(--muted);transition:transform .2s}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(var(--rc) calc(var(--p)*1turn),rgba(255,255,255,.13) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px))}
.ring.full{--rc:var(--acc-dim);color:var(--acc)}
.ring.none::before{background:none;border:1.5px dashed rgba(255,255,255,.16);-webkit-mask:none;mask:none}
.ring.sel{transform:scale(1.22);color:var(--text);font-weight:500}
.ring.sel::before{-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3.5px))}
.ring.sel.full::before{background:var(--acc)}
.ring.sel.p0::before{background:conic-gradient(var(--acc) .03turn,rgba(255,255,255,.2) 0)}
button.ring:hover{color:var(--text)}

/* agenda */
.ag-head{display:flex;justify-content:center;gap:8px;font:500 15px var(--font);margin:10px 0 0}
.ag-head span{color:var(--muted);font-weight:400}
.ag{display:flex;flex-direction:column;gap:12px}
.agc{display:block;width:100%;text-align:left;padding:16px 18px 14px;border-radius:26px;border:1px solid var(--hair);color:var(--text);
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.agc.now{border-color:rgba(255,255,255,.18);background:radial-gradient(90% 120% at 100% 100%,rgba(226,140,90,.35),transparent 60%),radial-gradient(90% 120% at 30% 120%,rgba(184,98,140,.45),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05))}
.agc .r1{display:flex;align-items:flex-start;gap:12px}
.agc .r1 .tx{flex:1;min-width:0}
.agc .r1 b{display:block;font:500 15px/1.25 var(--font)}
.agc .r1 small{display:block;font-size:13px;color:var(--muted)}
.agc .pct{display:flex;align-items:center;gap:6px;font-size:13px}
.agc .pct i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.25);color:#111}
.agc.now .pct i{background:#fff}
.agc .r2{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:14px}
.agc .r2 span:last-child{display:flex;align-items:center;gap:4px}
.agc:not(.now){opacity:.7}
.agc:hover{opacity:1}

/* mapa + busca */
.searchw{position:relative;display:block}
.search{width:100%;height:52px;border-radius:999px;padding:0 20px 0 50px;outline:none;color:var(--text);
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.04));border:1px solid var(--hair);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.search::placeholder{color:var(--faint)}
.search:focus{border-color:var(--hair2)}
.searchw svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:var(--muted)}
.cycles{display:flex;flex-direction:column;gap:12px}
.cycle{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:16px;padding:18px 20px;border-radius:26px}
.cycle .cl b{display:block;font:500 15px var(--font)}
.cycle .cl small{font-size:13px;color:var(--muted)}
.cycle .ring{width:44px;height:44px;font-size:13px}
.cycle .lbl{margin:10px 0 0;font-size:11px}
.xlist{display:flex;flex-direction:column;gap:10px}
.xlist h4,.results h4{margin:10px 6px 0;font:500 15px var(--font)}
.results{display:flex;flex-direction:column;gap:10px}
.rrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px 18px 10px 10px;border-radius:999px;border:1px solid var(--hair);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));color:var(--text)}
.rrow:hover{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05))}
.rrow .tx{flex:1;min-width:0}
.rrow b{display:block;font:500 15px/1.3 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow small{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);padding:6px}

/* simulados */
.sims{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.sim{padding:22px;border-radius:28px;display:flex;flex-direction:column;gap:16px}
.sim .top2{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sim h3{margin:0;font:300 30px/1 var(--font);letter-spacing:-.025em}
.sim p{margin:4px 0 0;color:var(--muted);font-size:14px}
.sim .mix{display:flex;gap:6px;flex-wrap:wrap}
.sim .btns{display:flex;gap:8px;margin-top:auto}
.sim .btns .wbtn{flex:1}
.note{color:var(--muted);font-size:14px;max-width:70ch;padding:0 6px;margin:0}
.quiz{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.qcard{padding:28px;border-radius:32px}
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.qhead .tx{flex:1;min-width:0}
.qhead small{display:block;color:var(--muted);font-size:13px}
.qhead b{display:block;font:500 16px var(--font)}
.qtext{margin:0 0 18px;padding:16px 18px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid var(--hair);color:rgba(244,243,246,.82);font-size:15px;line-height:1.6}
.qtext summary{cursor:pointer;color:var(--text);font-weight:500;list-style:none}
.qtext summary::-webkit-details-marker{display:none}
.qtext p{margin:10px 0 0;max-width:72ch}
.qe{margin:0 0 20px;font:300 clamp(20px,2vw,26px)/1.3 var(--font);letter-spacing:-.01em;max-width:60ch}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px 18px 10px 10px;border-radius:24px;border:1px solid var(--hair);color:var(--text);
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));font:400 15px/1.4 var(--font);transition:background .15s,border-color .15s}
.opt:hover:not(:disabled){background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05))}
.opt:disabled{cursor:default}
.opt .l{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid var(--hair2);font:500 14px var(--font)}
.opt.right{border-color:rgba(228,240,110,.55);background:linear-gradient(90deg,rgba(228,240,110,.14),rgba(228,240,110,.02))}
.opt.right .l{background:var(--acc);border-color:var(--acc);color:#14160A}
.opt.wrong{border-color:rgba(255,138,122,.55);background:linear-gradient(90deg,rgba(255,138,122,.14),rgba(255,138,122,.02))}
.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#1a0b08}
.opt.dim{opacity:.5}
.fb{margin-top:18px;padding:16px 18px;border-radius:20px;border:1px solid var(--hair);background:rgba(255,255,255,.04)}
.fb b{display:block;font:500 15px var(--font);margin-bottom:4px}
.fb b.ok{color:var(--acc)}
.fb b.no{color:var(--bad)}
.fb p{margin:0;color:rgba(244,243,246,.8);max-width:72ch}
.qnav{display:flex;align-items:center;gap:10px;margin-top:22px}
.qnav .sp{flex:1}
.qside{padding:20px;border-radius:28px;position:sticky;top:22px}
.qside h4{margin:0 0 4px;font:500 15px var(--font)}
.qside p{margin:0 0 16px;color:var(--muted);font-size:13px}
.qgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.qn{aspect-ratio:1;border-radius:50%;border:1px solid var(--hair2);background:none;color:var(--muted);font:500 12px var(--font);padding:0}
.qn.r{background:var(--acc-dim);border-color:transparent;color:#14160A}
.qn.w{background:rgba(255,138,122,.55);border-color:transparent;color:#1a0b08}
.qn.c{border-color:var(--text);color:var(--text);box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.qside .wbtn{width:100%;margin-top:18px}
.result{padding:30px;border-radius:32px;display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center}
.result .big{font:200 clamp(84px,10vw,128px)/.9 var(--font);letter-spacing:-.05em}
.result .big span{font-size:.4em;color:var(--muted);margin-left:4px}
.result h3{margin:0 0 6px;font:400 24px var(--font)}
.result p{margin:0 0 16px;color:var(--muted)}
.result .btns{display:flex;gap:10px;flex-wrap:wrap}

/* resumos */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--hair2);background:rgba(255,255,255,.05);color:var(--muted);font:500 14px var(--font)}
.chip.on{background:#F4F3F6;border-color:#F4F3F6;color:#0B0B0E}
.cards{columns:2 340px;column-gap:14px}
.card{break-inside:avoid;margin:0 0 14px;padding:22px;border-radius:26px}
.card .h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.card .h b{font:500 17px/1.2 var(--font)}
.card .h small{display:block;color:var(--muted);font-size:13px}
.card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.card li{position:relative;padding-left:16px;color:rgba(244,243,246,.85);line-height:1.5}
.card li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--acc-dim)}
mark{background:rgba(228,240,110,.25);color:var(--text);border-radius:3px;padding:0 2px}

/* erros */
.errhead{display:flex;align-items:center;gap:16px;padding:22px 24px;border-radius:28px}
.errhead .tx{flex:1}
.errhead b{display:block;font:300 34px/1 var(--font);letter-spacing:-.02em}
.errhead small{color:var(--muted)}

/* pin */
.gate{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:24px}
.gate form{width:min(400px,100%);padding:36px 28px 28px;text-align:center}
.gate .mark{width:72px;height:72px;margin:0 auto 22px;font-size:22px}
.gate h1{margin:0;font:300 34px/1.05 var(--font);letter-spacing:-.025em}
.gate p{margin:10px 0 24px;color:var(--muted)}
.gate input{width:100%;height:58px;border-radius:999px;text-align:center;font:300 26px var(--font);letter-spacing:.4em;outline:none;color:var(--text);
  background:rgba(255,255,255,.06);border:1px solid var(--hair2)}
.gate input:focus{border-color:rgba(255,255,255,.4)}
.gate .wbtn{width:100%;height:54px;margin-top:12px}
.gate input.gi{height:52px;margin-bottom:10px;text-align:left;padding:0 22px;font:400 17px var(--font);letter-spacing:0}
.gate input.gi::placeholder{color:var(--faint)}
.gate form[data-m="in"] .up{display:none}
.gate p#gSub{margin:10px 0 18px;font-size:14px}
.gtabs{display:flex;padding:4px;gap:2px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--hair);margin:0 0 16px}
.gtabs button{flex:1;height:40px;border:0;border-radius:999px;background:none;color:var(--muted);font:500 14px var(--font)}
.gtabs button.on{background:#F4F3F6;color:#0B0B0E}
.gate .err{min-height:22px;margin:14px 0 0;color:var(--bad);font-size:14px}
.toast{position:fixed;left:50%;bottom:30px;z-index:9;transform:translate(-50%,14px);opacity:0;pointer-events:none;transition:.25s;padding:12px 20px;border-radius:999px;background:#F4F3F6;color:#0B0B0E;font:500 14px var(--font)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.nav{display:none}
.only-m{display:none!important}

@media (max-width:1180px){
  .app{grid-template-columns:minmax(0,1fr) 340px;padding:20px}
  .cycle{grid-template-columns:1fr}
  .sims{grid-template-columns:1fr 1fr}
  .quiz{grid-template-columns:1fr}

  .qgrid{grid-template-columns:repeat(10,1fr)}
}

  .seg,.side{display:none}

  .cont .row .dline,.cont .row span{display:none}
  .cont .row .wbtn,.cont .row .gbtn{flex:1}

  .tr b{font-size:18px}
  .player{border-radius:26px}
  body.pm-mini .pbox{right:12px;bottom:calc(max(16px,env(safe-area-inset-bottom)) + 74px);width:min(62vw,300px)}
  .poster .bar{left:10px;right:10px;bottom:10px;height:54px;gap:10px}
  .poster .play{width:38px;height:38px}
  .poster .bar small{display:none}
  .poster .corner{top:12px;left:12px;right:12px}
  .poster .corner .rbtn{width:40px;height:40px}
  .actions .info{display:none}
  .actions{padding:6px}
  .actions .wbtn{flex:1}

/* ---------- simulados, dicas e flashcards (v2) ---------- */
:root{--m-pt:#8FB8FF;--m-rl:#C7A2FF;--m-in:#6FE0C8;--m-ce:#FF9DB8;--m-lm:#FFC46B}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

h2.sec.sm{font-size:19px;margin-top:10px;display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mc);flex:none}
.mt{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font:500 13px var(--font);white-space:nowrap;

.nv{display:inline-flex;gap:3px;align-items:center;margin-left:4px}

.qcard{border-top:2px solid color-mix(in srgb,var(--mc) 55%,transparent)}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 16px}
.qmeta .sp,.cact .sp{flex:1}
.ibtn{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--hair2);background:rgba(255,255,255,.05);color:var(--muted);display:inline-flex;align-items:center;gap:6px;font:500 13px var(--font);transition:background .15s,color .15s}
.ibtn:hover{color:var(--text);background:rgba(255,255,255,.1)}
.ibtn.on{color:var(--acc);border-color:rgba(228,240,110,.4)}
.ibtn.chk2.on{color:#14160A;background:var(--acc);border-color:var(--acc)}
.opt.sel{border-color:rgba(244,243,246,.6);background:linear-gradient(90deg,rgba(255,255,255,.16),rgba(255,255,255,.04))}
.opt.sel .l{background:#F4F3F6;color:#0B0B0E;border-color:#F4F3F6}
.qn.m{background:rgba(244,243,246,.75);border-color:transparent;color:#0B0B0E}
.clock{height:36px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;font:500 15px var(--font);background:rgba(255,255,255,.08);border:1px solid var(--hair2)}
.clock.late{color:var(--bad);border-color:rgba(255,138,122,.5)}
.fb .src{display:block;margin-top:8px;color:var(--muted);font-size:13px}
.result .muted{color:var(--muted);margin:6px 0 0}
.result .btns{flex-wrap:wrap}
.weak{padding:20px 22px;border-radius:26px}
.weak h4{margin:0 0 12px;font:500 15px var(--font)}
.trn{padding:22px;border-radius:28px;display:flex;flex-direction:column;gap:16px}
.trn .row{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:start}
.trn .row>b{font:500 14px/38px var(--font);color:var(--muted)}
.trn .chip small{opacity:.6;margin-left:4px}
.trn .go2{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--hair);padding-top:16px;color:var(--muted)}
.trn .wbtn:disabled{opacity:.4}
.subj .srow small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.chip.on{background:#F4F3F6;color:#0B0B0E;border-color:#F4F3F6}

/* dicas */
.restools{display:flex;gap:8px;flex-wrap:wrap}
.card{position:relative;overflow:hidden;border-top:2px solid color-mix(in srgb,var(--mc) 60%,transparent)}
.card::before{content:"";position:absolute;inset:0 0 auto;height:90px;background:linear-gradient(180deg,color-mix(in srgb,var(--mc) 12%,transparent),transparent);pointer-events:none}
.card .h,.card ul,.card .pg,.card .cact{position:relative}
.card .h .ic{color:var(--mc)}
.card li::before{background:var(--mc)}
.card.done{opacity:.72}
.pg{margin-top:16px;padding:14px 16px;border-radius:18px;background:rgba(255,196,107,.07);border:1px solid rgba(255,196,107,.22)}

.cact{display:flex;gap:6px;align-items:center;margin-top:16px;flex-wrap:wrap}

/* flashcards */
.fcwrap{display:flex;flex-direction:column;gap:16px;max-width:680px;width:100%;margin:0 auto}
.fcbar{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.fcbar .dline{flex:1}
.fc{perspective:1400px;background:none;border:0;padding:0;width:100%;height:clamp(260px,46vh,380px);text-align:center}
.fc .in{position:relative;display:block;width:100%;height:100%;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;border-radius:32px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid var(--hair);border-top:2px solid color-mix(in srgb,var(--mc) 60%,transparent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--mc) 12%,rgba(255,255,255,.06)),rgba(255,255,255,.025));-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px)}
.fc .face b{font:300 clamp(20px,2.6vw,28px)/1.3 var(--font);letter-spacing:-.01em;max-width:30ch}
.fc .back{transform:rotateY(180deg)}
.fc .back b{font-size:clamp(18px,2.2vw,24px);max-width:36ch}
.fc small{color:var(--muted);font-size:13px}
.fcact{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.fcact .no{color:var(--bad);border-color:rgba(255,138,122,.4)}
.fchome{padding:28px;border-radius:30px;display:flex;flex-direction:column;align-items:flex-start;gap:18px}
.fchome p{margin:0;color:var(--muted);max-width:60ch}
.fcst{display:flex;gap:28px;flex-wrap:wrap}
.fcst b{display:block;font:300 40px/1 var(--font);letter-spacing:-.02em}
.fcst small{color:var(--muted)}
.big2{font:200 72px/.9 var(--font);letter-spacing:-.04em}
.big2 span{font-size:.4em;color:var(--muted)}
.fclist{padding:18px 20px;border-radius:26px}
.fclist summary{cursor:pointer;font-weight:500}
.fclist .results{margin:14px 0;display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto}
.fcrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--hair);font-size:14px}

<script>
var SIMULADOS=[{"id":"s1","nome":"Simulado 1","textos":{"t1":"Nas unidades básicas de saúde, o primeiro contato do usuário raramente começa pela consulta. Começa na recepção, no olhar de quem o atende e na forma como sua queixa é ouvida. Por isso, o acolhimento não é uma etapa burocrática, mas uma postura que atravessa todo o serviço. Quando a equipe escuta com atenção, identifica riscos mais cedo e evita que casos simples se agravem. Ainda assim, muitos profissionais tratam a escuta como perda de tempo, embora ela costume economizar retornos, exames desnecessários e encaminhamentos mal feitos."},"q":[{"m":"pt","tx":"t1","e":"De acordo com o texto, o acolhimento:","o":["é uma etapa administrativa restrita à recepção.","substitui a consulta nos casos simples.","aumenta a quantidade de exames solicitados.","é uma postura que deve estar presente em todo o serviço."],"a":3,"c":"O texto afirma que o acolhimento \"não é uma etapa burocrática, mas uma postura que atravessa todo o serviço\"."},
{"m":"pt","tx":"t1","e":"No trecho \"embora ela costume economizar retornos\", a conjunção \"embora\" estabelece relação de:","o":["concessão.","conclusão.","condição.","causa."],"a":0,"c":"\"Embora\" é conjunção concessiva: admite um fato contrário sem impedir o que se afirma na oração principal."},
{"m":"pt","tx":"t1","e":"A expressão \"Por isso\", no terceiro período, introduz uma ideia de:","o":["oposição.","conclusão.","finalidade.","adição."],"a":1,"c":"\"Por isso\" retoma o que foi dito antes e apresenta a consequência ou conclusão."},
{"m":"pt","e":"Assinale a alternativa em que o acento indicativo de crase está empregado corretamente.","o":["Refiro-me à esta situação.","Fomos à pé até a unidade.","O técnico entregou o laudo à paciente do leito 3.","O atendimento começa à partir das 8h."],"a":2,"c":"\"Entregar algo a alguém\" + artigo \"a\" (a paciente) = à. Não há crase antes de verbo (partir), de palavra masculina (pé) nem de pronome demonstrativo \"esta\"."},
{"m":"pt","e":"Assinale a frase que está de acordo com a norma-padrão quanto à concordância verbal.","o":["Houveram muitas faltas no plantão de ontem.","Existem poucos leitos disponíveis na enfermaria.","Aluga-se salas no centro da cidade.","Fazem dois anos que trabalho nesta unidade."],"a":1,"c":"\"Existir\" concorda com o sujeito (leitos). \"Fazer\" indicando tempo e \"haver\" no sentido de existir são impessoais (faz, houve). Em \"alugam-se salas\", o verbo concorda com o sujeito paciente."},
{"m":"pt","e":"Quanto à regência verbal, está correta a frase:","o":["Esqueci-me o horário da medicação.","Ele assistiu o jogo no intervalo do plantão.","A equipe obedeceu ao protocolo de segurança.","Prefiro trabalhar de dia do que à noite."],"a":2,"c":"\"Obedecer\" é transitivo indireto (obedecer a algo). O correto seria: \"prefiro trabalhar de dia a trabalhar à noite\", \"assistiu ao jogo\" e \"esqueci-me do horário\"."},
{"m":"pt","e":"Assinale a alternativa em que a colocação do pronome oblíquo está de acordo com a norma-padrão.","o":["Tudo fez-se como previsto.","Quem chamou-te ao setor?","Me disseram que a escala mudou.","Não se esqueça de conferir a escala."],"a":3,"c":"A palavra negativa \"não\" atrai o pronome (próclise). Pela norma-padrão, não se inicia frase com pronome oblíquo, e \"tudo\" e \"quem\" também atraem o pronome."},
{"m":"pt","e":"De acordo com o Acordo Ortográfico vigente, está corretamente grafada a palavra:","o":["heroico","vôo","idéia","pára (verbo parar)"],"a":0,"c":"O acordo eliminou o acento dos ditongos abertos \"éi\" e \"ói\" em paroxítonas (ideia, heroico), do hiato \"oo\" (voo) e o acento diferencial de \"para\"."},
{"m":"pt","e":"Assinale a frase corretamente pontuada.","o":["Chegamos cedo mas, a sala estava fechada.","O enfermeiro que é responsável pelo setor, saiu mais cedo.","Os técnicos, organizaram o almoxarifado.","Maria, traga o termômetro, por favor."],"a":3,"c":"O vocativo (Maria) é separado por vírgula. Não se separa sujeito de verbo por vírgula, e a vírgula vem antes do \"mas\", não depois."},
{"m":"pt","e":"Na oração \"Os pacientes chegaram cansados\", o termo \"cansados\" exerce a função de:","o":["aposto.","predicativo do sujeito.","adjunto adverbial.","objeto direto."],"a":1,"c":"\"Cansados\" atribui uma característica ao sujeito (os pacientes) por meio de um verbo, sendo predicativo do sujeito."},
{"m":"rl","e":"A negação lógica da proposição \"Todo técnico usa luvas\" é:","o":["Algum técnico não usa luvas.","Todo técnico não usa luvas.","Algum técnico usa luvas.","Nenhum técnico usa luvas."],"a":0,"c":"Para negar \"todo\", basta um caso contrário: \"algum (pelo menos um) não\"."},
{"m":"rl","e":"Um medicamento custava R$ 80,00, teve aumento de 25% e, em seguida, desconto de 20% sobre o novo preço. O preço final é:","o":["R$ 85,00","R$ 76,00","R$ 80,00","R$ 84,00"],"a":2,"c":"80 × 1,25 = 100. Depois, 100 × 0,80 = 80."},
{"m":"rl","e":"Em um grupo de 50 profissionais, 30 fizeram curso de sala de vacina, 25 fizeram curso de curativos e 10 fizeram os dois. Quantos não fizeram nenhum dos dois cursos?","o":["5","10","15","0"],"a":0,"c":"Fizeram pelo menos um: 30 + 25 − 10 = 45. Não fizeram nenhum: 50 − 45 = 5."},
{"m":"rl","e":"Observe a sequência: 2, 6, 12, 20, 30, ... O próximo termo é:","o":["44","40","42","48"],"a":2,"c":"As diferenças crescem de 2 em 2 (4, 6, 8, 10). A próxima é 12: 30 + 12 = 42. Também é n × (n + 1): 6 × 7 = 42."},
{"m":"rl","e":"Uma caixa tem 4 ampolas azuis e 6 brancas. Retirando-se 2 ampolas ao acaso, sem reposição, a probabilidade de as duas serem azuis é:","o":["4/15","2/15","1/5","4/25"],"a":1,"c":"4/10 × 3/9 = 12/90 = 2/15."},
{"m":"in","e":"A memória do computador que é volátil, ou seja, perde seu conteúdo quando o equipamento é desligado, é a:","o":["SSD","HD","ROM","RAM"],"a":3,"c":"A RAM é a memória principal de trabalho e é volátil. ROM, SSD e HD guardam dados sem energia."},
{"m":"in","e":"No Windows 10/11, o atalho que bloqueia a sessão do usuário é:","o":["Windows + E","Windows + L","Windows + D","Alt + F4"],"a":1,"c":"Windows + L bloqueia (Lock). Windows + D mostra a área de trabalho, Windows + E abre o Explorador de Arquivos e Alt + F4 fecha a janela ativa."},
{"m":"in","e":"No Excel, a célula D2 contém a fórmula =B2*$C$1. Se ela for copiada para D3, a fórmula em D3 será:","o":["=C3*$D$1","=B2*$C$1","=B3*$C$1","=B3*$C$2"],"a":2,"c":"A referência relativa B2 vira B3 ao descer uma linha. A referência absoluta $C$1 não muda."},
{"m":"in","e":"O software malicioso que criptografa os arquivos da vítima e exige pagamento para liberá-los é chamado de:","o":["ransomware","spyware","worm","adware"],"a":0,"c":"Ransomware \"sequestra\" os dados. Spyware espiona, worm se propaga sozinho pela rede e adware exibe propaganda."},
{"m":"in","e":"Ao acessar um site cujo endereço começa com \"https://\", o usuário sabe que:","o":["a navegação é anônima.","o site não utiliza cookies.","o site é necessariamente de um órgão do governo.","a comunicação entre o navegador e o site é criptografada."],"a":3,"c":"O \"s\" de HTTPS indica conexão protegida por criptografia (TLS). Isso não garante que o site seja confiável nem anônimo."},
{"m":"ce","e":"Segundo a Constituição Federal de 1988 (art. 196), a saúde é:","o":["direito apenas de quem contribui para a Previdência Social.","dever exclusivo dos municípios.","direito de todos e dever do Estado.","serviço prestado exclusivamente pela iniciativa privada conveniada."],"a":2,"c":"Art. 196: \"A saúde é direito de todos e dever do Estado, garantido mediante políticas sociais e econômicas...\""},
{"m":"ce","e":"De acordo com o art. 7º da Lei nº 8.080/1990, NÃO é princípio do SUS:","o":["centralização político-administrativa.","universalidade de acesso aos serviços de saúde.","integralidade de assistência.","participação da comunidade."],"a":0,"c":"A lei prevê a descentralização político-administrativa, com direção única em cada esfera de governo."},
{"m":"ce","e":"Conforme a Lei nº 8.142/1990, a Conferência de Saúde se reúne:","o":["a cada 2 anos.","a cada 5 anos.","a cada 3 anos.","a cada 4 anos."],"a":3,"c":"A Conferência se reúne a cada quatro anos, com representação dos vários segmentos sociais, para avaliar a situação de saúde e propor diretrizes."},
{"m":"ce","e":"Segundo a Lei nº 8.142/1990, a representação dos usuários nos Conselhos e Conferências de Saúde é:","o":["de 25% das vagas.","paritária em relação ao conjunto dos demais segmentos.","definida livremente pelo gestor.","minoritária, por se tratar de órgão técnico."],"a":1,"c":"Os usuários ocupam metade das vagas (paridade com o conjunto dos demais segmentos)."},
{"m":"ce","e":"\"Conjunto de ações que proporcionam o conhecimento, a detecção ou prevenção de qualquer mudança nos fatores determinantes e condicionantes de saúde individual ou coletiva, com a finalidade de recomendar e adotar as medidas de prevenção e controle das doenças ou agravos.\" A Lei nº 8.080/1990 define assim a:","o":["saúde do trabalhador.","vigilância sanitária.","assistência farmacêutica.","vigilância epidemiológica."],"a":3,"c":"É a definição de vigilância epidemiológica (art. 6º, § 2º). A vigilância sanitária atua sobre riscos ligados a produtos, serviços e meio ambiente."},
{"m":"ce","e":"O Decreto nº 7.508/2011 define as Portas de Entrada do SUS. NÃO é uma delas o serviço de:","o":["atenção ambulatorial especializada.","atenção psicossocial.","atenção primária.","atenção de urgência e emergência."],"a":0,"c":"São portas de entrada: atenção primária, urgência e emergência, atenção psicossocial e serviços especiais de acesso aberto. A atenção especializada é acessada por referenciamento."},
{"m":"ce","e":"Pela Lei nº 7.498/1986, é atividade privativa do enfermeiro:","o":["verificação de sinais vitais.","realização de curativos.","consulta de enfermagem.","administração de medicamentos prescritos."],"a":2,"c":"Consulta e prescrição da assistência de enfermagem são privativas do enfermeiro. As demais podem ser executadas pela equipe de nível médio."},
{"m":"ce","e":"Segundo o Código de Ética dos Profissionais de Enfermagem (Resolução Cofen nº 564/2017), NÃO é penalidade prevista:","o":["advertência verbal.","demissão.","multa.","censura."],"a":1,"c":"As penalidades são: advertência verbal, multa, censura, suspensão do exercício profissional e cassação do direito ao exercício profissional. Demissão é sanção trabalhista, não ética."},
{"m":"ce","e":"A frequência respiratória considerada normal (eupneia) em um adulto em repouso é de, aproximadamente:","o":["12 a 20 irpm.","8 a 10 irpm.","22 a 30 irpm.","30 a 40 irpm."],"a":0,"c":"Adulto: 12 a 20 incursões respiratórias por minuto. Abaixo disso é bradipneia; acima, taquipneia."},
{"m":"ce","e":"Pelas Diretrizes Brasileiras de Hipertensão Arterial (2020), uma pressão de 145 x 92 mmHg em adulto é classificada como:","o":["hipertensão estágio 2.","pré-hipertensão.","hipertensão estágio 3.","hipertensão estágio 1."],"a":3,"c":"Estágio 1: 140–159 e/ou 90–99 mmHg. Estágio 2: 160–179 e/ou 100–109. Estágio 3: ≥ 180 e/ou ≥ 110."},
{"m":"ce","e":"Em adultos com diabetes, considera-se hipoglicemia a glicemia capilar abaixo de:","o":["100 mg/dL","70 mg/dL","140 mg/dL","126 mg/dL"],"a":1,"c":"Glicemia < 70 mg/dL é hipoglicemia e exige correção imediata, como a \"regra dos 15\" (15 g de carboidrato de absorção rápida e nova medida em 15 minutos)."},
{"m":"ce","e":"Foram prescritos 500 mL de soro fisiológico para correr em 8 horas. Em macrogotas, o gotejamento será de, aproximadamente:","o":["31 gotas/min","63 gotas/min","21 gotas/min","42 gotas/min"],"a":2,"c":"Gotas/min = volume ÷ (horas × 3) = 500 ÷ 24 ≈ 20,8, ou seja, cerca de 21 gotas/min."},
{"m":"ce","e":"Na administração de medicamento por via intramuscular, o ângulo de inserção da agulha recomendado é de:","o":["15°","90°","30°","45°"],"a":1,"c":"IM: 90°. Intradérmica: cerca de 15°. Subcutânea: 45° ou 90°, conforme a agulha e o tecido."},
{"m":"ce","e":"Para o atendimento de paciente com suspeita de tuberculose pulmonar bacilífera, o profissional deve usar:","o":["apenas avental descartável.","apenas luvas de procedimento.","máscara cirúrgica comum.","respirador N95/PFF2."],"a":3,"c":"Tuberculose exige precaução para aerossóis: respirador N95/PFF2 para o profissional e, de preferência, quarto privativo. A máscara cirúrgica é colocada no paciente durante o transporte."},
{"m":"ce","e":"Pela classificação de Spaulding, os artigos que entram em contato com tecidos estéreis ou com o sistema vascular são:","o":["críticos, exigindo esterilização.","semicríticos, exigindo desinfecção de alto nível.","semicríticos, exigindo apenas limpeza.","não críticos, exigindo limpeza."],"a":0,"c":"Críticos (ex.: instrumentais cirúrgicos) exigem esterilização. Semicríticos tocam mucosa ou pele não íntegra. Não críticos tocam pele íntegra."},
{"m":"ce","e":"Uma gestante informa a data da última menstruação (DUM) em 10/01/2026. Pela regra de Naegele, a data provável do parto é:","o":["17/11/2026","10/10/2026","17/10/2026","07/10/2026"],"a":2,"c":"Naegele: soma 7 dias e subtrai 3 meses (ou soma 9) da DUM. 10 + 7 = 17; janeiro − 3 meses = outubro. DPP: 17/10/2026."},
{"m":"ce","e":"O Ministério da Saúde recomenda aleitamento materno exclusivo até:","o":["os 4 meses de vida.","2 anos de idade.","1 ano de idade.","os 6 meses de vida."],"a":3,"c":"Exclusivo até 6 meses e complementado até 2 anos ou mais."},
{"m":"ce","e":"O teste do pezinho (triagem neonatal) deve ser realizado, idealmente:","o":["nas primeiras 24 horas de vida.","entre o 3º e o 5º dia de vida.","no 15º dia de vida.","no 30º dia de vida."],"a":1,"c":"Entre o 3º e o 5º dia, após o bebê ter sido amamentado, o que permite detectar alterações metabólicas com segurança."},
{"m":"ce","e":"O agente etiológico da hanseníase é:","o":["Leptospira interrogans.","Treponema pallidum.","Mycobacterium leprae.","Mycobacterium tuberculosis."],"a":2,"c":"Mycobacterium leprae (bacilo de Hansen). M. tuberculosis causa tuberculose, T. pallidum causa sífilis e Leptospira causa leptospirose."},
{"m":"ce","e":"Na reanimação cardiopulmonar de adultos, a frequência recomendada de compressões torácicas é de:","o":["100 a 120 por minuto.","60 a 80 por minuto.","80 a 100 por minuto.","120 a 150 por minuto."],"a":0,"c":"100 a 120 compressões/min, com profundidade de 5 a 6 cm e retorno total do tórax. Sem via aérea avançada, a relação é 30:2."}]},{"id":"s2","nome":"Simulado 2","textos":{"t1":"Durante décadas, o Brasil foi referência internacional em vacinação. Campanhas nacionais alcançavam cidades pequenas e comunidades distantes, e doenças que antes lotavam hospitais tornaram-se raras. Nos últimos anos, porém, as coberturas caíram. Parte da queda se explica por falhas de acesso, como horários de funcionamento restritos; outra parte, pela circulação de boatos nas redes sociais. Combater esse cenário exige mais do que informar: é preciso reconstruir a confiança entre a população e os serviços de saúde."},"q":[{"m":"pt","tx":"t1","e":"A ideia central do texto é que:","o":["basta divulgar mais informações para resolver o problema.","os boatos nas redes sociais são a única causa da queda das coberturas.","a queda das coberturas tem mais de uma causa e sua reversão depende de reconstruir a confiança.","o Brasil nunca teve boas coberturas vacinais."],"a":2,"c":"O texto aponta duas causas (acesso e boatos) e conclui que é preciso \"mais do que informar\"."},
{"m":"pt","tx":"t1","e":"A palavra \"porém\", no terceiro período, pode ser substituída, sem prejuízo de sentido, por:","o":["portanto","no entanto","porque","assim"],"a":1,"c":"\"Porém\" e \"no entanto\" são conjunções adversativas. \"Portanto\" e \"assim\" são conclusivas; \"porque\" é causal ou explicativa."},
{"m":"pt","tx":"t1","e":"No trecho \"doenças que antes lotavam hospitais\", a palavra \"que\" é:","o":["conjunção integrante.","preposição.","advérbio.","pronome relativo."],"a":3,"c":"Retoma \"doenças\" e introduz oração adjetiva: doenças as quais lotavam hospitais."},
{"m":"pt","e":"Quanto à concordância nominal, está correta a frase:","o":["Seguem anexas as fichas de notificação.","É proibido a entrada de acompanhantes.","Ela mesmo fez o curativo.","O plantão termina ao meio-dia e meio."],"a":0,"c":"\"Anexo\" concorda com o substantivo (as fichas, anexas). Com artigo, diz-se \"é proibida a entrada\"; \"ela mesma\"; \"meio-dia e meia\" (meia hora)."},
{"m":"pt","e":"Assinale a alternativa que completa corretamente a frase: \"Vou ___ farmácia e, depois, ___ Brasília.\"","o":["à / a","à / à","a / a","a / à"],"a":0,"c":"\"Ir à farmácia\" (a farmácia, com artigo). \"Ir a Brasília\" não tem crase: quem volta, volta \"de Brasília\", e não \"da Brasília\"."},
{"m":"pt","e":"Transpondo para a voz ativa a oração \"O curativo foi feito pela técnica\", obtém-se:","o":["O curativo fez a técnica.","A técnica fez o curativo.","A técnica foi fazer o curativo.","Fez-se o curativo pela técnica."],"a":1,"c":"O agente da passiva (pela técnica) vira sujeito, e o sujeito paciente (o curativo) vira objeto direto, mantendo o tempo verbal."},
{"m":"pt","e":"O plural de \"cidadão\", segundo a norma-padrão, é:","o":["cidadãns","cidadães","cidadões","cidadãos"],"a":3,"c":"Cidadão faz plural em \"-ãos\", como irmão e cristão."},
{"m":"pt","e":"Assinale a alternativa que completa corretamente a frase: \"Não sei ___ ela faltou ao plantão.\"","o":["porque","porquê","por que","por quê"],"a":2,"c":"Na pergunta indireta, usa-se \"por que\" (equivale a \"por qual motivo\")."},
{"m":"pt","e":"Na frase \"Li Machado de Assis durante as férias\", há uma figura de linguagem chamada:","o":["metáfora","metonímia","hipérbole","antítese"],"a":1,"c":"Metonímia: o autor é usado no lugar da obra."},
{"m":"pt","e":"Em \"Espero que você chegue cedo\", a oração destacada \"que você chegue cedo\" é classificada como:","o":["subordinada substantiva objetiva direta.","subordinada adverbial causal.","coordenada explicativa.","subordinada adjetiva restritiva."],"a":0,"c":"Funciona como objeto direto de \"espero\" (espero isso)."},
{"m":"rl","e":"Uma proposição equivalente a \"Se chove, então a escala muda\" é:","o":["Se a escala muda, então chove.","Chove e a escala não muda.","Se a escala não muda, então não chove.","Se não chove, então a escala não muda."],"a":2,"c":"A contrapositiva (se não q, então não p) é equivalente à condicional. A alternativa D é a negação."},
{"m":"rl","e":"Quantos códigos de 3 letras distintas podem ser formados com as letras A, B, C, D e E, considerando que a ordem importa?","o":["120","10","125","60"],"a":3,"c":"Arranjo: 5 × 4 × 3 = 60."},
{"m":"rl","e":"Três técnicos aplicam 90 vacinas em 2 horas. Mantido o mesmo ritmo, 5 técnicos aplicarão, em 3 horas:","o":["225 vacinas","200 vacinas","250 vacinas","150 vacinas"],"a":0,"c":"Cada técnico aplica 90 ÷ (3 × 2) = 15 vacinas por hora. Então 5 × 3 × 15 = 225."},
{"m":"rl","e":"Sendo p uma proposição falsa e q uma proposição verdadeira, é verdadeira:","o":["~q","p ∧ q","p ↔ q","p ∨ q"],"a":3,"c":"A disjunção é verdadeira quando pelo menos uma parte é verdadeira. p ∧ q e p ↔ q são falsas, e ~q é falsa."},
{"m":"rl","e":"Se 1º de março de um ano caiu em uma quarta-feira, então 1º de abril desse ano caiu em um(a):","o":["domingo","sábado","quinta-feira","sexta-feira"],"a":1,"c":"Março tem 31 dias: 31 = 4 semanas + 3 dias. Quarta + 3 dias = sábado."},
{"m":"in","e":"No Microsoft Word em português, o atalho padrão para aplicar negrito ao texto selecionado é:","o":["Ctrl + G","Ctrl + S","Ctrl + N","Ctrl + B"],"a":2,"c":"Na versão em português: Ctrl + N (negrito), Ctrl + I (itálico), Ctrl + S (sublinhado) e Ctrl + B (salvar)."},
{"m":"in","e":"No Excel, a célula A1 contém 6,5. A fórmula =SE(A1>=7;\"Aprovado\";\"Reprovado\") retorna:","o":["6,5","Reprovado","Aprovado","#VALOR!"],"a":1,"c":"6,5 não é maior ou igual a 7, então a função retorna o valor_se_falso, \"Reprovado\"."},

var BANCO={"id":"b","nome":"Banco de questões","textos":{"g1":"Pressão alta não dói\n\nQuem passa pela sala de acolhimento de uma unidade básica de saúde num dia comum ouve, mais de uma vez, a mesma frase: \"Mas eu não sinto nada\". É dita com alívio, quase com orgulho, por homens e mulheres que acabaram de descobrir que a pressão arterial está acima do recomendado. O problema é justamente esse: a hipertensão costuma avançar em silêncio, sem dor nem febre, e só se anuncia quando já causou estragos no coração, nos rins ou no cérebro.\n\nPor isso, os profissionais repetem que medir a pressão periodicamente é um gesto simples e barato, mas decisivo. Uma aferição feita com a técnica correta — paciente sentado, braço apoiado na altura do coração, alguns minutos de repouso antes — vale mais do que muitas suposições. Quando o valor alterado se confirma em diferentes momentos, começa um acompanhamento que exige paciência dos dois lados.\n\nO tratamento, contudo, não se resume ao comprimido. Reduzir o sal, caminhar com regularidade, controlar o peso e moderar o álcool fazem parte da receita, ainda que nenhum desses hábitos caiba numa embalagem. Muitos pacientes abandonam o remédio assim que os números melhoram, como se a cura tivesse chegado. Não chegou: a pressão ficou controlada porque o tratamento estava funcionando.\n\nHá, portanto, um trabalho de convencimento que nenhuma tecnologia substitui. O técnico que explica, sem pressa, por que o medicamento deve ser tomado todos os dias, mesmo sem sintomas, faz tanto pela saúde daquela pessoa quanto o aparelho que registrou o número. Afinal, uma doença que não dói precisa de quem a torne visível.\n\n(Texto elaborado para fins didáticos.)","g2":"A fila do pão\n\nToda manhã, às seis e meia, a padaria da esquina vira uma pequena assembleia. Ninguém combinou nada, mas os frequentadores ocupam sempre os mesmos lugares na fila, como se houvesse cadeiras marcadas num teatro invisível. O senhor de boné discute o resultado do futebol; a professora aposentada comenta o preço do tomate; o rapaz de uniforme da construtora apenas boceja, ainda brigando com o sono.\n\nDurante anos, achei aquilo perda de tempo. Pedia meu pão com a pressa de quem tem compromissos importantes e saía sem cumprimentar ninguém. Foi preciso uma gripe forte, que me deixou uma semana em casa, para perceber o que eu vinha desprezando. Quando voltei, a dona da padaria perguntou se eu tinha melhorado. O senhor de boné quis saber se eu tinha tomado vacina. A professora me ofereceu um chá de receita antiga, que, confesso, nunca experimentei.\n\nDescobri, então, que eu fazia parte de alguma coisa. Não era amizade, pelo menos não do tipo que se convida para o aniversário. Era uma rede frouxa e discreta de atenção, dessas que só notamos quando falta alguém. Na cidade grande, dizem, ninguém conhece o vizinho; na fila do pão, porém, todo mundo sabe quem sumiu.\n\nHoje chego cinco minutos mais cedo. Não por causa do pão, que continua o mesmo, mas pela conversa, que nunca se repete. Aprendi que a pressa nos protege de muita coisa, inclusive daquilo que poderia nos fazer bem.\n\n(Crônica elaborada para fins didáticos.)","g3":"Memória de pedra\n\nNas cidades do interior de Minas, o centro histórico costuma guardar mais do que casarões. Nas ruas calçadas de pedra, que castigam os saltos e os pneus, ainda se ouvem histórias contadas de porta em porta: quem construiu a igreja, quem foi o primeiro farmacêutico, em que ano a enchente levou a ponte velha. Essa memória, transmitida de boca em boca, é um patrimônio tão frágil quanto as paredes de adobe que a abrigam.\n\nNos últimos anos, muitas dessas cidades cresceram para além do núcleo antigo. Surgiram bairros novos, supermercados, condomínios e avenidas largas. O movimento foi, em grande parte, positivo: trouxe emprego, serviços e conforto a quem antes precisava viajar horas para resolver qualquer coisa. Entretanto, o crescimento também levou parte dos moradores a abandonar o centro, e casas centenárias passaram a sofrer com a falta de uso e de manutenção.\n\nPreservar, nesse caso, não significa congelar a cidade no passado. Significa encontrar usos para os imóveis antigos — uma biblioteca, um ateliê, uma escola de música, uma pousada — de modo que eles continuem vivos. Prédio fechado se deteriora depressa; prédio ocupado é cuidado por quem o utiliza.\n\nOs moradores mais velhos têm papel fundamental nessa tarefa. São eles que lembram os nomes das ruas antes da numeração, as receitas das festas religiosas, os ofícios que desapareceram. Ouvi-los, registrar seus relatos e levá-los às escolas é uma forma barata e eficiente de manter a identidade de um lugar. Uma cidade que esquece a própria história corre o risco de se tornar igual a todas as outras.\n\n(Texto elaborado para fins didáticos.)","g4":"O prontuário e o olhar\n\nAté pouco tempo atrás, a história clínica de um paciente costumava ficar espalhada em pastas de papel, guardadas em armários de diferentes serviços. Bastava uma mudança de endereço para que exames, vacinas e alergias se perdessem pelo caminho. A adoção do prontuário eletrônico vem mudando esse cenário: com alguns cliques, o profissional consulta o histórico, verifica as últimas prescrições e registra o atendimento do dia.\n\nOs ganhos são evidentes. Informações legíveis reduzem erros de interpretação, alertas automáticos ajudam a identificar interações medicamentosas e a comunicação entre as equipes se torna mais ágil. Em municípios menores, onde o paciente muitas vezes é encaminhado para outra cidade, o compartilhamento de dados evita que ele repita exames desnecessariamente.\n\nNada disso, no entanto, funciona sem cuidados. Senhas compartilhadas entre colegas, computadores deixados com a sessão aberta e anotações feitas às pressas comprometem a segurança e a qualidade do registro. Os dados de saúde estão entre as informações mais sensíveis que existem, e sua proteção é exigida pela Lei Geral de Proteção de Dados. Um vazamento pode expor diagnósticos, causar constrangimento e até discriminação.\n\nHá também o risco de que a tela roube a atenção que pertence ao paciente. Quem já foi atendido por alguém que não tirou os olhos do monitor sabe como a experiência pode ser fria. A tecnologia deve servir ao cuidado, e não o contrário. O melhor sistema do mundo não substitui um olhar atento, uma pergunta bem formulada e um registro feito com responsabilidade.\n\n(Texto elaborado para fins didáticos.)","g5":"O berço das águas\n\nO Cerrado é chamado, com razão, de berço das águas. Nascentes que surgem em suas chapadas alimentam rios importantes do país, e as veredas, com seus buritis enfileirados, funcionam como grandes esponjas que retêm a água da chuva e a liberam lentamente ao longo do ano. Quem cresceu no noroeste de Minas conhece bem essa paisagem, ainda que nem sempre perceba o quanto ela é decisiva para a vida da região.\n\nDurante muito tempo, o Cerrado foi visto como uma vegetação pobre, de árvores tortas e capim seco, que poderia ser substituída sem grandes perdas. Essa impressão é falsa. Boa parte da biodiversidade do bioma está abaixo do solo: raízes profundas, que buscam a água a vários metros, sustentam plantas capazes de resistir a meses de estiagem. Quando a vegetação nativa é retirada, o solo perde essa estrutura, a infiltração diminui e as nascentes começam a secar.\n\nOs efeitos não ficam restritos ao campo. Rios com menor vazão significam menos água nas torneiras das cidades, mais conflitos pelo uso dos recursos e maior custo de tratamento. A saúde pública também é afetada: períodos secos mais longos aumentam as queimadas, e a fumaça agrava problemas respiratórios, sobretudo em crianças e idosos.\n\nProteger as veredas e as matas ciliares, recuperar áreas degradadas e usar a água com responsabilidade não são tarefas exclusivas dos órgãos ambientais. Produtores rurais, escolas, prefeituras e moradores urbanos dividem essa responsabilidade. Afinal, cada copo de água que bebemos começou, um dia, numa nascente que alguém decidiu preservar.\n\n(Texto elaborado para fins didáticos.)","g6":"Dez minutos contra o mosquito\n\nCom a chegada das chuvas, as equipes de vigilância em saúde de muitos municípios mineiros intensificam as visitas domiciliares. O objetivo é conhecido, mas continua atual: eliminar os criadouros do Aedes aegypti, mosquito que transmite dengue, zika e chikungunya. Segundo os agentes de combate às endemias, a maior parte dos focos encontrados está dentro das residências ou nos quintais, e não em terrenos baldios, como muitos imaginam.\n\nPratinhos de vasos de plantas, baldes esquecidos, calhas entupidas, garrafas de boca para cima e caixas-d'água mal tampadas são os locais preferidos do mosquito para depositar seus ovos. Esses ovos podem resistir por meses em ambiente seco e eclodem quando entram em contato com a água. Por esse motivo, os especialistas recomendam esfregar as paredes dos recipientes, e não apenas esvaziá-los.\n\nA população tem papel decisivo nesse trabalho. Dez minutos por semana, dedicados a percorrer a casa em busca de água parada, podem evitar muitos casos da doença. Os agentes lembram, ainda, que a dengue pode evoluir para formas graves e que alguns sinais exigem atendimento imediato: dor abdominal intensa e contínua, vômitos persistentes, sangramento de mucosas e sonolência ou irritabilidade.\n\nQuem apresentar febre deve procurar a unidade de saúde, evitar a automedicação e manter-se hidratado. Medicamentos à base de ácido acetilsalicílico, por exemplo, não devem ser usados sem orientação, pois aumentam o risco de sangramentos. A prevenção, entretanto, continua sendo a medida mais eficaz: sem criadouro, não há mosquito.\n\n(Texto elaborado para fins didáticos.)","g7":"Do outro lado da tela\n\nDona Lurdes tem setenta e oito anos e aprendeu a usar o celular durante a pandemia, quando a única forma de ver os netos era a chamada de vídeo. Hoje, ela marca consultas pelo aplicativo, recebe o resultado de exames, paga contas e participa de três grupos de mensagens — um da família, um da igreja e outro das amigas do tempo de escola. A tecnologia, que parecia um território estrangeiro, virou parte da rotina.\n\nCom a familiaridade, porém, vieram também os riscos. Na semana passada, ela recebeu uma mensagem de um número desconhecido, com a foto do neto, dizendo que ele tinha trocado de telefone e precisava de dinheiro com urgência. O texto era convincente, a foto era verdadeira, e o pedido vinha acompanhado de uma chave para transferência. Dona Lurdes só não caiu no golpe porque decidiu ligar para o número antigo do rapaz, que atendeu tranquilo, sem saber de nada.\n\nCasos assim se multiplicam. Os criminosos exploram a confiança, a pressa e o afeto, e não apenas a falta de conhecimento técnico. Por isso, especialistas em segurança digital insistem em algumas regras simples: desconfiar de pedidos urgentes de dinheiro, confirmar a identidade por outro canal, nunca informar códigos recebidos por SMS e ativar a verificação em duas etapas nos aplicativos.\n\nOs mais velhos não precisam ser afastados da tecnologia, mas acompanhados nela. Uma conversa paciente vale mais do que proibir o uso do aparelho. Afinal, Dona Lurdes não deixou de usar o celular: apenas aprendeu que, do outro lado da tela, nem sempre está quem diz estar.\n\n(Texto elaborado para fins didáticos.)","g8":"Um copo de água na hora certa\n\nAs ondas de calor deixaram de ser eventos raros. Em várias regiões do país, temperaturas acima de 35 graus se repetem por dias seguidos, e os serviços de saúde já observam o reflexo disso nos atendimentos. Os idosos estão entre os mais vulneráveis, e a explicação é, em boa parte, fisiológica: com o envelhecimento, a sensação de sede diminui, e o organismo perde parte da capacidade de regular a própria temperatura.\n\nO resultado é que muitos idosos ficam desidratados sem perceber. Os sinais podem ser discretos — boca seca, urina escura e em pequena quantidade, cansaço, tontura — e, às vezes, se confundem com outras condições. Em pessoas que usam diuréticos ou têm doenças crônicas, como diabetes e insuficiência cardíaca, o risco é ainda maior, e a reposição de líquidos deve seguir a orientação da equipe que acompanha o paciente.\n\nAlgumas medidas simples ajudam a reduzir os riscos. Oferecer água em intervalos regulares, mesmo sem pedido, é uma delas. Também se recomenda evitar a exposição ao sol nos horários mais quentes, usar roupas leves, manter os ambientes ventilados e preferir refeições leves, com frutas e verduras. Familiares e cuidadores devem ficar atentos a mudanças de comportamento, como confusão ou sonolência fora do habitual, que podem indicar um quadro mais grave.\n\nA atenção primária tem papel importante nesse cenário. Agentes comunitários conhecem as casas onde vivem idosos sozinhos e podem priorizar visitas durante os períodos críticos. Em tempos de calor extremo, um copo de água oferecido na hora certa é, literalmente, um cuidado de saúde.\n\n(Texto elaborado para fins didáticos.)"},"q":[{"m":"lm","tp":"Lei Orgânica – Organização do Município","nv":1,"e":"De acordo com a Lei Orgânica do Município de Paracatu, é CORRETO afirmar que:","o":["O distrito terá o nome da respectiva sede, cuja categoria será a de vila.","Os distritos serão criados, organizados, suprimidos ou fundidos por decreto do Prefeito.","São símbolos do Município a Bandeira, o Brasão e o Hino.","São Poderes do Município, independentes e harmônicos entre si, o Legislativo, o Executivo e o Judiciário."],"a":0,"c":"Art. 6º, parágrafo único: o distrito tem o nome da sede, com categoria de vila (a sede do Município tem categoria de cidade – art. 4º). Os Poderes do Município são apenas o Legislativo e o Executivo (art. 2º); os símbolos são a Bandeira e o Hino (art. 5º), sem Brasão; distritos são criados, organizados, suprimidos ou fundidos por LEI, observada a legislação estadual (art. 6º).","f":"LO Paracatu, arts. 2º, 4º, 5º e 6º","id":"1e24c8c"},{"m":"lm","tp":"Lei Orgânica – Competências","nv":2,"e":"A Lei Orgânica de Paracatu separa as atribuições próprias do Município (art. 8º) das competências que ele exerce em comum com a União e os Estados (art. 9º). Constitui competência exercida EM COMUM, nos termos do art. 9º:","o":["Instituir a guarda municipal, conforme dispuser a lei.","Fixar a tonelagem máxima permitida a veículos que circulem em vias públicas municipais.","Estabelecer e implantar política de educação para a segurança do trânsito.","Conceder licença para exercício de comércio eventual ou ambulante."],"a":2,"c":"O art. 9º, XII, inclui entre as competências comuns estabelecer e implantar política de educação para a segurança do trânsito. As demais alternativas são atribuições do art. 8º (incisos XXXI, XX e XXV, c).","f":"LO Paracatu, arts. 8º e 9º","id":"6a2fa78"},{"m":"lm","tp":"Lei Orgânica – Competências","nv":1,"e":"Conforme o art. 8º, IV, da Lei Orgânica de Paracatu, compete ao Município organizar e prestar, diretamente ou sob o regime de concessão ou permissão, os seguintes serviços públicos, EXCETO:","o":["Transporte coletivo urbano e intramunicipal.","Cemitérios e serviços funerários.","Distribuição de energia elétrica.","Mercados, feiras e matadouros."],"a":2,"c":"O art. 8º, IV, lista: transporte coletivo urbano e intramunicipal; abastecimento de água e esgotamento sanitário; mercados, feiras e matadouros; cemitérios e serviços funerários; limpeza pública, coleta domiciliar e destinação final do lixo. Energia elétrica não consta.","f":"LO Paracatu, art. 8º, IV","id":"7337715"},{"m":"lm","tp":"Lei Orgânica – Vedações","nv":2,"e":"De acordo com o art. 10 da Lei Orgânica de Paracatu, marque V para verdadeiro e F para falso:\n( ) É vedado ao Município recusar fé aos documentos públicos.\n( ) É vedado ao Município estabelecer cultos religiosos ou igrejas ou subvencioná-los, sem qualquer ressalva.\n( ) É vedada a publicidade de órgãos públicos da qual constem nomes, símbolos ou imagens que caracterizem promoção pessoal de
